name: NOX B1 R83 real DOM preACK
on:
  pull_request:
    paths:
      - 'nox-control/b1-r83/**'
      - '.github/workflows/b1-r83-real-dom.yml'
permissions:
  contents: read
jobs:
  real-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin R82 and run exact Node regression
        run: |
          test "$(git hash-object nox-control/b1-r82/b1_browser_bundle.js)" = af09a602a69390ecbbfc21becfd394b15c6dc836
          test "$(git hash-object nox-control/b1-r82/test_preack_observer.cjs)" = 1222b2e2a6fd1e481ec4029e9bfc401e24e80ebe
          node nox-control/b1-r82/test_preack_observer.cjs
      - name: Actual Chromium DOM and WebCrypto
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
          python nox-control/b1-r83/test_real_dom.py
