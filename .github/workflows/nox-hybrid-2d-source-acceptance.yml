name: NOX Hybrid 2D source gate (offline, no native)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'coordination/hybrid_20261115/2D_reasoning_source_gate.py'
      - 'coordination/hybrid_20261115/test_2D_reasoning_source_gate.py'
      - 'nox_runpod/teacher_mesh/adapter_recipe.py'
      - 'coordination/hybrid_20261115/test_2D_adapter_recipe.py'
      - 'nox-control/v13_split_archive.py'
      - 'nox-control/test_v13_split_archive.py'
      - '.github/workflows/nox-hybrid-2d-source-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact checkout offline Python source test (no credentials, no GPU)
        run: |
          python3 -m py_compile coordination/hybrid_20261115/2D_reasoning_source_gate.py coordination/hybrid_20261115/test_2D_reasoning_source_gate.py
          python3 -m unittest discover -s coordination/hybrid_20261115 -p 'test_2D_reasoning_source_gate.py' -q
          python3 -O -m unittest discover -s coordination/hybrid_20261115 -p 'test_2D_reasoning_source_gate.py' -q
          python3 -m py_compile nox_runpod/teacher_mesh/adapter_recipe.py coordination/hybrid_20261115/test_2D_adapter_recipe.py
          python3 -m unittest discover -s coordination/hybrid_20261115 -p 'test_2D_adapter_recipe.py' -q
          python3 -O -m unittest discover -s coordination/hybrid_20261115 -p 'test_2D_adapter_recipe.py' -q
      - name: V13 offline split archive bounded/strict manifest gate
        run: |
          python3 -m py_compile nox-control/v13_split_archive.py nox-control/test_v13_split_archive.py
          PYTHONPATH=nox-control python3 -m unittest discover -s nox-control -p 'test_v13_split_archive.py' -q
          PYTHONPATH=nox-control python3 -O -m unittest discover -s nox-control -p 'test_v13_split_archive.py' -q
          echo 'SOURCE_TESTED_ONLY; no native install or STOP alteration'
