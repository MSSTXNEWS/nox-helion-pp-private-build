name: NOX V14 A4 original mentor verified-journal source regression
on:
  push:
    branches:
      - feature/nox-v38-synaptic-brain-20261114
    paths:
      - nox-control/owner_task_lifecycle.py
      - nox-control/test_owner_dispatcher_mentor.py
      - .github/workflows/nox-v14-a4-verified-journal-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accepted-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile existing mentor and lifecycle source
        run: python3 -m py_compile nox-control/owner_task_lifecycle.py nox-control/owner_dispatcher_mentor.py nox-control/test_owner_dispatcher_mentor.py
      - name: Exercise original mentor regression suite and accepted journal filtering
        run: PYTHONPATH=nox-control python3 -m unittest -v test_owner_dispatcher_mentor
      - name: Keep native production gated
        run: echo 'NOX_V14_A4_SOURCE_ONLY_NO_ONEHOST_DEPLOY=true'
