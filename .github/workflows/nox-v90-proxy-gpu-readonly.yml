name: NOX V90 actual proxy stream and GPU process owners
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v90-proxy-gpu-readonly.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions: {contents: read}
concurrency:
  group: nox-v90-one-native-readonly
  cancel-in-progress: false
jobs:
  inspect:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile source
        run: python3 -m py_compile nox_runpod/teacher_mesh/v90/native_proxy_gpu_diagnosis.py
      - name: Compare actual native model and proxy streamer plus GPU process ownership
        run: python3 -m nox_runpod.teacher_mesh.v90.native_proxy_gpu_diagnosis
      - name: Revoke temporary SSH identity
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
