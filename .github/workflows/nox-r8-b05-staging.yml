name: NOX R8 B05 NO-LOSS guard (staging only)
on:
  push:
    branches: [work/b03-r8-b05-sidebyside-20261108-0125]
permissions:
  contents: read
jobs:
  guard:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Exercise read-only installer guard with disposable fixtures
        shell: pwsh
        run: |
          & ./coordination/nox-r8/installer/Test-NoLossGuard.ps1
          if (-not $?) { throw 'B05_GUARD_FAILED' }
      - name: Compile staged NSIS recipe with disposable non-NOX payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $compiler='C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'B05_NSIS_INSTALL_TOOL_UNAVAILABLE' }
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'B05_NSIS_COMPILER_MISSING' }
          $fixture=Join-Path $env:RUNNER_TEMP 'b05-nsis-source-only'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          $exe=Join-Path $fixture 'fixture.exe'
          [IO.File]::WriteAllText($exe,'NOT_A_REAL_NOX_EXE')
          $exeSha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $src='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          $receipt=Join-Path $fixture 'BUILD_RECEIPT.json'
          @{schema='NOX_R8_NATIVE_SINGLE_EXE_V1';source_git_sha=$src;exe_sha256=$exeSha;accepted_full_release=$false} | ConvertTo-Json -Compress | Set-Content -LiteralPath $receipt -Encoding utf8NoBOM
          $receiptSha=(Get-FileHash $receipt -Algorithm SHA256).Hash.ToLowerInvariant()
          $setup=Join-Path $fixture 'NOX_B05_NSIS_COMPILER_ONLY.exe'
          $script=Join-Path $env:GITHUB_WORKSPACE 'coordination/nox-r8/installer/NOX_R8_ImmutableUser_Setup.nsi'
          $guard=Join-Path $env:GITHUB_WORKSPACE 'coordination/nox-r8/installer/NoLossGuard.ps1'
          & $compiler /V2 "/DNOX_EXE_PATH=$exe" "/DNOX_RECEIPT_PATH=$receipt" "/DNOX_GUARD_PATH=$guard" "/DNOX_EXE_SHA256=$exeSha" "/DNOX_RECEIPT_SHA256=$receiptSha" "/DNOX_SOURCE_GIT_SHA=$src" "/DNOX_SETUP_OUT=$setup" /DNOX_B05_FIXTURE_TRACE=1 $script
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $setup)) { throw 'B05_NSIS_COMPILE_FAILED' }
          Write-Host 'B05_NSIS_TEMPLATE_COMPILE_PASS_FIXTURE_ONLY_RELEASE_HOLD'

      - name: Real NSIS install and foreign-file-safe uninstall on disposable Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fixture=Join-Path $env:RUNNER_TEMP 'b05-nsis-source-only'
          $setup=Join-Path $fixture 'NOX_B05_NSIS_COMPILER_ONLY.exe'
          $exe=Join-Path $fixture 'fixture.exe'
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $target=Join-Path $env:LOCALAPPDATA "Programs\\NOX-HELION-R8\\$sha"
          if (Test-Path -LiteralPath $target) { throw 'B05_FIXTURE_TARGET_PREEXISTS' }
          $p=Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            $trace=Join-Path $env:TEMP 'NOX_B05_NSIS_FIXTURE_TRACE.txt'
            if (Test-Path -LiteralPath $trace) { Write-Host 'B05_NSI_FAIL_CLOSED_TRACE:'; Get-Content -LiteralPath $trace }
            throw "B05_NSIS_INSTALL_FAILED:$($p.ExitCode)"
          }
          $installedExe=Join-Path $target 'NOX.HELION.exe'
          if (-not (Test-Path -LiteralPath $installedExe)) { throw 'B05_INSTALLED_EXE_NOT_FOUND' }
          if (-not [string]::Equals((Get-FileHash $installedExe -Algorithm SHA256).Hash,$sha,[StringComparison]::OrdinalIgnoreCase)) { throw 'B05_INSTALLED_EXE_SHA_MISMATCH' }
          # Pinned inputs must be promoted together, without staging residue.
          $installedNames=@(Get-ChildItem -LiteralPath $target -Force | ForEach-Object Name)
          $expectedNames=@('NOX.HELION.exe','BUILD_RECEIPT.json','Uninstall.exe')
          if ($installedNames.Count -ne 3 -or @($installedNames | Where-Object { $_ -notin $expectedNames }).Count -ne 0) { throw 'B05_NONATOMIC_OR_FOREIGN_INSTALLED_ENTRY' }
          $installedReceipt=Join-Path $target 'BUILD_RECEIPT.json'
          if (-not [string]::Equals((Get-FileHash $installedReceipt -Algorithm SHA256).Hash,(Get-FileHash (Join-Path $fixture 'BUILD_RECEIPT.json') -Algorithm SHA256).Hash,[StringComparison]::OrdinalIgnoreCase)) { throw 'B05_RECEIPT_PROMOTION_SHA_MISMATCH' }
          $uninstaller=Join-Path $target 'Uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw 'B05_UNINSTALLER_MISSING' }
          # B03: exercise the B05 installer as an actual two-version immutable update
          # on a disposable runner. This is NOT owner-PC acceptance or a Qwen test.
          $fixture2=Join-Path $fixture 'version-two'
          New-Item -ItemType Directory -Force -Path $fixture2 | Out-Null
          $exe2=Join-Path $fixture2 'fixture-v2.exe'
          [IO.File]::WriteAllText($exe2,'NOT_A_REAL_NOX_EXE_V2_DISTINCT_SHA')
          $sha2=(Get-FileHash $exe2 -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha2 -eq $sha) { throw 'B03_FIXTURE_VERSION_SHAS_IDENTICAL' }
          $receipt2=Join-Path $fixture2 'BUILD_RECEIPT.json'
          @{schema='NOX_R8_NATIVE_SINGLE_EXE_V1';source_git_sha=('a'*40);exe_sha256=$sha2;accepted_full_release=$false} | ConvertTo-Json -Compress | Set-Content -LiteralPath $receipt2 -Encoding utf8NoBOM
          $receiptSha2=(Get-FileHash $receipt2 -Algorithm SHA256).Hash.ToLowerInvariant()
          $setup2=Join-Path $fixture2 'NOX_B03_B05_VERSION_TWO_FIXTURE.exe'
          $compiler='C:\Program Files (x86)\NSIS\makensis.exe'
          $script=Join-Path $env:GITHUB_WORKSPACE 'coordination/nox-r8/installer/NOX_R8_ImmutableUser_Setup.nsi'
          $guard=Join-Path $env:GITHUB_WORKSPACE 'coordination/nox-r8/installer/NoLossGuard.ps1'
          & $compiler /V2 "/DNOX_EXE_PATH=$exe2" "/DNOX_RECEIPT_PATH=$receipt2" "/DNOX_GUARD_PATH=$guard" "/DNOX_EXE_SHA256=$sha2" "/DNOX_RECEIPT_SHA256=$receiptSha2" "/DNOX_SOURCE_GIT_SHA=$('a'*40)" "/DNOX_SETUP_OUT=$setup2" $script
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $setup2)) { throw 'B03_B05_VERSION_TWO_NSIS_COMPILE_FAILED' }
          $target2=Join-Path $env:LOCALAPPDATA "Programs\NOX-HELION-R8\$sha2"
          if (Test-Path -LiteralPath $target2) { throw 'B03_B05_VERSION_TWO_TARGET_PREEXISTS' }
          $p2=Start-Process -FilePath $setup2 -ArgumentList '/S' -PassThru -Wait
          if ($p2.ExitCode -ne 0) { throw "B03_B05_VERSION_TWO_INSTALL_FAILED:$($p2.ExitCode)" }
          $exe2Installed=Join-Path $target2 'NOX.HELION.exe'
          if (-not [string]::Equals((Get-FileHash $exe2Installed -Algorithm SHA256).Hash,$sha2,[StringComparison]::OrdinalIgnoreCase)) { throw 'B03_B05_VERSION_TWO_INSTALLED_SHA_MISMATCH' }
          if (-not [string]::Equals((Get-FileHash $installedExe -Algorithm SHA256).Hash,$sha,[StringComparison]::OrdinalIgnoreCase)) { throw 'B03_B05_UPGRADE_MUTATED_PREVIOUS_EXE' }
          $uninstaller2=Join-Path $target2 'Uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstaller2)) { throw 'B03_B05_VERSION_TWO_UNINSTALLER_MISSING' }
          $foreign=Join-Path $target 'owner_data.txt'
          [IO.File]::WriteAllText($foreign,'OWNER_FIXTURE_MUST_SURVIVE')
          $blocked=Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if (-not (Test-Path -LiteralPath $foreign)) { throw 'B05_FOREIGN_OWNER_DATA_DELETED' }
          if (-not (Test-Path -LiteralPath $installedExe)) { throw 'B05_UNINSTALL_DID_NOT_FAIL_CLOSED' }
          if ([IO.File]::ReadAllText($foreign) -cne 'OWNER_FIXTURE_MUST_SURVIVE') { throw 'B05_FOREIGN_OWNER_DATA_MODIFIED' }
          Remove-Item -LiteralPath $foreign -Force
          $finish=Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($finish.ExitCode -ne 0) { throw "B05_NSIS_UNINSTALL_FAILED:$($finish.ExitCode)" }
          if (Test-Path -LiteralPath $target) { throw 'B05_UNINSTALL_LEFT_UNEXPECTED_FILES' }
          # Removing version one must not mutate version two, nor require
          # deleting any owner data or other installed versions.
          if (-not [string]::Equals((Get-FileHash $exe2Installed -Algorithm SHA256).Hash,$sha2,[StringComparison]::OrdinalIgnoreCase)) { throw 'B03_B05_ROLLBACK_VERSION_TWO_MUTATED' }
          $r2=Start-Process -FilePath $uninstaller2 -ArgumentList '/S' -PassThru -Wait
          if ($r2.ExitCode -ne 0 -or (Test-Path -LiteralPath $target2)) { throw 'B03_B05_VERSION_TWO_UNINSTALL_FAILED' }
          Write-Host 'B03_B05_REAL_WINDOWS_TWO_SHA_SIDE_BY_SIDE_NOLOSS_FIXTURE_PASS_RELEASE_HOLD'
          Write-Host 'B05_REAL_WINDOWS_NSIS_FIXTURE_INSTALL_UNINSTALL_NOLOSS_PASS_RELEASE_HOLD'
