name: NOX E2 V63 inspect installed model flags and agent loop (read-only)
on:
  push:
    branches: [nox/e2-chat-latency-20261114]
    paths:
      - '.github/workflows/nox-v63-config-audit.yml'
      - 'nox_runpod/teacher_mesh/v63/live_config_audit.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nox-e2-v63-runtime-config-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax-check bounded audit
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v63/live_config_audit.py
          test -n "$NOX2"
      - name: Read exact live model flags and agent loop bounds
        run: python3 -m nox_runpod.teacher_mesh.v63.live_config_audit
      - name: Clean temporary key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
