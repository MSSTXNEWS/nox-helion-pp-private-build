name: NOX B2 4A02 stable checkpoint SHA exact-source gate
on:
  pull_request:
    branches:
      - b2-4a02-paused-step-type-gate-20261119
    paths:
      - 'nox-control/owner_training_resume.py'
      - 'nox-control/tests/test_owner_training_resume_step_type_b2.py'
      - '.github/workflows/nox-b2-4a02-hash-stability-ci.yml'
      - 'nox-control/b2_ru_es_3turn_holdout.py'
      - 'nox-control/tests/test_b2_ru_es_3turn_holdout.py'
permissions:
  contents: read
jobs:
  hash-stability-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify pinned owner and regression source Git blobs
        shell: bash
        run: |
          test "$(git hash-object nox-control/owner_training_resume.py)" = "65d71ed0009fc8f33b57a66d529754daaacb5719"
          test "$(git hash-object nox-control/tests/test_owner_training_resume_step_type_b2.py)" = "0425ec904d14a23573d4528cd1cf6092f6ea151c"
      - name: Verify pinned B2 RU-ES quality holdout probe and offline tests
        run: |
          test "$(git hash-object nox-control/b2_ru_es_3turn_holdout.py)" = "cf0af2c954b7704dfb83dff88fef83baa1077fac"
          test "$(git hash-object nox-control/tests/test_b2_ru_es_3turn_holdout.py)" = "e531a7d427cf61635f9916e288c3253e451d9dbe"
          python -B -m py_compile nox-control/b2_ru_es_3turn_holdout.py nox-control/tests/test_b2_ru_es_3turn_holdout.py
          python -B -m unittest discover -s nox-control/tests -p 'test_b2_ru_es_3turn_holdout.py' -v
      - name: Syntax and bounded non-native checkpoint regression
        run: |
          python -B -m py_compile nox-control/owner_training_resume.py nox-control/tests/test_owner_training_resume_step_type_b2.py
          python -B -m unittest discover -s nox-control/tests -p 'test_owner_training_resume_step_type_b2.py' -v
