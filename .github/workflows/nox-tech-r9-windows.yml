name: NOX TECH R9 Windows native build
on:
  push:
    branches:
      - feature/nox-techfirst-r9-20261106
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tech-native-windows:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify immutable R9 source and technical contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONUTF8='1'
          $zip='coordination/nox-tech-r9/NOX_TECH_R9_SOURCE.zip'
          $actual=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne '87807f3ef6bfb455f75b16341cd35beda6074a885874b5a170fa8377fa31e758') { throw 'TECH_R9_SOURCE_ARCHIVE_SHA_MISMATCH' }
          Expand-Archive -LiteralPath $zip -DestinationPath './tech-r9' -Force
          & python -m pip install --disable-pip-version-check 'Pygments==2.18.0'
          if ($LASTEXITCODE -ne 0) { throw 'QA_LEXER_INSTALL_FAILED' }
          foreach ($test in @('verify_package.py','test_engine_lifecycle.py','test_persona_migration.py','test_knowledge_schema.py','test_r7_ui_smoke.py','test_r8_fx_contract.py','test_r5_acceptance.py','validate_source.py')) {
            & python "./tech-r9/$test"
            if ($LASTEXITCODE -ne 0) { throw "NOX_R9_TEST_FAILED_$test" }
          }
      - name: Compile original WPF and WebView2 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & './coordination/nox-tech-r9/patch_protocol_fixture.ps1' './tech-r9/src/MainWindow.xaml.cs'
          $c=Get-Content './tech-r9/src/MainWindow.xaml.cs' -Raw
          if (!$c.Contains('nativeProtocolAccepted = accepted') -or !$c.Contains('nativeCoreAccepted = accepted && !ProtocolFixtureRequested')) { throw 'FIXTURE_NATIVE_CORE_SEPARATION_MISSING' }
          & dotnet publish './tech-r9/src/NOX.HELION.csproj' -c Release -r win-x64 --self-contained false -p:EnableWindowsTargeting=true -o './NOX_TECH_R9_WIN64'
          if ($LASTEXITCODE -ne 0) { throw 'TECH_R9_WIN64_BUILD_FAILED' }
          $exe=(Resolve-Path './NOX_TECH_R9_WIN64/NOX.HELION.exe').Path
          $hash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Copy-Item './tech-r9/START_NOX.ps1' './NOX_TECH_R9_WIN64/START_NOX.ps1'
          @{
            product='NOX HELION TECH R9'
            source_sha256='87807f3ef6bfb455f75b16341cd35beda6074a885874b5a170fa8377fa31e758'
            exe_sha256=$hash
            windows_compile='PASS'
            native_webview2='NOT_TESTED'
            synthetic_protocol_ipc_stop_sqlite='NOT_TESTED'
            real_owner_qwen='NOT_TESTED'
            canonical_d02='NOT_ACCEPTED'
            full_v16_release=$false
          } | ConvertTo-Json -Depth 5 | Set-Content './NOX_TECH_R9_WIN64/TECH_BUILD_RECEIPT.json' -Encoding UTF8
          Write-Host "TECH_R9_COMPILED_SHA256=$hash"
      - name: Real WPF WebView2 and isolated SQLite acceptance
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path './NOX_TECH_R9_WIN64/NOX.HELION.exe').Path
          $runId='NOX-TECH-R9-'+$env:GITHUB_RUN_ID
          $proc=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -ArgumentList @('--nox-ui-smoke',"--nox-runid=$runId") -PassThru
          try {
            Wait-Process -Id $proc.Id -Timeout 90 -ErrorAction Stop
            $proc.Refresh()
            $receipt=Join-Path $env:LOCALAPPDATA "NOX_HELION/ui_selftest_$($proc.Id).json"
            if (!(Test-Path -LiteralPath $receipt)) { throw 'UI_RECEIPT_MISSING' }
            $o=Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
            Write-Host ('NOX_UI_RECEIPT_DEBUG '+($o | ConvertTo-Json -Depth 6 -Compress))
            Copy-Item -LiteralPath $receipt -Destination './NOX_TECH_R9_WIN64/TECH_UI_RECEIPT.json' -Force
            $sha=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
            if ($proc.ExitCode -ne 0 -or
                $o.schema -cne 'NOX_WPF_UI_SMOKE_R7_V1' -or
                $o.runId -cne $runId -or
                $o.pid -ne $proc.Id -or
                $o.wpfWebView2Accepted -ne $true -or
                $o.qwenE2ETested -ne $false -or
                $o.checks.real_webview2_eight_routes -ne 'PASS' -or
                $o.checks.isolated_sqlite_path -ne 'PASS' -or
                $o.checks.native_wpf_webview2_renderer -ne 'PASS' -or
                ![string]::Equals($o.exeSha256,$sha,[StringComparison]::OrdinalIgnoreCase)) {
              throw 'NOX_TECH_R9_NATIVE_UI_HOLD'
            }
            Copy-Item -LiteralPath $receipt -Destination './NOX_TECH_R9_WIN64/TECH_UI_RECEIPT.json' -Force
            $build=Get-Content './NOX_TECH_R9_WIN64/TECH_BUILD_RECEIPT.json' -Raw | ConvertFrom-Json
            $build.native_webview2='PASS'
            $build | ConvertTo-Json -Depth 5 | Set-Content './NOX_TECH_R9_WIN64/TECH_BUILD_RECEIPT.json' -Encoding UTF8
            Write-Host 'TECH_R9_REAL_WPF_WEBVIEW2_AND_ISOLATED_SQLITE_PASS (QWEN NOT TESTED)'
          }
          finally {
            $proc.Refresh()
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Real native UI IPC, STOP, SQLite with synthetic loopback (not Qwen)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & './coordination/nox-tech-r9/run_protocol_fixture_windows.ps1' -Exe './NOX_TECH_R9_WIN64/NOX.HELION.exe' -OutputRoot './NOX_TECH_R9_WIN64'
      - name: Strict native technical acceptance — no partial PASS
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='./NOX_TECH_R9_WIN64/TECH_BUILD_RECEIPT.json'
          if (!(Test-Path -LiteralPath $p)) { throw 'BUILD_RECEIPT_MISSING' }
          $j=Get-Content -LiteralPath $p -Raw | ConvertFrom-Json
          if ($j.windows_compile -cne 'PASS' -or
              $j.native_webview2 -cne 'PASS' -or
              $j.synthetic_protocol_ipc_stop_sqlite -cne 'PASS' -or
              $j.real_owner_qwen -cne 'NOT_TESTED' -or
              $j.full_v16_release -ne $false) {
            Write-Host ('TECHNICAL_ACCEPTANCE_HOLD '+($j | ConvertTo-Json -Depth 7 -Compress))
            throw 'NOX_TECH_NATIVE_GATE_HOLD'
          }
          Write-Host 'TECH_R9_NATIVE_UI_AND_SYNTHETIC_IPC_STOP_SQLITE_GATE_PASS; REAL_QWEN_PENDING'
      - name: Compile self-contained single-file Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & dotnet publish './tech-r9/src/NOX.HELION.csproj' -c Release -r win-x64 --self-contained true -p:EnableWindowsTargeting=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o './NOX_R9_ONEFILE'
          if($LASTEXITCODE -ne 0){throw 'ONEFILE_COMPILE_HOLD'}
          $exe=(Resolve-Path './NOX_R9_ONEFILE/NOX.HELION.exe').Path
          $sha=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{product='NOX TECH R9 SINGLEFILE'; exe_sha256=$sha; windows_compile='PASS'; native_webview2='NOT_TESTED'; synthetic_protocol_ipc_stop_sqlite='NOT_TESTED'; real_owner_qwen='NOT_TESTED'; full_v16_release=$false} | ConvertTo-Json | Set-Content './NOX_R9_ONEFILE/TECH_BUILD_RECEIPT.json' -Encoding UTF8
          Write-Host "ONEFILE_COMPILED_SHA256=$sha"
      - name: Native UI smoke — self-contained EXE
        shell: pwsh
        run: |
          & './coordination/nox-tech-r9/run_onefile_ui_smoke.ps1' -Exe './NOX_R9_ONEFILE/NOX.HELION.exe' -OutputRoot './NOX_R9_ONEFILE'
      - name: Native IPC STOP SQLite — self-contained EXE synthetic protocol
        shell: pwsh
        run: |
          & './coordination/nox-tech-r9/run_protocol_fixture_windows.ps1' -Exe './NOX_R9_ONEFILE/NOX.HELION.exe' -OutputRoot './NOX_R9_ONEFILE'
      - name: Strict self-contained technical gate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(!(Test-Path './NOX_R9_ONEFILE/TECH_BUILD_RECEIPT.json')){throw 'ONEFILE_RECEIPT_MISSING'}
          $b=Get-Content './NOX_R9_ONEFILE/TECH_BUILD_RECEIPT.json' -Raw|ConvertFrom-Json
          if($b.windows_compile -cne 'PASS' -or $b.native_webview2 -cne 'PASS' -or $b.synthetic_protocol_ipc_stop_sqlite -cne 'PASS' -or $b.real_owner_qwen -cne 'NOT_TESTED' -or $b.full_v16_release -ne $false){throw 'ONEFILE_NATIVE_GATE_HOLD'}
          Write-Host 'ONEFILE_NATIVE_UI_STREAM_STOP_SQLITE_ACCEPTED (FIXTURE ONLY, REAL QWEN UNTESTED)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOX-R9-ONEFILE-WIN64
          path: NOX_R9_ONEFILE/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOX-TECH-R9-WIN64
          path: NOX_TECH_R9_WIN64/
          if-no-files-found: warn
          retention-days: 14
