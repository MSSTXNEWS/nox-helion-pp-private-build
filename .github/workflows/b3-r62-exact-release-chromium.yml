name: B3 R62 exact release Chromium
on:
  pull_request:
    paths:
      - 'coordination/onepass/b3_r62_*'
      - '.github/workflows/b3-r62-exact-release-chromium.yml'
permissions:
  contents: read
jobs:
  exact-release-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact browser
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Exact R61 six-mode and pending-readback regression
        run: python coordination/onepass/b3_r62_exact_release_chromium.py
      - uses: actions/upload-artifact@v4
        with:
          name: b3-r62-exact-release-browser-evidence
          path: b3-r62-browser-evidence/
