name: NOX V105 native V29 chat adapter real S03 receipt source tests
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v105/**'
      - '.github/workflows/nox-v105-chat-bridge-ci.yml'
  pull_request:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v105/**'
      - '.github/workflows/nox-v105-chat-bridge-ci.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: nox-v105-native-chat-adapter-ci
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only pinned test dependencies
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Compile and execute actual authenticated streaming and S03 tests
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v105/native_v29_chat_bridge.py nox_runpod/teacher_mesh/v105/tests/test_native_v29_chat_bridge.py
          python -m unittest discover -s nox_runpod/teacher_mesh/v105/tests -p 'test_*.py' -v
      - name: Explicitly no live production activation yet
        run: |
          echo 'NOX_V105_SOURCE_VALIDATED_ONLY=true'
          echo 'NOX_WEB_V29_PRODUCTION_FULL_FEATURES_DONE=false'
