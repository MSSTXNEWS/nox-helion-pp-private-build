name: NOX zip bounded reviewed mission source acceptance
on:
  pull_request:
    paths:
      - nox-control/owner_native_operator.py
      - nox-control/systemic_relay_20261118/owner_zip_bounded_refill_entry.py
      - nox-control/systemic_relay_20261118/test_owner_zip_bounded_refill_entry.py
      - .github/workflows/nox-zip-reviewed-refill-ci.yml
permissions:
  contents: read
jobs:
  verify-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Compile exact owner entrypoint and validate immutable source mission
        working-directory: nox-control/systemic_relay_20261118
        run: |
          python -m py_compile owner_zip_bounded_refill_entry.py test_owner_zip_bounded_refill_entry.py ../owner_native_operator.py
          python -m unittest -v test_owner_zip_bounded_refill_entry
