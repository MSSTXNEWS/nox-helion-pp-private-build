name: NOX reviewed manifest CAS API source checks
on:
  pull_request:
    paths:
      - 'nox-control/systemic_relay_20261118/runtime/owner_systemic_manifest_publisher.py'
      - 'nox-control/systemic_relay_20261118/runtime/test_owner_systemic_manifest_publisher.py'
      - '.github/workflows/nox-reviewed-manifest-cas-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-manifest-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and run publisher contract regressions
        working-directory: nox-control/systemic_relay_20261118/runtime
        run: |
          python -m py_compile owner_systemic_refill.py owner_systemic_manifest_publisher.py test_owner_systemic_manifest_publisher.py
          python -m unittest -v test_owner_systemic_manifest_publisher
