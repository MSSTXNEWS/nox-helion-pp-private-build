name: NOX V108 existing teacher source and role safe inventory
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - "nox_runpod/teacher_mesh/v108/**"
      - ".github/workflows/nox-v108-teacher-roles.yml"
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-60509551-v108-teacher-readonly
  cancel-in-progress: false
jobs:
  check:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate static runtime scanner
        run: |
          python -m py_compile nox_runpod/teacher_mesh/v108/teacher_role_probe.py
          python - <<'PY'
          from nox_runpod.teacher_mesh.v108.teacher_role_probe import REMOTE
          compile(REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0],'<remote>','exec')
          PY
      - name: Read-only teacher launcher inventory, no inference and no downloads
        run: python -m nox_runpod.teacher_mesh.v108.teacher_role_probe
      - name: Revoke temporary SSH key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
