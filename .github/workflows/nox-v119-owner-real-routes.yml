name: NOX V119 six real owner read endpoints HTTP E2E
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v119/**'
      - '.github/workflows/nox-v119-owner-real-routes.yml'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Explicit owner approval for original NOX OneHost only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v119-60509551-owner-reads
  cancel-in-progress: false
jobs:
  acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check runner and native source syntax
        run: |
          python -m py_compile nox_runpod/teacher_mesh/v119/owner_read_surface_e2e.py
          python - <<'PY'
          from nox_runpod.teacher_mesh.v119.owner_read_surface_e2e import REMOTE
          code=REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0]
          compile(code,'<native v119>','exec')
          for key in ('HOLD_ANONYMOUS_AUTH','HOLD_FALSE_FULL_TRAINING_CLAIM',
                      'HOLD_NATIVE_S03_COUNTS_MISMATCH','_read_chat_password'):
              assert key in code
          print('NOX_V119_CODE_SAFETY_PASS=true')
          PY
      - name: Real HTTP owner session readback on six native endpoints
        run: python -m nox_runpod.teacher_mesh.v119.owner_read_surface_e2e
      - name: Always detach temporary SSH key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
