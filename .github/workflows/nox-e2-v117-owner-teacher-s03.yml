name: NOX V117 authenticated owner teacher to PRIME to S03 complete proof
on:
  push:
    branches: [nox/e2-v117-optin-e2e-20261115]
    paths:
      - '.github/workflows/nox-e2-v117-owner-teacher-s03.yml'
      - 'nox_runpod/teacher_mesh/v117/**'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v117-owner-auth-teacher-s03-60509551
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate derived native owner-cookie teacher test
        run: |
          set -euo pipefail
          python3 -m compileall -q nox_runpod/teacher_mesh/v114 nox_runpod/teacher_mesh/v117
          python3 -m unittest -v nox_runpod.teacher_mesh.v117.test_native_optin_teacher_e2e
  native:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticated existing Vast owner connector required
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOX2" || { echo "HOLD_NOX2"; exit 2; }
      - name: One opt-in teacher request through real owner cookie, stream and S03
        run: python3 -m nox_runpod.teacher_mesh.v117.native_optin_teacher_e2e
      - name: Revoke ephemeral Vast key even on HOLD
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
