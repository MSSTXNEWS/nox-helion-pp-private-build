name: NOX V66 export verified offsite and cleanup receipt to portable ZIP
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v66-offsite-handoff-artifact.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-portable:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate physical cleanup and Drive sources; do not claim Windows restore
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path('coordination/NOX_V66_OFFSITE_HANDOFF_20261114.json')
          d=json.loads(p.read_text())
          assert d['schema']=='NOX_V66_OFFSITE_HANDOFF_V1'
          assert d['vast_cleanup_verified']['files_deleted']==198
          assert d['vast_cleanup_verified']['disk_free_increase_bytes']==460337152
          assert d['pc_disk_copy']['status']=='NOT_VERIFIED'
          assert d['pending']['delete_original_weights_allowed'] is False
          assert d['offsite_existing']['v61']['owner_key_restore_verified'] is False
          print('NOX_V66_READBACK_MANIFEST_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Store small sanitized handoff; no secrets, raw logs or private data
        uses: actions/upload-artifact@v4
        with:
          name: NOX_V66_CLEANUP_OFFSITE_HANDOFF_20261114
          path: coordination/NOX_V66_OFFSITE_HANDOFF_20261114.json
          retention-days: 30
          if-no-files-found: error
      - name: No remote mutation
        run: |
          echo "VAST_SERVER_NOT_TOUCHED_BY_THIS_WORKFLOW=true"
