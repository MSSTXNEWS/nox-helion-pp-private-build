name: NOX V107 native v29 bridge isolated failure diagnosis
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v107-bridge-readonly.yml, nox_runpod/teacher_mesh/v107/native_bridge_postfailure.py]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions: {contents: read}
concurrency:
  group: nox-v107-bridge-readonly
  cancel-in-progress: false
jobs:
  diagnose:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile current and native probes
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v107/native_bridge_postfailure.py
          python3 - <<'PY'
          from nox_runpod.teacher_mesh.v107.native_bridge_postfailure import REMOTE
          compile(REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0],
                  '<native-v107>','exec')
          PY
      - name: Diagnose bridge registration in isolated actual server runtime
        run: python3 -m nox_runpod.teacher_mesh.v107.native_bridge_postfailure
      - name: Revoke temporary SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
