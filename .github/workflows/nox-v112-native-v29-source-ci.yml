name: NOX V112 true S03 dialogue + native stream source CI
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v112/**'
      - 'nox-control/owner_chat_browser_qa.py'
      - 'nox-control/test_owner_chat_browser_qa.py'
      - '.github/workflows/nox-v112-native-v29-source-ci.yml'
  pull_request:
    branches: [feature/nox-v38-synaptic-brain-20261114, repair/dispatcher-memory-telemetry-20261119]
    paths:
      - 'nox_runpod/teacher_mesh/v112/**'
      - 'nox-control/owner_chat_browser_qa.py'
      - 'nox-control/test_owner_chat_browser_qa.py'
      - '.github/workflows/nox-v112-native-v29-source-ci.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned test dependencies, never production
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Compile bridge and test real DB semantics under isolated fixtures
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v112/native_v29_full_bridge.py
          python -m py_compile nox_runpod/teacher_mesh/v112/tests/test_native_bridge.py
          python -m py_compile nox-control/owner_chat_browser_qa.py
          python -m py_compile nox-control/test_owner_chat_browser_qa.py
          python -m unittest discover -s nox_runpod/teacher_mesh/v112/tests -p 'test_*.py' -v
          PYTHONPATH=nox-control python -m unittest -v test_owner_chat_browser_qa
      - name: Never call fixture evidence a live owner E2E
        run: |
          echo 'NOX_V112_TEST_FIXTURES_ONLY=true'
          echo 'NOX_V112_LIVE_AUTHENTICATED_BROWSER_E2E=false'
