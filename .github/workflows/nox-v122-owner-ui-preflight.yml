name: NOX V122 authenticated V29 owner UI contract and safe live preflight
on:
  pull_request:
    branches: [feature/nox-v37-v100-firsthour-14d-20261113]
    paths:
      - 'nox_runpod/teacher_mesh/v112/**'
      - 'nox_runpod/teacher_mesh/v122/**'
      - '.github/workflows/nox-v122-owner-ui-preflight.yml'
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v122/**'
      - '.github/workflows/nox-v122-owner-ui-preflight.yml'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v122-owner-ui-readonly-preflight
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned test-only FastAPI requirements
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Verify frozen owner UI adaptation and fail-closed HTTP mount
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v112/native_v29_full_bridge.py nox_runpod/teacher_mesh/v122/native_owner_ui_preflight.py
          python -m unittest discover -s nox_runpod/teacher_mesh/v112/tests -p 'test_v122_owner_ui_contract.py' -v
          python - <<'PY'
          import ast,pathlib
          path=pathlib.Path('nox_runpod/teacher_mesh/v122/native_owner_ui_preflight.py')
          tree=ast.parse(path.read_text(encoding='utf8'))
          remote=next(x.value.value for x in tree.body if isinstance(x,ast.Assign) and x.targets[0].id=='REMOTE')
          python=remote.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0]
          compile(python,'<V122 NATIVE READ-ONLY>','exec')
          assert all(x in python for x in ('NATIVE_READ_ONLY_COMPLETE=true','model_weights_modified','services_restarted','auth_401','frozen_source_sha_ok'))
          print('NOX_V122_READONLY_SOURCE_COMPILE=PASS')
          PY
  native-readonly:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.event_name == 'workflow_dispatch' && github.actor == 'MSSTXNEWS') }}"
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit only existing Vast owner WEB and original asset hashes, no modifications
        run: python -m nox_runpod.teacher_mesh.v122.native_owner_ui_preflight
      - name: Mandatory temporary SSH key revocation
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
