name: NOX existing OneHost pinned SSH recovery read only
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: ['.github/workflows/nox-existing-onehost-pinned-ssh-readonly.yml']
permissions:
  contents: read
concurrency:
  group: nox-existing-owner-pinned-ssh-readonly
  cancel-in-progress: false
jobs:
  existing-ssh:
    if: "${{ github.repository == 'MSSTXNEWS/nox-helion-pp-private-build' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOX_VAST_SSH_PRIVATE_KEY: ${{ secrets.NOX_VAST_SSH_PRIVATE_KEY }}
      NOX_VAST_SSH_KNOWN_HOSTS: ${{ secrets.NOX_VAST_SSH_KNOWN_HOSTS }}
    steps:
      - name: Use only previously authorized original private SSH identity and pinned host key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          if [ -z "${NOX_VAST_SSH_PRIVATE_KEY:-}" ]; then
            echo "NOX_EXISTING_SSH_IDENTITY=HOLD_MISSING_SECRET"
            exit 2
          fi
          printf '%s\n' "$NOX_VAST_SSH_PRIVATE_KEY" > "$tmpdir/identity"
          if ! ssh-keygen -y -f "$tmpdir/identity" >/dev/null 2>&1; then
            echo "NOX_EXISTING_SSH_IDENTITY=HOLD_INVALID_FORMAT"
            exit 2
          fi
          echo "NOX_EXISTING_SSH_IDENTITY=AVAILABLE_VALID_FORMAT_NOT_YET_AUTHENTICATED"
          expected='SHA256:G4hmMllaT4uSfx+Gup9vjSySLXJT1cSc/9XePr7XmGc'
          # These are previously recorded SSH endpoints, not newly discovered hosts.
          for target in 'ssh9.vast.ai 26623' '166.113.48.41 11234'; do
            read -r host port <<< "$target"
            : > "$tmpdir/verified_hosts"
            if [ -n "${NOX_VAST_SSH_KNOWN_HOSTS:-}" ]; then
              printf '%s\n' "$NOX_VAST_SSH_KNOWN_HOSTS" > "$tmpdir/provided_hosts"
              while IFS= read -r line; do
                [ -n "$line" ] || continue
                printf '%s\n' "$line" > "$tmpdir/onehostkey"
                if ssh-keygen -lf "$tmpdir/onehostkey" 2>/dev/null | grep -Fq "$expected"; then
                  printf '%s\n' "$line" >> "$tmpdir/verified_hosts"
                fi
              done < "$tmpdir/provided_hosts"
            fi
            if [ ! -s "$tmpdir/verified_hosts" ]; then
              ssh-keyscan -T 6 -p "$port" "$host" > "$tmpdir/scanned_hosts" 2>/dev/null || true
              while IFS= read -r line; do
                [ -n "$line" ] || continue
                printf '%s\n' "$line" > "$tmpdir/onehostkey"
                if ssh-keygen -lf "$tmpdir/onehostkey" 2>/dev/null | grep -Fq "$expected"; then
                  printf '%s\n' "$line" >> "$tmpdir/verified_hosts"
                fi
              done < "$tmpdir/scanned_hosts"
            fi
            if [ ! -s "$tmpdir/verified_hosts" ]; then
              echo "NOX_EXISTING_SSH_PIN_${port}=HOLD_NO_MATCH"
              continue
            fi
            echo "NOX_EXISTING_SSH_PIN_${port}=MATCH"
            if timeout 24s ssh -T -p "$port" -i "$tmpdir/identity" -o IdentitiesOnly=yes \
              -o BatchMode=yes -o NumberOfPasswordPrompts=0 -o ConnectTimeout=8 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmpdir/verified_hosts" \
              "root@$host" 'sh -c '\''echo NOX_ORIGINAL_SSH_AUTH=PASS; id -u | sed "s/^/NOX_REMOTE_UID=/"; test -f /root/nox/scripts/chat_proxy.py && echo NOX_EXISTING_ONEHOST_SOURCE_PRESENT=true; for port in 8080 8081; do curl -sS -o /dev/null -w "NOX_HEALTH_${port}_HTTP=%{http_code}\n" --max-time 3 "http://127.0.0.1:${port}/health" || true; done'\'''; then
              echo "NOX_EXISTING_SSH_READONLY=PASS"
              echo "NOX_SECRET_EXPORTED=false"
              echo "NOX_MODEL_S03_GPU_MUTATED=false"
              exit 0
            fi
            echo "NOX_EXISTING_SSH_AUTH_${port}=HOLD"
          done
          echo "NOX_EXISTING_SSH_READONLY=HOLD"
          echo "NOX_SECRET_EXPORTED=false"
          echo "NOX_MODEL_S03_GPU_MUTATED=false"
          exit 2
