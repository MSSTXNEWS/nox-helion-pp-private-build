name: NOX V130 owner fact to original S03 native one-shot
on:
  pull_request:
    branches: [feature/nox-v37-v100-firsthour-14d-20261113]
    paths: ['.github/workflows/nox-v130-owner-s03-facts-live.yml']
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Explicit approval after current source/health SHA verification'
        type: choice
        required: true
        options: ['NO','YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v130-60509551-owner-s03-write
  cancel-in-progress: false
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned isolated fixture dependencies
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Require native S03 write and reverse-proxy source tests PASS
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v130/owner_s03_fact_write.py nox_runpod/teacher_mesh/v130/install_native_owner_fact.py
          python -m unittest discover -s nox_runpod/teacher_mesh/v130/tests -p 'test_*.py' -v
          echo NOX_V130_SOURCE_GATE=PASS
  native-once:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'MSSTXNEWS' && inputs.allow_native == 'YES'
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One-time SHA pinned native owner fact POST, S03 readback, rollback on failure
        run: python -m nox_runpod.teacher_mesh.v130.install_native_owner_fact
      - name: Revoke temporary SSH key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
