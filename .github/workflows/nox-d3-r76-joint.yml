name: D3 R76 joint resume review
on:
  pull_request:
    paths: ['nox-control/d3-r76/**', '.github/workflows/nox-d3-r76-joint.yml']
permissions:
  contents: read
jobs:
  joint:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'd3-r76-joint-resume-review-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Existing staged B0 B5 B4 R72 functional composition
        shell: bash
        run: |
          set -euo pipefail
          stage="$PWD/nox-control/d3-r74/staging"
          own="$PWD/nox-control/d3-r76"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for name in test_d3_r68_review_binding test_b2_r69_strict_review_ingress test_d3_r70_owner_fd_review_ingress; do
            cp "nox-control/tests/$name.py" "$tmp/"
          done
          export PYTHONPATH="$stage/py:$own:$tmp"
          export D3_B4_MODULE="$stage/b4/b4_existing_turn_pair.mjs"
          cd "$tmp"
          python3 -B "$own/test_joint_resume_review.py"
          echo SOURCE_ONLY_NATIVE_ACCEPTED=false
