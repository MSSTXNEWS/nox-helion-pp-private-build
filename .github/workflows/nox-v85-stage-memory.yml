name: NOX V85 stage V84 offline memory on live Vast no service restart
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: ['nox_runpod/teacher_mesh/v85/**','nox_runpod/teacher_mesh/v84/**','.github/workflows/nox-v85-stage-memory.yml']
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-60509551-v85-stage
  cancel-in-progress: false
jobs:
  stage:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recheck V84 native memory and ACL tests
        run: python -m unittest discover -s nox_runpod/teacher_mesh/v84/tests -p 'test_*.py' -v
      - name: Atomic staged V84 source SHA and physical readback
        run: python -m nox_runpod.teacher_mesh.v85.stage_memory
      - name: Mandatory SSH cleanup
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
