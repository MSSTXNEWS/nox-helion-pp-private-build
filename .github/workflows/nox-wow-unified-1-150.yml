name: NOX V16 WOW 1–150 unified native event admission
on:
  pull_request:
    paths:
      - 'proposals/NOX-WOW-UNIFIED-1-150/**'
      - '.github/workflows/nox-wow-unified-1-150.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-windows-source:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check single admission layer
        shell: pwsh
        run: |
          node --check proposals/NOX-WOW-UNIFIED-1-150/gate.mjs
          node --check proposals/NOX-WOW-UNIFIED-1-150/gate.test.mjs
      - name: Check original 51-100 and 101-150 tests plus admission
        shell: pwsh
        run: |
          node --test proposals/NOX-WOW51-100/wow51-100.test.mjs proposals/NOX-WOW101-150/director.test.mjs proposals/NOX-WOW-UNIFIED-1-150/gate.test.mjs
          if ($LASTEXITCODE -ne 0) {throw 'UNIFIED_WOW_REGRESSION'}
      - name: Preserve exact pre-existing asset receipts
        shell: pwsh
        run: |
          node --test proposals/NOX-WOW51-100/sha256.test.mjs
          if ($LASTEXITCODE -ne 0) {throw 'WOW51_SOURCE_RECEIPT_DRIFT'}
      - name: Checkout exact first fifty UI and routes (PACK01)
        uses: actions/checkout@v4
        with:
          repository: MSSTXNEWS/nox-helion-pp-private-build
          ref: f06432bb747d10f42c64ebb9c3d2cadd7b61d071
          path: owner-pack01
      - name: Checkout exact second fifty offline tools (PACK02)
        uses: actions/checkout@v4
        with:
          repository: MSSTXNEWS/nox-helion-pp-private-build
          ref: 002e387621b3058f42d96739b270e5fac7afd6be
          path: owner-pack02
      - name: Materialize exact Git LF bytes for PACK02 receipt verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # This changes only the disposable CI worktree, NEVER Git objects or owner source.
          git -C owner-pack02 -c core.autocrlf=false checkout-index --force --all
          if ($LASTEXITCODE -ne 0) {throw 'PACK02_GIT_BLOB_CHECKOUT_FAILED'}
      - name: Cross-check all 100 function routes and all 150 WOW source IDs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p1=Get-Content owner-pack01/proposals/NOX-PACK01-50/catalog.json -Raw | ConvertFrom-Json
          $p2=Get-Content owner-pack02/proposals/NOX-PACK02-50/catalog.json -Raw | ConvertFrom-Json
          $ledger=Get-Content owner-pack01/proposals/NOX-PACK01-50/owner-binding-map.json -Raw | ConvertFrom-Json
          if($p1.actions.Count -ne 50 -or $p2.actions.Count -ne 50){throw 'FUNCTION_COUNT_DRIFT'}
          $ids=@($p1.actions | ForEach-Object { $_.routeId }) + @($p2.actions | ForEach-Object { $_.routeId })
          if(@($ids | Sort-Object -Unique).Count -ne 100){throw 'CROSS_PACK_ROUTE_COLLISION'}
          $tasks=@($p1.actions | ForEach-Object { $_.taskId }) + @($p2.actions | ForEach-Object { $_.taskId })
          if(@($tasks | Sort-Object -Unique).Count -ne 100){throw 'CROSS_PACK_TASK_COLLISION'}
          if($ledger.counts.sourceOwnerMethodBound -ne 37 -or $ledger.counts.releaseAccepted -ne 0){throw 'OWNER_LEDGER_DRIFT'}
          node --test owner-pack01/proposals/NOX-PACK01-50/smoke.test.mjs owner-pack01/proposals/NOX-PACK01-50/binding_map.test.mjs
          if($LASTEXITCODE -ne 0){throw 'PACK01_ORIGINAL_TESTS_FAILED'}
          node --test owner-pack02/proposals/NOX-PACK02-50/smoke.test.mjs owner-pack02/proposals/NOX-PACK02-50/golden.test.mjs owner-pack02/proposals/NOX-PACK02-50/receipt.test.mjs
          if($LASTEXITCODE -ne 0){throw 'PACK02_ORIGINAL_TESTS_FAILED'}
          Write-Host 'NOX_CROSS_PACK_SOURCE_PASS: 100 unique function routes + 150 cinematic source IDs; EXE not accepted'
      - name: Create SHA256 receipts for new additive files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $paths=@('proposals/NOX-WOW-UNIFIED-1-150/gate.mjs',
                   'proposals/NOX-WOW-UNIFIED-1-150/gate.test.mjs',
                   'proposals/NOX-WOW-UNIFIED-1-150/scene.css',
                   'proposals/NOX-WOW-UNIFIED-1-150/README.md')
          $proof=@()
          foreach($p in $paths){
            if(-not(Test-Path $p)){throw "MISSING_$p"}
            $b=[System.Text.Encoding]::UTF8.GetBytes([System.IO.File]::ReadAllText((Resolve-Path $p).Path).Replace("`r`n","`n"))
            $hash=[Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($b)).ToLowerInvariant()
            $proof+=@{path=$p;preimage='ABSENT';bytes=$b.Length;post_sha256=$hash}
          }
          @{schema='NOX-WOW1-150-ADDITIVE-RECEIPTS-V1';sourceOnly=$true;paths=$proof} |
            ConvertTo-Json -Depth 8 | Set-Content nox-wow-unified-source-receipts.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: nox-wow-unified-1-150-source-receipts
          path: nox-wow-unified-source-receipts.json
          retention-days: 30
          if-no-files-found: error
