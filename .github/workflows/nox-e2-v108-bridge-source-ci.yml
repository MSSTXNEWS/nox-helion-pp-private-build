name: NOX V108 V29 native bridge registration source acceptance
on:
  push:
    branches: [nox/e2-v108-teacher-corpus-repair-20261114]
    paths:
      - '.github/workflows/nox-e2-v108-bridge-source-ci.yml'
      - 'nox_runpod/teacher_mesh/v106/native_install_v29_bridge.py'
      - 'nox_runpod/teacher_mesh/v106/tests/test_v108_registration_order.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded bridge test dependencies
        run: python3 -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Compile and validate native bridge registration and original S03 tests
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v106/native_install_v29_bridge.py
          python3 -m unittest -v \
            nox_runpod.teacher_mesh.v106.tests.test_v108_registration_order \
            nox_runpod.teacher_mesh.v105.tests.test_native_v29_chat_bridge
      - name: Evidence boundary
        if: success()
        run: |
          echo "NOX_V108_REGISTRATION_ORDER_CORRECTED=true"
          echo "NOX_V108_LIVE_ONEHOST_UNCHANGED_BY_THIS_CI=true"
