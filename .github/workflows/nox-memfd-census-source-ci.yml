name: NOX open-deleted memfd census source CI
on:
  push:
    branches: [repair/nox-memfd-census-20261119]
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify owner one-shot scope
        run: |
          python -m py_compile nox-control/owner_memory_cleanup_entry.py nox-control/owner_memory_governor.py nox-control/owner_native_operator.py
          python -m unittest discover -s nox-control -p test_owner_memory_governor.py -v
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          text=Path('nox-control/owner_memory_cleanup_entry.py').read_text()
          assert '"MEMFD_SHMEM" if link.startswith(("memfd:", "/memfd:"))' in text
          assert 'reclaim_requires_exact_process_handoff_not_killall' in text
          spec=importlib.util.spec_from_file_location('operator','nox-control/owner_native_operator.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          assert m.FILES['repair']=='nox-control/owner_memory_cleanup_entry.py'
          assert m.SCOPED_REPAIR_BUNDLES[m.FILES['repair']]==('owner_storage_reclaim.py','owner_memory_governor.py')
          print('MEMFD_OWNER_CENSUS_SOURCE_PASS')
          PY
