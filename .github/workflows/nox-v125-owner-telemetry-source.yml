name: NOX V125 genuine owner telemetry source acceptance
on:
  push:
    branches: [nox/v125-live-owner-metrics-20261115]
    paths:
      - 'nox_runpod/teacher_mesh/v125/**'
      - '.github/workflows/nox-v125-owner-telemetry-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Pinned isolated test dependencies (not installed on native)
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Validate actual /proc + nvidia-smi parsers and owner-only five route contract
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v125/live_owner_readonly.py
          python -m unittest -v nox_runpod.teacher_mesh.v125.test_live_owner_readonly
          python -m py_compile nox_runpod/teacher_mesh/v125/install_owner_readonly.py
          python -m unittest -v nox_runpod.teacher_mesh.v125.test_install_owner_readonly
      - name: No native deployment performed
        run: |
          echo 'NOX_V125_SOURCE_ONLY_PASS=true'
          echo 'NOX_V125_LIVE_DEPLOYED=false'
