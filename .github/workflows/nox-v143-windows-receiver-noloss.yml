name: NOX V143 original Windows receiver NO-LOSS source QA only
on:
  push:
    branches:
      - fix/nox-e3-v143-windows-checkpoint-receiver-noloss
      - feature/nox-v38-synaptic-brain-20261114
    paths:
      - 'nox_runpod/control/nox_windows_verified_receiver.ps1'
      - 'nox_runpod/control/tests/test_v143_receiver_noloss.py'
      - '.github/workflows/nox-v143-windows-receiver-noloss.yml'
  pull_request:
    paths:
      - 'nox_runpod/control/nox_windows_verified_receiver.ps1'
      - 'nox_runpod/control/tests/test_v143_receiver_noloss.py'
      - '.github/workflows/nox-v143-windows-receiver-noloss.yml'
permissions:
  contents: read
jobs:
  windows-receiver-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run regression on original historical Windows receiver, no SSH
        run: |
          set -euo pipefail
          python -m unittest -v nox_runpod.control.tests.test_v143_receiver_noloss
      - name: Parse actual PowerShell AST and prove .NET no-replace semantics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null
          $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('nox_runpod/control/nox_windows_verified_receiver.ps1',[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { $parseErrors | Out-String | Write-Host; throw 'HOLD_POWERSHELL_PARSE' }
          $p=Join-Path $env:RUNNER_TEMP 'nox-v143-noreplace'
          [System.IO.Directory]::CreateDirectory($p) | Out-Null
          $src=Join-Path $p 'checkpoint.tmp'
          $dst=Join-Path $p 'checkpoint.bin'
          [System.IO.File]::WriteAllText($src,'NEW')
          [System.IO.File]::WriteAllText($dst,'KEEP')
          $blocked=$false
          try { [System.IO.File]::Move($src,$dst) } catch [System.IO.IOException] { $blocked=$true }
          if (-not $blocked -or [System.IO.File]::ReadAllText($dst) -ne 'KEEP') { throw 'HOLD_REPLACE_RACE_REGRESSION' }
          Write-Host 'NOX_V143_POWERSHELL_AST_PASS'
          Write-Host 'NOX_V143_ATOMIC_NOREPLACE_RACE_PASS'
      - name: Explicit physical release is still blocked
        run: |
          echo 'NOX_V143_SOURCE_ONLY=true'
          echo 'NOX_V143_WINDOWS_OWNER_PHYSICAL_E2E=HOLD'
          echo 'NOX_V143_ORIGINAL_ONEHOST_AUTH=HOLD'
          echo 'NOX_V143_MODEL_S03_CHECKPOINT_UNTOUCHED=true'
