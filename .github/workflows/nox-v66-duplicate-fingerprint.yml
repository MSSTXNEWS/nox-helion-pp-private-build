name: NOX V66 probable duplicate weight fingerprint (read-only)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v66-duplicate-fingerprint.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v66-bounded-fingerprint
  cancel-in-progress: false
jobs:
  inspect:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile original verified V62 code and wrapper
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v62/dedup_fingerprint.py nox_runpod/teacher_mesh/v66/probable_duplicate_audit.py
      - name: Inspect just three 64KB windows per model, no full model hashes
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v66.probable_duplicate_audit
      - name: Revoke exact temporary key even if read fails
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Evidence constraints
        if: success()
        run: |
          echo "PROBABLE_DUPLICATES_NOT_SHA_PROVEN=true"
          echo "MODEL_OR_CHECKPOINT_FILES_DELETED=false"
