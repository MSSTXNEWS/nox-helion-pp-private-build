name: NOX EXPRESS G1+G2 one-source immutable bundle
on:
  push:
    branches:
      - integration/nox-v16-unified-candidate-20261028-r01
    paths:
      - .github/workflows/nox-express-g1g2-unified-package.yml
      - coordination/e06/express_source_snapshot_pack.py
      - tests/e06/test_express_source_snapshot_pack_r116.py
      - Packages/P04/train_qlora.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nox-express-g1g2-source-snapshot
  cancel-in-progress: false
jobs:
  source-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: G1 immutable HEAD provenance regression (real Git fixtures)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests/e06 -p test_express_source_snapshot_pack_r116.py -v
      - name: Verify latest P03 download tiles and canonical quick20
        shell: bash
        run: |
          set -euo pipefail
          node --check Packages/P03/Source/P03.ModelCenter.Wow/ui.js
          node Packages/P03/Source/P03.ModelCenter.QuickSmoke/quick20_contract.cjs
          python3 - <<'PY'
          from pathlib import Path
          html=Path('Packages/P03/Source/P03.ModelCenter.Wow/index.html').read_text()
          css=Path('Packages/P03/Source/P03.ModelCenter.Wow/ui.css').read_text()
          assert html.count('class="tool-source-card"') == 12
          assert '.tool-source-grid' in css
          assert "connect-src 'none'" in html
          assert 'id="quickInstallGrid"' in html
          assert "rel=\"noopener noreferrer\"" in html
          print('P03_QUICK20_AND_TOOLS_SOURCE_PASS_ONLY')
          PY
      - name: Verify all four sequential D02 SUPER WOW source stages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          css=Path('integrations/wow200/runtime/home-guard.css').read_text()
          for marker in ('ORB STEP01','GARGANTUA STEP02','LIQUID CHROME STEP03','DARK VEIL STEP04'):
              assert marker in css, marker
          assert 'pointer-events:none' in css
          assert 'prefers-reduced-motion:reduce' in css
          assert 'forced-colors:active' in css
          print('WOW_01_04_SOURCE_STAGE_PASS_ONLY')
          PY
      - name: Build full SHA-locked tracked source archive
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=normal)" || { echo 'DIRTY_CHECKOUT_HOLD'; exit 2; }
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$GITHUB_SHA" || { echo 'SHA_MISMATCH_HOLD'; exit 2; }
          python3 coordination/e06/express_source_snapshot_pack.py --repo . --sha "$sha" --out "$RUNNER_TEMP/NOX_HELION_EXPRESS_SOURCE_${sha}.zip" | tee "$RUNNER_TEMP/EXACT_SOURCE_RECEIPT.json"
          mkdir -p dist/nox-express-package
          mv "$RUNNER_TEMP/NOX_HELION_EXPRESS_SOURCE_${sha}.zip" dist/nox-express-package/
          cp "$RUNNER_TEMP/EXACT_SOURCE_RECEIPT.json" dist/nox-express-package/
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          root=pathlib.Path('dist/nox-express-package')
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          archive=root/f'NOX_HELION_EXPRESS_SOURCE_{sha}.zip'
          with zipfile.ZipFile(archive) as z:
              manifest=json.loads(z.read('SOURCE_MANIFEST.json'))
              assert manifest['git_sha']==sha
              expected={n for n in subprocess.check_output(['git','ls-files','-z']).decode().strip('\x00').split('\x00') if n}
              actual={f['path'] for f in manifest['files']}
              assert len(actual)==len(manifest['files']) and actual==expected
              assert {n for n in z.namelist() if n.startswith('source/')}=={'source/'+n for n in expected}
              for record in manifest['files']:
                  digest=hashlib.sha256()
                  with z.open('source/'+record['path']) as fp:
                      for chunk in iter(lambda:fp.read(1048576), b''):digest.update(chunk)
                  assert digest.hexdigest()==record['sha256'],record['path']
          def sha256(p):
              with p.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          refs={'schema':'nox.express.cache-references.v1','source_git_sha':sha,'cache_embedded':False,
            'cache_folder':'https://drive.google.com/drive/folders/1x7uX9U6H3cfrKunKCJOtBQpXzNfifUpd',
            'volume_manifest':'https://drive.google.com/file/d/1NzFbXdF9lJjf0Hr4YTgVHGPSvhbm7OOt/view',
            'boost_v4_zip64_sha256':'2ca2647e46edd1e110db1569cb6a636ceee8e8154b416560ad43a87fb95545bd',
            'boost_v4_zip64_bytes':2327776086,'model_weights_embedded':False,
            'status':'REFERENCES_ONLY_REVERIFY_FULL_CACHE_BEFORE_REUSE'}
          (root/'BOOST_CACHE_REFERENCES.json').write_text(json.dumps(refs,indent=2)+'\n')
          receipt={'schema':'nox.express.g1g2.package.v1','git_sha':sha,'source_files':len(actual),
            'source_zip_sha256':sha256(archive),'verified_all_zip_entries':True,
            'G1':'SOURCE_SNAPSHOT_CREATED_NOT_FULL_SOURCELOCK','G2':'NOT_ASSERTED',
            'G3_WINDOWS':'NOT_RUN_HERE','G4_E07':'NOT_RUN','release_accepted':False}
          (root/'INTEGRATION_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          with (root/'SHA256SUMS.txt').open('w') as o:
              for p in sorted(root.iterdir()):
                  if p.name!='SHA256SUMS.txt':o.write(f'{sha256(p)}  {p.name}\n')
          print(json.dumps(receipt))
          PY
      - name: G2 P04 original syntax gate (not Windows proof)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path('Packages/P04/train_qlora.py')
          ast.parse(p.read_text(encoding='utf-8'),filename=str(p))
          print('P04_SYNTAX_PASS_ONLY')
          PY
      - name: Upload one source-and-cache-reference archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NOX_HELION_EXPRESS_G1G2_SINGLE_PACKAGE
          path: dist/nox-express-package/
          if-no-files-found: error
          retention-days: 7
