name: NOX P01 EXPRESS · canonical D02 + verified native buttons
on:
  pull_request:
    paths:
      - 'proposals/P01/WOW-MAX10/**'
      - 'coordination/mega814/**'
      - 'integrations/adminator-nox/**'
      - '.github/workflows/p01-pr162-express.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p01-source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect exact original owner source paths
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 833a37bca2930e0cb9b272ae07f5d6545e3d5096 HEAD
          # This job belongs to P01 but runs on the SHARED integration PR162.
          # E06/I0 owns .circleci and other packages. Do not misclassify its
          # authorized changes as P01 defects; separate SourceLock covers them.
          baseline=833a37bca2930e0cb9b272ae07f5d6545e3d5096
          git diff --check "$baseline" HEAD -- proposals/P01/WOW-MAX10/ .github/workflows/p01-pr162-express.yml
          echo 'P01_OWNED_CHANGED_PATHS_BEGIN'
          git diff --name-only "$baseline" HEAD -- proposals/P01/WOW-MAX10/ .github/workflows/p01-pr162-express.yml
          echo 'P01_OWNED_CHANGED_PATHS_END'
          if test -n "$(git diff --no-renames --diff-filter=D --name-only "$baseline" HEAD -- proposals/P01/WOW-MAX10/ .github/workflows/p01-pr162-express.yml)"; then
            echo 'P01_NO_LOSS_PATH_DELETION_FAIL'; exit 1
          fi
          test -d proposals/P01/WOW-MAX10
          echo 'P01_SCOPED_NOLOSS_PASS_NOT_GLOBAL_OWNER_ATTESTATION'
      - name: Node syntax and focused P01 tests
        shell: bash
        run: |
          set -euo pipefail
          for file in proposals/P01/WOW-MAX10/*.mjs; do node --check "$file"; done
          node --test proposals/P01/WOW-MAX10/*.test.mjs
          node --check coordination/mega814/menu-v2-adapter.mjs
          node --check integrations/adminator-nox/nox-adminator-adapter.mjs
          node --check integrations/adminator-nox/nox-adminator-entry.mjs
          node --test coordination/mega814/test_menu_v2.mjs
          node --test integrations/adminator-nox/tests/*.test.mjs
      - name: Keep original D02 gravity and WOW unified source regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test proposals/NOX-CINEMA-FX/nox-cinema.test.mjs
          node --test proposals/NOX-WOW-UNIFIED-1-150/gate.test.mjs
      - name: Emit actual code hash receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          { git rev-parse HEAD; git rev-parse HEAD^{tree};
            find proposals/P01/WOW-MAX10 -type f -print0 | sort -z | xargs -0 sha256sum;
          } > ci-evidence/P01_PR162_EXPRESS_SHA256.txt
          cat ci-evidence/P01_PR162_EXPRESS_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p01-pr162-express-source-receipts
          path: ci-evidence/P01_PR162_EXPRESS_SHA256.txt
          retention-days: 30
          if-no-files-found: error
