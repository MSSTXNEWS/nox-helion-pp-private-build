name: NOX independent exact-SHA Windows E07 lifecycle
on:
  push:
    branches: [qa/nox-installed-qwen-20261104]
    paths:
      - .github/workflows/nox-7b-independent-lifecycle.yml
      - coordination/e07/independent_lifecycle_7b.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nox-independent-7b-lifecycle
  cancel-in-progress: false
jobs:
  independent-lifecycle:
    if: github.repository == 'MSSTXNEWS/nox-helion-pp-private-build'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout independent verifier code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pinned Python on clean independent Windows VM
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
          check-latest: false
      - name: Download exact successful owner Windows candidate, NOT from this job
        uses: actions/download-artifact@v4
        with:
          run-id: 41829928630
          name: NOX-EXPRESS-ONEHOST-a504410cd969adfbdcda4e39fdeb9aef76e78702
          github-token: ${{ github.token }}
          path: input/nox
      - name: Check pinned 7b Setup and perform independent NSIS WPF IPC update rollback uninstall
        id: lifecycle
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 17
        run: |
          $ErrorActionPreference='Stop'
          python -B -m py_compile coordination/e07/independent_setup_e07.py coordination/e07/probe_five_primary_action.py coordination/e07/independent_lifecycle_7b.py
          if ($LASTEXITCODE -ne 0) { throw 'NOX_E07_LIFECYCLE_SCRIPT_SYNTAX_HOLD' }
          python -B coordination/e07/independent_lifecycle_7b.py --artifact-dir input/nox --out work/e07-7b/INDEPENDENT_LIFECYCLE_RECEIPT.json
          if ($LASTEXITCODE -ne 0) { throw 'NOX_E07_INDEPENDENT_LIFECYCLE_HOLD' }
      - name: Preserve real independent lifecycle proof or first-failure receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NOX-7B-INDEPENDENT-LIFECYCLE-${{ github.sha }}-${{ github.run_id }}
          path: work/e07-7b/INDEPENDENT_LIFECYCLE_RECEIPT.json
          if-no-files-found: warn
          retention-days: 14
      - name: Independent lifecycle verdict is not complete E07 release verdict
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.lifecycle.outcome }}' -ne 'success') { throw 'NOX_INDEPENDENT_LIFECYCLE_NOT_PASSED' }
          Write-Host 'INDEPENDENT_LIFECYCLE_PASS_NOT_FULL_E07; Qwen STOP history UIA independently checked on matching Setup SHA'
