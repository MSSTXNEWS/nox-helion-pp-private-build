name: NOX V124 combined frozen V29 owner patch source gate
on:
  push:
    branches: [nox/v124-owner-v29-combined-20261115]
    paths:
      - 'nox_runpod/teacher_mesh/v118/activate_staged_catalog.py'
      - 'nox_runpod/teacher_mesh/v118/test_activate_staged_catalog.py'
      - '.github/workflows/nox-v124-source-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install isolated test-only Web dependencies
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Compile full native embedded Python and execute source-only tests
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v118/activate_staged_catalog.py
          python -m unittest -v nox_runpod.teacher_mesh.v118.test_activate_staged_catalog
          python -m unittest -v nox_runpod.teacher_mesh.v112.tests.test_v118_native_catalog_route
          echo 'NOX_V124_SOURCE_QA=PASS'
          echo 'NOX_V124_LIVE_DEPLOYED=false'
