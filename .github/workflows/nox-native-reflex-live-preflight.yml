name: NOX native reflex preflight — Vast owner read-only
on:
  push:
    branches: [repair/nox-native-reflex-autorefill-20261119]
    paths: [.github/workflows/nox-native-reflex-live-preflight.yml]
permissions: {contents: read}
concurrency:
  group: nox-vast60509551-owner-reflex-readonly
  cancel-in-progress: false
jobs:
  pinned-native-readback:
    if: github.repository == 'MSSTXNEWS/nox-helion-pp-private-build' && github.ref == 'refs/heads/repair/nox-native-reflex-autorefill-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Owner-only Vast current pins and queue read-only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from nox_runpod.teacher_mesh.v51 import ephemeral_ssh_probe as ssh
          ssh.REMOTE=r"""
          set -euo pipefail
          python3 - <<'PYREMOTE'
          import json,hashlib,os,re,subprocess
          from pathlib import Path
          base=Path('/root/nox')
          print('NOX_NATIVE_V51_SSH_EXECUTED=true')
          def sha(path):
              try:
                  obj=Path(path)
                  if obj.is_symlink() or not obj.is_file() or obj.stat().st_size>2097152:return 'UNSAFE_OR_MISSING'
                  return hashlib.sha256(obj.read_bytes()).hexdigest()
              except OSError:return 'UNREADABLE'
          for item in ('scripts/owner_systemic_refill.py','scripts/owner_subagent_dispatcher.py','config/owner_native_subagents.json'):
              print('NATIVE_REFLEX_CURRENT_'+item.rsplit('/',1)[-1].replace('.','_')+'='+sha(base/item))
          for item in ('state/STOP','STOP','state/OWNER_MAINTENANCE.flag'):
              p=base/item
              print('NATIVE_REFLEX_FLAG_'+item.replace('/','_').replace('.','_')+'='+str(p.exists() or p.is_symlink()).lower())
          try:
              cfg=json.loads((base/'config/owner_native_subagents.json').read_text())
              refs=cfg.get('module_pins',{})
              for name in ('owner_systemic_refill.py','owner_subagent_dispatcher.py'):
                  pin=refs.get(name)
                  print('NATIVE_REFLEX_CONFIG_PIN_'+name.replace('.','_')+'='+(pin if isinstance(pin,str) and re.fullmatch('[a-f0-9]{64}',pin) else 'UNKNOWN'))
              print('NATIVE_REFLEX_TARGET='+str(cfg.get('target')))
              print('NATIVE_REFLEX_EXECUTION_MODE='+str(cfg.get('execution_mode')))
              relay=cfg.get('systemic_relay') or {}
              pin=relay.get('sha256','UNKNOWN')
              print('NATIVE_REFLEX_MANIFEST_SHA='+(pin if isinstance(pin,str) and re.fullmatch('[a-f0-9]{64}',pin) else 'UNKNOWN'))
          except Exception: print('NATIVE_REFLEX_CONFIG=UNREADABLE')
          try:
              output=subprocess.run(['supervisorctl','status','nox-dispatcher-t855u'],capture_output=True,text=True,timeout=8)
              print('NATIVE_REFLEX_SUPERVISOR='+('RUNNING' if 'RUNNING' in output.stdout and output.returncode==0 else 'UNKNOWN'))
          except Exception: print('NATIVE_REFLEX_SUPERVISOR=UNKNOWN')
          print('NATIVE_READ_ONLY_COMPLETE=true')
          PYREMOTE
          """
          try:
              result=ssh.probe()
              print('NOX_REFLEX_NATIVE_PREFLIGHT='+('PASS' if result else 'HOLD'))
              raise SystemExit(0 if result else 2)
          finally:
              try:
                  assert ssh.cleanup()
              except Exception:
                  print('NOX_REFLEX_EPHEMERAL_CLEANUP=HOLD')
                  raise
          PY
      - name: Recover ephemeral credential after any native failure
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
