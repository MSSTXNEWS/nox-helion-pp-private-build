name: NOX original S03 source-vs-record SHA reconciliation
on:
  push:
    branches: [nox/e2-s03-native-vs-content-sha-20261115]
    paths:
      - '.github/workflows/nox-e2-s03-dual-hash-ci.yml'
      - 'nox_runpod/teacher_mesh/v120/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s03-hash-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated HTTP tests only
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Prove native record checksum is not source text checksum
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v120/s03_owner_memory_views.py
          python -m unittest -v \
            nox_runpod.teacher_mesh.v120.tests.test_v132_owner_fact_history_contract \
            nox_runpod.teacher_mesh.v130.tests.test_owner_s03_fact_write
          python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/nox-v120-s03-owner-views.yml').read_text()
          assert "inputs.allow_native == 'YES'" in wf
          assert "github.event_name == 'workflow_dispatch'" in wf
          assert "default: 'NO'" in wf
          print('NOX_DUAL_SHA_NO_AUTOMATIC_VAST_RESTART=PASS')
          PY
          echo 'NOX_DUAL_SHA_SOURCE_REGRESSION=PASS'
      - name: Physical gate remains closed
        run: |
          echo 'NOX_DUAL_SHA_SOURCE_FIXTURE_ONLY=true'
          echo 'NOX_DUAL_SHA_NOX_ONEHOST_RESTARTS=0'
          echo 'NOX_DUAL_SHA_WINDOWS_AND_FORGE_HOLD=true'
