name: NOX ONEPASS owner-stage legacy JSON/SSE native stream compatibility - SOURCE ONLY
on:
  push:
    branches: [fix/nox-web-v293-onepass-native-compat-20261115, feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'coordination/onepass/nox-legacy-chat-bridge-v293.js'
      - 'coordination/onepass/build_legacy_compat_v2.py'
      - 'coordination/onepass/test_chat_compat_node.cjs'
      - 'coordination/onepass/test_build_legacy_compat_v2.py'
      - '.github/workflows/nox-onepass-native-compat-source.yml'
  pull_request:
    paths:
      - 'coordination/onepass/nox-legacy-chat-bridge-v293.js'
      - 'coordination/onepass/build_legacy_compat_v2.py'
      - 'coordination/onepass/test_chat_compat_node.cjs'
      - 'coordination/onepass/test_build_legacy_compat_v2.py'
      - '.github/workflows/nox-onepass-native-compat-source.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify existing native owner protocol boundaries in JavaScript
        run: |
          set -euo pipefail
          node --check coordination/onepass/nox-legacy-chat-bridge-v293.js
          node coordination/onepass/test_chat_compat_node.cjs
      - name: Verify deterministic native-owner-only derived full ZIP builder, no original mutation
        run: |
          set -euo pipefail
          python -m py_compile coordination/onepass/build_legacy_compat_v2.py
          python -m unittest -v coordination.onepass.test_build_legacy_compat_v2
      - name: Export exact tested owner-stage compatibility source for V134 convergence
        uses: actions/upload-artifact@v4
        with:
          name: NOX_V134_OWNER_CHAT_COMPAT_SOURCE
          path: |
            coordination/onepass/nox-legacy-chat-bridge-v293.js
            coordination/onepass/build_legacy_compat_v2.py
            coordination/onepass/NOX_V293_NATIVE_COMPAT_ACCEPTANCE.json
          if-no-files-found: error
          retention-days: 14
      - name: Confirm no native Vast/Windows changes from source tests
        run: |
          echo 'NOX_ONEPASS_COMPAT_SOURCE_TESTED=true'
          echo 'NOX_ONEPASS_COMPAT_NATIVE_DEPLOYED=false'
          echo 'NOX_ORIGINAL_S03_WEIGHTS_UNMODIFIED=true'
