name: NOX A3 dialog context source regression
on:
  push:
    branches:
      - codex/a3-s03-receipt-failclosed-20261119
    paths:
      - 'nox_runpod/teacher_mesh/v112/native_v29_full_bridge.py'
      - 'nox_runpod/teacher_mesh/v112/tests/test_native_bridge.py'
      - '.github/workflows/nox-a3-dialog-context-source.yml'
  pull_request:
    paths:
      - 'nox_runpod/teacher_mesh/v112/native_v29_full_bridge.py'
      - 'nox_runpod/teacher_mesh/v112/tests/test_native_bridge.py'
      - '.github/workflows/nox-a3-dialog-context-source.yml'
permissions:
  contents: read
jobs:
  fixture-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned fixture dependencies
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Run isolated V112 dialog-context fixture tests
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v112/native_v29_full_bridge.py
          python -m py_compile nox_runpod/teacher_mesh/v112/tests/test_native_bridge.py
          python -m unittest nox_runpod.teacher_mesh.v112.tests.test_native_bridge -v
      - name: Mark runtime boundary
        run: |
          echo 'SOURCE_FIXTURE_ONLY=true'
          echo 'NATIVE_S03_WRITES=false'
          echo 'NOX_PROCESS_LAUNCHED=false'
          echo 'MODEL_INFERENCE=false'
