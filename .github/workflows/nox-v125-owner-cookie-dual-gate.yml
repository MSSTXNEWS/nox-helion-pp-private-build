name: NOX V125 owner-cookie exact-allowlist dual-backup one-shot
on:
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Explicit owner approval for original NOX OneHost only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
  push:
    branches: [nox/v125-live-owner-metrics-20261115]
    paths:
      - '.github/workflows/nox-v125-owner-cookie-dual-gate.yml'
permissions:
  contents: read
concurrency:
  group: nox-60509551-v125-owner-cookie-recovery
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install isolated source-test dependencies
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Verify source safety and both rollback files
        run: |
          set -euo pipefail
          python -m unittest -v nox_runpod.teacher_mesh.v125.test_live_owner_readonly
          python -m unittest -v nox_runpod.teacher_mesh.v125.test_install_owner_readonly
  native:
    needs: source
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS' && github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify existing owner-only credential availability
        run: test -n "$NOX2" || { echo 'HOLD_NOX2'; exit 2; }
      - name: Native double-file exact-SHA, full cookie/auth and all five owner reads, rollback
        run: python -m nox_runpod.teacher_mesh.v125.install_owner_readonly
      - name: Always revoke only this temporary Vast public SSH key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
