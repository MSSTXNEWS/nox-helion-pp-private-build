name: NOX V103 real OneHost auth scope and S03 receipt table
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v103-auth-s03.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions: {contents: read}
concurrency:
  group: nox-v103-auth-s03-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile both runner and native code
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v103/native_auth_receipt_schema.py
          python3 - <<'PY'
          from nox_runpod.teacher_mesh.v103.native_auth_receipt_schema import REMOTE
          compile(REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0],
                  '<native-v103>','exec')
          print('NOX_V103_SOURCE_GATE=PASS')
          PY
      - name: Read-only source-defined owner auth and existing S03 schema
        run: python3 -m nox_runpod.teacher_mesh.v103.native_auth_receipt_schema
      - name: Revoke exact ephemeral SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
