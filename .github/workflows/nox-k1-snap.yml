name: NOX K1 site snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor == 'MSSTXNEWS'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Snapshot site from K1
        env:
          NOX2: ${{ secrets.NOX2 }}
          C300: snap
        run: python3 -B nox-control/c300/k1_snap.py && ls -la site.tgz
      - name: Publish snapshot to branch k1-snap (chunks <90MB)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir snapout && split -b 90m -d site.tgz snapout/site.tgz.part
          sha256sum site.tgz > snapout/SHA256
          cd snapout && git init -q -b k1-snap && git add . && git -c user.email=ci@nox -c user.name=nox-ci commit -qm "k1 site snapshot $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" k1-snap
