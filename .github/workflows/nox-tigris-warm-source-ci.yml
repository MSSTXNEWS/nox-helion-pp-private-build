name: NOX Tigris warm vault source safety tests (no remote access)
on:
  push:
    branches: [feature/nox-tigris-warm-20261115]
    paths:
      - 'nox_runpod/teacher_mesh/v43/nox/tigris_warm.py'
      - 'nox_runpod/teacher_mesh/v43/tests/test_tigris_warm.py'
      - '.github/workflows/nox-tigris-warm-source-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - run: python -m py_compile nox_runpod/teacher_mesh/v43/nox/tigris_warm.py
      - run: python -m unittest discover -s nox_runpod/teacher_mesh/v43/tests -p test_tigris_warm.py -v
