name: NOX V144 original full V140 Windows backup owner source guard
on:
  push:
    branches:
      - fix/nox-e1-v144-windows-owner-backup-guard
      - fix/nox-e2-v145-windows-status-owner-host-guard
      - feature/nox-v38-synaptic-brain-20261114
    paths:
      - 'coordination/onepass/v144_windows_backup_owner_guard.py'
      - 'coordination/onepass/test_v144_windows_backup_owner_guard.py'
      - 'coordination/onepass/test_v144_backup_browser.cjs'
      - '.github/workflows/nox-v144-windows-owner-backup-source.yml'
  pull_request:
    paths:
      - 'coordination/onepass/v144_windows_backup_owner_guard.py'
      - 'coordination/onepass/test_v144_windows_backup_owner_guard.py'
      - 'coordination/onepass/test_v144_backup_browser.cjs'
      - '.github/workflows/nox-v144-windows-owner-backup-source.yml'
permissions:
  contents: read
jobs:
  exact-source-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original V140 ZIP-contract source tests, no anonymous backup fallback
        run: |
          set -euo pipefail
          python -m py_compile coordination/onepass/v144_windows_backup_owner_guard.py
          python -m unittest discover -s coordination/onepass -p 'test_v144_windows_backup_owner_guard.py' -v
          echo 'NOX_V144_CI_EXACT_V140_ZIP_NOT_ATTACHED=true'
      - name: Execute real Javascript source guard in isolated Node VM (9 scenarios, including OneHost != Windows)
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from coordination.onepass import v144_windows_backup_owner_guard as v
          original=(v.ANCHOR+'\nasync function trigger(){'+v.OLD_ACTION+';}\n').encode('utf8')
          Path('/tmp/nox-v144-original-anchor-fixture.js').write_bytes(v.patched(v.TARGETS[0], original))
          PY
          node --check /tmp/nox-v144-original-anchor-fixture.js
          node coordination/onepass/test_v144_backup_browser.cjs /tmp/nox-v144-original-anchor-fixture.js
      - name: Do not claim native or production release
        run: |
          echo 'NOX_V144_FULL_V140_ARCHIVE_VERIFIED_BY_OWNER_LOCAL_RUN_NOT_CI=true'
          echo 'NOX_V144_NATIVE_WINDOWS_OWNER_BACKUP=HOLD'
          echo 'NOX_V145_ONEHOST_STATUS_NOT_PC_AUTHORITY=true'
          echo 'NOX_V144_NATIVE_VAST_ONEHOST_AUTH=HOLD'
          echo 'NOX_V144_ORIGINAL_S03_WEIGHT_CHECKPOINT_UNTOUCHED=true'
          echo 'NOX_V144_PRODUCTION_PROMOTION=false'
