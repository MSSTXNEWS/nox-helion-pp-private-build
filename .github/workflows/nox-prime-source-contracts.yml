name: NOX PRIME source contracts
on:
  push:
    branches:
      - integration/nox-v16-unified-candidate-20261028-r01
    paths:
      - "coordination/soul_gpu_v1/**"
      - ".github/workflows/nox-prime-source-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prime-python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "torch==2.5.1" "safetensors==0.5.3"
      - name: Run source-only unit tests (never production E07)
        working-directory: coordination/soul_gpu_v1
        run: |
          python -m compileall -q .
          python -m unittest -q test_nox_unified_brain_v1 test_nox_prime_resource_advisor_v1 test_nox_prime_cognitive_memory_v1 test_nox_prime_semantic_retriever_v1 test_nox_prime_memory_continuum_v1 test_nox_prime_experience_v1 test_nox_prime_core_matrix_v1 test_nox_prime_dream_v1 test_nox_prime_affect_runtime_v1 test_nox_prime_self_edit_lab_v1 test_nox_prime_live_pipeline_v1 test_nox_prime_soul_stage1_train test_nox_prime_absorption_v2 test_nox_prime_student_dataset_v1 test_nox_prime_progress_v1
  powershell-parser:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse PS5.1 launcher with actual Windows PowerShell
        shell: powershell
        run: |
          $paths = @(
            "coordination/soul_gpu_v1/NOX_PRIME_LIVE_V6_BOOT.ps1",
            "coordination/soul_gpu_v1/NOX_PRIME_STAGE1_START.ps1",
            "coordination/soul_gpu_v1/NOX_PRIME_DISTILL_RUN_V7.ps1",
            "coordination/soul_gpu_v1/NOX_UNIFIED_BOOT_V1.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
            )
            if (@($errors).Count -gt 0) {
              $errors | Format-List
              throw "POWER_SHELL_SYNTAX_FAILED: $path"
            }
            Write-Host "POWER_SHELL_PARSE_OK: $path"
          }
