name: NOX V61 encrypted checkpoint + optimizer offload (no loss)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - .github/workflows/nox-v61-encrypted-checkpoint-export.yml
      - nox_runpod/teacher_mesh/v61/checkpoint_backup.py
      - nox-control/owner_qwen6_backup_stream.py
      - nox-control/owner_qwen6_backup_runner.py
      - nox-control/owner_qwen6_backup_local.py
      - nox-control/owner_qwen6_backup_public.json
      - nox-control/test_owner_qwen6_backup.py
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Explicit owner approval for original NOX OneHost only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
      checkpoint_scope:
        description: 'LEGACY preserves the original V61 operation; QWEN6 exports only the accepted six-update checkpoint'
        type: choice
        required: true
        options: ['LEGACY', 'QWEN6']
        default: 'LEGACY'
      source_sha:
        description: 'For QWEN6 only: exact reviewed 40-character commit, equal to the selected workflow ref HEAD'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: nox-v61-vast60509551-checkpoint-export
  cancel-in-progress: false
jobs:
  source-only:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Regression for original owner STOP revocation during checkpoint ciphertext read (source only)
        run: |
          /usr/bin/python3 -m py_compile nox-control/owner_checkpoint_backup_pager.py nox-control/test_owner_checkpoint_backup_pager.py
          /usr/bin/python3 -m unittest discover -s nox-control -p test_owner_checkpoint_backup_pager.py -v
      - name: Validate bounded Qwen6 source only, without credentials or native access
        run: |
          if ! /usr/bin/python3 -c 'import cryptography'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-cryptography
          fi
          /usr/bin/python3 -m py_compile nox-control/owner_qwen6_backup_stream.py nox-control/owner_qwen6_backup_runner.py nox-control/owner_qwen6_backup_local.py
          /usr/bin/python3 -m unittest discover -s nox-control -p test_owner_qwen6_backup.py

  export:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (!inputs.checkpoint_scope || inputs.checkpoint_scope == 'LEGACY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify archive script syntax
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py nox_runpod/teacher_mesh/v60/encrypted_backup.py nox_runpod/teacher_mesh/v61/checkpoint_backup.py
      - name: Get supported age binary from OS distribution
        run: |
          set -euo pipefail
          if ! command -v age; then
            sudo apt-get update -qq
            sudo apt-get -qq install -y age
          fi
          age --version
      - name: Stream checkpoint and optimizer ciphertext from live Vast (without remote deletion)
        env:
          NOX2: ${{ secrets.NOX2 }}
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v61.checkpoint_backup
      - name: Verify ciphertext and receipt
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('NOX_V61_CHECKPOINT_OPTIMIZER_ENCRYPTED_20261114.tar.age')
          d=json.loads(pathlib.Path('NOX_V61_CHECKPOINT_OPTIMIZER_RECEIPT.json').read_text())
          assert d['temporary_age_test_restore']=='PASS'
          assert d['checkpoint_optimizer_files']>=10
          assert hashlib.sha256(p.read_bytes()).hexdigest()==d['ciphertext_sha256']
          print('NOX_V61_CIPHER_SHA_AND_RESTORE_TEST=PASS')
          PY
      - name: Upload only encrypted bundle and checksum receipt
        uses: actions/upload-artifact@v4
        with:
          name: NOX_V61_ENCRYPTED_CHECKPOINT_OPTIMIZER_20261114
          path: |
            NOX_V61_CHECKPOINT_OPTIMIZER_ENCRYPTED_20261114.tar.age
            NOX_V61_CHECKPOINT_OPTIMIZER_RECEIPT.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Always verify temporary Vast SSH key removal
        if: always()
        env:
          NOX2: ${{ secrets.NOX2 }}
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: No-loss training protection
        if: success()
        run: |
          echo "NOX_TRAINING_NOT_INTERRUPTED=true"
          echo "NOX_SOURCE_CHECKPOINTS_NOT_DELETED=true"
          echo "NOX_OFFSITE_OWNER_KEY_RESTORE_NEEDS_VERIFICATION=true"
  qwen6-export:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && inputs.checkpoint_scope == 'QWEN6' && github.actor == 'MSSTXNEWS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate reviewed Qwen6 source before native credentials are provided
        run: |
          if ! /usr/bin/python3 -c 'import cryptography'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-cryptography
          fi
          /usr/bin/python3 -m py_compile nox-control/owner_qwen6_backup_stream.py nox-control/owner_qwen6_backup_runner.py nox-control/owner_qwen6_backup_local.py
          /usr/bin/python3 -m unittest discover -s nox-control -p test_owner_qwen6_backup.py
      - name: Export exact checkpoint6 as ciphertext only through pinned owner SSH
        env:
          NOX2: ${{ secrets.NOX2 }}
          NOX_PINNED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: /usr/bin/python3 nox-control/owner_qwen6_backup_runner.py --native
      - name: Upload encrypted part 0
        uses: actions/upload-artifact@v4
        with:
          name: NOX_QWEN6_CIPHER_${{ github.run_id }}_PART_000
          path: artifacts/qwen6-checkpoint-backup/qwen6-cipher.part000
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload encrypted part 1
        uses: actions/upload-artifact@v4
        with:
          name: NOX_QWEN6_CIPHER_${{ github.run_id }}_PART_001
          path: artifacts/qwen6-checkpoint-backup/qwen6-cipher.part001
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload encrypted part 2
        uses: actions/upload-artifact@v4
        with:
          name: NOX_QWEN6_CIPHER_${{ github.run_id }}_PART_002
          path: artifacts/qwen6-checkpoint-backup/qwen6-cipher.part002
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload encrypted part 3
        uses: actions/upload-artifact@v4
        with:
          name: NOX_QWEN6_CIPHER_${{ github.run_id }}_PART_003
          path: artifacts/qwen6-checkpoint-backup/qwen6-cipher.part003
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload encrypted part 4
        uses: actions/upload-artifact@v4
        with:
          name: NOX_QWEN6_CIPHER_${{ github.run_id }}_PART_004
          path: artifacts/qwen6-checkpoint-backup/qwen6-cipher.part004
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload encrypted part 5
        uses: actions/upload-artifact@v4
        with:
          name: NOX_QWEN6_CIPHER_${{ github.run_id }}_PART_005
          path: artifacts/qwen6-checkpoint-backup/qwen6-cipher.part005
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload encrypted part 6
        uses: actions/upload-artifact@v4
        with:
          name: NOX_QWEN6_CIPHER_${{ github.run_id }}_PART_006
          path: artifacts/qwen6-checkpoint-backup/qwen6-cipher.part006
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload checksum receipt only
        uses: actions/upload-artifact@v4
        with:
          name: NOX_QWEN6_CIPHER_${{ github.run_id }}_RECEIPT
          path: artifacts/qwen6-checkpoint-backup/QWEN6_CIPHER_RECEIPT.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Always verify removal of this job's temporary native SSH key
        if: always()
        env:
          NOX2: ${{ secrets.NOX2 }}
        run: /usr/bin/python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
