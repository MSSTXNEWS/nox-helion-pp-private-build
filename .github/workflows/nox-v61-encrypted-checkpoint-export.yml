      - name: Upload encrypted part 1
        uses: actions/upload-artifact@v4
        with:
          name: NOX_QWEN55_CIPHER_${{ github.run_id }}_PART_001
          path: artifacts/qwen55-checkpoint-backup/qwen55-cipher.part001
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload encrypted part 2
        uses: actions/upload-artifact@v4
        with:
          name: NOX_QWEN55_CIPHER_${{ github.run_id }}_PART_002
          path: artifacts/qwen55-checkpoint-backup/qwen55-cipher.part002
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload encrypted part 3
        uses: actions/upload-artifact@v4
        with:
          name: NOX_QWEN55_CIPHER_${{ github.run_id }}_PART_003
          path: artifacts/qwen55-checkpoint-backup/qwen55-cipher.part003
          compression-level: 0
