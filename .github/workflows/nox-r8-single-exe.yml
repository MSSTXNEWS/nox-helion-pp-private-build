name: NOX R8 Windows desktop compilation
on:
  push:
    branches: [feature/nox-r8-liquid-one-exe-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile from exact source
        shell: pwsh
        run: |
          $zip='coordination/nox-r8/NOX_R8_SOURCE.zip'
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'a1ed386b4b9356c21a007c9c54dc2f98f27a25ede42bad91dafada99ddd70325') { throw 'SOURCE_HASH_MISMATCH' }
          Expand-Archive $zip -DestinationPath './r8' -Force
          # D05 native source from same R8 branch; base archive remains SHA-pinned.
          Copy-Item './coordination/nox-r8/overrides/src/MainWindow.xaml.cs' './r8/src/MainWindow.xaml.cs' -Force
          Copy-Item './coordination/nox-r8/overrides/src/index.html' './r8/src/index.html' -Force
          Copy-Item './coordination/nox-r8/tests/test_r8_learn_owner_queue.py' './r8/test_r8_learn_owner_queue.py'
          python './r8/test_r8_learn_owner_queue.py'
          if ($LASTEXITCODE -ne 0) { throw 'D05_LEARN_SOURCE_HOLD' }
          Copy-Item './coordination/nox-r8/tests/test_r8_settings_contract.py' './r8/test_r8_settings_contract.py'
          python './r8/test_r8_settings_contract.py'
          if ($LASTEXITCODE -ne 0) { throw 'D06_SETTINGS_SOURCE_HOLD' }
          Copy-Item './coordination/nox-r8/tests/test_r8_persona_memory.py' './r8/test_r8_persona_memory.py'
          python './r8/test_r8_persona_memory.py'
          if ($LASTEXITCODE -ne 0) { throw 'D03_PERSONA_MEMORY_SOURCE_HOLD' }
          Copy-Item './coordination/nox-r8/tests/test_r8_gpu_fallback.cjs' './r8/test_r8_gpu_fallback.cjs'
          node './r8/test_r8_gpu_fallback.cjs'
          if ($LASTEXITCODE -ne 0) { throw 'D04_GPU_FALLBACK_SOURCE_HOLD' }
          Copy-Item './coordination/nox-r8/tests/test_r8_ipc_contract.py' './r8/test_r8_ipc_contract.py'
          python './r8/test_r8_ipc_contract.py'
          if ($LASTEXITCODE -ne 0) { throw 'B02_NATIVE_IPC_SOURCE_HOLD' }
          # B03: fail-closed native checkpoint contract with isolated WAL/foreign-file fixture.
          Copy-Item './coordination/nox-r8/tests/test_r8_b03_checkpoint_no_loss.py' './r8/test_r8_b03_checkpoint_no_loss.py'
          python './r8/test_r8_b03_checkpoint_no_loss.py'
          if ($LASTEXITCODE -ne 0) { throw 'B03_CHECKPOINT_NOLOSS_SOURCE_HOLD' }
          # D01: execute actual embedded chat click handler with offline/overlength/valid drafts.
          Copy-Item './coordination/nox-r8/tests/test_r8_d01_chat_draft.cjs' './r8/test_r8_d01_chat_draft.cjs'
          node './r8/test_r8_d01_chat_draft.cjs'
          if ($LASTEXITCODE -ne 0) { throw 'D01_CHAT_OWNER_DRAFT_HOLD' }
          dotnet publish './r8/src/NOX.HELION.csproj' -c Release -r win-x64 --self-contained true -o './out' -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) { throw 'BUILD_FAILED' }
          Get-FileHash './out/NOX.HELION.exe' -Algorithm SHA256
      - name: Native WPF WebView2 eight-route smoke, isolated SQLite
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path './out/NOX.HELION.exe').Path
          $runId='NOX-R8-'+$env:GITHUB_RUN_ID
          $started=[DateTime]::UtcNow
          $p=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -ArgumentList @('--nox-ui-smoke',"--nox-runid=$runId") -PassThru
          try {
            Wait-Process -Id $p.Id -Timeout 95 -ErrorAction Stop
            $p.Refresh()
            $file=Join-Path $env:LOCALAPPDATA "NOX_HELION/ui_selftest_$($p.Id).json"
            if (!(Test-Path -LiteralPath $file)) {
              # Missing UI receipts are not a PASS. Surface the process-bound
              # startup failure rather than hiding its native error.
              $startup=Join-Path $env:LOCALAPPDATA "NOX_HELION/startup_failure_$($p.Id).json"
              $detail=if (Test-Path -LiteralPath $startup) { Get-Content -LiteralPath $startup -Raw } else { 'NO_STARTUP_FAILURE_RECEIPT' }
              throw "NOX_R8_UI_RECEIPT_MISSING PID=$($p.Id) EXIT=$($p.ExitCode) STARTUP=$detail"
            }
            $n=Get-Content $file -Raw | ConvertFrom-Json
            $sha=(Get-FileHash $exe -Algorithm SHA256).Hash
            $stamp=[DateTimeOffset]::Parse([string]$n.checkedAt).UtcDateTime
            if ($p.ExitCode -ne 0 -or $n.schema -ne 'NOX_WPF_UI_SMOKE_R7_V1' -or
                $n.runId -cne $runId -or $n.pid -ne $p.Id -or
                $stamp -lt $started -or !$n.wpfWebView2Accepted -or
                $n.checks.real_webview2_eight_routes -ne 'PASS' -or
                $n.checks.real_webview2_keyboard_routes -ne 'PASS' -or
                $n.checks.settings_windows_uia_host -ne 'PASS' -or
                $n.checks.settings_webview2_accessible_controls -ne 'PASS' -or
                $n.checks.settings_wpf_owner_sqlite_readback -ne 'PASS' -or
                $n.checks.settings_wpf_motion_sqlite_readback -ne 'PASS' -or
                $n.checks.settings_foreign_key_denial -ne 'PASS' -or
                $n.checks.sqlite_native_backup_no_loss -ne 'PASS' -or
                $n.checks.isolated_sqlite_path -ne 'PASS' -or
                $n.checks.native_wpf_webview2_renderer -ne 'PASS' -or
                ![string]::Equals($n.exeSha256,$sha,[StringComparison]::OrdinalIgnoreCase)) {
              throw "NOX_R8_WINDOWS_UI_HOLD: $($n.error)"
            }
            Copy-Item $file './out/UI_SMOKE_RECEIPT.json' -Force
            Write-Host "NOX_R8_WINDOWS_UI_NATIVE_PASS SHA256=$sha (local Qwen E2E not checked)"
          } finally {
            $p.Refresh()
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
          # D06: a real second WPF/WebView2 process must recover ECO from the
          # exact isolated SQLite DB, without writing to owner chat.sqlite3.
          $restartStarted=[DateTime]::UtcNow
          $restart=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -ArgumentList @('--nox-ui-smoke','--nox-settings-restart-readback',"--nox-runid=$runId") -PassThru
          try {
            Wait-Process -Id $restart.Id -Timeout 95 -ErrorAction Stop
            $restart.Refresh()
            $restartFile=Join-Path $env:LOCALAPPDATA "NOX_HELION/ui_selftest_$($restart.Id).json"
            if (!(Test-Path -LiteralPath $restartFile)) { throw 'NOX_R8_SETTINGS_RESTART_RECEIPT_MISSING' }
            $r=Get-Content $restartFile -Raw | ConvertFrom-Json
            $sha=(Get-FileHash $exe -Algorithm SHA256).Hash
            $stamp=[DateTimeOffset]::Parse([string]$r.checkedAt).UtcDateTime
            if ($restart.ExitCode -ne 0 -or $r.schema -ne 'NOX_WPF_UI_SMOKE_R7_V1' -or
                $r.runId -cne $runId -or $r.pid -ne $restart.Id -or
                $stamp -lt $restartStarted -or !$r.wpfWebView2Accepted -or
                $r.checks.isolated_sqlite_path -ne 'PASS' -or
                $r.checks.settings_wpf_owner_restart_readback -ne 'PASS' -or
                ![string]::Equals($r.exeSha256,$sha,[StringComparison]::OrdinalIgnoreCase)) {
              throw "NOX_R8_SETTINGS_RESTART_HOLD: $($r.error)"
            }
            Copy-Item $restartFile './out/SETTINGS_RESTART_RECEIPT.json' -Force
            Write-Host "NOX_R8_SETTINGS_RESTART_NATIVE_PASS SHA256=$sha (owner-PC restart not tested)"
          } finally {
            $restart.Refresh()
            if (!$restart.HasExited) { Stop-Process -Id $restart.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Package launch helper and verified EXE
        shell: pwsh
        run: |
          Copy-Item './r8/START_NOX.ps1' './out/START_NOX.ps1'
          $script='@echo off'+[Environment]::NewLine+
            'powershell.exe -NoProfile -File "%~dp0START_NOX.ps1"'+[Environment]::NewLine
          [IO.File]::WriteAllText((Join-Path (Resolve-Path './out').Path 'START_NOX.cmd'),$script,[Text.Encoding]::ASCII)
          Get-ChildItem './out' -File -Include '*.xml','*.pdb' | Remove-Item -Force -ErrorAction SilentlyContinue
          $exe=(Resolve-Path './out/NOX.HELION.exe').Path
          @{
            schema='NOX_R8_NATIVE_SINGLE_EXE_V1';
            source_sha256='a1ed386b4b9356c21a007c9c54dc2f98f27a25ede42bad91dafada99ddd70325';
            source_git_sha=$env:GITHUB_SHA;
            native_cs_sha256=(Get-FileHash './r8/src/MainWindow.xaml.cs' -Algorithm SHA256).Hash.ToLowerInvariant();
            embedded_html_sha256=(Get-FileHash './r8/src/index.html' -Algorithm SHA256).Hash.ToLowerInvariant();
            training='NOT_STARTED';
            exe_sha256=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant();
            compiled_and_native_ui='PASS'; local_qwen_e2e='NOT_TESTED';
            canonical_full_d02='NOT_ACCEPTED'; full_v16='NOT_IMPLEMENTED';
            accepted_full_release=$false
          } | ConvertTo-Json | Set-Content './out/BUILD_RECEIPT.json' -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: NOX-R8-WIN64
          path: out/
