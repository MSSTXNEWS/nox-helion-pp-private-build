name: NOX Vast.ai direct control
run-name: NOX Vast.ai 60509551 - ${{ github.event.inputs.operation || 'start' }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Vast.ai instance operation'
        type: choice
        required: true
        default: start
        options:
          - start
          - status
          - stop
  push:
    branches: [main]
    paths:
      - '.github/workflows/nox-vast-direct-control.yml'
permissions:
  contents: read
concurrency:
  group: nox-vast-control-60509551
  cancel-in-progress: false
jobs:
  vast-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VAST_API_KEY: ${{ secrets.NOX2 }}
      OPERATION: ${{ github.event.inputs.operation || 'start' }}
    steps:
      - name: Direct Vast.ai control using existing NOX2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, sys
          key = os.getenv("VAST_API_KEY", "")
          op = os.getenv("OPERATION", "start")
          if not key:
              print("::error::GitHub Actions secret NOX2 is empty or unavailable")
              sys.exit(1)
          if op not in ("start","stop","status"):
              print("::error::Unsupported operation")
              sys.exit(1)
          url = "https://console.vast.ai/api/v0/instances/60509551/"
          headers = {"Authorization": "Bearer " + key, "Accept":"application/json"}
          if op == "status":
              req = urllib.request.Request(url, headers=headers, method="GET")
          else:
              headers["Content-Type"] = "application/json"
              payload = json.dumps({"state":"running" if op == "start" else "stopped"}).encode()
              req = urllib.request.Request(url, data=payload, headers=headers, method="PUT")
          try:
              with urllib.request.urlopen(req, timeout=35) as r:
                  response = json.load(r)
          except urllib.error.HTTPError as e:
              print(f"::error::Vast.ai returned HTTP {e.code} for {op}; check NOX2 key and instance permissions")
              sys.exit(1)
          except Exception as e:
              print(f"::error::Vast.ai connection failed: {type(e).__name__}")
              sys.exit(1)
          if not isinstance(response, dict):
              print("::error::Unexpected response format")
              sys.exit(1)
          if response.get("success") is False:
              print("::error::Vast.ai rejected operation")
              sys.exit(1)
          print(f"NOX Vast.ai instance 60509551: {op} request accepted by API")
          if op == "status":
              d = response.get("instances",response)
              if isinstance(d,dict):
                  safe_fields=("id","actual_status","intended_status","gpu_name","num_gpus")
                  print(json.dumps({k:d.get(k) for k in safe_fields if k in d},ensure_ascii=False))
          PY
