name: NOX browser context challenge source checks
on:
  pull_request:
    paths:
      - 'nox-control/owner_chat_browser_qa.py'
      - 'nox-control/owner_chat_browser_transport_qa.py'
      - 'nox-control/owner_chat_browser_release_qa.py'
      - 'nox-control/owner_chat_stream_only_qa.py'
      - 'nox-control/owner_browser_stream_only_entry.py'
      - 'nox-control/test_owner_chat_stream_only_qa.py'
      - 'nox-control/test_owner_browser_stream_only_entry.py'
      - '.github/workflows/nox-browser-context-challenge-source.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the browser bundle and two-turn context regression
        env:
          PYTHONPATH: nox-control
        run: python3 -B -m unittest -v test_owner_chat_stream_only_qa test_owner_browser_stream_only_entry
