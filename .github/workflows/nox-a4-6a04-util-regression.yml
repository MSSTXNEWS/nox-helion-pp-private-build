name: NOX A4 6A04 source regression
on:
  pull_request:
    paths:
      - 'nox-control/nox_dispatcher_advisor.py'
      - 'nox-control/bridge/nox_webapi.py'
      - 'nox-control/test_nox_web_gpu_status_6a04.py'
      - 'nox-control/test_nox_dispatcher_advisor_6a04.py'
      - 'nox-control/test_nox_dispatcher_advisor_0a01.py'
      - '.github/workflows/nox-a4-6a04-util-regression.yml'
permissions:
  contents: read
jobs:
  focused-6a04:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: One focused source regression for 6A04 and 0A01
        run: |
          python3 -B -m unittest discover -s nox-control -p 'test_*6a04.py' -q
          python3 -B -m unittest discover -s nox-control -p 'test_*0a01.py' -q
