name: NOX bounded memory reclaim watchdog
on:
  push:
    paths:
      - 'nox-control/nox_memory_reclaim_watchdog.py'
      - 'nox-control/test_nox_memory_reclaim_watchdog.py'
      - 'nox-control/memory-reclaim-policy.example.json'
      - 'nox-control/NOX_MEMORY_RECLAIM.md'
      - 'nox-control/systemd/nox-memory-managed.slice'
      - 'nox-control/systemd/nox-memory-reclaim-watchdog.service'
      - '.github/workflows/nox-memory-reclaim-watchdog.yml'
  pull_request:
    paths:
      - 'nox-control/nox_memory_reclaim_watchdog.py'
      - 'nox-control/test_nox_memory_reclaim_watchdog.py'
      - 'nox-control/memory-reclaim-policy.example.json'
      - 'nox-control/NOX_MEMORY_RECLAIM.md'
      - 'nox-control/systemd/nox-memory-managed.slice'
      - 'nox-control/systemd/nox-memory-reclaim-watchdog.service'
      - '.github/workflows/nox-memory-reclaim-watchdog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m py_compile nox-control/nox_memory_reclaim_watchdog.py nox-control/test_nox_memory_reclaim_watchdog.py
      - run: python3 -m unittest discover -s nox-control -p 'test_nox_memory_reclaim_watchdog.py' -v
      - run: python3 -c 'import json; json.load(open("nox-control/memory-reclaim-policy.example.json"))'
