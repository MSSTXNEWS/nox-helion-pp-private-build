name: NOX V71 S03 SQLite RAM snapshot safety smoke
on:
  push:
    branches: [nox/e2-v71-oneprime-chatfirst-20261114]
    paths: ['.github/workflows/nox-e2-v71-s03-ram-smoke.yml']
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-e2-v71-live-s03-ram-smoke
  cancel-in-progress: false
jobs:
  native:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check safe remote code
        run: |
          set -euo pipefail
          test -n "$NOX2"
          python3 -m py_compile nox_runpod/teacher_mesh/v71/s03_ram_smoke.py
      - name: Make only volatile SQLite RAM snapshots and quick_check in existing Vast
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v71.s03_ram_smoke
      - name: Remove exact temporary SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Scope receipt
        if: success()
        run: |
          echo "NOX_S03_RAM_QUICK_CHECK_SMOKE_ONLY=true"
          echo "NOX_S03_ACTIVE_ONEHOST_NOT_REWIRED=true"
          echo "NOX_CANONICAL_SQLITE_NEVER_MOVED=true"
