name: NOX V125 owner-confirmed facts to original S03 M2
on:
  push:
    branches: [nox/e2-v125-owner-s03-facts-20261115]
    paths:
      - '.github/workflows/nox-e2-v125-fact-source-ci.yml'
      - 'nox_runpod/teacher_mesh/v125/owner_fact_write.py'
      - 'nox_runpod/teacher_mesh/v125/test_owner_fact_write.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-s03-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only isolated HTTP fixture dependencies
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Validate exact original S03 schema, owner authentication and STOP
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v125/owner_fact_write.py
          python -m unittest -v nox_runpod.teacher_mesh.v125.test_owner_fact_write
          echo "NOX_V125_ORIGINAL_S03_FACT_SOURCE=PASS"
          echo "NOX_V125_NATIVE_SERVER_CHANGED=false"
          echo "NOX_V125_REAL_S03_ROWS_NOT_EXPORTED=true"
