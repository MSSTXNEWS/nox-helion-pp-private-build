name: NOX D3 SSH ephemeral-key cleanup source safety
on:
  pull_request:
    paths:
      - 'nox-control/cmd_agent/run_update.py'
      - 'nox-control/cmd_agent/test_run_update_cleanup.py'
      - '.github/workflows/nox-d3-ssh-key-cleanup-ci.yml'
permissions: {contents: read}
jobs:
  cleanup-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: One focused fail-closed cleanup regression
        run: |
          python3 -B -m unittest discover -s nox-control/cmd_agent -p test_run_update_cleanup.py -v
