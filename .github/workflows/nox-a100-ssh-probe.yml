name: NOX A100 SSH via hosted Linux
on:
  push:
    branches:
      - control/nox-a100-github-ssh-probe-20261112
    paths:
      - .github/workflows/nox-a100-ssh-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-connect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Connect to A100 using existing private SSH secret
        shell: bash
        env:
          SSH_KEY: ${{ secrets.NOX_RUNPOD_SSH_PRIVATE_KEY }}
          NOX_HOST: 216.81.151.54
          NOX_PORT: "13704"
          EXPECTED_HOST_FINGERPRINT: "SHA256:FGcaxeq6a1ci00/sV9I0VE7b60KNmrVVDIVdx0Nhp2M"
        run: |
          set -Eeuo pipefail
          umask 077
          if [[ -z "${SSH_KEY:-}" ]]; then
            echo "::error::HOLD_NOX_RUNPOD_SSH_PRIVATE_KEY secret missing in this repository"
            exit 2
          fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/nox_ephemeral"
          chmod 600 "$HOME/.ssh/nox_ephemeral"
          ssh-keygen -y -f "$HOME/.ssh/nox_ephemeral" >/dev/null || {
            echo "::error::HOLD_INVALID_SSH_PRIVATE_KEY"
            exit 3
          }
          timeout 12 ssh-keyscan -T 6 -p "$NOX_PORT" -t ed25519 "$NOX_HOST" > "$HOME/.ssh/known_hosts_raw" 2>/dev/null || {
            echo "::error::HOLD_SSH_TCP_UNREACHABLE"
            exit 4
          }
          awk '$2=="ssh-ed25519" {print}' "$HOME/.ssh/known_hosts_raw" > "$HOME/.ssh/known_hosts"
          actual=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')
          if [[ "$actual" != "$EXPECTED_HOST_FINGERPRINT" ]]; then
            echo "::error::HOLD_HOST_FINGERPRINT_MISMATCH"
            exit 5
          fi
          echo "NOX_HOST_KEY_VERIFIED"
          timeout 28 ssh -i "$HOME/.ssh/nox_ephemeral" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 \
            -p "$NOX_PORT" "root@$NOX_HOST" \
            'printf "NOX_A100_SSH_CONNECTED\n"; hostname; nvidia-smi --query-gpu=name,temperature.gpu,utilization.gpu,memory.used --format=csv,noheader; df -h /'
          echo "NOX_A100_SSH_READONLY_DONE"
