name: NOX V92 owner TTFT, memory dialog IDs and Volta knobs
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v92-owner-latency.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions: {contents: read}
concurrency:
  group: nox-v92-source-inspect
  cancel-in-progress: false
jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile both outer and native source before remote execution
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v92/owner_latency_memory_trainer_audit.py
          python3 - <<'PY'
          from nox_runpod.teacher_mesh.v92.owner_latency_memory_trainer_audit import REMOTE
          native=REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0]
          compile(native,'<remote V92>','exec')
          print('NOX_V92_RUNNER_AND_NATIVE_SYNTAX=PASS')
          PY
      - name: Audit existing runtime without reading private records
        run: python3 -m nox_runpod.teacher_mesh.v92.owner_latency_memory_trainer_audit
      - name: Revoke temporary SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
