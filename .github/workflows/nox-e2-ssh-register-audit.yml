name: NOX E2 SSH registration read-only audit
on:
  push:
    branches: [nox/e2-vast-file-transfer-20261114]
    paths: ['.github/workflows/nox-e2-ssh-register-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      VAST_API_KEY: ${{ secrets.NOX2 }}
    steps:
      - name: Inspect SSH registry metadata (no public keys output)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          key=os.environ.get('VAST_API_KEY','')
          if not key:raise SystemExit('HOLD_NOX2')
          for label,url in [('INSTANCE','https://console.vast.ai/api/v0/instances/60509551/ssh'),('ACCOUNT','https://console.vast.ai/api/v0/ssh')]:
              try:
                  r=urllib.request.Request(url,headers={'Authorization':'Bearer '+key,'Accept':'application/json'})
                  with urllib.request.urlopen(r,timeout=22) as response:data=json.load(response)
              except urllib.error.HTTPError as e:
                  print(label+'_HTTP_STATUS='+str(e.code))
                  continue
              except Exception as e:
                  print(label+'_ERROR='+type(e).__name__)
                  continue
              arr=data.get('ssh_keys',data) if isinstance(data,dict) else data
              if isinstance(arr,str):
                  try:arr=json.loads(arr)
                  except ValueError:arr=[]
              if not isinstance(arr,list):
                  print(label+'_REGISTRY_NOT_A_LIST')
                  continue
              print(label+'_SSH_KEY_COUNT='+str(len(arr)))
              own=sum(isinstance(x,dict) and 'nox-e2-one-time' in str(x.get('public_key') or x.get('key') or x.get('ssh_key') or '') for x in arr)
              print(label+'_POSSIBLE_OWN_ORPHANS='+str(own))
          PY
