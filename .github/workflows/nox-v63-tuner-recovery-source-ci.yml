name: NOX V63 agent tuner recovery source safety tests
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - .github/workflows/nox-v63-tuner-recovery-source-ci.yml
      - nox_runpod/teacher_mesh/v63/recover_agent_tuner.py
      - nox_runpod/teacher_mesh/v63/tests/test_safe_recovery.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run source compile and guarded recovery security unit-tests
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v63/recover_agent_tuner.py
          python3 -m unittest discover -s nox_runpod/teacher_mesh/v63/tests -p 'test_safe_recovery.py' -v
      - name: Source only
        run: |
          echo "LIVE_TUNER_RESTARTED=false"
          echo "NOX_WEIGHTS_OR_S03_CHANGED=false"
