name: NOX V14 B6 original-dispatcher progress source acceptance
on:
  push:
    branches:
      - feature/nox-v38-synaptic-brain-20261114
    paths:
      - nox-control/owner_component_tasks.py
      - nox-control/test_owner_component_progress_v14.py
      - .github/workflows/nox-v14-b6-dispatcher-progress-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile existing source and test
        run: python3 -m py_compile nox-control/owner_component_tasks.py nox-control/test_owner_component_progress_v14.py
      - name: Source acceptance, no SSH, GPU, S03, or model change
        run: python3 -m unittest discover -s nox-control -p 'test_owner_component_progress_v14.py' -v
