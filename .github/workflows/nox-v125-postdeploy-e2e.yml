name: NOX V125 independent live 92-route and genuine owner chat S03 after deployment
on:
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
  push:
    branches: [nox/v125-live-owner-metrics-20261115]
    paths:
      - '.github/workflows/nox-v125-postdeploy-e2e.yml'
permissions:
  contents: read
concurrency:
  group: nox-60509551-v125-postdeploy-e2e
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Source-only audit, 92-path manifest and original S03 E2E SHA verification
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v125/postdeploy_owner_chat_e2e.py
          python -m unittest -v nox_runpod.teacher_mesh.v122.test_immutable_live_web_audit
          python -m unittest -v nox_runpod.teacher_mesh.v125.test_postdeploy_owner_chat_e2e
  native_routes:
    needs: source
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Read-only native route count and current bridge/proxy/S03 SHA
        run: |
          test -n "$NOX2" || { echo 'HOLD_NOX2'; exit 2; }
          python -m nox_runpod.teacher_mesh.v122.immutable_live_web_audit
      - name: Revoke temporary SSH key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
  native_owner_chat_e2e:
    needs: native_routes
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Independent owner cookie, genuine native stream, S03 commit and history readback
        run: |
          test -n "$NOX2" || { echo 'HOLD_NOX2'; exit 2; }
          python -m nox_runpod.teacher_mesh.v125.postdeploy_owner_chat_e2e
      - name: Always remove temporary SSH identity
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
