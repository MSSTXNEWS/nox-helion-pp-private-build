name: NOX redacted credential path AST source gate
on:
  pull_request:
    paths:
      - 'nox-control/owner_smart_chat_acceptance.py'
      - 'nox-control/test_owner_smart_chat_credential_ast_shape.py'
      - '.github/workflows/nox-smart-chat-credential-ast-source.yml'
  push:
    paths:
      - 'nox-control/owner_smart_chat_acceptance.py'
      - 'nox-control/test_owner_smart_chat_credential_ast_shape.py'
      - '.github/workflows/nox-smart-chat-credential-ast-source.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and test sanitized AST receipt
        run: |
          python3 -m py_compile nox-control/owner_smart_chat_acceptance.py nox-control/test_owner_smart_chat_credential_ast_shape.py
          python3 -m unittest discover -s nox-control -p 'test_owner_smart_chat_credential_ast_shape.py' -v
