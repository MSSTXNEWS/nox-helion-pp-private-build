name: NOX RunPod Direct Orchestrator (adapter-free A5000 boost)
run-name: NOX A5000 direct second CUDA lane + A40 health
on:
  workflow_dispatch:
    inputs:
      training_admission:
        description: "Explicit owner admission; default remains HOLD"
        required: true
        type: choice
        options: [HOLD, AUTHORIZED]
        default: HOLD
      training_target:
        description: "Must match the pinned trainable model manifest"
        required: true
        type: string
        default: HOLD
      model_manifest_sha256:
        description: "SHA-256 of nox_runpod/stage0/training_admission_manifest.json"
        required: true
        type: string
        default: HOLD
permissions:
  contents: read
concurrency:
  group: nox-runpod-direct-orchestrator
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ssh_ready: ${{ steps.check.outputs.ssh_ready }}
      admission_ready: ${{ steps.check.outputs.admission_ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Require pinned model admission before GPU worker launch
        env:
          RUNPOD_KEY: ${{ secrets.NOX_RUNPOD_SSH_PRIVATE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          TRAINING_ADMISSION: ${{ inputs.training_admission }}
          TRAINING_TARGET: ${{ inputs.training_target }}
          MANIFEST_SHA256: ${{ inputs.model_manifest_sha256 }}
        run: |
          set -euo pipefail
          echo "ssh_ready=false" >> "$GITHUB_OUTPUT"
          echo "admission_ready=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" != "workflow_dispatch" ||
                "$TRAINING_ADMISSION" != "AUTHORIZED" ||
                "$TRAINING_TARGET" != "deepseek-v4.1-flash-1017-trainable" ||
                ! "$MANIFEST_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "HOLD: explicit target and pinned manifest admission are required."
            exit 0
          fi
          python - <<'PY'
          import hashlib, json, os, re, sys
          path = "nox_runpod/stage0/training_admission_manifest.json"
          raw = open(path, "rb").read()
          if hashlib.sha256(raw).hexdigest() != os.environ["MANIFEST_SHA256"].lower():
              sys.exit("HOLD: model manifest SHA-256 mismatch")
          doc = json.loads(raw)
          valid = (
              doc.get("status") == "AUTHORIZED"
              and doc.get("target_model") == os.environ["TRAINING_TARGET"]
              and doc.get("trainable_base") is True
              and doc.get("license_status") == "VERIFIED"
              and doc.get("quantized_inference_only") is False
              and bool(re.fullmatch(r"[0-9a-fA-F]{40,64}", str(doc.get("source_revision", ""))))
          )
          if not valid:
              sys.exit("HOLD: manifest is not an authorized, licensed trainable base")
          PY
          echo "admission_ready=true" >> "$GITHUB_OUTPUT"
          if [[ -z "$RUNPOD_KEY" ]]; then
            echo "::error::Missing NOX_RUNPOD_SSH_PRIVATE_KEY secret. No RunPod command was executed."
            exit 1
          fi
          echo "ssh_ready=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: preflight
    if: ${{ needs.preflight.outputs.admission_ready == 'true' && needs.preflight.outputs.ssh_ready == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: A5000
            host: 69.30.85.188
            port: 22199
          - node: A40
            host: 69.30.85.193
            port: 22088
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install SSH key from secure repo secret
        env:
          RUNPOD_KEY: ${{ secrets.NOX_RUNPOD_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$RUNPOD_KEY" > ~/.ssh/nox
          chmod 600 ~/.ssh/nox
      - name: Start A5000 second teacher CUDA stream (A40 unaffected)
        env:
          NODE: ${{ matrix.node }}
          HOST: ${{ matrix.host }}
          PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/nox -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -p "$PORT" "root@$HOST" \
            "if [ -e /workspace/nox/STOP ] || [ -e /workspace/nox/MODEL_UPDATE ]; then echo NOX_STOP_HOLD_ACTIVE; exit 42; fi; if [ \"$NODE\" = A5000 ]; then curl -fsSL https://raw.githubusercontent.com/MSSTXNEWS/nox-helion-pp-private-build/0f6d1a0899444019f2e8dfd910fdeec382f52757/nox_runpod/stage0/start_a5000_cuda_secondary_direct.sh | bash; else echo NOX_A40_EXISTING_TASKS_UNTOUCHED; fi"
      - name: Check remotely requested processes, GPU and persistence
        if: always()
        env:
          NODE: ${{ matrix.node }}
          HOST: ${{ matrix.host }}
          PORT: ${{ matrix.port }}
        run: |
          ssh -i ~/.ssh/nox -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -p "$PORT" "root@$HOST" \
            'nvidia-smi --query-gpu=utilization.gpu,memory.used,memory.total --format=csv; find /workspace/nox/dispatcher/dual_gpu -maxdepth 1 -name "*.pid" -print 2>/dev/null; df -h /workspace' || exit 1
