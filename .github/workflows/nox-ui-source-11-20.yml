name: NOX UI source archive 11-20
on:
  push:
    branches:
      - assets/download-ui-11-20-20261105
    paths:
      - .github/workflows/nox-ui-source-11-20.yml
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Download upstream sources verify and archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nox-ui-11-20
          cat > repos.tsv <<'EOF'
          11 tabler-demo tabler/tabler
          12 shadcn-ui shadcn-ui/ui
          13 radix-ui radix-ui/primitives
          14 lucide lucide-icons/lucide
          15 svg-gauge naikus/svg-gauge
          16 progressbar-js kimmobrunfeldt/progressbar.js
          17 apache-echarts apache/echarts
          18 uplot leeoniya/uPlot
          19 apexcharts apexcharts/apexcharts.js
          20 chartjs chartjs/Chart.js
          EOF
          printf 'number,name,repository,commit_sha,archive,bytes,sha256,notes\n' > nox-ui-11-20/MANIFEST.csv
          while read -r number name repo; do
            echo "Fetching $number $name from $repo"
            metadata="$(curl -fsSL --retry 3 --max-time 90 -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$repo")"
            branch="$(jq -r .default_branch <<< "$metadata")"
            commit="$(curl -fsSL --retry 3 --max-time 90 "https://api.github.com/repos/$repo/commits/$branch" | jq -r .sha)"
            file="nox-ui-11-20/${number}_${name}.zip"
            curl -fL --retry 4 --max-time 720 "https://codeload.github.com/$repo/zip/$commit" -o "$file"
            test -s "$file"
            unzip -tqq "$file"
            bytes="$(stat -c '%s' "$file")"
            hash="$(sha256sum "$file" | cut -d' ' -f1)"
            notes="complete upstream source snapshot"
            if [ "$number" = "11" ]; then notes="Tabler Demo is contained in upstream tabler repo; demo site itself is not a separate downloadable repository"; fi
            printf '%s,%s,%s,%s,%s,%s,%s,%s\n' "$number" "$name" "$repo" "$commit" "$(basename "$file")" "$bytes" "$hash" "$notes" >> nox-ui-11-20/MANIFEST.csv
          done < repos.tsv
          test "$(find nox-ui-11-20 -name '*.zip' | wc -l)" -eq 10
          sha256sum nox-ui-11-20/*.zip > nox-ui-11-20/SHA256SUMS.txt
          cat > nox-ui-11-20/README.txt <<'EOF'
          NOX UI source donor pack, items 11-20.
          11 Tabler Demo: source is part of tabler/tabler; includes the demo pages. Item 10 in the prior bundle was the same upstream repository.
          Items 12-20: upstream source repositories, not installed packages; installation may require package managers/build tooling.
          Each ZIP contains its own upstream license files where provided. Check licenses before redistribution.
          SHA256SUMS.txt records checksums for inner ZIP files.
          EOF
          cd nox-ui-11-20
          zip -0 -q ../NOX_UI_11_20_FULL_SOURCE.zip ./*
      - uses: actions/upload-artifact@v4
        with:
          name: NOX_UI_11_20_FULL_SOURCE
          path: NOX_UI_11_20_FULL_SOURCE.zip
          if-no-files-found: error
          retention-days: 2
