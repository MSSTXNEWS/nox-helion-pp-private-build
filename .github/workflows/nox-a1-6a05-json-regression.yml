name: NOX A1 6A05 telemetry source regression
on:
  pull_request:
    paths:
      - 'nox-control/nox_dispatcher_advisor.py'
      - 'nox-control/test_nox_dispatcher_advisor_6a05_json.py'
      - 'nox-control/bridge/nox_webapi.py'
      - 'nox-control/test_nox_web_ram_6a05.py'
      - 'nox-control/owner_chat_ui.py'
      - 'nox-control/test_owner_chat_ui_5v14.py'
      - '.github/workflows/nox-a1-6a05-json-regression.yml'
permissions:
  contents: read
jobs:
  focused-json-6a05:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: One focused source regression
        run: |
          python3 -B -m unittest discover -s nox-control -p 'test_nox_dispatcher_advisor_6a05_json.py' -q
          python3 -B -m unittest discover -s nox-control -p 'test_nox_web_ram_6a05.py' -q
          python3 -B -m unittest discover -s nox-control -p 'test_owner_chat_ui_5v14.py' -q
      - name: One real FastAPI mini-chat ingress preservation check
        run: |
          python3 -m pip install -q "fastapi==0.128.2" "httpx==0.28.1"
          PYTHONPATH=nox-control/bridge python3 -B -m unittest -q test_webapi_s03_receipt.FactReceiptTest.test_0a03_malformed_chat_never_starts_stream_or_memory
