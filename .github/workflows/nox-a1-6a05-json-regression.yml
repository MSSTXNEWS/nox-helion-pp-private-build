name: NOX A1 6A05 owner JSON source regression
on:
  pull_request:
    paths:
      - 'nox-control/nox_dispatcher_advisor.py'
      - 'nox-control/test_nox_dispatcher_advisor_6a05_json.py'
      - '.github/workflows/nox-a1-6a05-json-regression.yml'
permissions:
  contents: read
jobs:
  focused-json-6a05:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: One focused source regression
        run: python3 -B -m unittest discover -s nox-control -p 'test_nox_dispatcher_advisor_6a05_json.py' -q
