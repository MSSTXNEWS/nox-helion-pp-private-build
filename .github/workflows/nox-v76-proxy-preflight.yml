name: NOX V76 dynamic owner proxy source inspection
on:
  pull_request:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v76/proxy_source_inspect_v2.py'
      - 'nox_runpod/teacher_mesh/v76/test_proxy_source_inspect_v2.py'
      - '.github/workflows/nox-v76-proxy-preflight.yml'
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v76/proxy_source_inspect_v2.py'
      - 'nox_runpod/teacher_mesh/v76/test_proxy_source_inspect_v2.py'
      - '.github/workflows/nox-v76-proxy-preflight.yml'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved read-only NOX OneHost inspection'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions: {contents: read}
concurrency:
  group: nox-v76-proxy-source-inspection
  cancel-in-progress: false
jobs:
  source-tests:
    if: "${{ github.event_name != 'workflow_dispatch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile and run bounded AST source tests
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v76/proxy_source_inspect_v2.py nox_runpod/teacher_mesh/v76/test_proxy_source_inspect_v2.py
          python3 -m unittest nox_runpod.teacher_mesh.v76.test_proxy_source_inspect_v2 -v
  native-read-only:
    if: "${{ github.event_name != 'workflow_dispatch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile exact pinned inspection entry
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v76/proxy_source_inspect_v2.py
      - name: Resolve and inspect current proxy PID without restart
        run: python3 -m nox_runpod.teacher_mesh.v76.proxy_source_inspect_v2
      - name: Revoke temporary SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
