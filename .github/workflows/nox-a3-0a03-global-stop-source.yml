name: NOX A3 0A03 global STOP source gate
on:
  push:
    branches:
      - a3/0a03-chat-global-stop-epoch-20261121
    paths:
      - nox-control/bridge/nox_webapi.py
      - nox-control/bridge/test_webapi_s03_receipt.py
      - .github/workflows/nox-a3-0a03-global-stop-source.yml
  pull_request:
    paths:
      - nox-control/bridge/nox_webapi.py
      - nox-control/bridge/test_webapi_s03_receipt.py
      - .github/workflows/nox-a3-0a03-global-stop-source.yml
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing FastAPI test dependency
        run: python -m pip install "fastapi>=0.110,<1.0"
      - name: One no-network endpoint stop/receipt regression
        run: |
          set -euo pipefail
          python -B -m unittest discover -s nox-control/bridge -p test_webapi_s03_receipt.py -v
