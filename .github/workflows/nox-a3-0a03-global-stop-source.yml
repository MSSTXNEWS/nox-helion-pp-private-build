name: NOX A3 0A03 global STOP source gate
on:
  push:
    branches:
      - a3/0a03-chat-global-stop-epoch-20261121
    paths:
      - nox-control/bridge/nox_webapi.py
      - nox-control/bridge/test_webapi_s03_receipt.py
      - nox-control/bridge/test_s03_export_provenance_0a03.py
      - coordination/onepass/nox-v135-resonance-owner-bridge.js
      - coordination/onepass/test_v135_resonance_owner_bridge.cjs
      - .github/workflows/nox-a3-0a03-global-stop-source.yml
  pull_request:
    paths:
      - nox-control/bridge/nox_webapi.py
      - nox-control/bridge/test_webapi_s03_receipt.py
      - nox-control/bridge/test_s03_export_provenance_0a03.py
      - coordination/onepass/nox-v135-resonance-owner-bridge.js
      - coordination/onepass/test_v135_resonance_owner_bridge.cjs
      - .github/workflows/nox-a3-0a03-global-stop-source.yml
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing FastAPI test dependency
        run: python -m pip install "fastapi>=0.110,<1.0" "httpx>=0.27,<1.0"
      - name: One no-network endpoint stop/receipt regression
        run: |
          set -euo pipefail
          python -B -m unittest discover -s nox-control/bridge -p test_webapi_s03_receipt.py -v
          python -B -m unittest discover -s nox-control/bridge -p test_s03_export_provenance_0a03.py -v

  browser-s03-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: One native-bridge browser S03 history integrity regression
        run: node --test --test-name-pattern='0A03 legacy S03 history never labels malformed native rows saved' coordination/onepass/test_v135_resonance_owner_bridge.cjs
