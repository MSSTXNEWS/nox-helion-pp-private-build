name: NOX E06 EXPRESS one-block real WPF Python NSIS and mandatory report
on:
  push:
    branches:
      - codex/v16-executor2-ollama-contract-20261027
      - e06/v16-r08-binary-diagnostic-20261028
      - e06/v16-express-onehost-20261028
      - e06/v16-r13-correct-p01-webview2-combined-20261028
      - e06/v16-r16-owner1-entire-nsis-admission-20261028
      - e06/final-express-20261028-r22
    paths:
      - '.github/workflows/nox-p02-r08-wpf-build.yml'
      - 'coordination/e06/OriginalPythonDiagnosticBridge.cs'
      - 'coordination/e06/stage_onehost.py'
      - 'coordination/e06/build_onehost_installer.ps1'
      - 'coordination/e06/express_per_run_report.py'
      - '.github/workflows/nox-e06-express-oneblock.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deterministic original 25-blobs and 729-source tests
        run: python3 -m unittest discover -s tests/express -p 'test_*.py' -v
      - name: Verify original Git blobs, reconstructed ZIP, all 729 source SHA-256
        run: |
          python3 coordination/express/verify_stage.py --root . --lock coordination/express/NOX_V16_EXPRESS_MAIN_BLOB_LOCK.json --output "$RUNNER_TEMP/NOX_E06_R22_SOURCE_RECEIPT.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NOX-E06-R22-VERIFIED-SOURCE-${{ github.run_id }}
          path: ${{ runner.temp }}/NOX_E06_R22_SOURCE_RECEIPT.json
          retention-days: 30
  current-wpf-diagnostic:
    needs: source-seal
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout owner 2 branch (CI metadata only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout E06 sealed R08 diagnostic source (read-only)
        uses: actions/checkout@v4
        with:
          repository: MSSTXNEWS/nox-helion-pp-private-build
          ref: 6f41831c69d41adec6899b07c074b0b19cd68b28
          path: .e06-r08-source
          persist-credentials: false
      - name: Checkout E06 previously implemented compiler fixes (read-only)
        uses: actions/checkout@v4
        with:
          repository: MSSTXNEWS/nox-helion-pp-private-build
          ref: 0a832004d4b57127f08d3b045dc864ddf149d8a4
          path: .e06-existing-fixes
          persist-credentials: false
      - name: Checkout exact owner1 corrected P01 source
        uses: actions/checkout@v4
        with:
          repository: MSSTXNEWS/nox-helion-pp-private-build
          ref: 8e42bb15aecbee8412c342b0e9049b6cce044297
          path: .p01-approved-source
          persist-credentials: false
      - name: Checkout exact R16 approved E06 builder without modifying this source tree
        uses: actions/checkout@v4
        with:
          repository: MSSTXNEWS/nox-helion-pp-private-build
          ref: 5f8f992582e55039a4ba6bf3c8d1c89fa62de144
          path: .e06-approved-builder
          persist-credentials: false
      - name: Checkout pinned signed Microsoft WebView2 prerequisite verifier
        uses: actions/checkout@v4
        with:
          repository: MSSTXNEWS/nox-helion-pp-private-build
          ref: b5233bbb58a059783d1d143b2523e32cae3724d3
          path: .e06-webview2
          persist-credentials: false
      - name: Official .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Python stdlib only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate R08 original source and isolate diagnostic stage
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source='.e06-r08-source/proposals/E06/express/NOX_R08_WPF_DIAG_CODE_ONLY.zip'
          $expected='fbeab580b90930e93f80ea83bea610a034f3411f00f3433b2e688d5ae0d921a9'
          if (!(Test-Path -LiteralPath $source -PathType Leaf)) { throw 'R08_PINNED_SOURCE_MISSING' }
          if ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'R08_SOURCE_SHA256_MISMATCH' }
          New-Item -ItemType Directory -Path 'work/e06/staged' -Force | Out-Null
          Expand-Archive -LiteralPath $source -DestinationPath 'work/e06/staged'
          $manifest=Get-Content 'work/e06/staged/EXPRESS_SOURCE_MANIFEST.json' -Raw | ConvertFrom-Json
          if ($manifest.schema -cne 'NOX_EXPRESS_R08_ORIGINAL_SOURCE_INVENTORY_V1' -or $manifest.original_full_zip_sha256 -cne '67ba6deae9b315fbdfcd6f1cc076be68f6e33e1920a8bd829794d12f14573689') { throw 'R08_MANIFEST_HOLD' }
          $checked=0
          foreach ($file in $manifest.files) {
            if ($file.in_compile_subset -ne $true) { continue }
            $path=[string]$file.path
            if ($path -notmatch '^R11/[A-Za-z0-9._/\\-]+$' -or $path.Contains('..')) { throw 'UNSAFE_R08_MEMBER_PATH' }
            $full=Join-Path 'work/e06/staged' $path
            if (!(Test-Path -LiteralPath $full -PathType Leaf)) { throw 'R08_MEMBER_MISSING' }
            if ((Get-Item $full).Length -ne [long]$file.bytes) { throw 'R08_MEMBER_SIZE_HOLD' }
            if ((Get-FileHash $full -Algorithm SHA256).Hash.ToLowerInvariant() -cne [string]$file.sha256) { throw 'R08_MEMBER_SHA_HOLD' }
            $checked++
          }
          if ($checked -lt 90) { throw 'R08_INCOMPLETE_SUBSET' }
          'R08_PINNED_SOURCE_PASS' | Set-Content -LiteralPath 'work/e06/staged/R08-source-seal.txt'
          New-Item -ItemType Directory -Path 'coordination/e06' -Force | Out-Null
          Copy-Item '.e06-existing-fixes/coordination/e06/patch_legacy_p05_html.py' 'coordination/e06/patch_legacy_p05_html.py'
          Copy-Item '.e06-existing-fixes/coordination/e06/patch_legacy_compiler.py' 'coordination/e06/patch_legacy_compiler.py'
      - name: Recover the four approved D02 images from verified frozen original archive
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targetRoot='work/e06/staged/R11/Assets'
          if (!(Test-Path -LiteralPath $targetRoot -PathType Container)) { throw 'NOX_R08_ASSETS_FOLDER_MISSING' }
          $tmp=Join-Path $env:RUNNER_TEMP 'NOX_E06_APPROVED_D02_ORIGINAL.zip'
          if (Test-Path $tmp) { throw 'NOX_D02_TEMP_ARCHIVE_ALREADY_EXISTS' }
          $writer=[IO.FileStream]::new($tmp,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try {
            foreach ($name in @('source_00.part','source_01.part','source_02.part')) {
              if (!(Test-Path -LiteralPath $name -PathType Leaf)) { throw "NOX_ORIGINAL_SOURCE_PART_MISSING:$name" }
              $reader=[IO.File]::OpenRead((Resolve-Path -LiteralPath $name).Path)
              try { $reader.CopyTo($writer) } finally { $reader.Dispose() }
            }
          } finally { $writer.Dispose() }
          if ((Get-Item -LiteralPath $tmp).Length -ne 60364346) { throw 'NOX_ORIGINAL_SOURCE_SIZE_HOLD' }
          if ((Get-FileHash -LiteralPath $tmp -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'ff8e2848c7c7ab776b90cbd8ac28e41e3815e96373c3c5f635d7587284629e9a') { throw 'NOX_ORIGINAL_SOURCE_SHA_HOLD' }
          Add-Type -AssemblyName System.IO.Compression
          $assets=@(
            @{from='assets/HOME_OWNER_APPROVED.png';to='home.png';sha='382c1069afcaaaed11c319796f2c553d2bd977d7e46c68ecd7d55af26e132a4a'},
            @{from='assets/approved_ui/NOX_HELION_MENU_OWNER_APPROVED_20261019.png';to='menu.png';sha='4c73d137e6d25f496abb006dbb8af08b1fe272d2f935c5006f0f42b6fd9992b9'},
            @{from='assets/approved_ui/NOX_HELION_APPROVED_CORE_01_CONSCIOUSNESS_20261020.png';to='core01.png';sha='343e5c73539358fe2c086706b4155cc0f9cd9702fcd40a98b4aab130585bec97'},
            @{from='assets/approved_ui/NOX_HELION_MENU_8_SECTIONS_COLLAGE_APPROVED_20261020.png';to='menu_sections.png';sha='7d181604f913cf9956c173c14da3dc7fd0238c389322896588cec4407b4024a4'}
          )
          $receipt=[ordered]@{schema='NOX_E06_D02_BYTE_EXACT_ASSETS_V1'; originalArchiveSha256='ff8e2848c7c7ab776b90cbd8ac28e41e3815e96373c3c5f635d7587284629e9a'; files=@()}
          $zip=[IO.Compression.ZipFile]::OpenRead($tmp)
          try {
            foreach($asset in $assets) {
              $entry=$zip.GetEntry($asset.from)
              if ($null -eq $entry) { throw "NOX_D02_APPROVED_ASSET_MISSING:$($asset.from)" }
              $dest=Join-Path $targetRoot $asset.to
              if (!(Test-Path -LiteralPath $dest -PathType Leaf)) {
                $input=$entry.Open()
                $output=[IO.FileStream]::new([IO.Path]::GetFullPath($dest),[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
                try { $input.CopyTo($output) } finally { $output.Dispose(); $input.Dispose() }
              }
              $observed=(Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($observed -cne $asset.sha) { throw "NOX_D02_ASSET_PREIMAGE_CONFLICT:$($asset.to)" }
              $receipt.files+=@([ordered]@{source=$asset.from;target=$asset.to;sha256=$observed;bytes=(Get-Item -LiteralPath $dest).Length})
            }
          } finally { $zip.Dispose(); Remove-Item -LiteralPath $tmp -Force }
          $receipt | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath 'work/e06/staged/d02-byte-exact-receipt.json' -Encoding utf8
          Write-Host 'NOX_D02_FOUR_ORIGINAL_IMAGES_BYTE_EXACT_PASS'
      - name: Admit all four exact approved P01 installer safety files, source unchanged
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $items=@(
            @{name='Preflight-InstallPath.ps1';old='8413580656bace887478c9f82e72433987ad8e4a552af6e67c3531b09d545239';ownerBlob='eb45add5a929eee99bc09ef87f2db3735556b78b'},
            @{name='Verify-Payload.ps1';old='e741c131ddc1af45391ed64b4cdce686895aa78bd67e6bd4795fa97f548d455b';ownerBlob='5023e556b2370b65513dd5f0093b290ceb4346ea'},
            @{name='Remove-InstalledPayload.ps1';old='6853f3d4a32eb5946c3c68d22b0d61e3a402b729ebda225cd3f6b8b154b1ec55';ownerBlob='81fbe7dfeb70801a0eaf5e4246a8789cb5032916'},
            @{name='NOX-HELION-Setup.nsi';old='2158b71759e72b3b93cafcf27196386c1885b39fb99f80b4bd1872273a0b2248';ownerBlob='75ce8a88bfbcf5d79dccab677bc2fbe6c82bb042'}
          )
          $rows=@()
          foreach($item in $items){
            $name=$item.name
            $dst=Join-Path 'work/e06/staged/R11/Installer' $name
            $src=Join-Path '.p01-approved-source/stage/proposals/P01/C09/Installer' $name
            if (!(Test-Path -LiteralPath $dst -PathType Leaf) -or !(Test-Path -LiteralPath $src -PathType Leaf)) {throw "P01_OWNER_FILE_MISSING:$name"}
            $pre=(Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash.ToLowerInvariant()
            if($pre -cne $item.old){throw "OWNER_CONFLICT_P01_R08_PREIMAGE:$name"}
            $blob=(git -C '.p01-approved-source' hash-object "stage/proposals/P01/C09/Installer/$name").Trim()
            if($LASTEXITCODE -ne 0 -or $blob -cne $item.ownerBlob){throw "P01_APPROVED_OWNER_SOURCE_DRIFT:$name"}
            Copy-Item -LiteralPath $src -Destination $dst -Force
            $post=(Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash.ToLowerInvariant()
            if($post -cne (Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash.ToLowerInvariant()){throw "P01_POST_SHA_MISMATCH:$name"}
            $rows+=@([ordered]@{path="R11/Installer/$name";owner=1;pre_sha256=$pre;approved_owner_blob_sha1=$blob;post_sha256=$post})
          }
          [ordered]@{schema='E06_R16_OWNER1_COMPLETE_NSIS_SOURCE_ADMISSION';runId=$env:GITHUB_RUN_ID;owner=1;integrator=6;approvedCommit='8e42bb15aecbee8412c342b0e9049b6cce044297';stagedOnly=$true;sourceOriginalUnchanged=$true;releaseAccepted=$false;files=$rows} | ConvertTo-Json -Depth 6 | Set-Content 'work/e06/staged/R16-P01-owner-verified-installer.json'
          Write-Host 'E06_R16_ALL_4_OWNER1_INSTALLER_FILES_STAGED_SHA_PASS'
      - name: R22 fail-closed x64 PowerShell adapter for three pinned P01 NSIS calls (isolated stage only)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest -v coordination/e06/test_r18_nsexec_x64_adapter.py
          if($LASTEXITCODE -ne 0){ throw 'R22_P01_ADAPTER_TESTS_HOLD' }
          $owner='work/e06/staged/R11/Installer/NOX-HELION-Setup.nsi'
          $candidate='work/e06/r22-x64/NOX-HELION-Setup.nsi'
          $receipt='work/e06/staged/R22_P01_BITNESS_SHA_RECEIPT.json'
          python coordination/e06/r18_nsexec_x64_adapter.py --owner-nsi $owner --candidate-nsi $candidate --receipt $receipt --patch 'work/e06/staged/R22_P01_BITNESS.patch' --run-id $env:GITHUB_RUN_ID
          if($LASTEXITCODE -ne 0){ throw 'R22_OWNER_PREIMAGE_BITNESS_HOLD' }
          $x=Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if($x.releaseAllowed -ne $false -or $x.nativeInstallAccepted -ne $false -or $x.changedNSExecCalls -ne 3){throw 'R22_BITNESS_RECEIPT_INVALID'}
          if((Get-FileHash $owner -Algorithm SHA256).Hash.ToLowerInvariant() -cne $x.ownerPreSha256){throw 'R22_BITNESS_PREIMAGE_CHANGED'}
          if((Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -cne $x.candidatePostSha256){throw 'R22_BITNESS_POSTIMAGE_CHANGED'}
          Copy-Item -LiteralPath $candidate -Destination $owner -Force
          if((Get-FileHash $owner -Algorithm SHA256).Hash.ToLowerInvariant() -cne $x.candidatePostSha256){throw 'R22_BITNESS_STAGE_COPY_CHANGED'}
          Write-Host 'E06_R22_PINNED_P01_BITNESS_SOURCE_STAGED_NOT_NATIVE_ACCEPTANCE'
      - name: Apply E06's original exact-SHA P05 HTML compatibility fix to staged bytes only
        shell: pwsh
        run: python coordination/e06/patch_legacy_p05_html.py
      - name: Reuse original E06 compiler fix with exact R08 source hash
        shell: pwsh
        run: python Packages/P02/diagnostics/r08_exact_reuse_e06_repairs.py
      - name: Apply bounded E02 compiler compatibility overlay only inside isolated stage
        shell: pwsh
        run: python Packages/P02/diagnostics/r08_apply_minimal_compile_fixes.py
      - name: Recover immutable original Python EXE and stage one WPF native diagnostic bridge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $id=12781339660
          $meta=gh api "repos/MSSTXNEWS/nox-helion-pp-private-build/actions/artifacts/$id" | ConvertFrom-Json
          if ($meta.id -ne $id -or $meta.expired -eq $true -or
              $meta.workflow_run.id -ne 40609239316 -or
              $meta.workflow_run.head_sha -cne 'ff28eef5c7cc0e01473fb8ba65656b08b1e348ef') {
            throw 'ORIGINAL_PYTHON_ARTIFACT_PROVENANCE_HOLD'
          }
          $target='work/e06/pinned-original-python'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          gh run download 40609239316 --repo MSSTXNEWS/nox-helion-pp-private-build --name nox-e06-original-diagnostic-40609239316 --dir $target
          if ($LASTEXITCODE -ne 0) { throw 'PINNED_ORIGINAL_EXE_DOWNLOAD_HOLD' }
          $py=Join-Path $target 'work/candidate/dist/NOX_HELION_PRIVATE_CANDIDATE.exe'
          if (!(Test-Path -LiteralPath $py -PathType Leaf)) { throw 'ORIGINAL_BINARY_PATH_MISSING' }
          if ((Get-FileHash -LiteralPath $py -Algorithm SHA256).Hash.ToLowerInvariant() -cne '4e488372cf3f6410d268a7ef72b3e4b359a7a3e6642c7a16ac2e6f7eb06fc5f3') {
            throw 'ORIGINAL_PYTHON_BINARY_SHA_HOLD'
          }
          python coordination/e06/stage_onehost.py 'work/e06/staged/R11' 'coordination/e06/OriginalPythonDiagnosticBridge.cs' $py
          if ($LASTEXITCODE -ne 0) { throw 'E06_OWNER_SCOPE_SHA_CONFLICT' }
          "NOX_ORIGINAL_PYTHON_PATH=$((Resolve-Path $py).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'E06_PINNED_WPF_PYTHON_NATIVE_BRIDGE_STAGED_PASS'
      - name: Compile R08 original WPF/WebView2 host using existing repaired stage
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $project='work/e06/staged/R11/NOX.P01.Shell.csproj'
          dotnet restore $project --runtime win-x64 --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'NOX_R08_DOTNET_RESTORE_HOLD' }
          dotnet build $project -c Release -r win-x64 --no-restore --nologo --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'NOX_R08_DOTNET_BUILD_HOLD' }
      - name: Publish diagnostic EXE and write SHA receipt (not accepted release)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $project='work/e06/staged/R11/NOX.P01.Shell.csproj'
          dotnet publish $project -c Release -r win-x64 --self-contained false --no-restore -p:PublishSingleFile=false -p:PublishTrimmed=false -o 'work/e06/staged/diagnostic-payload' --nologo --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'NOX_R08_DOTNET_PUBLISH_HOLD' }
          $exe='work/e06/staged/diagnostic-payload/NOX.P01.Shell.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'DIAGNOSTIC_EXE_MISSING' }
          [ordered]@{
            schema='NOX_V16_E02_PINNED_R08_DIAGNOSTIC_v1'
            buildRunId=$env:GITHUB_RUN_ID
            owner2Commit=$env:GITHUB_SHA
            e06SourceCommit='6f41831c69d41adec6899b07c074b0b19cd68b28'
            e06LegacyPatchesCommit='0a832004d4b57127f08d3b045dc864ddf149d8a4'
            zipFullOriginalSha256='67ba6deae9b315fbdfcd6f1cc076be68f6e33e1920a8bd829794d12f14573689'
            diagnosticExeSha256=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            diagnosticExeBytes=(Get-Item -LiteralPath $exe).Length
            sourceSubsetOnly=$true
            originalApprovedD02AssetsIncluded=$true
            stagedRepairsRequireOwnerApproval=$true
            originalSourceUntouched=$true
            fullProductIntegrated=$false
            E07Accepted=$false
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath 'work/e06/staged/diagnostic-receipt.json'
          Write-Host 'WPF_DIAGNOSTIC_EXE_BUILT_NOT_FINAL_RELEASE'
      - name: Build single-host self-contained Windows and existing P01 NSIS installer candidate
        id: e06installer
        continue-on-error: true
        shell: pwsh
        run: |
          & .\.e06-approved-builder\coordination\e06\build_onehost_installer.ps1 -SourceRoot 'work/e06/staged/R11' -PythonExe $env:NOX_ORIGINAL_PYTHON_PATH -OutputRoot 'work/e06/onehost-candidate' -RunId $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build distinct owner1 16.0.1 upgrade from same pinned combined source
        if: steps.e06installer.outcome == 'success'
        id: upgrade
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./.e06-approved-builder/coordination/e06/build_onehost_installer.ps1 -SourceRoot 'work/e06/staged/R11' -PythonExe $env:NOX_ORIGINAL_PYTHON_PATH -OutputRoot 'work/e06/onehost-upgrade' -RunId "$env:GITHUB_RUN_ID-upgrade" -AppVersion '16.0.1'
          if($LASTEXITCODE -ne 0) {throw 'E06_NUMERIC_UPGRADE_BUILD_HOLD'}
          if(!(Test-Path 'work/e06/onehost-upgrade/NOX-HELION-V16-DIAGNOSTIC-SETUP.exe' -PathType Leaf)){throw 'E06_UPGRADE_EXE_MISSING'}
      - name: Validate official signed Microsoft Evergreen WebView2 before NSIS
        shell: pwsh
        run: |
          $env:CI='true'
          & ./.e06-webview2/coordination/e06/Test-OfficialWebView2Prereq.ps1
          if($LASTEXITCODE -ne 0){ throw 'E06_VERIFIED_WEBVIEW2_REQUIRED' }
      - name: Native original P01 full install update rollback uninstall data retention
        if: steps.e06installer.outcome == 'success' && steps.upgrade.outcome == 'success'
        id: native
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:CI='true'
          $old='work/e06/onehost-candidate/NOX-HELION-V16-DIAGNOSTIC-SETUP.exe'
          $new='work/e06/onehost-upgrade/NOX-HELION-V16-DIAGNOSTIC-SETUP.exe'
          $hash1=(Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash2=(Get-FileHash $new -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash1 -eq $hash2){throw 'SAME_VERSION_UPGRADE_BUG'}
          $target='work/e06/native-qa-transaction.json'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.p01-approved-source/stage/proposals/P01/C09/Installer/Test-NSIS-Windows.ps1' -InitialSetup $old -UpgradeSetup $new -ExpectedInitialSetupSha256 $hash1 -ExpectedUpgradeSetupSha256 $hash2 -ReportPath $target -DisposableRunnerAcknowledged
          if($LASTEXITCODE -ne 0){throw 'NATIVE_COMBINED_INSTALL_TRANSACTION_HOLD'}
          $record=Get-Content $target -Raw | ConvertFrom-Json
          foreach($key in @('install','update','rollback','uninstall','userDataRetained')){
            if($record.$key -cne 'PASS'){throw ("P01_NATIVE_TRANSACTION_HOLD:"+$key)}
          }
          Write-Host 'NOX_E06_NATIVE_TRANSACTION_PASS_DIAGNOSTIC_NOT_PRODUCT_E07'
      - name: Preserve unified program, NSIS candidate, pre/post SHA and error evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-e06-onehost-installer-${{ github.run_id }}
          path: |
            work/e06/staged/E06_R10_SOURCE_RECEIPT.json
            work/e06/staged/d02-byte-exact-receipt.json
            work/e06/onehost-candidate/ONEHOST_DIAGNOSTIC_RECEIPT.json
            work/e06/onehost-candidate/NOX-HELION-V16-DIAGNOSTIC-SETUP.exe
            work/e06/onehost-candidate/payload/payload.sha256.json
            work/e06/onehost-upgrade/ONEHOST_DIAGNOSTIC_RECEIPT.json
            work/e06/onehost-upgrade/NOX-HELION-V16-DIAGNOSTIC-SETUP.exe
            work/e06/native-qa-transaction.json
          if-no-files-found: warn
          retention-days: 14
      - name: Refuse release credit on NSIS compiler failure
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.e06installer.outcome }}' -ne 'success') {
            throw 'E06_ONEHOST_INSTALLER_BUILD_HOLD'
          }
          Write-Host 'E06_ONEHOST_INSTALLER_DIAGNOSTIC_PASS_NOT_E07_ACCEPTED'
      - name: Preserve diagnostic evidence even if compile fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-e02-r08-pinned-diagnostic-evidence
          path: |
            work/e06/staged/R16-P01-owner-verified-installer.json
            work/e06/staged/R22_P01_BITNESS_SHA_RECEIPT.json
            work/e06/staged/R22_P01_BITNESS.patch
            work/e06/staged/R08-source-seal.txt
            work/e06/staged/P05-diagnostic-repair-receipt.json
            work/e06/staged/legacy-compiler-repair-receipts.json
            work/e06/staged/E02-compiler-compat-receipt.json
            work/e06/staged/diagnostic-receipt.json
            work/e06/staged/d02-byte-exact-receipt.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save Windows diagnostic binaries, including EXE (NOT final release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-e06-r08-diagnostic-binary-${{ github.run_id }}
          path: |
            work/e06/staged/diagnostic-payload/**
            work/e06/staged/diagnostic-receipt.json
          if-no-files-found: warn
          retention-days: 14

      - name: MANDATORY honest RunID TaskID seven-lane report on every executed attempt
        if: always()
        shell: pwsh
        run: |
          $args=@('--out',('work/e06/run-report-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT+'.json'),'--event','EXPRESS_WINDOWS_CI')
          $setup='work/e06/onehost-candidate/NOX-HELION-V16-DIAGNOSTIC-SETUP.exe'
          $receipt='work/e06/onehost-candidate/ONEHOST_DIAGNOSTIC_RECEIPT.json'
          if(Test-Path $setup){$args+=@('--installer',$setup)}
          if(Test-Path $receipt){$args+=@('--installer-receipt',$receipt)}
          python coordination/e06/express_per_run_report.py @args
          if($LASTEXITCODE -ne 0){throw 'E06_PER_RUN_REPORT_REQUIRED_HOLD'}
      - name: Publish mandatory report and native evidence even on build failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-e06-express-run-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/e06/run-report-*.json
            work/e06/native-qa-transaction.json
            work/e06/staged/R16-P01-owner-verified-installer.json
            work/e06/onehost-candidate/ONEHOST_DIAGNOSTIC_RECEIPT.json
          if-no-files-found: warn
          retention-days: 30
