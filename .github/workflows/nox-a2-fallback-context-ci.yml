name: NOX A2 current-main model and tool evidence gate
on:
  # Catch regressions reintroduced by overlapping branch merges on main.
  push:
    branches: [main]
    paths:
      - 'nox-control/owner_chat_stream.py'
      - 'nox-control/owner_chat_evidence.py'
      - 'nox-control/test_owner_chat_stream.py'
      - '.github/workflows/nox-a2-fallback-context-ci.yml'
  # If the repository uses GitHub's merge queue, check the merged candidate.
  merge_group:
    types: [checks_requested]
  pull_request:
    paths:
      - 'nox-control/owner_chat_stream.py'
      - 'nox-control/owner_chat_evidence.py'
      - 'nox-control/test_owner_chat_stream.py'
      - '.github/workflows/nox-a2-fallback-context-ci.yml'
permissions:
  contents: read
jobs:
  model-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: One focused native model and result-fidelity regression
        run: |
          python3 -m venv .a2-ci
          . .a2-ci/bin/activate
          python -m pip install --disable-pip-version-check httpx==0.28.1 fastapi==0.116.1
          PYTHONPATH=nox-control python -m unittest test_owner_chat_stream.StreamTests.test_model_identity_in_native_request_is_not_replaced_by_legacy_alias test_owner_chat_stream.StreamTests.test_pool_cannot_disable_tool_choice_or_reenable_thinking test_owner_chat_stream.StreamTests.test_pool_preserves_serving_budget_and_stream_controls test_owner_chat_stream.StreamTests.test_pooled_payload_preserves_explicit_model_before_http test_owner_chat_stream.StreamTests.test_tool_confirmation_flag_must_be_boolean_before_followup test_owner_chat_stream.StreamTests.test_tool_success_evidence_requires_bool_before_followup test_owner_chat_stream.StreamTests.test_direct_admin_missing_ok_never_reports_success test_owner_chat_stream.StreamTests.test_executor_reply_respects_owner_maintenance_and_read_transition test_owner_chat_stream.StreamTests.test_executor_unknown_on_stale_corrupt_duplicate_or_inconsistent_snapshot test_owner_chat_stream.StreamTests.test_executor_snapshot_rejects_ambiguous_json_and_inplace_rewrite test_owner_chat_stream.StreamTests.test_parser_cannot_rewrite_model_tool_name_or_arguments test_owner_chat_stream.StreamTests.test_pool_cannot_rewrite_verified_model_tools_during_dedup test_owner_chat_stream.StreamTests.test_pool_dedup_cannot_drop_a_distinct_model_tool_action test_owner_chat_stream.StreamTests.test_direct_media_fast_path_rejects_unverified_outcome test_owner_chat_stream.StreamTests.test_plain_chat_skips_unrelated_status_and_inventory_io test_owner_chat_stream.StreamTests.test_direct_tool_identities_fail_closed_before_native_dispatch test_owner_chat_stream.StreamTests.test_oversized_s03_history_holds_before_second_decode test_owner_chat_stream.StreamTests.test_falsey_model_error_envelopes_cannot_certify_s03 test_owner_chat_stream.StreamTests.test_tool_error_envelopes_never_certify_successful_s03 test_owner_chat_stream.StreamTests.test_invalid_tool_observation_never_audits_false_success test_owner_chat_stream.StreamTests.test_confirmation_pending_cannot_audit_success test_owner_chat_stream.MediaEvidenceTests.test_unverified_native_completed_media_never_claims_tool_success test_owner_chat_stream.StreamTests.test_tool_call_fragment_limits_are_utf8_bytes test_owner_chat_stream.StreamTests.test_coalesced_sse_transport_decodes_bounded_utf8_slices test_owner_chat_stream.StreamTests.test_sse_done_requires_clean_http_eof_and_no_late_events test_owner_chat_stream.StreamTests.test_native_sse_utf8_wire_limit_holds_before_oversized_token test_owner_chat_stream.StreamTests.test_unicode_sse_record_limit_is_wire_bytes_not_codepoints test_owner_chat_stream.StreamTests.test_model_heartbeat_cannot_keep_sse_post_open_forever test_owner_chat_stream.StreamTests.test_invalid_utf8_on_wire_cannot_certify_browser_or_s03 test_owner_chat_stream.StreamTests.test_upstream_http_and_transport_failures_keep_exact_hold_and_one_post -v
