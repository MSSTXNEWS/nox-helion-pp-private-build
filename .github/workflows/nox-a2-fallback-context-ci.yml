name: NOX A2 fallback lossless context gate
on:
  pull_request:
    paths:
      - 'nox-control/owner_chat_stream.py'
      - 'nox-control/test_owner_chat_stream.py'
      - '.github/workflows/nox-a2-fallback-context-ci.yml'
permissions:
  contents: read
jobs:
  fallback-context:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: One focused second-turn long-Unicode evidence regression
        run: |
          python3 -m venv .a2-ci
          . .a2-ci/bin/activate
          python -m pip install --disable-pip-version-check httpx==0.28.1 fastapi==0.116.1
          PYTHONPATH=nox-control python -m unittest test_owner_chat_stream.StreamTests.test_full_unicode_tool_evidence_survives_model_followup test_owner_chat_stream.StreamTests.test_falsy_tool_arguments_fail_closed_without_rewriting_model_evidence test_owner_chat_stream.StreamTests.test_deterministic_falsy_arguments_hold_before_native_dispatch test_owner_chat_stream.StreamTests.test_ambiguous_model_sse_json_holds_without_tool_or_s03_receipt test_owner_chat_stream.StreamTests.test_ambiguous_tool_argument_json_rejected_without_default_object test_owner_chat_stream.StreamTests.test_explicit_invalid_sse_structures_hold_before_native_dispatch test_owner_chat_stream.StreamTests.test_nonstring_tool_evidence_holds_without_second_model_request test_owner_chat_stream.StreamTests.test_tool_success_evidence_requires_bool_before_followup test_owner_chat_stream.StreamTests.test_model_identity_in_native_request_is_not_replaced_by_legacy_alias test_owner_chat_stream.StreamTests.test_pooled_payload_preserves_explicit_model_before_http test_owner_chat_stream.StreamTests.test_duplicate_effective_direct_tool_ids_hold_before_dispatch test_owner_chat_stream.StreamTests.test_pool_dedup_does_not_drop_model_tool_call_evidence test_owner_chat_stream.StreamTests.test_executor_status_rejects_ambiguous_or_undecodable_json test_owner_chat_stream.StreamTests.test_model_tool_parser_cannot_rewrite_name_or_typed_arguments -v
