name: NOX V63 five services supervisor configs and log root causes (read only)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - .github/workflows/nox-v63-five-services-deep-diagnostic.yml
      - nox_runpod/teacher_mesh/v63/service_deep_inspect.py
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v63-five-services-deep-readonly
  cancel-in-progress: false
jobs:
  inspect:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile bounded native diagnostic
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py nox_runpod/teacher_mesh/v63/service_deep_inspect.py
      - name: Read five existing Supervisor configs and summarized logs without modifications
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v63.service_deep_inspect
      - name: Revoke exact ephemeral SSH key and verify readback
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Acceptance boundary
        if: success()
        run: |
          echo "NOX_NATIVE_SERVICE_CONFIGS_AND_LOGS_READ=true"
          echo "NOX_SERVICES_MUTATED=false"
          echo "RAW_LOG_CONTENT_EXPORTED=false"
