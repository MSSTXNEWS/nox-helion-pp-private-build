name: PRE-PRE Windows candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pp-windows-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out private build inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
          check-latest: false

      - name: Prepare exact source, install offline dependencies, and build
        id: build
        continue-on-error: true
        shell: pwsh
        run: '& .\private_build.ps1'

      - name: Preserve candidate binaries, build receipt, and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PP-001-C1-R3-Windows-candidate-${{ github.run_id }}
          path: |
            work/candidate/dist/NOX_HELION_PRIVATE_CANDIDATE.exe
            work/candidate/dist/NOX_HELION_BACKGROUND_CANDIDATE.exe
            work/candidate/C_RELEASE_SPRINT_BUILD_RECEIPT.json
            work/candidate/CANDIDATE_README.txt
            work/candidate/BUILD_STATUS.txt
            work/candidate/launch_background_user.ps1
            work/candidate/register_windows_background.ps1
            work/candidate/unregister_windows_background.ps1
            work/candidate/DEPENDENCY_NOTICES.txt
            work/candidate/QA_DEPENDENCY_NOTICES.txt
            work/NOX_NATIVE_SMOKE_*/**
            ci-evidence/p01-sourcelock.json
            ci-evidence/p01-prerequisites.json
            ci-evidence/build-attempt.json
            ci-evidence/windows-build-transcript.txt
            ci-evidence/requirements-qa-win64-hashed.txt
            ci-evidence/qa-wheelhouse-*/*.whl
          if-no-files-found: warn
          retention-days: 14

      - name: Report the build attempt status
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.build.outcome }}' -ne 'success') {
            Write-Host 'Build attempt incomplete or failed; available files are retained as candidate evidence.'
            exit 1
          }
          Write-Host 'Build script returned success. This remains a pre-release candidate; product gates are separate.'
