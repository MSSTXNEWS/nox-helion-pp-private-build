name: NOX I-39 pre-upgrade source census
on:
  push:
    branches:
      - repair/nox-i39-preupgrade-census-20261119
    paths:
      - '.github/workflows/nox-i39-preupgrade-census-ci.yml'
      - 'nox-control/owner_native_operator.py'
      - 'nox-control/systemic_relay_20261118/*i39_preupgrade_census.py'
permissions:
  contents: read
jobs:
  read-only-source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify scoped read-only payload and owner transport
        run: python -B nox-control/systemic_relay_20261118/test_owner_i39_preupgrade_census.py
