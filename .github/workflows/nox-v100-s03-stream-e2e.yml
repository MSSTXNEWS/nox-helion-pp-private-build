name: NOX V100 native owner stream to S03 readback
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - "nox_runpod/teacher_mesh/v100/**"
      - ".github/workflows/nox-v100-s03-stream-e2e.yml"
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-60509551-v100-owner-s03-e2e
  cancel-in-progress: false
jobs:
  acceptance:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and remote API source validation
        run: |
          python -m py_compile nox_runpod/teacher_mesh/v100/native_owner_s03_e2e.py
          python - <<'PY'
          from nox_runpod.teacher_mesh.v100.native_owner_s03_e2e import REMOTE
          compile(REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0],'<remote>','exec')
          PY
      - name: One approved harmless native owner stream and existing S03 receipt
        run: python -m nox_runpod.teacher_mesh.v100.native_owner_s03_e2e
      - name: Always detach temporary SSH key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
