name: NOX ONEPASS source acceptance (single branch, no native writes)
on:
  push:
    branches: [control/nox-web-onepass-release-candidate-20261115, feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v130/owner_s03_fact_write.py'
      - 'nox_runpod/teacher_mesh/v130/tests/test_owner_s03_fact_write.py'
      - 'nox_runpod/teacher_mesh/v112/native_v29_full_bridge.py'
      - 'nox_runpod/teacher_mesh/v112/tests/test_native_bridge.py'
      - 'nox_runpod/teacher_mesh/v120/s03_owner_memory_views.py'
      - 'coordination/onepass/**'
      - 'nox-control/owner_s03_gateway.py'
      - 'nox-control/test_owner_s03_gateway.py'
      - 'nox-control/maya_ds4_v100_launch_profile_v1.py'
      - 'nox-control/test_maya_ds4_launch_preflight_v1.py'
      - '.github/workflows/nox-onepass-source-acceptance.yml'
  pull_request:
    paths:
      - 'nox_runpod/teacher_mesh/v130/owner_s03_fact_write.py'
      - 'nox_runpod/teacher_mesh/v130/tests/test_owner_s03_fact_write.py'
      - 'nox_runpod/teacher_mesh/v112/native_v29_full_bridge.py'
      - 'nox_runpod/teacher_mesh/v112/tests/test_native_bridge.py'
      - 'nox_runpod/teacher_mesh/v120/s03_owner_memory_views.py'
      - 'coordination/onepass/**'
      - 'nox-control/owner_s03_gateway.py'
      - 'nox-control/test_owner_s03_gateway.py'
      - 'nox-control/maya_ds4_v100_launch_profile_v1.py'
      - 'nox-control/test_maya_ds4_launch_preflight_v1.py'
      - '.github/workflows/nox-onepass-source-acceptance.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Isolated test-only dependencies
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Compile exact original S03 owner-fact patch and official Vast diagnosis
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v130/owner_s03_fact_write.py coordination/onepass/vast_official_readonly.py
          python -m unittest -v coordination.onepass.test_vast_official_readonly
          python -m unittest -v coordination.onepass.test_frozen_web_contract
          python -m unittest -v coordination.onepass.test_choice_overlay
          python -m py_compile coordination/onepass/v133_full_convergence.py
          python -m unittest -v coordination.onepass.test_v133_full_convergence
          python - <<'PY'
          import json
          from coordination.onepass import v133_full_convergence as m
          d=json.load(open('coordination/onepass/NOX_V133_CONVERGED_ACCEPTANCE.json',encoding='utf8'))
          p=json.load(open('coordination/onepass/NOX_V133_DRIVE_PARTS_SHA256.json',encoding='utf8'))
          assert d['original_site_paths_preserved']==1089
          assert d['original_site_paths_deleted']==0
          assert d['original_site_paths_changed']==9
          assert d['source_frozen_zip_sha256']==m.FROZEN_SHA
          assert d['owner_v122_ui_sha256']==m.OWNER_SHA
          assert d['converged_zip_sha256']==p['archive_sha256']
          assert d['drive']['independently_downloaded_from_drive'] is True
          assert d['chromium_isolated_ui']['passed']==10
          assert d['local_html_static_dependencies']['missing_local_references']==0
          assert d['release']['production_promoted'] is False
          assert d['release']['full_base_weight_optimizer_accepted'] is False
          print('NOX_V133_SHA_LOCKED_SOURCE_CONVERGENCE_PASS=true')
          PY
          python -m unittest -v nox_runpod.teacher_mesh.v130.tests.test_owner_s03_fact_write
          python -m unittest -v nox_runpod.teacher_mesh.v130.tests.test_install_native_owner_fact
      - name: Original WEB29 3C persisted-hour and stale-metric regression (SOURCE ONLY)
        run: |
          set -euo pipefail
          python -m py_compile coordination/onepass/web29_main/integration/progress/nox_progress.py
          python coordination/onepass/web29_main/test_nox_progress_hourly_v3c.py
          node --check coordination/onepass/web29_main/site/pc/progress/nox-progress.js
          node coordination/onepass/web29_main/test_nox_progress_frontend_v3c.cjs

      - name: Original WEB29 3D idle Motion / contrast reduced-motion source acceptance
        run: |
          set -euo pipefail
          node --check coordination/onepass/web29_3d_20261116/site/nox-motion-idle-loader.js
          node --test coordination/onepass/web29_3d_20261116/tests/test_motion_idle_loader.mjs
          node --test coordination/onepass/web29_3d_20261116/tests/test_responsive_3d_source.mjs

      - name: V14-3-05 original S03 bounded recency regression (SOURCE ONLY)
        run: |
          set -euo pipefail
          python -m py_compile nox-control/owner_s03_gateway.py nox-control/test_owner_s03_gateway.py
          python nox-control/test_owner_s03_gateway.py -v

      - name: V14-2-09 Maya missing-pack nonlaunch regression (SOURCE ONLY)
        run: |
          set -euo pipefail
          python -m py_compile nox-control/maya_launch_preflight_v1.py nox-control/maya_ds4_v100_launch_profile_v1.py nox-control/test_maya_ds4_launch_preflight_v1.py
          python nox-control/test_maya_ds4_launch_preflight_v1.py MayaV14PackReadinessTests -v
          echo 'NOX_MAYA_PACK_REQUIRED_NOT_INSTALLED=true'
      - name: V112 chat cross-dialog owner-fact retrieval (SOURCE ONLY)
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v112/native_v29_full_bridge.py nox_runpod/teacher_mesh/v112/tests/test_native_bridge.py nox_runpod/teacher_mesh/v120/s03_owner_memory_views.py
          python -m unittest -v nox_runpod.teacher_mesh.v112.tests.test_native_bridge
      - name: No server or weight action in this workflow
        run: |
          echo 'NOX_ONEPASS_SOURCE_ONLY=true'
          echo 'NOX_RELEASE_92_API_E2E_ACCEPTED=false'
          echo 'NOX_NATIVE_MODEL_S03_UNCHANGED=true'
