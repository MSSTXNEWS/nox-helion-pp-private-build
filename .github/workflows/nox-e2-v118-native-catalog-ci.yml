name: NOX V118 frozen WEB V29 native catalog link gate
on:
  push:
    branches: [nox/e2-v118-staged-native-catalog-links-20261115]
    paths:
      - 'nox_runpod/teacher_mesh/v112/native_v29_full_bridge.py'
      - 'nox_runpod/teacher_mesh/v112/tests/test_v118_native_catalog_route.py'
      - '.github/workflows/nox-e2-v118-native-catalog-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies for isolated HTTP source fixtures only
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Pure SHA-pinned V29 catalog mapping and protected mount regression
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v112/native_v29_full_bridge.py
          python -m unittest -v \
            nox_runpod.teacher_mesh.v112.tests.test_v118_native_catalog_route
          python -m unittest discover -s nox_runpod/teacher_mesh/v112/tests -p 'test_native_bridge.py' -v
      - name: Do not misrepresent source tests as server/browser acceptance
        run: |
          echo 'NOX_V118_FROZEN_SOURCE_UNCHANGED=true'
          echo 'NOX_V118_LIVE_DEPLOYED=false'
          echo 'NOX_V118_BROWSER_E2E_NOT_RUN=true'
