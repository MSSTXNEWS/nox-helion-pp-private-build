name: NOX A6 responsive browser source acceptance
on:
  pull_request:
    branches:
      - repair/nox-continuous-execution-20261118
      - main
    paths:
      - 'nox-control/owner_chat_browser_qa.py'
      - 'nox-control/test_owner_browser_responsive_coverage.py'
      - 'nox-control/owner_browser_stream_only_entry.py'
      - 'nox-control/test_owner_chat_stream_only_qa.py'
      - '.github/workflows/nox-a6-browser-responsive-source.yml'
permissions:
  contents: read
jobs:
  responsive-probe-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One focused source-only responsive acceptance probe
        env:
          PYTHONPATH: nox-control
        run: |
          set -euo pipefail
          python -B -m unittest -v test_owner_browser_responsive_coverage
          python -B -m unittest -v test_owner_chat_stream_only_qa.EntryTests
          echo 'NOX_A6_RESPONSIVE_SOURCE_TESTED=true'
          echo 'NOX_A6_BROWSER_LIVE_ACCEPTED=false'
