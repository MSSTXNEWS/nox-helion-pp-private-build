name: NOX V130 existing S03 owner fact write source QA
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v130/**'
      - '.github/workflows/nox-v130-owner-s03-facts-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test-only runtime
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Native S03 source-only end-to-end fixture tests
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v130/owner_s03_fact_write.py
          python -m unittest discover -s nox_runpod/teacher_mesh/v130/tests -p 'test_*.py' -v
          echo 'NOX_V130_FIXTURE_QA_ONLY=true'
          echo 'NOX_V130_REAL_S03_NOT_MUTATED_BY_CI=true'
