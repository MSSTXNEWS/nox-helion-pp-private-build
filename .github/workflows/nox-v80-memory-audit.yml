name: NOX V80 S03 memory read only inventory
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: ['nox_runpod/teacher_mesh/v80/**', '.github/workflows/nox-v80-memory-audit.yml']
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-60509551-s03-readonly
  cancel-in-progress: false
jobs:
  memory:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python -m py_compile nox_runpod/teacher_mesh/v80/s03_memory_inventory.py
      - name: Inventory canonical S03 SQLite schemas, integrity, row counts only
        run: python -m nox_runpod.teacher_mesh.v80.s03_memory_inventory
      - name: Revoke temporary SSH key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
