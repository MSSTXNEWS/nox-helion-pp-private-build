name: NOX V71 one PRIME chat-first RAM and 10GB policies source acceptance
on:
  push:
    branches: [nox/e2-v71-oneprime-chatfirst-20261114, feature/nox-v38-synaptic-brain-20261114]
    paths:
      - '.github/workflows/nox-e2-v71-prime-source-ci.yml'
      - 'nox_runpod/teacher_mesh/v71/**'
      - 'nox_runpod/teacher_mesh/v41/training/priority_autonomy.py'
      - 'nox_runpod/teacher_mesh/v47/night_v47/**'
      - 'nox_runpod/teacher_mesh/v43/nox/resource_brain.py'
      - 'nox_runpod/teacher_mesh/v43/models.v43.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile source, no model and no GPU
        run: |
          set -euo pipefail
          python3 -m compileall -q nox_runpod/teacher_mesh/v71
          python3 -m py_compile nox_runpod/teacher_mesh/v41/training/priority_autonomy.py nox_runpod/teacher_mesh/v47/night_v47/policy.py nox_runpod/teacher_mesh/v47/night_v47/direct_weights_smoke.py nox_runpod/teacher_mesh/v43/nox/resource_brain.py
      - name: Run existing V38 V41 V43 V47 and new V71 CPU regression
        env:
          PYTHONPATH: ".:nox_runpod/teacher_mesh/v41:nox_runpod/teacher_mesh/v47"
        run: |
          set -euo pipefail
          python3 -m unittest -v             nox_runpod.teacher_mesh.v71.test_one_prime             nox_runpod.teacher_mesh.v38.tests.test_v38_memory_speed             nox_runpod.teacher_mesh.v38.tests.test_v38_control             nox_runpod.teacher_mesh.v41.tests.test_priority_autonomy             nox_runpod.teacher_mesh.v43.tests.test_v43             nox_runpod.teacher_mesh.v47.tests.test_night_v47
      - name: Explicit source-only boundary
        if: success()
        run: |
          echo "NOX_MAIN_CHAT_NOT_RESTARTED=true"
          echo "NOX_S03_CANONICAL_NOT_MOVED=true"
          echo "NOX_10GB_WRITE_RESERVE_POLICY_TESTED=true"
          echo "NOX_NEW_ONEHOST_OR_MODEL=NONE"
          echo "NOX_LIVE_RAM_BINDING_NOT_CLAIMED=true"
