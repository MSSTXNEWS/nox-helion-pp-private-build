name: NOX native reflex bounded installation CI
on:
  push:
    branches: [repair/nox-native-reflex-autorefill-20261119]
    paths:
      - nox-control/systemic_relay_20261118/owner_native_reflex_successor_entry.py
      - nox-control/owner_native_operator.py
      - .github/workflows/nox-native-reflex-install-source-ci.yml
  pull_request:
    paths:
      - nox-control/systemic_relay_20261118/owner_native_reflex_successor_entry.py
      - nox-control/owner_native_operator.py
permissions: {contents: read}
jobs:
  install-source-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Parse source and verify pinned bundle locally
        run: |
          set -euo pipefail
          python -B -m py_compile nox-control/systemic_relay_20261118/owner_native_reflex_successor_entry.py nox-control/owner_native_operator.py
          python -B - <<'PY'
          import base64,hashlib,importlib.util
          from pathlib import Path
          root=Path('nox-control')
          source=root/'systemic_relay_20261118'/'owner_native_reflex_successor_entry.py'
          spec=importlib.util.spec_from_file_location('guarded_native_reflex',source)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          sources={
            'owner_systemic_refill.py':root/'systemic_relay_20261118/runtime/owner_systemic_refill.py',
            'owner_subagent_dispatcher.py':root/'systemic_relay_20261118/runtime/owner_subagent_dispatcher.py',
            'continuous_transaction_helpers.py':root/'continuous_executor_20261118/assets/continuous_transaction_helpers.py',
          }
          module.BUNDLE={name:base64.b64encode(path.read_bytes()).decode('ascii') for name,path in sources.items()}
          helper, scripts=module.decode()
          assert set(scripts)=={module.REFILL,module.DIRECTOR}
          assert helper.digest(scripts[module.REFILL]) == hashlib.sha256(sources['owner_systemic_refill.py'].read_bytes()).hexdigest()
          assert helper.digest(scripts[module.DIRECTOR]) == hashlib.sha256(sources['owner_subagent_dispatcher.py'].read_bytes()).hexdigest()
          assert helper.digest(sources['continuous_transaction_helpers.py'].read_bytes()) == module.HELPER_SHA
          assert module.OLD[module.CONFIG] == '30effffe3c8a20c0df4dee936beb2f8183347fb2a5fd51d4543dfbde50efb919'
          assert module.MANIFEST == 'd58ed9b020a78c3c8fcbfd476b3b0eecfd235e50f3a6ded29c8cec550e1a4212'
          from importlib.util import spec_from_file_location,module_from_spec
          op=spec_from_file_location('owner_operator',root/'owner_native_operator.py')
          obj=module_from_spec(op);op.loader.exec_module(obj)
          assert obj.FILES['repair']==str(source)
          paths=obj.repair_bundle_paths('repair',obj.FILES['repair'],())
          assert {Path(p).name for p in paths} == set(sources)
          print('NOX_REFLEX_OWNER_BUNDLE_SOURCE_VERIFIED=true')
          print('NOX_REFLEX_NATIVE_INSTALL_NOT_EXECUTED=true')
          PY
