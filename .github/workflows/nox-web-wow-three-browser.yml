name: NOX WEB WOW live Chromium
on:
  push:
    branches: [integration/nox-v16-unified-candidate-20261028-r01]
    paths: [.github/workflows/nox-web-wow-three-browser.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium dependencies
        run: |
          npm install --prefix /tmp/nox-wow-browser --no-save playwright@1.58.2
          test -x /usr/bin/google-chrome || command -v google-chrome
          ln -s /tmp/nox-wow-browser/node_modules node_modules
      - name: Seven viewport and bounded 320px orbit acceptance
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nox-web.log 2>&1 &
          sleep 2
          node --check ui/menu-pages/formwork-halo-hud.js
          node --check ui/menu-pages/formwork-zodiac-cores.js
          node --check ui/menu-pages/native-gauge-adapter.js
          node --check ui/menu-pages/vendor/svg-gauge.min.js
          test -f ui/menu-pages/formwork-zodiac.LICENSE.txt
          node --check ui/menu-pages/vendor/loquix-typing.mjs
          node --check ui/menu-pages/menu.js
          test -f ui/menu-pages/formwork-aether-bento.css
          test -f ui/menu-pages/formwork-heliodon.LICENSE.txt
          test -f ui/menu-pages/formwork-aether.LICENSE.txt
          test -f ui/menu-pages/tabler-card-integration.css
          test -f ui/menu-pages/tabler-card.LICENSE.txt
          NOX_CHROME_PATH=$(command -v google-chrome) node ui/menu-pages/express-wow-three.browser.mjs
      - name: Collect screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOX-WOW-THREE-LIVE-CHROMIUM
          path: wow-three-*.png
          if-no-files-found: ignore
