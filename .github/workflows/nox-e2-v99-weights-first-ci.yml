name: NOX V99 weights-first single OneHost 85% training task graph
on:
  push:
    branches: [nox/e2-v95-ram-weight-pipeline-20261114]
    paths:
      - '.github/workflows/nox-e2-v99-weights-first-ci.yml'
      - 'nox_runpod/teacher_mesh/v47/control/dispatcher.py'
      - 'nox_runpod/teacher_mesh/v47/control/test_v94_priority.py'
      - 'nox_runpod/teacher_mesh/v47/control/TASKS_60_V46.json'
      - 'coordination/NOX_R60_MASTER.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ".:nox_runpod/teacher_mesh/v41:nox_runpod/teacher_mesh/v47"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify full 60-task one-source hash and no invented job IDs
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD:nox_runpod/teacher_mesh/v47/control/TASKS_60_V46.json)"
          expected="$(python3 -c 'import json;print(json.load(open("coordination/NOX_R60_MASTER.json"))["source_matrix_blob_sha"])')"
          test "$actual" = "$expected" || { echo "::error::HOLD_CANONICAL_MATRIX_MISMATCH";exit 2; }
          python3 -m py_compile nox_runpod/teacher_mesh/v47/control/dispatcher.py
      - name: 60 source tasks, weights-first 85pct, VOLTA GPU1 and S03 regression
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            nox_runpod.teacher_mesh.v47.control.test_v94_priority \
            nox_runpod.teacher_mesh.v87.test_gpu1_oom_gate \
            nox_runpod.teacher_mesh.v41.tests.test_priority_autonomy \
            nox_runpod.teacher_mesh.v47.tests.test_night_v47 \
            nox_runpod.teacher_mesh.v71.test_one_prime
      - name: Acceptance bounds
        if: success()
        run: |
          echo 'NOX_SAME_ONEHOST_TASKS=60'
          echo 'NOX_WEIGHT_TRAINING_POLICY_TARGET_COMPUTE=85%'
          echo 'NOX_P0_CHAT_AND_STOP_PRESERVED=true'
          echo 'NOX_NO_CONFIRMED_NATIVE_ENQUEUES_OR_OPTIMIZER_STEPS=true'
