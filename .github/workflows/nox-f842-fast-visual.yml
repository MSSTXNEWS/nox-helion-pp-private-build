name: NOX F842 fast installed visual witness - NOT RELEASE
on:
  push:
    branches: [integration/nox-v16-unified-candidate-20261028-r01]
    paths:
      - .github/workflows/nox-f842-fast-visual.yml
      - coordination/e07/probe_f842_visual_fast.py
      - coordination/e07/probe_final_same_setup.py
      - coordination/e07/probe_91a6_real_visual_u17.py
      - tests/e07/test_91a6_real_visual_u17.py
      - tests/e07/test_final_primary_dispatch_u18.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nox-f842-fast-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  same-setup-visual:
    if: github.repository == 'MSSTXNEWS/nox-helion-pp-private-build'
    runs-on: windows-2022
    timeout-minutes: 42
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12 Windows
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
          check-latest: false
      - name: One fast fail-closed source syntax gate
        shell: pwsh
        run: |
          python -B -m py_compile coordination/e07/probe_f842_visual_fast.py coordination/e07/independent_setup_e07.py coordination/e07/probe_final_same_setup.py
          if ($LASTEXITCODE -ne 0) { throw 'F842_FAST_VISUAL_PY_SOURCE_HOLD' }
          python -B -m unittest discover -s tests/e07 -p test_91a6_real_visual_u17.py -v
          if ($LASTEXITCODE -ne 0) { throw 'F842_GRAPHICAL_MODE_SOURCE_HOLD' }
          python -B -m unittest discover -s tests/e07 -p test_final_primary_dispatch_u18.py -v
          if ($LASTEXITCODE -ne 0) { throw 'F842_VISIBLE_BUTTON_SOURCE_HOLD' }
      - name: Download exact existing immutable f842 Setup candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 41895699906
          github-token: ${{ github.token }}
          name: nox-v16-e06-onehost-diagnostic-41895699906
          path: input/f842
      - name: Real original WPF screenshot, resize, five quality controls and no-loss
        id: physical
        shell: pwsh
        timeout-minutes: 28
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          python -B coordination/e07/probe_f842_visual_fast.py --artifact-dir input/f842 --out work/f842-visual/VISUAL_WITNESS.json
          if ($LASTEXITCODE -ne 0) { throw 'F842_PHYSICAL_VISUAL_WITNESS_HOLD' }
          Write-Host 'F842_PHYSICAL_OBSERVED_NOT_FULL_E07_OR_DESIGN_APPROVAL'
      - name: Retain physical evidence even on HOLD
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NOX-F842-FAST-VISUAL-${{ github.run_id }}
          path: |
            work/f842-visual/VISUAL_WITNESS.json
            ${{ runner.temp }}/nox-f842-window-gdi.png
            ${{ runner.temp }}/nox-f842-window-print.png
          if-no-files-found: warn
          retention-days: 14
      - name: Fail closed until physical evidence is complete
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.physical.outcome }}' -ne 'success') { throw 'F842_FAST_VISUAL_NOT_ACCEPTED_NOT_RELEASE' }
