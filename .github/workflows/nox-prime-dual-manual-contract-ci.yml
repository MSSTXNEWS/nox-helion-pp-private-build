name: NOX PRIME dual manual and RAM-only warm-weight source acceptance
on:
  push:
    branches: [nox/dual-manual-ram-first-policy-20261115]
    paths:
      - 'nox_runpod/teacher_mesh/v71/ram_policy.py'
      - 'nox_runpod/teacher_mesh/v71/one_prime.py'
      - 'nox_runpod/teacher_mesh/v71/test_one_prime.py'
      - 'coordination/NOX_PRIME_TWO_MANUAL_PARALLEL_20261115.md'
      - 'coordination/NOX_PRIME_TWO_MANUAL_TASKBOARD_20261115.json'
      - '.github/workflows/nox-prime-dual-manual-contract-ci.yml'
permissions:
  contents: read
jobs:
  current-source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One integrated source contract test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v71/ram_policy.py nox_runpod/teacher_mesh/v71/one_prime.py
          python3 -m unittest -v nox_runpod.teacher_mesh.v71.test_one_prime
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('coordination/NOX_PRIME_TWO_MANUAL_TASKBOARD_20261115.json')
          d=json.loads(p.read_text())
          assert d['schema']=='NOX_PRIME_DUAL_MANUAL_BOARD_V1'
          assert sorted(a['id'] for a in d['lanes'])==['MANUAL_1','MANUAL_2']
          assert d['shared_gates']['one_writer_per_shared_jsonl'] is True
          assert d['shared_gates']['backup_restore_before_deletion'] is True
          assert d['warm_policy']['remote_to_ram_loader']=='NOT_BOUND_TO_NATIVE_ONEHOST_YET'
          print('NOX_DUAL_MANUAL_CONTRACT_SOURCE_PASS=true')
          print('NOX_NATIVE_RAM_WARM_OR_GPU_STOP_VERIFIED=false')
          print('NOX_NEW_BACKEND_OR_MODEL_DEPLOYED=false')
          PY
