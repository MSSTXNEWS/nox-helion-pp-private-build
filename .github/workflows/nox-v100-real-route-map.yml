name: NOX V100 actual native backend coverage for all V29.3 functions
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v100-real-route-map.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions: {contents: read}
concurrency:
  group: nox-v100-real-route-readonly
  cancel-in-progress: false
jobs:
  map:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile existing and native route map
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v100/native_backend_route_map.py
          python3 - <<'PY'
          from nox_runpod.teacher_mesh.v100.native_backend_route_map import REMOTE
          compile(REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0],'<native-v100>','exec')
          print('NOX_V100_SOURCE_SYNTAX=PASS')
          PY
      - name: Read installed backend decorators and FastAPI mounts without mutation
        run: python3 -m nox_runpod.teacher_mesh.v100.native_backend_route_map
      - name: Always detach temporary SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
