name: NOX V69 RAM staged owner-encrypted cold ZIP offsite (no deletes)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - .github/workflows/nox-v69-encrypted-single-archive-offload.yml
      - nox_runpod/teacher_mesh/v69/encrypted_single_zip_offload.py
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Explicit owner approval for original NOX OneHost only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v69-owner-encrypted-one-zip
  cancel-in-progress: false
jobs:
  offload:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source safety gates
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v69/encrypted_single_zip_offload.py
          python -m unittest discover -s nox_runpod/teacher_mesh/v69/tests -p test_encrypted_offload.py -v
      - name: Install age for owner-encrypted offsite stream
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          age --version
      - name: RAM buffer cold ZIP on Vast, stream owner-encrypted ciphertext, verify restore SHA
        shell: bash
        env:
          NOX2: ${{ secrets.NOX2 }}
        run: |
          set -euo pipefail
          python -m nox_runpod.teacher_mesh.v69.encrypted_single_zip_offload
      - name: Confirm checksum receipt and no remote deletion
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          a=Path('NOX_V69_COLD_INCOMING_85218466_20261114.zip.age')
          r=json.loads(Path('NOX_V69_COLD_INCOMING_85218466_RECEIPT.json').read_text())
          assert r['source_sha256']=='171c1b7894391ead3d376ae0e375fb34991854eeb3cce2aa04f2c28a301000c5'
          assert r['source_bytes']==85218466
          assert r['temporary_test_identity_decryption_verified'] is True
          assert r['restored_plain_sha256_matches_source'] is True
          assert r['active_prime_model_or_s03_changed'] is False
          assert r['remote_source_deleted'] is False
          sha=hashlib.sha256(a.read_bytes()).hexdigest()
          assert sha==r['ciphertext_sha256']
          print('NOX_V69_ENCRYPTED_STAGED_SHA_VERIFIED=true')
          print('NOX_V69_OWNER_PC_RESTORE_NOT_VERIFIED=true')
          print('NOX_V69_SOURCE_NOT_DELETED=true')
          PY
      - name: Store only ciphertext and receipt for connector-to-Drive transfer
        uses: actions/upload-artifact@v4
        with:
          name: NOX_V69_OWNER_ENCRYPTED_COLD_INCOMING_20261114
          path: |
            NOX_V69_COLD_INCOMING_85218466_20261114.zip.age
            NOX_V69_COLD_INCOMING_85218466_RECEIPT.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Mandatory temporary SSH key revoke
        if: always()
        env:
          NOX2: ${{ secrets.NOX2 }}
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Keep one-core user-facing stack unchanged
        if: success()
        run: |
          echo 'NOX_PRIME_ACTIVE_MODEL_UNTOUCHED=true'
          echo 'NOX_RESONANCE_AND_S03_UNTOUCHED=true'
          echo 'NOX_BACKGROUND_TEACHERS_NOT_RESTARTED=true'
          echo 'NOX_V69_VAST_SOURCE_FILES_DELETED=false'
