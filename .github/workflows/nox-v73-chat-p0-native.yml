name: NOX V73 ONEPASS native chat-first CPU scheduling (no second backend)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - .github/workflows/nox-v73-chat-p0-native.yml
      - nox_runpod/teacher_mesh/v73/tests/test_prime_priority.py
      - nox_runpod/teacher_mesh/v73/prime_chat_priority.py
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-60509551-native-p0-cpu-priority
  cancel-in-progress: false
jobs:
  p0:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: All six source guards and no second model/queue
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v73/prime_chat_priority.py
          python -m unittest discover -s nox_runpod/teacher_mesh/v73/tests -p test_prime_priority.py -v
          PYTHONPATH=".:nox_runpod/teacher_mesh/v41" python -m unittest discover -s nox_runpod/teacher_mesh/v41/tests -p test_chat_activity_lease.py -v
      - name: One-shot safe live background nice priority, independent P02 HTTP readback
        run: |
          set -euo pipefail
          python -m nox_runpod.teacher_mesh.v73.prime_chat_priority
      - name: Always clean ephemeral SSH key, including native failure
        if: always()
        run: |
          python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Explicit limitations
        if: success()
        run: |
          echo "NOX_ONE_MAIN_MODEL_UNCHANGED=true"
          echo "NOX_RESONANCE_AND_S03_UNCHANGED=true"
          echo "NOX_CHAT_P0_CPU_SCHEDULING_VERIFIED=true"
          echo "MODEL_WEIGHTS_CHANGED=false"
          echo "WEIGHT_OPTIMIZER_STEPS_EXECUTED=0"
          echo "NOX_BACKEND_OR_TRAINER_RESTARTED=false"
