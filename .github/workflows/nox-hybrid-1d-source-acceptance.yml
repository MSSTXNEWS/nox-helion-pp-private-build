name: NOX AUTO 1D source-only hybrid holdout gate
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'coordination/hybrid_20261115/1D_eval.py'
      - 'coordination/hybrid_20261115/1D.md'
      - '.github/workflows/nox-hybrid-1d-source-acceptance.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  offline-1d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Exact committed 1D regression and HOLD behavior
        shell: bash
        run: |
          set -euo pipefail
          script="coordination/hybrid_20261115/1D_eval.py"
          python -m py_compile "$script"
          python "$script" --selftest | tee /tmp/nox-1d-selftest.txt
          grep -q 'SELFTEST 18/18 PASS' /tmp/nox-1d-selftest.txt
          if python -O "$script" --selftest; then
            echo "ERROR: optimized selftest false PASS"; exit 1
          fi
          if PYTHONOPTIMIZE=1 python "$script" --selftest; then
            echo "ERROR: env-optimized selftest false PASS"; exit 1
          fi
          temp="$(mktemp -d)"
          if python "$script" --out "$temp/result.json"; then
            echo "ERROR: missing owner evidence accepted"; exit 1
          fi
          python - "$temp/result.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1], encoding="utf-8"))
          assert r["source_consistency"] == "HOLD"
          assert r["native_verified"] is False
          assert r["live_promoted"] is False
          print("NOX_1D_NATIVE_HOLD_ON_MISSING_EVIDENCE=true")
          PY
