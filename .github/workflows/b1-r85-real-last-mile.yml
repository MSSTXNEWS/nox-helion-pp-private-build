name: NOX B1 R85 real DOM last mile
on:
  pull_request:
    branches: [nox/b1-r84-preack-last-mile-20261125]
    paths:
      - 'nox-control/b1-r85/**'
      - '.github/workflows/b1-r85-real-last-mile.yml'
permissions:
  contents: read
jobs:
  real-last-mile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact donor and saved Node WebCrypto regression
        run: |
          set -euo pipefail
          test "$(git hash-object nox-control/b1-r82/b1_browser_bundle.js)" = af09a602a69390ecbbfc21becfd394b15c6dc836
          test "$(git hash-object nox-control/b1-r84/b1_browser_bundle.js)" = 7d713b9144698d0923877195962ae0795397c82a
          test "$(git hash-object nox-control/b1-r84/test_last_mile.cjs)" = 826c96f1f23c2585f1a027c1dc93b3c7d627cd19
          node --unhandled-rejections=strict nox-control/b1-r84/test_last_mile.cjs
      - name: Real Chromium differential
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
          python nox-control/b1-r85/test_real_last_mile.py
