name: NOX V89 GPU1 teacher and trainer owner map read-only
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v89-gpu1-role.yml, nox_runpod/teacher_mesh/v89/gpu1_role_map.py]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions: {contents: read}
concurrency:
  group: nox-v89-gpu1-role-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source syntax
        run: python3 -m py_compile nox_runpod/teacher_mesh/v89/gpu1_role_map.py
      - name: Find process owners without GPU changes
        run: python3 -m nox_runpod.teacher_mesh.v89.gpu1_role_map
      - name: Temporary SSH key removal
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
