name: NOX V69 four cold archive full SHA read-only
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v69-exact-archives-sha.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nox-v69-cold-file-sha
  cancel-in-progress: false
jobs:
  sha:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax
        run: python3 -m py_compile nox_runpod/teacher_mesh/v69/exact_archives.py
      - name: Four cold backup and incoming archives exact source SHA
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v69.exact_archives
      - name: Remove and verify temporary SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
