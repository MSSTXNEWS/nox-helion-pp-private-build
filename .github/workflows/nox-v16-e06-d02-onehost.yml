name: NOX V16 E06 exact D02 visual stage into ONEHOST diagnostic installer
on:
  workflow_dispatch:
    inputs:
      native_smoke_model:
        description: 'Explicit approved model already installed on the native runner; never downloaded by smoke'
        required: false
        type: string
  pull_request:
    paths:
      - 'coordination/e06/build_onehost_installer.ps1'
      - 'src/nox_selfbuilder/acquisition_library.py'
      - 'src/nox_selfbuilder/firstboot_coordinator.py'
      - 'tests/test_acquisition_library.py'
      - 'tests/test_firstboot_coordinator.py'
      - 'coordination/e06/stage_native_p02.py'
      - 'coordination/e06/native_onehost_smoke.py'
      - 'coordination/e06/t06_samevm_installed_smoke.py'
      - 'tests/e06/test_native_busy_retry_r12.py'
      - 'private_build.ps1'
      - '.github/workflows/nox-v16-e06-d02-onehost.yml'
permissions:
  contents: read
concurrency:
  group: nox-e06-onehost-${{ github.event.pull_request.number || github.ref }}
  # Keep the running exact-SHA Windows job alive; queue only the newest PR head.
  cancel-in-progress: false
jobs:
  activator-portable-source:
    # Cross-platform code check, deliberately NOT Windows EXE/E07 evidence.
    # A Linux runner also diagnoses whether the CI failure is runner-wide.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Run existing ACTIVATOR and selfbuilder regressions
        env:
          PYTHONPATH: 'src:.'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/selfbuilder -p 'test_activator_worm.py' -v
          python -m unittest discover -s tests/selfbuilder -p 'test_selfbuilder.py' -v
          python -m unittest discover -s tests/selfbuilder -p 'test_r4_complete.py' -v
  visual-source-stage:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Block 2 P03 native/preview catalog source-pin consistency
        shell: pwsh
        run: |
          python coordination/express/block2/test_catalog_consistency.py
          if ($LASTEXITCODE -ne 0) { throw 'BLOCK2_P03_CATALOG_PIN_HOLD' }
      - name: MEGAPATCH_A_ACQUISITION_LIB_V2 signed local catalog and native firstboot
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_acquisition_library.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'A2_ACQUISITION_FTS5_SHA_TEST_HOLD' }
          python -m unittest discover -s tests -p 'test_firstboot_coordinator.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'A2_NATIVE_FIRSTBOOT_REGRESSION_HOLD' }
      - name: Verify original 28-part immutable R11 donor (no guessed source)
        shell: pwsh
        run: |
          python coordination/e06/stage_p01.py
          if ($LASTEXITCODE -ne 0) { throw 'PINNED_R11_SOURCELOCK_HOLD' }
      - name: Real D02 staging unit tests and negative tampering cases
        shell: pwsh
        run: |
          python -m unittest discover -s integrations/wow200/tests -p 'test_stage_wow200.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'D02_STAGING_REGRESSION_HOLD' }
      - name: Stage existing approved Creative and owner1 D02 in SAME disposable R11
        shell: pwsh
        run: |
          python integrations/creative/stage_creative.py work/e06/staged/R11 integrations/creative
          if ($LASTEXITCODE -ne 0) { throw 'SAME_R11_CREATIVE_STAGE_HOLD' }
          python integrations/wow200/stage_wow200.py work/e06/staged/R11 integrations/wow200
          if ($LASTEXITCODE -ne 0) { throw 'SAME_R11_D02_STAGE_HOLD' }
          $receipt=Get-Content work/e06/staged/WOW200_STAGE_RECEIPT.json -Raw | ConvertFrom-Json
          # Stage 78 exact sources: legacy WOW200 + MENU V2 + seven P01 MENU10 modules; native activation still NOT_RUN.
          if ($receipt.count -ne 78 -or $receipt.p01_owner_source_staged -ne $true -or $receipt.p01_owner_native_mount_activated -ne $false -or $receipt.p01_owner_native_route_e2e -cne 'NOT_RUN' -or $receipt.menu_v2_native_ui_staged -ne $true -or $receipt.active_d02_engine -cne 'OWNER1_PR144_PINNED' -or
              $receipt.legacy_d02_runtime_imported -ne $false -or $receipt.release_accepted -ne $false) {
            throw 'D02_STAGE_ACTIVE_IMPORT_RECEIPT_HOLD'
          }
          $active='work/e06/staged/R11/Assets/creative/wow200/proposals/NOX-CINEMA-FX/nox-cinema.mjs'
          $canonical='proposals/NOX-CINEMA-FX/nox-cinema.mjs'
          $stagedBlob=(& git hash-object -- $active).Trim().ToLowerInvariant()
          $canonicalBlob=(& git rev-parse 'HEAD:proposals/NOX-CINEMA-FX/nox-cinema.mjs').Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $stagedBlob -cne $canonicalBlob) { throw 'D02_ACTIVE_GIT_BLOB_HOLD' }
          Write-Host 'D02_STAGED_SOURCE_PIN_PASS (NOT WINDOWS E07 ACCEPTED)'
      - name: Preserve original and staged receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nox-v16-e06-d02-source-receipts-${{ github.run_id }}
          path: |
            work/e06/staged/source_lock.json
            work/e06/staged/CREATIVE_STAGE_RECEIPT.json
            work/e06/staged/WOW200_STAGE_RECEIPT.json
          if-no-files-found: warn
          retention-days: 14
  diagnostic-onehost:
    # Reuse the existing Windows job for canonical PR162 so that the first
    # real WPF/NSIS failure and receipts are visible in GitHub Actions.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.number == 162)
    needs: visual-source-stage
    env:
      NOX_NATIVE_SMOKE_MODEL: ${{ inputs.native_smoke_model }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build original trusted Python candidate and stage original owner1 R11
        shell: pwsh
        run: |
          # private_build.ps1 uses a version-checked external Python 3.12 executable.
          & ./private_build.ps1 -OneHostNative -RunId "NOX-E06-D02-${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_PYTHON_CANDIDATE_BUILD_HOLD' }
          python coordination/e06/stage_p01.py
          if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_R11_SOURCELOCK_HOLD' }
          python coordination/source-lock/verify_original_archive.py --parts-dir . --output work/e06/original-729-manifest.json --expected-files 729
          if ($LASTEXITCODE -ne 0) { throw 'E07_ORIGINAL_729_SOURCELOCK_HOLD' }
          # The E06 owner-specific original 729 receipt must independently match.
          python coordination/e06/verify_original_729_source.py --parts-dir . --out work/e06/original-729-owner-pinned.json --run-id "NOX-V16-E06-${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) { throw 'E07_ORIGINAL_OWNER_729_SOURCELOCK_HOLD' }
      - name: Build one diagnostic WPF + Python + pinned owner1 D02 / Creative NSIS
        shell: pwsh
        run: |
          $buildReceipt='work/candidate/ONEHOST_PYTHON_BUILD_RECEIPT.json'
          $backend=(Resolve-Path -LiteralPath 'work/candidate/NOX_HELION_PRIVATE_CANDIDATE.exe').Path
          $build=Get-Content -LiteralPath $buildReceipt -Raw -Encoding UTF8 | ConvertFrom-Json
          $tree=(& git rev-parse 'HEAD^{tree}' | Out-String).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_BUILD_SOURCE_TREE_UNAVAILABLE' }
          if ($build.schema -cne 'NOX-ONEHOST-PYTHON-BUILD-V1' -or
              $build.release_accepted -isnot [bool] -or $build.bundled_runtime_data_verified -isnot [bool] -or
              $build.source_commit -cne '${{ github.sha }}' -or $build.source_tree -cne $tree -or
              $build.release_accepted -ne $false -or $build.bundled_runtime_data_verified -ne $true -or
              @($build.runtime_data_files).Count -lt 1 -or
              [IO.Path]::GetFullPath([string]$build.python_exe) -ine $backend -or
              $build.python_exe_sha256 -cne (Get-FileHash -LiteralPath $backend -Algorithm SHA256).Hash.ToLowerInvariant()) {
            throw 'NATIVE_BUILD_RECEIPT_CURRENT_SOURCE_OR_BYTES_MISMATCH'
          }
          $nativeProof='work/candidate/NATIVE_ONEHOST_SMOKE.json'
          $smokeArgs=@('coordination/e06/native_onehost_smoke.py','--exe',$backend,
              '--build-receipt',$buildReceipt,'--source-head','${{ github.sha }}','--output',$nativeProof)
          if (-not [string]::IsNullOrWhiteSpace($env:NOX_NATIVE_SMOKE_MODEL)) {
            $smokeArgs+=@('--model',$env:NOX_NATIVE_SMOKE_MODEL)
          }
          & python @smokeArgs
          $nativeSmokeExit=$LASTEXITCODE
          if ($nativeSmokeExit -notin @(0,2)) { throw "NATIVE_ONEHOST_SMOKE_FAILED:$nativeSmokeExit" }
          $smoke=Get-Content -LiteralPath $nativeProof -Raw -Encoding UTF8 | ConvertFrom-Json
          foreach ($flag in @('run_id_matched','request_id_matched','original_729_unchanged',
              'release_accepted','installed_wpf_e07','process_restart_verified','isolated_test_data',
              'history_persistence_verified')) {
            if ($smoke.$flag -isnot [bool]) { throw 'NATIVE_ONEHOST_PROOF_BOOLEAN_TYPE_REQUIRED' }
          }
          if (($smoke.concurrent_native_executables_max -isnot [int] -and
               $smoke.concurrent_native_executables_max -isnot [long]) -or
               $smoke.concurrent_native_executables_max -ne 1) {
            throw 'NATIVE_ONEHOST_PROOF_SINGLE_PROCESS_INTEGER_REQUIRED'
          }
          $fullNative=($nativeSmokeExit -eq 0 -and $smoke.phase -ceq 'BUILT_AND_NATIVE_STDIO_SMOKE_PASS' -and
              $smoke.live_model_status -ceq 'PASS' -and $smoke.native_windows_exe_request_reply -ceq 'PASS')
          $offlineNative=($nativeSmokeExit -eq 2 -and $smoke.phase -ceq 'BUILT_AND_NATIVE_STDIO_SMOKE_HOLD' -and
              $smoke.live_model_status -ceq 'HOLD' -and $smoke.native_windows_exe_request_reply -ceq 'HOLD')
          if ($smoke.schema -cne 'NOX_NATIVE_ONEHOST_SMOKE_V2' -or $smoke.platform -cne 'win32' -or
              $smoke.transport_status -cne 'PASS' -or $smoke.offline_backbone_status -cne 'PASS' -or
              $smoke.run_id_matched -ne $true -or $smoke.request_id_matched -ne $true -or
              $smoke.process_restart_verified -ne $true -or $smoke.original_729_unchanged -ne $true -or
              $smoke.isolated_test_data -ne $true -or $smoke.concurrent_native_executables_max -ne 1 -or
              $smoke.release_accepted -ne $false -or $smoke.installed_wpf_e07 -ne $false -or
              $smoke.source_commit -cne $build.source_commit -or $smoke.source_tree -cne $tree -or
              $smoke.build_run_id -cne $build.run_id -or
              $smoke.exe_sha256 -cne (Get-FileHash -LiteralPath $backend -Algorithm SHA256).Hash.ToLowerInvariant() -or
              $smoke.build_receipt_sha256 -cne (Get-FileHash -LiteralPath $buildReceipt -Algorithm SHA256).Hash.ToLowerInvariant() -or
              $smoke.source_original_archive_sha256 -cne $build.source_original_archive_sha256 -or
              $smoke.staged_original_app_sha256 -cne $build.staged_original_app_sha256 -or
              -not ($fullNative -or $offlineNative)) {
            throw 'NATIVE_ONEHOST_EXACT_WINDOWS_BACKBONE_PROOF_REQUIRED'
          }
          # Source/build admission only. A real offline candidate may be packaged so
          # Model Center can install an approved model; it remains HOLD for release/E07.
          Write-Host ("NATIVE_DIAGNOSTIC_CANDIDATE LIVE_MODEL="+$smoke.live_model_status+" RELEASE_ACCEPTED=False")
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            & choco install nsis --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_NSIS_PREREQUISITE_HOLD' }
          }
          # Reuse original Creative owner worker and installer patch, on a disposable CI copy.
          # The ONEHOST packager must include the real worker BEFORE payload.sha256.json.
          $creativeRoot=(Resolve-Path -LiteralPath 'integrations/creative').Path
          $workerRoot=Join-Path (Resolve-Path -LiteralPath '.').Path 'work/e06/github-creative-worker'
          if (Test-Path -LiteralPath $workerRoot) { throw 'GITHUB_CREATIVE_WORKER_OUTPUT_EXISTS_HOLD' }
          New-Item -ItemType Directory -Path $workerRoot -Force | Out-Null
          python -m venv (Join-Path $workerRoot '.venv')
          if ($LASTEXITCODE -ne 0) { throw 'GITHUB_CREATIVE_VENV_HOLD' }
          $workerPython=Join-Path $workerRoot '.venv/Scripts/python.exe'
          # Fixed original owner dependency versions in isolated build venv (no global pip).
          & $workerPython -m pip install --disable-pip-version-check --no-input 'pyinstaller==6.16.0' 'huggingface_hub==0.36.0' 'trimesh==4.8.2' 'numpy==2.3.4'
          if ($LASTEXITCODE -ne 0) { throw 'GITHUB_CREATIVE_DEPS_HOLD' }
          $env:PYTHONPATH=$creativeRoot
          & $workerPython -m unittest discover -s (Join-Path $creativeRoot 'tests') -v
          if ($LASTEXITCODE -ne 0) { throw 'GITHUB_CREATIVE_PROTOCOL_HOLD' }
          & $workerPython -m PyInstaller --noconfirm --clean --onedir --console --name NOX_CreativeWorker --paths $creativeRoot --collect-all huggingface_hub --collect-all trimesh --distpath (Join-Path $workerRoot 'dist') --workpath (Join-Path $workerRoot 'build') (Join-Path $creativeRoot 'creative_worker.py')
          if ($LASTEXITCODE -ne 0) { throw 'GITHUB_CREATIVE_WORKER_COMPILE_HOLD' }
          $workerDist=Join-Path $workerRoot 'dist/NOX_CreativeWorker'
          if (!(Test-Path -LiteralPath (Join-Path $workerDist 'NOX_CreativeWorker.exe') -PathType Leaf)) { throw 'GITHUB_CREATIVE_WORKER_BINARY_MISSING_HOLD' }
          $builderCopy=Join-Path $workerRoot 'build_onehost_creative_disposable.ps1'
          Copy-Item -LiteralPath 'coordination/e06/build_onehost_installer.ps1' -Destination $builderCopy -ErrorAction Stop
          & $workerPython (Join-Path $creativeRoot 'patch_installer.py') $builderCopy $workerDist
          if ($LASTEXITCODE -ne 0) { throw 'GITHUB_CREATIVE_INSTALLER_STAGE_HOLD' }
          $patchedBuilder=Get-Content -LiteralPath $builderCopy -Raw -Encoding UTF8
          if ($patchedBuilder -notmatch 'CREATIVE_PAYLOAD_MISSING_HOLD' -or $patchedBuilder -notmatch 'NOX_CreativeWorker.exe') { throw 'GITHUB_CREATIVE_BUILDER_COPY_NOT_PATCHED_HOLD' }
          & $builderCopy `
            -SourceRoot work/e06/staged/R11 `
            -PythonExe $backend `
            -PythonNativeSmokeReceipt $nativeProof `
            -OutputRoot work/e06/onehost-wow-diagnostic `
            -RunId "NOX-E06-D02-${{ github.run_id }}" `
            -CreativeSourceRoot integrations/creative `
            -WowSourceRoot integrations/wow200
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'work/e06/onehost-wow-diagnostic/ONEHOST_DIAGNOSTIC_RECEIPT.json')) {
            throw 'COMBINED_INSTALLER_BUILD_HOLD'
          }
          $out='work/e06/onehost-wow-diagnostic'
          $proof=Join-Path $out 'D02_VISUAL_PUBLISH_RECEIPT.json'
          if (!(Test-Path -LiteralPath $proof -PathType Leaf)) { throw 'PUBLISHED_D02_RECEIPT_MISSING_HOLD' }
          $report=Get-Content -LiteralPath $proof -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($report.schema -cne 'NOX-E06-D02-VISUAL-PAYLOAD-V1' -or
              $report.owner1_active_only -ne $true -or
              $report.previous_pr30_archived -ne $true -or
              $report.release_accepted -ne $false -or
              $report.file_count -lt 60) { throw 'PUBLISHED_D02_RECEIPT_REJECTED_HOLD' }
          $manifest=Get-Content -LiteralPath (Join-Path $out 'payload/payload.sha256.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          foreach ($name in @('index.html','creative/wow200/runtime/home-scene.mjs',
              'creative/wow200/proposals/NOX-CINEMA-FX/nox-cinema.mjs',
              'creative/wow200/proposals/NOX-CINEMA-FX/nox-cinema.css',
              'creative/wow200/legacy/d02-pr30/nox-cinema.mjs',
              'creative/wow200/legacy/d02-pr30/nox-cinema.css')) {
            $rel='Assets/'+$name
            $entry=@($manifest.files | Where-Object { $_.path -ceq $rel })
            if ($entry.Count -ne 1) { throw "D02_NSIS_MANIFEST_ENTRY_MISSING:$rel" }
            $published=Join-Path $out ('payload/Assets/'+$name)
            if (!(Test-Path -LiteralPath $published -PathType Leaf) -or
                (Get-FileHash -LiteralPath $published -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                ([string]$entry[0].sha256).ToLowerInvariant()) {
              throw "D02_NSIS_MANIFEST_SHA_MISMATCH:$rel"
            }
          }
          Write-Host 'D02_PUBLISHED_ASSETS_PIN_PASS / E07_NOT_RUN'
          $handoffArgs=@{
            Original729Receipt='work/e06/original-729-manifest.json'
            Owner729Receipt='work/e06/original-729-owner-pinned.json'
            OneHostReceipt=(Join-Path $out 'ONEHOST_DIAGNOSTIC_RECEIPT.json')
            SetupExe=(Join-Path $out 'NOX-HELION-V16-DIAGNOSTIC-SETUP.exe')
            PublishedExe=(Join-Path $out 'payload/NOX.P01.Shell.exe')
            SourceCommitSha='${{ github.sha }}'
            Output=(Join-Path $out 'E07_BUILT_HANDOFF.json')
            Phase='BUILT'
          }
          & ./coordination/e06/Emit-E07ImmutableHandoff.ps1 @handoffArgs
          if (!(Test-Path -LiteralPath (Join-Path $out 'E07_BUILT_HANDOFF.json') -PathType Leaf)) {
            throw 'E07_BUILDID_HANDOFF_NOT_EMITTED'
          }
      - name: Same-VM actual installed WPF / NSIS lifecycle smoke (NOT independent E07)
        shell: pwsh
        env:
          NOX_E07_CI_WINDOWS_DISPOSABLE: 'YES'
          NOX_M1_CI_INSTALL_WEBVIEW2: 'YES'
        run: |
          python -m py_compile coordination/e06/t06_samevm_installed_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'T06_SMOKE_PYTHON_SYNTAX_HOLD' }
          python coordination/e06/t06_samevm_installed_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'T06_INSTALLED_NATIVE_LIFECYCLE_HOLD' }
          Write-Host 'T06_INSTALLED_SAME_VM_SMOKE_PASS (NOT INDEPENDENT E07)'
      - name: Download exact Microsoft.WindowsAppSDK NuGet to Windows CI evidence cache (no install)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cache='work/e06/prereq-cache'
          New-Item -ItemType Directory -Path $cache -Force | Out-Null
          $name='microsoft.windowsappsdk.1.8.260921001.nupkg'
          $url='https://api.nuget.org/v3-flatcontainer/microsoft.windowsappsdk/1.8.260921001/'+$name
          $pkg=Join-Path $cache $name
          $receipt=[ordered]@{schema='NOX-EFINAL-NUGET-PIN-V1'; package='Microsoft.WindowsAppSDK'; version='1.8.260921001'; source=$url; sha256=$null; bytes=$null; source_sha256_pin_matched=$false; nuget_signature_exit=$null; status='HOLD'; error=$null; execute_or_install=$false}
          try {
            Invoke-WebRequest -Uri $url -OutFile $pkg -TimeoutSec 90 -ErrorAction Stop
            $size=(Get-Item -LiteralPath $pkg).Length
            if ($size -lt 1000 -or $size -gt 20971520) { throw 'NUGET_PINNED_PACKAGE_SIZE_HOLD' }
            $receipt.bytes=$size
            $receipt.sha256=(Get-FileHash -LiteralPath $pkg -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($receipt.sha256 -cne 'ee0c5218ded2dff2b5a40bd2fd15a5d91ae66fc612ab1ad0b9c66bf13fc6193a') { throw 'NUGET_PINNED_PACKAGE_SHA256_MISMATCH' }
            $receipt.source_sha256_pin_matched=$true
            $signatureOutput=(& dotnet nuget verify $pkg --all 2>&1 | Out-String)
            $receipt.nuget_signature_exit=$LASTEXITCODE
            if ($LASTEXITCODE -ne 0) { throw ('NUGET_PINNED_PACKAGE_SIGNATURE_HOLD '+$signatureOutput.Substring(0,[Math]::Min(400,$signatureOutput.Length))) }
            $receipt.status='VERIFIED_DOWNLOADED_NO_INSTALL'
          } catch {
            $receipt.error=[string]$_.Exception.Message
            if (Test-Path -LiteralPath $pkg -PathType Leaf) { Remove-Item -LiteralPath $pkg -Force }
          }
          $receipt | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $cache 'windowsappsdk-1.8.260921001-receipt.json') -Encoding utf8
          Write-Host ("NUGET_PINNED_PACKAGE_1_8_260921001 "+($receipt | ConvertTo-Json -Compress -Depth 4))
      - name: Preserve full build receipt; do not claim E07 release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nox-v16-e06-onehost-diagnostic-${{ github.run_id }}
          path: |
            work/e06/staged/source_lock.json
            work/e06/staged/CREATIVE_STAGE_RECEIPT.json
            work/e06/staged/WOW200_STAGE_RECEIPT.json
            work/e06/original-729-manifest.json
            work/e06/original-729-owner-pinned.json
            work/candidate/ONEHOST_PYTHON_BUILD_RECEIPT.json
            work/candidate/NATIVE_ONEHOST_SMOKE.json
            work/e06/onehost-wow-diagnostic/ONEHOST_DIAGNOSTIC_RECEIPT.json
            work/e06/onehost-wow-diagnostic/E07_BUILT_HANDOFF.json
            work/e06/onehost-wow-diagnostic/T06_INSTALLED_SMOKE.json
            work/e06/onehost-wow-diagnostic/D02_VISUAL_PUBLISH_RECEIPT.json
            work/e06/onehost-wow-diagnostic/D02_ORIGINAL_PUBLISHED_INDEX_BACKUP.html
            work/e06/onehost-wow-diagnostic/NOX-HELION-V16-DIAGNOSTIC-SETUP.exe
            work/e06/prereq-cache/windowsappsdk-1.8.260921001-receipt.json
            work/e06/prereq-cache/microsoft.windowsappsdk.1.8.260921001.nupkg
          if-no-files-found: warn
          retention-days: 14
