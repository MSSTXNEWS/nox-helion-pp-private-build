name: NOX V84 offline native S03 retrieval tests
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v84/**'
      - '.github/workflows/nox-v84-offline-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify read-only memory filters, native scope and FORGE gate
        run: |
          python -m py_compile nox_runpod/teacher_mesh/v84/memory_native.py
          python -m unittest discover -s nox_runpod/teacher_mesh/v84/tests -p 'test_*.py' -v
      - name: Explicit source boundary
        run: |
          echo 'LIVE_ONEHOST_BINDING_VERIFIED=false'
          echo 'USER_MEMORY_EXPORTED=false'
          echo 'TRAINING_STARTED=false'
