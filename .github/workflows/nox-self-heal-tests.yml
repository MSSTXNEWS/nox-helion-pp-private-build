name: NOX bounded self-heal regression
on:
  push:
    paths:
      - 'nox-control/nox_self_heal.py'
      - 'nox-control/test_nox_self_heal.py'
      - '.github/workflows/nox-self-heal-tests.yml'
  pull_request:
    paths:
      - 'nox-control/nox_self_heal.py'
      - 'nox-control/test_nox_self_heal.py'
      - '.github/workflows/nox-self-heal-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m py_compile nox-control/nox_self_heal.py nox-control/test_nox_self_heal.py
      - run: python3 -m unittest discover -s nox-control -p 'test_nox_self_heal.py' -v
