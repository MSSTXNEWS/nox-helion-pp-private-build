name: NOX V122 immutable live WEB V29 92-route read-only audit
on:
  push:
    branches: [fix/nox-v118-cookiejar-shadow-20261115]
    paths:
      - 'nox_runpod/teacher_mesh/v122/**'
      - '.github/workflows/nox-v122-readonly-web-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nox-60509551-v122-readonly-audit
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile existing source and prove read-only boundaries
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v122/immutable_live_web_audit.py
          python -m unittest -v nox_runpod.teacher_mesh.v122.test_immutable_live_web_audit
  native_readonly:
    needs: source
    if: ${{ github.actor == 'MSSTXNEWS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify protected transport exists without printing it
        run: test -n "$NOX2" || { echo 'HOLD_NOX2'; exit 2; }
      - name: Physical READ-ONLY SHA / routes / S03 / STOP / hardware audit
        run: python -m nox_runpod.teacher_mesh.v122.immutable_live_web_audit
      - name: Always detach temporary SSH public identity
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
