name: NOX V74 onepass verified brain bridge stage on Vast
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v74-cognitive-stage.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v74-stage-single-host
  cancel-in-progress: false
jobs:
  stage:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate native SHA-pinned stage source
        run: python3 -m py_compile nox_runpod/teacher_mesh/v74/onehost_cognitive_stage.py
      - name: Physically stage C01-C08 S03 cognitive modules without live restart
        run: python3 -m nox_runpod.teacher_mesh.v74.onehost_cognitive_stage
      - name: Revoke exact SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: No second host, no model overwrite
        if: success()
        run: |
          echo 'NOX_EXISTING_ONEHOST_PRESERVED=true'
          echo 'NOX_BRAIN_BRIDGE_STAGED_ONLY=true'
          echo 'NOX_PRODUCTION_ACTIVATION_NOT_CLAIMED=true'
