name: NOX V64 strict one-file HF PATH repair source safety tests
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v64-download-path-source-ci.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile source and execute offline source contract
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v64/download_path_patch.py
          python3 -m unittest discover -s nox_runpod/teacher_mesh/v64/tests -p 'test_*.py' -v
      - name: No live action claimed
        run: |
          echo "SOURCE_CHECK_ONLY=true"
          echo "DOWNLOAD_SERVICE_NOT_STARTED=true"
          echo "HF_PACKAGES_NOT_INSTALLED=true"
