name: NOX V50 ephemeral SSH live read-only audit and key revocation
on:
  push:
    branches:
      - feature/nox-v38-synaptic-brain-20261114
    paths:
      - ".github/workflows/nox-v50-live-ephemeral-ssh-audit.yml"
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v50-ephemeral-ssh-60509551
  cancel-in-progress: false
jobs:
  single-readonly-audit:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      VAST_API_KEY: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight 15 SSH key safety tests before touching Vast
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s nox_runpod/teacher_mesh/v50/tests -p 'test_*.py' -q
          echo 'V50_SECURITY_TESTS_PASSED=true'
      - name: Audit live instance with temporary SSH key and assured revoke readback
        shell: bash
        run: |
          set -euo pipefail
          python -m nox_runpod.teacher_mesh.v50.ephemeral_ssh_audit
      - name: Do not confuse resource audit with live OneHost activation
        if: always()
        run: |
          echo 'NOX_ONEHOST_BRIDGE_ACTIVATED=false'
          echo 'NOX_R60_NATIVE_REGISTERED=0'
          echo 'NOX_TRAINING_NOT_MODIFIED_BY_V50=true'
          echo 'NOX_PRODUCTION_UNCHANGED_BY_V50=true'
