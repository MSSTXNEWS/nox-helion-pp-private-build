name: NOX V53 live S03/OneHost/WEB source provenance (read only)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - ".github/workflows/nox-v53-native-s03-web-provenance.yml"
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v53-vast60509551-existing-onehost-audit
  cancel-in-progress: false
jobs:
  verify-provenance:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python compile
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py nox_runpod/teacher_mesh/v53/s03_onehost_provenance.py
      - name: Read native OneHost/S03 and original WEB hashes
        run: |
          python3 -m nox_runpod.teacher_mesh.v53.s03_onehost_provenance
      - name: Mandatory temporary SSH key cleanup
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Strict no-production claim
        if: success()
        run: |
          echo "S03_NATIVE_SCHEMA_INSPECT_ONLY=true"
          echo "NOX_WEIGHT_UPDATES_NOT_STARTED=true"
          echo "NOX_QUEUE_REGISTRATION_NOT_DONE=true"
          echo "NOX_WEB_NOT_MODIFIED=true"
