name: NOX V61 encrypted checkpoint archive split into Drive-size chunks
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v61-encrypted-drive-chunks.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  split-encrypted-existing-backup:
    if: ${{ github.actor == 'MSSTXNEWS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve the ALREADY-VERIFIED encrypted V61 archive (no Vast or SSH)
        uses: actions/download-artifact@v4
        with:
          name: NOX_V61_ENCRYPTED_CHECKPOINT_OPTIMIZER_20261114
          repository: MSSTXNEWS/nox-helion-pp-private-build
          run-id: 43607925517
          github-token: ${{ github.token }}
          path: source
      - name: Split only ciphertext, verifying V61 SHA and receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,math
          base=Path('source')
          enc=base/'NOX_V61_CHECKPOINT_OPTIMIZER_ENCRYPTED_20261114.tar.age'
          receipt=json.loads((base/'NOX_V61_CHECKPOINT_OPTIMIZER_RECEIPT.json').read_text())
          data=enc.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          assert sha==receipt['ciphertext_sha256']
          assert receipt['temporary_age_test_restore']=='PASS'
          assert receipt['checkpoint_optimizer_files']==12
          assert data.startswith(b'age-encryption.org/v1\n')
          chunks=[data[x:x+75000000] for x in range(0,len(data),75000000)]
          assert len(chunks)==4, 'HOLD_UNEXPECTED_CHUNK_COUNT'
          common={
             'schema':'NOX_V61_ENCRYPTED_CHUNKS_V1',
             'source_run':'https://github.com/MSSTXNEWS/nox-helion-pp-private-build/actions/runs/43607925517',
             'ciphertext_sha256':sha,
             'ciphertext_total_bytes':len(data),
             'checkpoint_optimizer_count':receipt['checkpoint_optimizer_files'],
             'owner_private_key_restore_verified':False,
             'originals_deleted':False,
             'part_count':len(chunks)
          }
          common['parts']=[]
          for i,item in enumerate(chunks,1):
              name=f'NOX_V61_CIPHER.part{i:02d}'
              common['parts'].append({'part':i,'file':name,
                 'size_bytes':len(item),'sha256':hashlib.sha256(item).hexdigest()})
          for i,item in enumerate(chunks,1):
              out=Path('split')/f'part{i:02d}'
              out.mkdir(parents=True,exist_ok=True)
              part=out/f'NOX_V61_CIPHER.part{i:02d}'
              part.write_bytes(item)
              (out/'NOX_V61_CHUNK_INDEX.json').write_text(json.dumps(common,indent=2,sort_keys=True)+'\n')
              assert len(item)<100_000_000
              print('NOX_V61_CHUNK_'+str(i)+'_BYTES='+str(len(item)))
              print('NOX_V61_CHUNK_'+str(i)+'_SHA256='+hashlib.sha256(item).hexdigest())
          print('NOX_V61_CIPHERTEXT_CHUNKS_VERIFIED=4')
          print('VAST_SOURCE_NOT_TOUCHED=true')
          PY
      - name: Encrypted chunk 01
        uses: actions/upload-artifact@v4
        with:
          name: NOX_V61_CIPHERTEXT_PART_01_20261114
          path: split/part01/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Encrypted chunk 02
        uses: actions/upload-artifact@v4
        with:
          name: NOX_V61_CIPHERTEXT_PART_02_20261114
          path: split/part02/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Encrypted chunk 03
        uses: actions/upload-artifact@v4
        with:
          name: NOX_V61_CIPHERTEXT_PART_03_20261114
          path: split/part03/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Encrypted chunk 04
        uses: actions/upload-artifact@v4
        with:
          name: NOX_V61_CIPHERTEXT_PART_04_20261114
          path: split/part04/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
