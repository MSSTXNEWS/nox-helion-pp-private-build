name: NOX WOW vendor full upstream source ZIP
on:
  push:
    branches: [codex/nox-wow-sources-20261121]
    paths:
      - "tools/nox_wow_vendor_sources.py"
      - ".github/workflows/nox-wow-vendor-sources.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download_sources:
    name: Download 125 upstream source archives and build one ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Source snapshot downloader (never executes vendor source)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/nox_wow_vendor_sources.py
      - name: Publish one complete downloaded-sources ZIP as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOX_WOW_UPSTREAM_SOURCES_20261121
          path: |
            NOX_WOW_UPSTREAM_SOURCES_20261121.zip
            nox_wow_vendor_out/manifest/FETCH_RESULTS.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3
