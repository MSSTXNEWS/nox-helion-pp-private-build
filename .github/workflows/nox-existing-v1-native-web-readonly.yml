name: NOX original OneHost WEB Resonance native read-only audit
on:
  workflow_dispatch:
    inputs:
      allow_native:
        description: "Owner authorized read-only existing Vast #60509551, no installs"
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions: {contents: read}
concurrency:
  group: nox-v51-vast60509551-temp-ssh
  cancel-in-progress: false
jobs:
  original-web:
    if: "${{ github.repository == 'MSSTXNEWS/nox-helion-pp-private-build' && github.actor == 'MSSTXNEWS' && github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.ref == 'refs/heads/feature/nox-v38-synaptic-brain-20261114' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inspect original WEB site, route registration, and S03 schema; preserve live model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from nox_runpod.teacher_mesh.v51 import ephemeral_ssh_probe as ssh
          ssh.LIST_API='https://console.vast.ai/api/v1/instances'
          ssh.REMOTE=r"""
          set -euo pipefail
          cd /root/nox/scripts
          /root/nox/venv/bin/python - <<'PYREMOTE'
          import hashlib,importlib,json,os,sqlite3,urllib.request,urllib.error
          from pathlib import Path
          print('NOX_NATIVE_V51_SSH_EXECUTED=true')
          print('NATIVE_ORIGINAL_WEB_AUDIT=STARTED')
          base=Path('/root/nox/incoming_t800u/v29_3/NOX_HELION_WEB_V29_3_FROZEN_20261113/site')
          def file_facts(rel):
              f=base/rel
              if not f.is_file() or f.is_symlink():
                  return {'present':False}
              b=f.read_bytes() if f.stat().st_size<=2000000 else b''
              return {'present':True,'size':f.stat().st_size,
                      'sha256':hashlib.sha256(b).hexdigest() if b else None}
          for name,rel in [('CHAT','chat.html'),('RESONANCE','pc/resonance.html'),
                           ('V135_BRIDGE','nox-v135-resonance-owner-bridge.js'),
                           ('OWNER_SCRIPT','native-owner.js')]:
              print('NATIVE_WEB_FILE_'+name+'='+json.dumps(file_facts(rel),sort_keys=True))
          for label,rel in [('PROXY','chat_proxy.py'),('BRIDGE','nox_v29_chat_bridge.py')]:
              f=Path('/root/nox/scripts')/rel
              if f.is_file() and not f.is_symlink() and f.stat().st_size<1000000:
                  print('NATIVE_WEB_SOURCE_'+label+'_SHA256='+hashlib.sha256(f.read_bytes()).hexdigest())
              else:
                  print('NATIVE_WEB_SOURCE_'+label+'_SHA256=HOLD_NOT_FOUND')
          def get(port,path,timeout=5):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:'+str(port)+path,timeout=timeout) as res:
                      return res.status
              except urllib.error.HTTPError as exc:
                  return exc.code
              except Exception:return 0
          for port in (8080,8081):
              print('NATIVE_WEB_HEALTH_'+str(port)+'='+str(get(port,'/health')))
          for item,path in [('ANON_CHAT','/nox-web-v29/chat.html'),
                            ('ANON_RESONANCE','/nox-web-v29/pc/resonance.html'),
                            ('ANON_STREAM','/api/nox/chat/stream'),
                            ('ANON_OWNER_SCRIPT','/nox-web-v29/native-owner.js')]:
              print('NATIVE_WEB_'+item+'_HTTP='+str(get(8080,path)))
          try:
              import chat_proxy
              from fastapi.routing import APIRoute
              routes={(getattr(r,'path',''),','.join(sorted(getattr(r,'methods',[]) or [])))
                       for r in chat_proxy.app.routes if isinstance(r,APIRoute)}
              for label,method,path in [('STREAM','POST','/api/nox/chat/stream'),
                                        ('DIALOG_CREATE','POST','/api/ui/memory/dialogs/create'),
                                        ('DIALOG_HISTORY','GET','/api/ui/memory/dialogs/history'),
                                        ('OWNER_STATUS','GET','/api/nox/status')]:
                  matched=any(p==path and method in ms.split(',') for p,ms in routes)
                  print('NATIVE_WEB_ROUTE_'+label+'_REGISTERED='+str(matched).lower())
          except Exception as e:
              print('NATIVE_WEB_ROUTES=HOLD_'+type(e).__name__)
          try:
              with urllib.request.urlopen('http://127.0.0.1:8081/slots',timeout=4) as res:
                  rows=json.loads(res.read(30000))
              if isinstance(rows,list):
                  busy=sum(bool(x.get('processing',x.get('is_processing',False))) for x in rows if isinstance(x,dict))
                  print('NATIVE_WEB_SLOTS='+json.dumps({'total':len(rows),'busy':busy},sort_keys=True))
          except Exception as e:
              print('NATIVE_WEB_SLOTS=HOLD_'+type(e).__name__)
          try:
              import s03_memory
              db=Path(s03_memory.DB)
              if db.is_file() and not db.is_symlink():
                  with sqlite3.connect('file:'+str(db)+'?mode=ro',uri=True,timeout=3) as conn:
                      conn.execute('PRAGMA query_only=ON')
                      tables={r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                  print('NATIVE_WEB_S03_TABLES_READY='+str({'s03_items','nox_v29_dialogs',
                    'nox_v29_dialog_messages'}<=tables).lower())
              else: print('NATIVE_WEB_S03_TABLES_READY=false')
          except Exception as e:
              print('NATIVE_WEB_S03=HOLD_'+type(e).__name__)
          print('NATIVE_WEB_AUDIT_NATIVE_SERVER_UNCHANGED=true')
          print('NATIVE_READ_ONLY_COMPLETE=true')
          PYREMOTE
          """
          good=False
          try:
              good=ssh.probe()
          except Exception as exc:
              msg=str(exc)
              print('NOX_WEB_NATIVE_HOLD='+msg if msg.startswith('HOLD_') and len(msg)<110 else 'NOX_WEB_NATIVE_HOLD=HOLD_EXCEPTION')
          finally:
              try:good=bool(good and ssh.cleanup())
              except Exception:
                  good=False
                  print('NOX_WEB_NATIVE_KEY_CLEANUP=HOLD')
          print('NOX_WEB_NATIVE_READ_ONLY='+('PASS' if good else 'HOLD'))
          sys.exit(0 if good else 2)
          PY
      - name: Mandatory ephemeral SSH cleanup
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
