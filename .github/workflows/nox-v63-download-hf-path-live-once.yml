name: NOX V63 repair existing Downloads hf executable PATH once with backup
run-name: NOX V63 verified bash-se SSH, single backup and PATH patch
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v63-download-hf-path-live-once.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v63-downloads-hf-native-write-once
  cancel-in-progress: false
jobs:
  scoped-repair:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate one-shot patch/rollback source
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v63/native_once.py nox_runpod/teacher_mesh/v63/repair_download_hf_path.py
          python3 -m unittest discover -s nox_runpod/teacher_mesh/v63/tests -p test_native_write_gate.py -q
      - name: Exactly one authorized native Downloads PATH patch, no service start
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v63.repair_download_hf_path
      - name: Mandatory cleanup of exact temporary Vast SSH key
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Native write acceptance boundary
        if: success()
        run: |
          echo 'DOWNLOADS_HF_PATH_NATIVE_CHECKED=true'
          echo 'DOWNLOAD_SERVICE_START_NOT_ATTEMPTED=true'
          echo 'TRAINER_NOT_RESTARTED=true'
          echo 'OTHER_SERVICES_UNTOUCHED=true'
