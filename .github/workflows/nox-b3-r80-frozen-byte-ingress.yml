name: NOX B3 R80 frozen byte ingress
on:
  pull_request:
    paths:
      - 'coordination/onepass/b3_r80*'
      - '.github/workflows/nox-b3-r80-frozen-byte-ingress.yml'
permissions:
  contents: read
jobs:
  exact-retained-text:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Single retained S03 chain and actual projection pair, no native calls
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 40b6ad0eeea8498b222e39feb2558e5922deccb1 ef3e7aa7ff26584d2bbb44b5e094b93de39a8014 68d5dd4ea1022dc55d3ee7b54347d053fb936e19 1c9f984247e557f9b2e393f9e2c24246f4f6a8de 4eafa7701e4e3e01c4fc3ecb0cd360054dd9deb3
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          load() { git show "$1:$2" > "$tmp/$3"; test "$(git hash-object "$tmp/$3")" = "$4"; }
          load 4eafa7701e4e3e01c4fc3ecb0cd360054dd9deb3 nox-control/b5_s03_verifier_r54.py b5_r55_pinned.py df94c535273dde1fd2609f555d1d615eacfda831
