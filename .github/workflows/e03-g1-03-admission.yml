name: NOX E03 G1-03 ModelCenter admission (source-only HOLD)
on:
  push:
    paths:
      - 'Packages/P03/Admission/**'
      - '.github/workflows/e03-g1-03-admission.yml'
  pull_request:
    paths:
      - 'Packages/P03/Admission/**'
      - '.github/workflows/e03-g1-03-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 8657491117f4221c053a0ea5111f68a61f5ad06a
          path: _pinned_owner3_donor
          sparse-checkout: |
            Packages/P03/Source/P03.ModelCenter/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check frozen original main identity and exact owner3 donor
        shell: bash
        run: |
          test "$(git merge-base HEAD 0b3a7d435be735148d64171deb9027093a89646e)" = "0b3a7d435be735148d64171deb9027093a89646e"
          test "$(git rev-parse 0b3a7d435be735148d64171deb9027093a89646e^{tree})" = "f108d604c444f718b32aaecfd07b90b8f91b9a6f"
          test "$(git -C _pinned_owner3_donor rev-parse HEAD)" = "8657491117f4221c053a0ea5111f68a61f5ad06a"
          test -f _pinned_owner3_donor/Packages/P03/Source/P03.ModelCenter/ModelTagReviewLeads.cs
          test -f _pinned_owner3_donor/Packages/P03/Source/P03.ModelCenter/ModelDownloadQueueStore.cs
          test -f _pinned_owner3_donor/Packages/P03/Source/P03.ModelCenter/OllamaModelAdapter.cs
      - name: 32 real offline no-download ModelCenter admission regressions
        shell: bash
        run: python -m unittest discover -s Packages/P03/Admission -p 'test_*.py' -v
      - name: Python syntax
        shell: bash
        run: python -m py_compile Packages/P03/Admission/p03_modelcenter_gate.py
