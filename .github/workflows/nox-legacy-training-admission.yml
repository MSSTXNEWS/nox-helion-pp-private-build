name: NOX legacy training admission source tests
on:
  pull_request:
    paths:
      - ".github/workflows/nox-runpod-direct.yml"
      - ".github/workflows/nox-legacy-training-admission.yml"
      - "nox_runpod/stage0/a40_full_parameter_distill_cycle.py"
      - "nox_runpod/stage0/training_admission.py"
      - "nox_runpod/stage0/training_admission_manifest.json"
      - "nox_runpod/stage0/tests/test_legacy_training_admission.py"
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run isolated admission tests
        run: python -m unittest discover -s nox_runpod/stage0/tests -v
