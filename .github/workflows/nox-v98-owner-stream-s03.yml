name: NOX V98 deferred owner streaming S03 native patch
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - "nox_runpod/teacher_mesh/v98/**"
      - ".github/workflows/nox-v98-owner-stream-s03.yml"
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Explicit owner approval for original NOX OneHost only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-native-proxy-patch-60509551
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate remote source and mock streaming S03 postflight
        run: |
          python -m py_compile nox_runpod/teacher_mesh/v98/deferred_s03_stream_patch.py
          python -m unittest discover -s nox_runpod/teacher_mesh/v98/tests -p 'test_*.py' -v
  gated-live:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One SHA-pinned native patch under idle slot gate with automatic rollback
        run: python -m nox_runpod.teacher_mesh.v98.deferred_s03_stream_patch
      - name: Always revoke temporary Vast SSH key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
