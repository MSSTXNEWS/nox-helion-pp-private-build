name: NOX E2 V92 full HF base weight non-LoRA readiness gate
on:
  push:
    branches: [nox/e2-v92-trainable-vault-20261114]
    paths:
      - '.github/workflows/nox-e2-v92-no-adapter-ci.yml'
      - 'nox_runpod/teacher_mesh/v92/test_manifest_gate.py'
      - 'nox_runpod/teacher_mesh/v47/night_v47/direct_weights_smoke.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ".:nox_runpod/teacher_mesh/v47:nox_runpod/teacher_mesh/v41"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source compilation and no-adapter metadata tests
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v47/night_v47/direct_weights_smoke.py
          python3 -m unittest -v \
            nox_runpod.teacher_mesh.v92.test_manifest_gate \
            nox_runpod.teacher_mesh.v87.test_gpu1_oom_gate \
            nox_runpod.teacher_mesh.v47.tests.test_night_v47
      - name: No resource action or fake training
        if: success()
        run: |
          echo 'NOX_V92_NO_ADAPTER_ACCEPTANCE_TESTED=true'
          echo 'NOX_MAIN_GGUF_UNCHANGED=true'
          echo 'NOX_VOLTA_TRAINER_NOT_RESTARTED=true'
          echo 'NOX_OPTIMIZER_STEPS_EXECUTED=0'
