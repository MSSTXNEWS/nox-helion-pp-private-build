name: NOX V99 full-weight-first 85pct resource admission source CI
on:
  push:
    branches: [nox/e2-v99-max-ram-prime-20261114]
    paths:
      - '.github/workflows/nox-e2-v99-train85-ci.yml'
      - 'nox_runpod/teacher_mesh/v99/training_85_budget.py'
      - 'nox_runpod/teacher_mesh/v99/test_training_85_budget.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ".:nox_runpod/teacher_mesh/v41:nox_runpod/teacher_mesh/v47"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile only source
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v99/training_85_budget.py
          python3 -m py_compile nox_runpod/teacher_mesh/v99/ram_first_weight_policy.py
      - name: 85pct RAM, Volta GPU1 training admission, P0 chat regression
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            nox_runpod.teacher_mesh.v99.test_training_85_budget \
            nox_runpod.teacher_mesh.v87.test_gpu1_oom_gate \
            nox_runpod.teacher_mesh.v71.test_one_prime \
            nox_runpod.teacher_mesh.v41.tests.test_priority_autonomy
      - name: No fake native train step
        if: success()
        run: |
          echo "NOX_V99_85PCT_COMPUTE_TARGET_SOURCE_VERIFIED=true"
          echo "NOX_V99_GPU1_NO_OVERCOMMIT=true"
          echo "NOX_V99_CHAT_GPU0_P0_PRESERVED=true"
          echo "NOX_V99_NEW_OPTIMIZER_STEPS=0"
