name: NOX next ZIP preflight native owner reviewed source checks
on:
  pull_request:
    paths:
      - 'nox-control/systemic_relay_20261118/next_zip_preflight/**'
      - 'nox-control/owner_native_operator.py'
      - '.github/workflows/nox-zip-preflight-owner-ci.yml'
permissions:
  contents: read
jobs:
  owner-next:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Source compiler, exact owner route, retained ZIP tests
        working-directory: nox-control/systemic_relay_20261118
        run: |
          python -m py_compile next_zip_preflight/merge_web_source.py \
            next_zip_preflight/owner_zip_reviewed_preflight_entry.py \
            ../owner_native_operator.py
          python -B -m unittest discover -s next_zip_preflight -p 'test_*.py' -v
