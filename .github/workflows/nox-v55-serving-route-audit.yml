name: NOX V55 existing native chat/model route audit (read only)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v55-serving-route-audit.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v55-native-serving-readonly
  cancel-in-progress: false
jobs:
  route-audit:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python compile
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py nox_runpod/teacher_mesh/v55/serving_route_audit.py
      - name: Native read-only mapped chat endpoints and run_admin hooks
        run: |
          python3 -m nox_runpod.teacher_mesh.v55.serving_route_audit
      - name: Revoke temporary SSH access even if prior step failed
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: No writes
        if: success()
        run: |
          echo "NOX_NATIVE_SERVING_READONLY_AUDIT=PASS"
          echo "NOX_MODEL_INFERENCE_NOT_INVOKED=true"
          echo "NOX_PRODUCTION_NOT_CHANGED=true"
