name: NOX E2 V76 ONEPASS seven-gate physical acceptance
run-name: NOX PRIME V76 | ONE SSH | 7 gates | stop-on-unsafe
on:
  push:
    branches: [nox/e2-v76-onepass-accept-20261114]
    paths:
      - '.github/workflows/nox-e2-v76-onepass.yml'
      - 'nox_runpod/teacher_mesh/v76/onepass_full_accept.py'
      - 'nox_runpod/teacher_mesh/v76/test_singlepass.py'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v76-onepass-60509551
  cancel-in-progress: false
jobs:
  full-acceptance:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NOX2: ${{ secrets.NOX2 }}
      PYTHONPATH: ".:nox_runpod/teacher_mesh/v41:nox_runpod/teacher_mesh/v47"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One source gate before any Vast connection
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOX2" || { echo "::error::HOLD_NOX2"; exit 2; }
          python3 -m py_compile nox_runpod/teacher_mesh/v76/onepass_full_accept.py
          python3 -m unittest -q \
            nox_runpod.teacher_mesh.v76.test_singlepass \
            nox_runpod.teacher_mesh.v72.test_onepass_contract \
            nox_runpod.teacher_mesh.v71.test_one_prime \
            nox_runpod.teacher_mesh.v38.tests.test_v38_control \
            nox_runpod.teacher_mesh.v38.tests.test_v38_memory_speed \
            nox_runpod.teacher_mesh.v41.tests.test_priority_autonomy \
            nox_runpod.teacher_mesh.v43.tests.test_v43 \
            nox_runpod.teacher_mesh.v47.tests.test_night_v47
      - name: ONE native SSH execution for seven independent gates and SHA-locked staging
        shell: bash
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v76.onepass_full_accept
      - name: Publish exact sanitized native receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOX_V76_SEVEN_GATE_ONEPASS_RECEIPT
          path: NOX_V76_ONEPASS_NATIVE_RECEIPT.json
          if-no-files-found: warn
          retention-days: 14
      - name: Independent exact SSH key detach on all outcomes
        if: always()
        shell: bash
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Conservative acceptance
        if: success()
        run: |
          echo "NOX_V76_ONE_NATIVE_EXECUTION=true"
          echo "NOX_V76_SECOND_SCHEDULER_OR_MODEL=false"
          echo "NOX_V76_SOURCE_STAGED_ONLY_WITH_SHA_PIN=true"
          echo "NOX_V76_LIVE_ONEPRIME_CALLBACKS_NOT_CLAIMED=true"
          echo "NOX_V76_30_NATIVE_JOB_IDS_NOT_INVENTED=true"
          echo "NOX_V76_OPTIMIZER_STEPS_NOT_INVENTED=true"
