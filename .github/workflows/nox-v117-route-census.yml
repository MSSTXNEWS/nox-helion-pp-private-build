name: NOX V117 real full 92-route V29 registered-surface audit
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v117/v29_route_census.py'
      - '.github/workflows/nox-v117-route-census.yml'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions: {contents: read}
jobs:
  native-readonly:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Prove source compiles and no destructive operations
        run: |
          python -m py_compile nox_runpod/teacher_mesh/v117/v29_route_census.py
          python - <<'PY'
          from nox_runpod.teacher_mesh.v117.v29_route_census import REMOTE
          body=REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0]
          compile(body,'<V117 route census>','exec')
          assert 'functional_e2e_passed_this_audit' in body
          assert "'all_92_functions_operational':False" in body
          assert "'read_only':True" in body
          print('NOX_V117_SOURCE_PASS')
          PY
      - name: Scan registered FastAPI routes without changing live service
        run: python -m nox_runpod.teacher_mesh.v117.v29_route_census
      - name: Revoke ephemeral access
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
