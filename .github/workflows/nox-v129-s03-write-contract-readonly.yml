name: NOX V129 original S03 writer signature schema read-only
on:
  pull_request:
    branches: [feature/nox-v37-v100-firsthour-14d-20261113, feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v129/read_native_s03_write_contract.py'
      - 'nox_runpod/teacher_mesh/v129/tests/test_read_native_s03_writer_contract.py'
      - '.github/workflows/nox-v129-s03-write-contract-readonly.yml'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v129-s03-native-readonly
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile read-only contract and assert no record reads
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v129/read_native_s03_write_contract.py
          python -m unittest nox_runpod.teacher_mesh.v129.tests.test_read_native_s03_writer_contract -v
          python - <<'PY'
          from nox_runpod.teacher_mesh.v129.read_native_s03_write_contract import REMOTE
          src=REMOTE.partition("<<'PYREMOTE'")[2].rpartition('PYREMOTE')[0]
          compile(src,'<NATIVE_S03_READONLY>','exec')
          for k in ('PRAGMA query_only=ON','mode=ro','O_NOFOLLOW','MODULE_ALLOWLIST','MAX_SOURCE_BYTES',
                    'PRAGMA table_info','PRAGMA index_list','PRAGMA index_info','private_rows_exported',
                    'TEMP_SSH_CLEANUP','NATIVE_READ_ONLY_COMPLETE=true'):
              assert k in (src+REMOTE if k!='TEMP_SSH_CLEANUP' else open('nox_runpod/teacher_mesh/v129/read_native_s03_write_contract.py').read()),k
          assert 'SELECT * FROM s03_items' not in src
          assert 'SELECT text FROM s03_items' not in src
          print('NOX_V129_S03_SOURCE_ONLY_PASS=true')
          PY
  native-readonly:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native S03 live source/schema inspection without private records
        run: python -m nox_runpod.teacher_mesh.v129.read_native_s03_write_contract
      - name: Revoke ephemeral SSH key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
