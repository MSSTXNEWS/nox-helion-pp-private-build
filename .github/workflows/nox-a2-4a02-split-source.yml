name: NOX A2 4A02 source-only split provenance
on:
  pull_request:
    branches:
      - main
    paths:
      - 'nox-control/owner_training_dataset_splits_4a02.py'
      - 'nox-control/test_owner_training_dataset_splits_4a02.py'
      - '.github/workflows/nox-a2-4a02-split-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-splits:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: One focused provenance-and-leakage regression
        run: |
          set -eu
          python3 -B -m py_compile nox-control/owner_training_dataset_splits_4a02.py nox-control/test_owner_training_dataset_splits_4a02.py
          PYTHONPATH=nox-control python3 -B -m unittest discover -s nox-control -p 'test_owner_training_dataset_splits_4a02.py' -v
