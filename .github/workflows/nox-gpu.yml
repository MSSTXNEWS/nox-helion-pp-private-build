name: NOX gpu_tier runner (S1)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nox-gpu
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor == 'MSSTXNEWS'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Update NOX command agent over temporary SSH key
        env:
          NOX2: ${{ secrets.NOX2 }}
          TS_AUTHKEY: ${{ secrets.NOXXXXX }}
        run: python3 -B nox-control/cmd_agent/run_gpu.py
