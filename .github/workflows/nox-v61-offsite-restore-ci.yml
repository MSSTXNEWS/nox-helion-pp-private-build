name: NOX V61 offsite ZIP reassembly and SHA fail-closed CI
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114, fix/nox-v61-atomic-publish-20261115]
    paths:
      - ".github/workflows/nox-v61-offsite-restore-ci.yml"
      - "nox_runpod/teacher_mesh/v61/restore_offsite_chunks.py"
      - "nox_runpod/teacher_mesh/v61/tests/test_offsite_restore.py"
  pull_request:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - ".github/workflows/nox-v61-offsite-restore-ci.yml"
      - "nox_runpod/teacher_mesh/v61/restore_offsite_chunks.py"
      - "nox_runpod/teacher_mesh/v61/tests/test_offsite_restore.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax and eleven isolated CRC/SHA/no-overwrite verification tests
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v61/restore_offsite_chunks.py
          python3 -m unittest -v nox_runpod.teacher_mesh.v61.tests.test_offsite_restore
      - name: No secrets and no remote operations
        run: |
          echo "NOX_V61_REASSEMBLY_TESTED_WITH_SYNTHETIC_DATA=true"
          echo "VAST_CONNECTION_NOT_USED=true"
          echo "DECRYPTION_WITH_OWNER_KEY_NOT_PERFORMED=true"
