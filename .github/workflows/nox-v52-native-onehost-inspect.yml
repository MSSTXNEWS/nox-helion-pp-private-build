name: NOX V52 native OneHost/S03/WEB read-only audit
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114, task/nox-20261116-02m-v52-path-stat]
    paths:
      - ".github/workflows/nox-v52-native-onehost-inspect.yml"
      - "nox-control/test_v52_exact_model_path_workflow_contract.py"
      - "nox-control/owner_native_audit.py"
      - "nox_runpod/teacher_mesh/v51/hf_range_probe.py"
  pull_request:
    paths:
      - ".github/workflows/nox-v52-native-onehost-inspect.yml"
      - "nox-control/test_v52_exact_model_path_workflow_contract.py"
      - "nox-control/owner_native_audit.py"
      - "nox_runpod/teacher_mesh/v51/hf_range_probe.py"
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v52-vast60509551-nox-native-inventory
  cancel-in-progress: false
jobs:
  source-contract:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run V52 exact model path source contract
        run: |
          python3 -m py_compile nox-control/owner_native_audit.py nox-control/test_v52_exact_model_path_workflow_contract.py nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py
          cd nox-control
          python3 -m unittest -v test_v52_exact_model_path_workflow_contract
      - name: Mark source-only boundary
        run: echo "SOURCE_TESTED_ONLY=true; no native dispatch, model files, STOP, or services touched"
  native-inspect:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Python source
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py nox_runpod/teacher_mesh/v52/remote_inspection.py nox-control/owner_native_audit.py
      - name: Native inspect exact DeepSeek paths through existing V52 SSH route
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import inspect
          import json
          from pathlib import Path
          from nox_runpod.teacher_mesh.v51 import ephemeral_ssh_probe as connection

          source_path = Path("nox-control/owner_native_audit.py")
          spec = importlib.util.spec_from_file_location("nox_model_path_audit", source_path)
          audit = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(audit)
          remote_python = (
              "import json, os\nfrom pathlib import Path\n"
              + "MODEL_ROOT=" + repr(audit.MODEL_ROOT) + "\n"
              + "MODEL_MANIFEST_REVISION=" + repr(audit.MODEL_MANIFEST_REVISION) + "\n"
              + "PINNED_MODEL_FILES=" + repr(audit.PINNED_MODEL_FILES) + "\n"
              + inspect.getsource(audit.pinned_model_paths)
              + "\nresult=pinned_model_paths()\n"
              + "print('NATIVE_PINNED_MODEL_PATH_STATUS='+result['status'])\n"
              + "print('NATIVE_PINNED_MODEL_ROOT='+result.get('root',''))\n"
              + "print('NATIVE_PINNED_MODEL_REVISION='+result['manifest_revision'])\n"
              + "for row in result['files']:\n"
              + " print('NATIVE_DEEPSEEK_PATH='+json.dumps(row,separators=(',',':')))\n"
              + "print('NATIVE_READ_ONLY_COMPLETE=true')\n"
          )
          connection.REMOTE = (
              "set -euo pipefail\npython3 - <<'PYREMOTE'\n"
              + remote_python + "PYREMOTE\n"
          )
          raise SystemExit(0 if connection.probe() else 2)
          PY
      - name: Mandatory temporary SSH key cleanup
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Source/run acceptance boundaries
        if: success()
        run: |
          echo "NATIVE_SERVER_READ_ONLY_PROBE=PASS"
          echo "S03_RESTART_NOT_TESTED=true"
          echo "NOX_QUEUE_READBACK_NOT_TESTED=true"
          echo "NOX_PRODUCTION_UNCHANGED=true"
