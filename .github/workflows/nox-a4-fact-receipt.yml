name: NOX A4 S03 fact receipt source gate
on:
  pull_request:
    paths:
      - 'nox-control/bridge/nox_webapi.py'
      - 'nox-control/bridge/test_webapi_s03_receipt.py'
      - '.github/workflows/nox-a4-fact-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fact-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - run: python -B nox-control/bridge/test_webapi_s03_receipt.py
