name: NOX V66 native secondary regenerable cache measurement
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v66-secondary-cache-readonly.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v66-secondary-cache-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax
        run: python3 -m py_compile nox_runpod/teacher_mesh/v66/secondary_cache_audit.py
      - name: Read only cached tool data sizes and open handles
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v66.secondary_cache_audit
      - name: Remove temporary Vast key and verify absence
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: No deletion
        if: success()
        run: echo 'NATIVE_USER_FILES_NOT_DELETED=true'
