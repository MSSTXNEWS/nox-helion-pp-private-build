name: NOX original S03 fact history compatibility V125/V130 source only
on:
  push:
    branches: [nox/e2-owner-facts-history-compat-20261115]
    paths:
      - '.github/workflows/nox-e2-owner-fact-history-compat-ci.yml'
      - '.github/workflows/nox-v120-s03-owner-views.yml'
      - 'nox_runpod/teacher_mesh/v120/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-version-source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only isolated FastAPI test dependencies
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Verify genuine original S03 owner fact write and history integration
        run: |
          set -euo pipefail
          python -m compileall -q nox_runpod/teacher_mesh/v120 nox_runpod/teacher_mesh/v130
          python -m unittest -v \
            nox_runpod.teacher_mesh.v120.tests.test_v132_owner_fact_history_contract \
            nox_runpod.teacher_mesh.v130.tests.test_owner_s03_fact_write
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/nox-v120-s03-owner-views.yml').read_text()
          assert "inputs.allow_native == 'YES'" in workflow
          assert "github.event_name == 'workflow_dispatch'" in workflow
          assert "default: 'NO'" in workflow
          print("NOX_V132_V120_NATIVE_PUSH_GUARDED=PASS")
          PY
          echo 'NOX_V132_REAL_S03_SQLITE_SOURCE_COMPAT=PASS'
      - name: Release boundary
        run: |
          echo 'NOX_V132_NATIVE_DEPLOYMENT=false'
          echo 'NOX_V132_PRIVATE_MEMORY_EXPORTED=false'
          echo 'NOX_V132_OWNER_FACT_LIVE_E2E_UNVERIFIED=true'
