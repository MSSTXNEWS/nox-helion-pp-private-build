name: NOX V110 local teacher to primary NOX synthesis
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - "nox_runpod/teacher_mesh/v110/**"
      - ".github/workflows/nox-v110-native-teacher-student.yml"
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-60509551-v110-two-model-smoke
  cancel-in-progress: false
jobs:
  acceptance:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate remote test source
        run: |
          python -m py_compile nox_runpod/teacher_mesh/v110/teacher_then_student.py
          python - <<'PY'
          from nox_runpod.teacher_mesh.v110.teacher_then_student import REMOTE
          compile(REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0],'<remote>','exec')
          PY
      - name: One harmless live teacher answer and actual NOX synthesis
        run: python -m nox_runpod.teacher_mesh.v110.teacher_then_student
      - name: Always revoke ephemeral key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
