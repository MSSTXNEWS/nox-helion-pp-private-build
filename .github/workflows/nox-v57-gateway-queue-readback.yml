name: NOX V57 existing tool gateway queue native readback (GET only)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v57-gateway-queue-readback.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v57-existing-native-queue-readonly
  cancel-in-progress: false
jobs:
  queue-read:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile source
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py nox_runpod/teacher_mesh/v57/queue_readback_probe.py
      - name: Native read-only queue route GET
        run: |
          python3 -m nox_runpod.teacher_mesh.v57.queue_readback_probe
      - name: Mandatory temporary SSH key cleanup
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Never imply actual jobs were registered
        if: success()
        run: |
          echo "NOX_EXISTING_QUEUE_GET_ONLY=true"
          echo "NOX_R60_NATIVE_TASKS_REGISTERED=0"
          echo "NOX_PRODUCTION_NO_WRITES=true"
