name: NOX V136 existing SSH host key fingerprint read-only
on:
  push:
    branches: [qa/nox-v136-original-ssh-route-readonly-20261115]
    paths: ['.github/workflows/nox-v136-ssh-host-fingerprint-readonly.yml']
permissions:
  contents: read
jobs:
  public-keys-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read only untrusted PUBLIC SSH host keys; do not authenticate
        run: |
          set -euo pipefail
          for row in "ssh9.vast.ai 26623 PROXY" "166.113.48.41 11234 DIRECT"; do
            read -r host port label <<< "$row"
            file="$(mktemp)"
            ssh-keyscan -T 7 -t ed25519 -p "$port" "$host" 2>/dev/null > "$file" || true
            if [[ -s "$file" ]]; then
              result="$(ssh-keygen -lf "$file" -E sha256 2>/dev/null | head -n 1 || true)"
              if [[ -n "$result" ]]; then
                fingerprint="$(awk '{print $2}' <<< "$result")"
                algo="$(awk '{print $4}' <<< "$result")"
                echo "NOX_V136_SSH_PUBLIC_HOSTKEY_$label=OBSERVED"
                echo "NOX_V136_SSH_FINGERPRINT_$label=$fingerprint"
                echo "NOX_V136_SSH_HOSTKEY_ALGO_$label=$algo"
              else
                echo "NOX_V136_SSH_PUBLIC_HOSTKEY_$label=HOLD_KEY_PARSE"
              fi
            else
              echo "NOX_V136_SSH_PUBLIC_HOSTKEY_$label=HOLD_SCAN_NO_KEY"
            fi
            rm -f "$file"
          done
          echo 'NOX_V136_NO_REMOTE_LOGIN=true'
          echo 'NOX_V136_NO_SERVER_OR_SECRET_CHANGES=true'
