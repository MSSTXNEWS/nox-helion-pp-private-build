name: NOX memory governor source acceptance
on:
  pull_request:
    paths:
      - 'nox-control/owner_memory_governor.py'
      - 'nox-control/test_owner_memory_governor.py'
      - '.github/workflows/nox-memory-governor-ci.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile + bounded cgroup fixtures, no host mutation
        run: |
          python -m py_compile nox-control/owner_memory_governor.py nox-control/test_owner_memory_governor.py
          python -m unittest discover -s nox-control -p test_owner_memory_governor.py -v
