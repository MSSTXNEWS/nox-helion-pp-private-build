name: NOX V124 independent post-activation original S03 chat and 92-route acceptance
on:
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
  push:
    branches: [nox/v124-owner-v29-combined-20261115]
    paths:
      - '.github/workflows/nox-v124-one-shot-postdeploy-qa.yml'
permissions:
  contents: read
concurrency:
  group: nox-v124-independent-live-qa-60509551
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify current SHA pins and no-write inventory source
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v122/immutable_live_web_audit.py nox_runpod/teacher_mesh/v114/owner_v29_dialog_acceptance.py
          python -m unittest -v nox_runpod.teacher_mesh.v122.test_immutable_live_web_audit
          python - <<'PY'
          from nox_runpod.teacher_mesh.v114.owner_v29_dialog_acceptance import REMOTE
          source=REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0]
          compile(source,'<v114-native-owner>','exec')
          assert "BRIDGE_SHA='cc27928b38f9b86d2375de8092d09dbdc34f81c6e51e8a68d36041ee71529750'" in source
          assert 'HOLD_FULL_S03_DIALOG_STREAM_RECEIPT' in source
          print('NOX_V124_POST_ACTIVATION_QA_SOURCE_PASS=true')
          PY
  native_readonly:
    needs: source
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Independent live V122 current bridge/proxy/S03/route readback
        run: |
          test -n "$NOX2" || { echo 'HOLD_NOX2'; exit 2; }
          python -m nox_runpod.teacher_mesh.v122.immutable_live_web_audit
      - name: Revoke temp SSH key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
  native_owner_dialog_e2e:
    needs: native_readonly
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Physical owner cookie -> real stream -> existing S03 dialog readback
        run: |
          test -n "$NOX2" || { echo 'HOLD_NOX2'; exit 2; }
          python -m nox_runpod.teacher_mesh.v114.owner_v29_dialog_acceptance
      - name: Always remove temporary SSH identity
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
