name: NOX NX03 bounded first-cycle source test (Windows)

on:
  push:
    branches:
      - integration/nox-v16-unified-candidate-20261028-r01
    paths:
      - src/nox_selfbuilder/firstcycle_native.py
      - src/nox_selfbuilder/nx03_model_firstcycle.py
      - src/nox_selfbuilder/onehost_builder.py
      - tests/test_selfwrite_firstcycle_native.py
      - tests/test_nx03_model_firstcycle.py
      - tests/test_nx03_onehost_owner.py
      - .github/workflows/nox-nx03-firstcycle-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nx03-native-sandbox-cycle:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout immutable current commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Test real sandbox write and rollback on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B -m unittest discover -s tests -p test_selfwrite_firstcycle_native.py -v
          if ($LASTEXITCODE -ne 0) { throw 'NX03_FIRSTCYCLE_WINDOWS_SOURCE_TEST_HOLD' }
          python -B -m unittest discover -s tests -p test_nx03_model_firstcycle.py -v
          if ($LASTEXITCODE -ne 0) { throw 'NX03_P02_TO_NATIVE_CYCLE_SOURCE_HOLD' }
          python -B -m unittest discover -s tests -p test_nx03_onehost_owner.py -v
          if ($LASTEXITCODE -ne 0) { throw 'NX03_ONEHOST_OWNER_WIRING_HOLD' }
          Write-Host 'NX03_WINDOWS_MODEL_BRIDGE_AND_ONEHOST_CONTRACT_PASS_ONLY_NOT_INSTALLED_NOX'
