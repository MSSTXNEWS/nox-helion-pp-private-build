name: NOX owner maintenance - explicit command only
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: nox-v51-vast60509551-temp-ssh
  cancel-in-progress: false
jobs:
  owner-maintenance:
    if: >-
      github.repository == 'MSSTXNEWS/nox-helion-pp-private-build' &&
      github.actor == 'MSSTXNEWS' &&
      github.event.sender.id == 340718567 &&
      github.event.comment.user.id == 340718567 &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.issue.number == 256 &&
      startsWith(github.event.comment.body, '/nox-maintain 60509551 ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate exact manual request without credentials or shell interpolation
        id: request
        run: |
          python3 - <<'PY'
          import json,os,re
          e=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          m=re.fullmatch(r'/nox-maintain 60509551 ([0-9a-f]{40}) (audit|inspect|stage|repair|lifeline|emergency_stop|deploy|backup|memfd_audit)',e['comment']['body'])
          assert m, 'Invalid bounded maintenance command'
          assert e['comment']['user']['id']==340718567 and e['sender']['id']==340718567
          assert e['repository']['owner']['id']==340718567 and e['issue']['number']==256
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('sha='+m[1]+'\naction='+m[2]+'\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.request.outputs.sha }}
          persist-credentials: false
      - name: Validate exact reviewed checkout SHA before credentials
        env:
          NOX_PINNED_SOURCE_SHA: ${{ steps.request.outputs.sha }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          sha=os.environ['NOX_PINNED_SOURCE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}',sha): raise SystemExit('HOLD_SOURCE_PIN')
          if subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()!=sha:
              raise SystemExit('HOLD_CHECKOUT_MISMATCH')
          PY
      - name: Validate reviewed checkout syntax before credentials
        env:
          NOX_ACTION: ${{ steps.request.outputs.action }}
        run: |
          python3 - <<'PY'
          import os,py_compile
          from pathlib import Path
          a=os.environ['NOX_ACTION']
          assert a in ('audit','inspect','stage','repair','lifeline','emergency_stop','deploy','backup','memfd_audit')
          py_compile.compile('nox-control/owner_native_operator.py',doraise=True)
          if a=='backup':
              for name in ('owner_cp55_cipher','owner_cp55_scope','owner_cp55_native','owner_cp55_runner','auth_prefix_reuse'):
                  py_compile.compile('nox-control/'+name+'.py',doraise=True)
          elif a=='memfd_audit':
              py_compile.compile('nox-control/owner_native_memfd_audit.py',doraise=True)
          else:
              source=('nox-control/owner_native_lifeline_observer.py' if a=='lifeline'
                      else 'nox-control/owner_native_'+a+'.py')
              py_compile.compile(source,doraise=True)
          PY
      - name: Validate encrypted backup dependency before credentials
        if: steps.request.outputs.action == 'backup'
        run: |
          if ! /usr/bin/python3 -c 'import cryptography'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-cryptography
          fi
          /usr/bin/python3 -m unittest discover -s nox-control -p test_owner_cp55_cipher.py -v
      - name: Execute only this owner-approved original-instance operation
        env:
          NOX2: ${{ secrets.NOX2 }}
          NOX_PINNED_SOURCE_SHA: ${{ steps.request.outputs.sha }}
          NOX_ACTION: ${{ steps.request.outputs.action }}
        run: |
          if [ "$NOX_ACTION" = "backup" ]; then
            /usr/bin/python3 nox-control/owner_cp55_runner.py
          else
            python3 nox-control/owner_native_operator.py "$NOX_ACTION"
          fi
      - name: Always detach only this run temporary public key
        if: always()
        env:
          NOX2: ${{ secrets.NOX2 }}
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Upload authenticated encrypted part 000
        if: success() && steps.request.outputs.action == 'backup' && hashFiles('artifacts/cp55-s03-cipher/EXPORT_VERIFIED.json') != '' && hashFiles('artifacts/cp55-s03-cipher/cp55-s03.cipher.part000') != ''
        uses: actions/upload-artifact@v4
        with:
          name: NOX_CP55_S03_${{ github.run_id }}_PART_000
          path: artifacts/cp55-s03-cipher/cp55-s03.cipher.part000
          compression-level: 0
          retention-days: 7
