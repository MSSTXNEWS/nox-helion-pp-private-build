name: NOX B5 R82 typed failed poststate
on:
  pull_request:
    paths:
      - 'nox-control/b5-r82/**'
      - '.github/workflows/nox-b5-r82-typed-failure.yml'
permissions:
  contents: read
jobs:
  typed-failure:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact failed poststate regression (no native access)
        shell: bash
        run: |
          set -euo pipefail
          ref=4eafa7701e4e3e01c4fc3ecb0cd360054dd9deb3
          git fetch --no-tags --depth=1 origin "$ref"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          git show "$ref:nox-control/b5_s03_verifier_r54.py" > "$tmp/b5_r55_pinned.py"
          test "$(git hash-object "$tmp/b5_r55_pinned.py")" = df94c535273dde1fd2609f555d1d615eacfda831
          load() { test "$(git hash-object "$1")" = "$2"; cp "$1" "$tmp/"; }
          load nox-control/b5-r63/b5_chain_guard.py f321f4ad36867e434ba72db9264a88cf23a91fb8
          load nox-control/b5-r63/test_b5_chain_guard.py 96fa30430ac2a9027eec0a2a0ef9b39c670c55dd
          load nox-control/b5-r66/b5_failed_poststate.py 381a738e54bdb1bba874ee8e0295c957e92b68b5
          load nox-control/b5-r67/b5_bound_failed_poststate.py 878128ef41095f8bf0d14a02281148e96e4a6ba3
          load nox-control/b5-r68/b5_receipted_failed_poststate.py c6181ce7a16f787b4b68b2507150c6990da2ef83
          load nox-control/b5-r69/b5_strict_receipted_poststate.py e2997a136b47f06d47eba519e4cd6a87f1c68fb0
          cp nox-control/b5-r82/*.py "$tmp/"
          cd "$tmp"
          python3 -B -m unittest -v test_typed_failed_poststate
