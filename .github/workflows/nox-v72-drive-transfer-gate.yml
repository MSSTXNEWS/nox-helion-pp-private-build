name: NOX V72 Drive authenticated-transfer prerequisite (public read probe only)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v72-drive-transfer-gate.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe a single small already-owned Drive donor WITHOUT authentication
        run: |
          python3 - <<'PY'
          import hashlib,urllib.request,urllib.error
          file_id='16mdR4bXV5vYOFxjOGBwZWPxwgDJimmwL'
          expect='ef726288e494c505f6990bd883bade34d200269d438aceca5fb11fe7f9575598'
          url='https://drive.google.com/uc?export=download&id='+file_id
          try:
              request=urllib.request.Request(url,headers={'User-Agent':'NOX-Transfer-Preflight/1.0'})
              with urllib.request.urlopen(request,timeout=15) as response:
                  ct=response.headers.get('Content-Type','')
                  data=response.read(300000)
              valid=(len(data)==187963 and hashlib.sha256(data).hexdigest()==expect)
              print('NOX_DRIVE_UNAUTHENTICATED_SHA_MATCH='+str(valid).lower())
              print('NOX_DRIVE_CONTENT_ZIP_CANDIDATE='+str('zip' in ct.lower() or data[:2]==b'PK').lower())
              print('NOX_ARCHIVE_TRANSFER_TO_VAST_ATTEMPTED=false')
              if not valid:print('NOX_TRANSFER_GATE=HOLD_GOOGLE_DRIVE_AUTH_REQUIRED')
          except (OSError,urllib.error.HTTPError,TimeoutError):
              print('NOX_TRANSFER_GATE=HOLD_GOOGLE_DRIVE_AUTH_REQUIRED')
          PY
