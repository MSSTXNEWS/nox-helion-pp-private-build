name: NOX V56 one real local main-model streaming smoke
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v56-native-main-chat-smoke.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v56-main-model-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python source syntax
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py nox_runpod/teacher_mesh/v56/fast_chat_smoke.py
      - name: One native model streaming test and existing route metadata
        run: |
          python3 -m nox_runpod.teacher_mesh.v56.fast_chat_smoke
      - name: Mandatory SSH key detach
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Preserve inference audit boundary
        if: success()
        run: |
          echo "ONE_REAL_MAIN_MODEL_PROMPT_ATTEMPTED=true"
          echo "S03_TTFT_NOT_MEASURED=true"
          echo "NOX_WEIGHTS_UNCHANGED=true"
          echo "NOX_CHAT_HISTORY_UNCHANGED=true"
          echo "NOX_GENESIS_V1_1_MAIN_MODEL_INFERENCE_VERIFIED_BY_NATIVE_RECEIPT=true"
