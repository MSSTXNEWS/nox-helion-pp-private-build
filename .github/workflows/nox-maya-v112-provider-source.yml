name: NOX V112 Maya provider source tests
on:
  push:
    branches:
      - codex/nox-maya-v112-provider-05ad-20261116
    paths:
      - 'nox_runpod/teacher_mesh/v112/maya_openai_provider.py'
      - 'nox_runpod/teacher_mesh/v112/tests/test_maya_openai_provider.py'
      - '.github/workflows/nox-maya-v112-provider-source.yml'
  pull_request:
    paths:
      - 'nox_runpod/teacher_mesh/v112/maya_openai_provider.py'
      - 'nox_runpod/teacher_mesh/v112/tests/test_maya_openai_provider.py'
      - '.github/workflows/nox-maya-v112-provider-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies, never production
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Compile and run isolated V112 source tests
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v112/maya_openai_provider.py
          python -m py_compile nox_runpod/teacher_mesh/v112/tests/test_maya_openai_provider.py
          python -m unittest discover -s nox_runpod/teacher_mesh/v112/tests -p 'test_*.py' -v
      - name: Mark runtime boundary
        run: |
          echo 'SOURCE_TESTED_ONLY=true'
          echo 'MAYA_PROCESS_LAUNCHED=false'
          echo 'GPU_OR_MODEL_TESTED=false'
