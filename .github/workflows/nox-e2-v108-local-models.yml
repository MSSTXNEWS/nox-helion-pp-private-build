name: NOX V108 existing local teacher capability inventory
on:
  push:
    branches: [nox/e2-v108-teacher-corpus-repair-20261114]
    paths: ['.github/workflows/nox-e2-v108-local-models.yml']
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v108-teacher-readonly-60509551
  cancel-in-progress: false
jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Existing key and syntax
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOX2"
          python3 -m py_compile nox_runpod/teacher_mesh/v108/local_endpoint_inventory.py
      - name: Physical read-only local teacher discovery
        run: python3 -m nox_runpod.teacher_mesh.v108.local_endpoint_inventory
      - name: Revoke one-time SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
