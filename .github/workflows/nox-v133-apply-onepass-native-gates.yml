name: NOX V133 atomic source-only native workflow collision repair
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nox-v133-source-only-single-commit-gates
  cancel-in-progress: false
jobs:
  guarded-source-write:
    if: false # Historical one-shot evidence; preserved but intentionally disabled
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only pinned YAML parser in ephemeral runner
        run: python -m pip install -q PyYAML==6.0.2
      - name: Verify source rewriter and reject malformed workflow YAML
        run: |
          set -euo pipefail
          python -m unittest -v coordination.onepass.test_native_job_gate_audit coordination.onepass.test_native_job_gate_autofix
          python -m coordination.onepass.native_job_gate_autofix --root . --out nox_v133_preflight.json
          git diff --exit-code -- .github/workflows/
      - name: Source-only onepass gate edit and strict full-workflow validation
        shell: bash
        run: |
          set -euo pipefail
          python -m coordination.onepass.native_job_gate_autofix --root . --apply --out nox_v133_accepted.json
          python -m coordination.onepass.native_job_gate_audit --root . --strict
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('nox_v133_preflight.json').read_text())
          after=json.loads(Path('nox_v133_accepted.json').read_text())
          assert after['applied'] is True
          assert after['unsafe_jobs_remaining']==0
          assert after['changed_files']==before['changed_files']
          assert after['unsafe_jobs_before']==before['unsafe_jobs_before']
          assert after['source_diff_sha256']==before['source_diff_sha256']
          assert after['original_model_or_s03_touched'] is False
          print('NOX_V133_NATIVE_OWNER_GATES_ZERO_UNSAFE=PASS')
          print('NOX_V133_CORRECTED_WORKFLOWS='+str(after['changed_files']))
          PY
          git diff --check
          git add .github/workflows/
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths and len(paths)>=100
          assert all(p.startswith('.github/workflows/nox-') and p.endswith(('.yml','.yaml')) for p in paths)
          print('NOX_V133_ONLY_GITHUB_ACTIONS_UPDATED=true')
          PY
      - name: Exactly one source commit on dedicated nonproduction branch
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='NOX Source Safety' -c user.email='actions@users.noreply.github.com' commit -m 'safety(nox): require owner YES for all 121 legacy auto-native OneHost jobs'
          git push origin HEAD:refs/heads/nox/e2-v133-native-workflow-single-gate-20261115
          echo 'NOX_V133_ATOMIC_SOURCE_BRANCH_COMMIT=PASS'
          echo 'NOX_V133_NO_VAST_REQUESTS=true'
          echo 'NOX_V133_NO_S03_OR_MODEL_WEIGHTS_CHANGED=true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOX_V133_ONEPASS_NATIVE_WORKFLOW_GATES_EVIDENCE
          path: |
            nox_v133_preflight.json
            nox_v133_accepted.json
          if-no-files-found: warn
          retention-days: 30
