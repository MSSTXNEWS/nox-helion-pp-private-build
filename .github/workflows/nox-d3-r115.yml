name: D3 R115 extracted joint staging
on:
  pull_request:
    paths: ['nox-control/d3-r115/**', '.github/workflows/nox-d3-r115.yml']
permissions:
  contents: read
  actions: read
jobs:
  extracted-joint:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'd3-r113-joint-release-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/checkout@v4
        with:
          ref: 12bfae6b332ac49aa5fa2201c2c728847caa03b2
          path: r115-donors/a6
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a06aa8581229bcc98d49a6d1d0be36adbcfe748b
          path: r115-donors/a3
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ff285d579a3594018d82eca375c36cda8ceba13b
          path: r115-donors/b3
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b96cc7a6cc42279ae59cf82b97e8fe8278115344
          path: r115-donors/b4
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 03299290104690a5523037bf862c4a2d172fad22
          path: r115-donors/b2
          persist-credentials: false
      - name: Compose original extracted release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/14989839885/zip" > "$RUNNER_TEMP/a6-exact.zip"
          python3 -B nox-control/d3-r115/stage_joint.py "$RUNNER_TEMP/a6-exact.zip" "$RUNNER_TEMP/r115-extracted" "$PWD/r115-donors"
