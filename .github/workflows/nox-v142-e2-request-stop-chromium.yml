name: NOX V142 original owner Request Chromium + S03 STOP source QA
on:
  push:
    branches: [fix/nox-e2-v142-s03-stop-20261115]
    paths:
      - '.github/workflows/nox-v142-e2-request-stop-chromium.yml'
      - 'nox_runpod/teacher_mesh/v130/**'
      - 'coordination/onepass/nox-v135-resonance-owner-bridge.js'
  pull_request:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - '.github/workflows/nox-v142-e2-request-stop-chromium.yml'
      - 'nox_runpod/teacher_mesh/v130/**'
      - 'coordination/onepass/nox-v135-resonance-owner-bridge.js'
permissions:
  contents: read
concurrency:
  group: nox-v142-owner-request-s03-source-only
  cancel-in-progress: false
jobs:
  chromium-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Re-run upstream V135/V136 independent Node and source NO-LOSS gates
        shell: bash
        run: |
          set -euo pipefail
          node --check coordination/onepass/nox-v135-resonance-owner-bridge.js
          node --test coordination/onepass/test_v135_resonance_owner_bridge.cjs
          python3 -m unittest -v coordination.onepass.test_v135_resonance_owner_stage
      - name: Original S03 fact writer STOP, pagination and owner security tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q fastapi==0.128.2 httpx==0.28.1
          python3 -m unittest discover -s nox_runpod/teacher_mesh/v130/tests -p 'test_*.py' -v
          echo 'NOX_V142_S03_TEST_FIXTURE_ONLY=true'
      - name: Run V142 Chromium browser on owner-scoped original V24 URL (mocked native callbacks)
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || { echo 'HOLD_NO_CHROMIUM_BROWSER'; exit 2; }
          cat > "$RUNNER_TEMP/nox-v142-browser-server.py" <<'PY'
          import http.server
          from pathlib import Path
          from urllib.parse import urlsplit

          JS_PATH=Path('coordination/onepass/nox-v135-resonance-owner-bridge.js')
          assert JS_PATH.is_file(), 'HOLD_V135_BRIDGE_NOT_FOUND'
          html=r'''<!doctype html>
          <html lang="ru"><head><meta charset="utf-8"><title>NOX V142 real Chromium test</title></head>
          <body><div id="result">TEST_PENDING</div>
          <script>
          const scenario = new URLSearchParams(location.search).get('case');
          const ownerId='abcd1234abcd1234abcd1234abcd1234';
          const promptText='Привет, NOX';
          const modelText='Реальный ответ тестового потока';
          const encoder=new TextEncoder();
          window.NOX_NATIVE_OWNER=(scenario!=='unauth');
          // Simulate a suspended background tab: rAF callbacks never fire.
          if(scenario==='rafblocked')window.requestAnimationFrame=()=>0;
          window.nativeProof={paths:[],signal:null,aborted:false,historyCalls:0};
          window.fetch=async function nativeFixture(input,options={}) {
            const path=new URL(String(input),location.href).pathname;
            window.nativeProof.paths.push(path);
            if(path==='/api/nox/chat/stream'){
              window.nativeProof.signal=options.signal;
              const body=new ReadableStream({
                start(control) {
                  if(options.signal?.aborted){control.error(new DOMException('Aborted','AbortError'));return;}
                  options.signal?.addEventListener('abort',()=>{
                    window.nativeProof.aborted=true;
                    try{control.error(new DOMException('Aborted','AbortError'));}catch{}
                  },{once:true});
                  // Original V112 OneHost sends preparing, then start, before first delta.
                  control.enqueue(encoder.encode(JSON.stringify({type:'preparing',stream_mode:'NATIVE_TOKEN_STREAM'})+'\n'));
                  control.enqueue(encoder.encode(JSON.stringify({type:'start',model:'NOX HELION'})+'\n'));
                  control.enqueue(encoder.encode(JSON.stringify({type:'delta',text:modelText})+'\n'));
                  if(scenario==='full'||scenario==='reject'||scenario==='rafblocked'){
                    setTimeout(()=>{
                      if(options.signal?.aborted)return;
                      control.enqueue(encoder.encode(JSON.stringify({
                        type:'done',saved:scenario!=='reject',s03_integrated:true,
                        dialog_id:ownerId,exchange_id:'v142-e2-browser-proof-01'
                      })+'\n'));
                      control.close();
                    },30);
                  }
                }
              });
              return new Response(body,{headers:{'Content-Type':'application/x-ndjson'}});
            }
            if(path==='/api/ui/memory/dialogs/history'){
              window.nativeProof.historyCalls++;
              return Response.json({status:'READY',dialog_id:ownerId,messages:[
                {role:'user',content:promptText,exchange_id:'v142-e2-browser-proof-01'},
                {role:'assistant',content:modelText,exchange_id:'v142-e2-browser-proof-01'}
              ]});
            }
            return new Response('NO_OWNER_ROUTE',{status:418});
          };
          </script>
          <script src="/coordination/onepass/nox-v135-resonance-owner-bridge.js"></script>
          <script>
          const assert=(yes,msg)=>{if(!yes)throw Error(msg);};
          const begin=()=>window.fetch(new Request(location.origin+'/api/nox/chat',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({message:promptText,dialog_id:ownerId,request_id:'v142-browser-01'})
          }));
          async function parseEvents(response) {
            const reader=response.body.getReader();
            let text='',frames=[];
            for(;;) {
              const chunk=await reader.read();
              if(chunk.done)break;
              text+=new TextDecoder().decode(chunk.value);
              let idx;
              while((idx=text.indexOf('\n\n'))!==-1){
                const item=text.slice(0,idx);text=text.slice(idx+2);
                if(item.startsWith('data: '))frames.push(JSON.parse(item.slice(6)));
              }
            }
            return frames;
          }
          async function run() {
            if(scenario==='unauth') {
              assert(!window.__NOX_V135_OWNER_RESONANCE,'owner gate bypass');
              const reply=await begin();
              assert(reply.status===418,'anonymous request was intercepted');
              assert(!window.nativeProof.paths.includes('/api/nox/chat/stream'),'anonymous native stream');
            }else if(scenario==='cancel') {
              assert(window.__NOX_V135_OWNER_RESONANCE==='OWNER_NATIVE_ONLY','missing owner bridge');
              const reply=await begin();
              const rd=reply.body.getReader();
              assert((await rd.read()).value,'meta not delivered');
              assert((await rd.read()).value,'first native delta not streamed');
              await rd.cancel('browser user closed reader');
              await new Promise(resolve=>setTimeout(resolve,60));
              assert(window.nativeProof.aborted,'downstream cancel did not abort native fetch');
              assert(window.nativeProof.signal?.aborted===true,'native AbortSignal not aborted');
              assert(window.nativeProof.historyCalls===0,'history read after user cancel');
              assert(!window.nativeProof.paths.includes('/api/nox/stop'),'global STOP incorrectly triggered');
            }else if(scenario==='preabort') {
              const ac=new AbortController();ac.abort();
              const response=await window.fetch(new Request(location.origin+'/api/nox/chat',{method:'POST',signal:ac.signal,
                body:JSON.stringify({message:promptText,dialog_id:ownerId,request_id:'v142-preabort'})}));
              const events=await parseEvents(response);
              assert(events.some(e=>e.type==='error'&&e.error==='STREAM_STOP_REQUESTED'),'no cancel error');
              assert(!events.some(e=>e.type==='done'),'false done on aborted request');
              assert(!window.nativeProof.paths.includes('/api/nox/chat/stream'),'inference began after abort');
            }else if(scenario==='full'||scenario==='reject'||scenario==='rafblocked') {
              const response=await begin();
              assert(response.headers.get('Content-Type')==='text/event-stream','wrong SSE header');
              const events=await parseEvents(response);
              assert(events[0]?.type==='meta','missing meta');
              const tokens=events.filter(e=>e.type==='token').map(e=>e.t).join('');
              assert(tokens===modelText,'lost/duplicated/fake model text');
              if(scenario==='full'||scenario==='rafblocked'){
                assert(events.filter(e=>e.type==='done').length===1,'missing/duplicate done');
                assert(events.at(-1)?.history_persisted===true,'false S03 readback');
                assert(window.nativeProof.historyCalls===1,'original S03 history not reread');
              }else{
                assert(!events.some(e=>e.type==='done'),'false done despite rejected S03');
                assert(events.some(e=>e.type==='error'),'no fail-closed error');
                assert(window.nativeProof.historyCalls===0,'history queried on rejected receipt');
              }
            }else throw Error('unknown scenario');
            document.querySelector('#result').textContent='NOX_V142_CHROMIUM_PASS:'+scenario;
          }
          run().catch(error=>{
            document.querySelector('#result').textContent='NOX_V142_CHROMIUM_FAIL:'+scenario+':'+String(error.message).slice(0,150);
          });
          </script></body></html>'''
          class Handler(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
              path=urlsplit(self.path).path
              if path=='/nox-web-v29/pc/resonance.html':
                body=html.encode('utf-8')
                mime='text/html; charset=utf-8'
              elif path=='/coordination/onepass/nox-v135-resonance-owner-bridge.js':
                body=JS_PATH.read_bytes()
                mime='text/javascript; charset=utf-8'
              else:
                self.send_error(404)
                return
              self.send_response(200)
              self.send_header('Content-Type',mime)
              self.send_header('Cache-Control','no-store')
              self.send_header('Content-Length',str(len(body)))
              self.end_headers()
              self.wfile.write(body)
            def log_message(self,*args):
              pass
          http.server.ThreadingHTTPServer(('127.0.0.1',18783),Handler).serve_forever()
          PY
          python3 "$RUNNER_TEMP/nox-v142-browser-server.py" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS 'http://127.0.0.1:18783/nox-web-v29/pc/resonance.html' >/dev/null;then break;fi
            sleep 0.25
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          for scenario in unauth cancel preabort full reject rafblocked; do
            out="$RUNNER_TEMP/nox-v142-$scenario.html"
            timeout 45s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --no-first-run --disable-extensions --virtual-time-budget=3500 --dump-dom \
              "http://127.0.0.1:18783/nox-web-v29/pc/resonance.html?case=$scenario" \
              > "$out" 2> "$RUNNER_TEMP/nox-v142-chrome-$scenario.log" || {
                echo "::error::HOLD_CHROME_RUNTIME_$scenario"
                tail -n 8 "$RUNNER_TEMP/nox-v142-chrome-$scenario.log"
                exit 2
              }
            if ! grep -Fq "NOX_V142_CHROMIUM_PASS:$scenario" "$out";then
              echo "::error::HOLD_CHROMIUM_CONTRACT_$scenario"
              grep -o '<div id="result">[^<]*</div>' "$out" | tail -n 1 || true
              exit 2
            fi
            echo "NOX_V142_REAL_CHROMIUM_$scenario=PASS"
          done
      - name: Explicit proof boundary
        if: success()
        run: |
          echo "NOX_V142_REAL_CHROMIUM_REQUEST_CASES=6"
          echo "NOX_V142_ORIGINAL_V24_URL_PATH=true"
          echo "NOX_V142_V134_HTML_FROM_ARCHIVE=false"
          echo "NOX_V142_NATIVE_BACKEND_FIXTURE_ONLY=true"
          echo "NOX_V142_VAST_NATIVE_DEPLOYED=false"
          echo "NOX_V142_ORIGINAL_S03_OR_GPU_CHANGED=false"
          echo "NOX_V142_WINDOWS_PHYSICAL_VERIFIED=false"
