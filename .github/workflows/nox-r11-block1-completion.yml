name: NOX R11 Block1 Completion - pinned Ollama and WebView2 evidence
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/nox-r11-block1-completion.yml'
      - 'coordination/wow-exec-v1/downloads/fetch-official-ollama.py'
  push:
    branches: [integration/nox-v16-unified-candidate-20261028-r01]
    paths:
      - '.github/workflows/nox-r11-block1-completion.yml'
      - 'coordination/wow-exec-v1/downloads/fetch-official-ollama.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ollama:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned official Ollama 1.676GB and SHA - NEVER EXECUTE
        shell: pwsh
        env:
          NOX_OLLAMA_BLOCK1_OUT: '${{ runner.temp }}\nox-r11-ollama'
        run: |
          python coordination/wow-exec-v1/downloads/fetch-official-ollama.py
      - name: Upload Ollama bytes plus receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-r11-official-ollama-${{ github.run_id }}
          path: ${{ runner.temp }}\nox-r11-ollama
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
  signatures:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nox-r11-block1-download-41324187733
          run-id: 41324187733
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}\nox-r11-from-first-run
      - name: Validate exact WebView2 bytes and Microsoft Authenticode
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'nox-r11-from-first-run'
          $out=Join-Path $env:RUNNER_TEMP 'nox-r11-webview2-proof'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $inputFile=Join-Path $root 'official\MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          $expected='62863f0f0611a16ccf124b4f15650c3b66624504eba74d7cde1e2ae5d951249b'
          $actual=(Get-FileHash -LiteralPath $inputFile -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=Join-Path $PSHOME 'Modules\Microsoft.PowerShell.Security\Microsoft.PowerShell.Security.psd1'
          if(Test-Path -LiteralPath $manifest -PathType Leaf){Import-Module -Name $manifest -ErrorAction Stop}
          $sig=Get-AuthenticodeSignature -LiteralPath $inputFile -ErrorAction Stop
          $signer=if($sig.SignerCertificate){[string]$sig.SignerCertificate.Subject}else{''}
          $pass=$actual -ceq $expected -and [string]$sig.Status -ceq 'Valid' -and $signer -match 'Microsoft Corporation'
          $receipt=@{schema='NOX-R11-WEBVIEW2-OFFICIAL-SHA-SIGNATURE';status=if($pass){'VERIFIED_SIGNED_MICROSOFT'}else{'HOLD'};sha256=$actual;expected_sha256=$expected;signer=$signer;signature_status=[string]$sig.Status;source_run=41324187733;installed=$false;merged=$false}
          $receipt | ConvertTo-Json -Depth 3 | Set-Content (Join-Path $out 'webview2-signature.json') -Encoding utf8
          if(-not $pass){throw 'WEBVIEW2_SIGNATURE_OR_SHA_HOLD'}
      - name: Upload small exact signature proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-r11-webview2-proof-${{ github.run_id }}
          path: ${{ runner.temp }}\nox-r11-webview2-proof
          retention-days: 14
          if-no-files-found: warn
  nuget_closure:
    # BLOCK1-only: one authorised Windows download/verify job, no installer or product changes.
    if: github.event_name == 'push'
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - name: Reuse previously downloaded pinned root NuGet without redownloading binaries
        uses: actions/download-artifact@v4
        with:
          name: nox-r11-block1-download-41324187733
          run-id: 41324187733
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}\\nox-block1-prior
      - name: Restore complete signed NuGet closure and create exact SHA receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $out = Join-Path $env:RUNNER_TEMP 'nox-block1-nuget-closure'
          $cache = Join-Path $out 'nuget-packages'
          $feed = Join-Path $out 'root-feed'
          $probe = Join-Path $out '_disposable-restore-probe'
          $source = 'https://api.nuget.org/v3/index.json'
          $expected = 'ee0c5218ded2dff2b5a40bd2fd15a5d91ae66fc612ab1ad0b9c66bf13fc6193a'
          $version = '1.8.260921001'
          $receipt = [ordered]@{schema='NOX-EFINAL-BLOCK1-NUGET-CLOSURE-v2'; status='HOLD'; scope='DOWNLOAD_VERIFY_ONLY'; installed=$false; merged=$false; sourceRun=41324187733; officialNugetSource=$source; rootVersion=$version; expectedRootSha256=$expected; packages=@(); requiredDirect=@(); error=$null}
          New-Item -ItemType Directory -Path $feed,$probe,$cache -Force | Out-Null
          try {
            $original = Join-Path $env:RUNNER_TEMP 'nox-block1-prior\\official\\microsoft.windowsappsdk.1.8.260921001.nupkg'
            if(!(Test-Path -LiteralPath $original -PathType Leaf)) {throw 'PINNED_ORIGINAL_ARTIFACT_NOT_FOUND'}
            $root = Join-Path $feed 'microsoft.windowsappsdk.1.8.260921001.nupkg'
            Copy-Item -LiteralPath $original -Destination $root
            $rootSha = (Get-FileHash -LiteralPath $root -Algorithm SHA256).Hash.ToLowerInvariant()
            if($rootSha -cne $expected){throw 'ROOT_SHA256_MISMATCH'}
            $receipt.rootSha256 = $rootSha
            $receipt.rootBytes = (Get-Item -LiteralPath $root).Length
            & dotnet nuget verify --all $root
            if($LASTEXITCODE -ne 0){throw 'ROOT_NUGET_SIGNATURE_VERIFY_FAILED'}
            $project = @'
          <Project Sdk="Microsoft.NET.Sdk.WindowsDesktop">
            <PropertyGroup>
              <TargetFramework>net8.0-windows10.0.19041.0</TargetFramework>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
              <UseWPF>true</UseWPF>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.WindowsAppSDK" Version="1.8.260921001" />
            </ItemGroup>
          </Project>
          '@
            [IO.File]::WriteAllText((Join-Path $probe 'Block1Restore.csproj'),$project,(New-Object Text.UTF8Encoding($false)))
            $nugetConfig = Join-Path $probe 'NuGet.Config'
            $feedEscaped = [System.Security.SecurityElement]::Escape($feed)
            $configXml = '<configuration><packageSources><clear/><add key="pinned-root" value="' + $feedEscaped + '"/><add key="nuget-org" value="https://api.nuget.org/v3/index.json" protocolVersion="3"/></packageSources></configuration>'
            [IO.File]::WriteAllText($nugetConfig,$configXml,(New-Object Text.UTF8Encoding($false)))
            & dotnet restore (Join-Path $probe 'Block1Restore.csproj') --packages $cache --configfile $nugetConfig --disable-parallel --force --verbosity minimal
            if($LASTEXITCODE -ne 0){throw 'OFFICIAL_NUGET_RESTORE_FAILED'}
            $required = @{
              'microsoft.windowsappsdk.base'='1.8.251216001'
              'microsoft.windowsappsdk.foundation'='1.8.260803002'
              'microsoft.windowsappsdk.interactiveexperiences'='1.8.260708001'
              'microsoft.windowsappsdk.winui'='1.8.260803003'
              'microsoft.windowsappsdk.dwrite'='1.8.25122902'
              'microsoft.windowsappsdk.widgets'='1.8.251231004'
              'microsoft.windowsappsdk.ai'='1.8.79'
              'microsoft.windowsappsdk.ml'='1.8.2223'
              'microsoft.windowsappsdk.runtime'='1.8.260921001'
            }
            foreach($id in ($required.Keys|Sort-Object)){
              $ver=$required[$id]
              $fn=Join-Path $cache "$id\\$ver\\$id.$ver.nupkg"
              if(!(Test-Path -LiteralPath $fn -PathType Leaf)){throw "DIRECT_NUGET_DEPENDENCY_MISSING:$id/$ver"}
              $receipt.requiredDirect+= "$id/$ver"
            }
            $all = @(Get-ChildItem -LiteralPath $cache -Recurse -Filter '*.nupkg' -File | Sort-Object FullName)
            if($all.Count -lt 10){throw "TRANSITIVE_CLOSURE_TOO_SMALL:$($all.Count)"}
            foreach($p in $all){
              & dotnet nuget verify --all $p.FullName
              if($LASTEXITCODE -ne 0){throw "UNTRUSTED_NUGET_PACKAGE:$($p.Name)"}
              $rel=$p.FullName.Substring($cache.Length+1).Replace('\','/')
              $parts=$rel.Split('/')
              $url="https://api.nuget.org/v3-flatcontainer/$($parts[0])/$($parts[1])/$($p.Name)"
              $receipt.packages+= [ordered]@{path=$rel;bytes=$p.Length;sha256=(Get-FileHash -LiteralPath $p.FullName -Algorithm SHA256).Hash.ToLowerInvariant();verified='dotnet_nuget_verify_all_PASS';officialUrl=$url}
            }
            $receipt.packageCount=$all.Count
            $receipt.status='PASS_SIGNED_TRANSITIVE_CLOSURE'
          } catch {
            $receipt.status='HOLD'
            $receipt.error=$_.Exception.Message
          } finally {
            $receipt | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $out 'BLOCK1_NUGET_CLOSURE_RECEIPT.json') -Encoding utf8
            Write-Output "BLOCK1_STATUS=$($receipt.status); PACKAGES=$($receipt.packages.Count); ERROR=$($receipt.error)"
          }
          if($receipt.status -ne 'PASS_SIGNED_TRANSITIVE_CLOSURE'){exit 2}
      - name: Publish immutable closure packages and signed receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-e-final-block1-nuget-closure-${{ github.run_id }}
          path: ${{ runner.temp }}\\nox-block1-nuget-closure
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
