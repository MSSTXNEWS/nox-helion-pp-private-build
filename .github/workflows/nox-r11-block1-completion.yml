name: NOX R11 Block1 Completion - pinned Ollama and WebView2 evidence
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/nox-r11-block1-completion.yml'
      - 'coordination/wow-exec-v1/downloads/fetch-official-ollama.py'
  push:
    branches: [integration/nox-v16-unified-candidate-20261028-r01]
    paths:
      - '.github/workflows/nox-r11-block1-completion.yml'
      - 'coordination/wow-exec-v1/downloads/fetch-official-ollama.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ollama:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned official Ollama 1.676GB and SHA - NEVER EXECUTE
        shell: pwsh
        env:
          NOX_OLLAMA_BLOCK1_OUT: '${{ runner.temp }}\nox-r11-ollama'
        run: |
          python coordination/wow-exec-v1/downloads/fetch-official-ollama.py
      - name: Upload Ollama bytes plus receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-r11-official-ollama-${{ github.run_id }}
          path: ${{ runner.temp }}\nox-r11-ollama
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
  signatures:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nox-r11-block1-download-41324187733
          run-id: 41324187733
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}\nox-r11-from-first-run
      - name: Validate exact WebView2 bytes and Microsoft Authenticode
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'nox-r11-from-first-run'
          $out=Join-Path $env:RUNNER_TEMP 'nox-r11-webview2-proof'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $inputFile=Join-Path $root 'official\MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          $expected='62863f0f0611a16ccf124b4f15650c3b66624504eba74d7cde1e2ae5d951249b'
          $actual=(Get-FileHash -LiteralPath $inputFile -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=Join-Path $PSHOME 'Modules\Microsoft.PowerShell.Security\Microsoft.PowerShell.Security.psd1'
          if(Test-Path -LiteralPath $manifest -PathType Leaf){Import-Module -Name $manifest -ErrorAction Stop}
          $sig=Get-AuthenticodeSignature -LiteralPath $inputFile -ErrorAction Stop
          $signer=if($sig.SignerCertificate){[string]$sig.SignerCertificate.Subject}else{''}
          $pass=$actual -ceq $expected -and [string]$sig.Status -ceq 'Valid' -and $signer -match 'Microsoft Corporation'
          $receipt=@{schema='NOX-R11-WEBVIEW2-OFFICIAL-SHA-SIGNATURE';status=if($pass){'VERIFIED_SIGNED_MICROSOFT'}else{'HOLD'};sha256=$actual;expected_sha256=$expected;signer=$signer;signature_status=[string]$sig.Status;source_run=41324187733;installed=$false;merged=$false}
          $receipt | ConvertTo-Json -Depth 3 | Set-Content (Join-Path $out 'webview2-signature.json') -Encoding utf8
          if(-not $pass){throw 'WEBVIEW2_SIGNATURE_OR_SHA_HOLD'}
      - name: Upload small exact signature proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-r11-webview2-proof-${{ github.run_id }}
          path: ${{ runner.temp }}\nox-r11-webview2-proof
          retention-days: 14
          if-no-files-found: warn
