name: NOX P0 DeepSeek Range V10 - source-only regression
on:
  push:
    branches:
      - feature/nox-v38-synaptic-brain-20261114
    paths:
      - 'nox-control/deepseek_owner_range_v10.py'
      - 'nox-control/test_deepseek_owner_range_v10.py'
      - 'nox-control/test_maya_ds4_source_compat_v10.py'
      - 'nox-control/maya_launch_preflight_v1.py'
      - 'nox-control/test_maya_ds4_launch_preflight_v1.py'
      - 'nox-control/maya_gpu_topology_v1.py'
      - 'nox-control/owner_native_inspect.py'
      - 'nox-control/maya_launch_preflight_v1.py'
      - 'nox-control/test_maya_ds4_launch_preflight_v1.py'
      - 'nox-control/maya_gpu_topology_v1.py'
      - '.github/workflows/nox-p0-deepseek-range-ci.yml'
  pull_request:
    paths:
      - 'nox-control/deepseek_owner_range_v10.py'
      - 'nox-control/test_deepseek_owner_range_v10.py'
      - 'nox-control/test_maya_ds4_source_compat_v10.py'
      - 'nox-control/maya_launch_preflight_v1.py'
      - 'nox-control/test_maya_ds4_launch_preflight_v1.py'
      - 'nox-control/maya_gpu_topology_v1.py'
      - 'nox-control/owner_native_inspect.py'
      - 'nox-control/maya_launch_preflight_v1.py'
      - 'nox-control/test_maya_ds4_launch_preflight_v1.py'
      - 'nox-control/maya_gpu_topology_v1.py'
      - '.github/workflows/nox-p0-deepseek-range-ci.yml'
permissions:
  contents: read
jobs:
  fixture-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Source, launch, and transfer safety regressions
        run: |
          python3 -m py_compile nox-control/deepseek_owner_range_v10.py nox-control/test_deepseek_owner_range_v10.py nox-control/test_maya_ds4_source_compat_v10.py nox-control/owner_native_inspect.py nox-control/maya_gpu_topology_v1.py nox-control/maya_launch_preflight_v1.py nox-control/test_maya_ds4_launch_preflight_v1.py
          python3 -m unittest discover -s nox-control -p 'test_deepseek_owner_range_v10.py' -v
          python3 -m unittest discover -s nox-control -p 'test_maya_ds4_source_compat_v10.py' -v
          python3 -m unittest discover -s nox-control -p 'test_maya_ds4_launch_preflight_v1.py' -v
          python3 -m unittest discover -s nox-control -p 'test_maya_ds4_launch_preflight_v1.py' -v
      - name: Explicitly source-only
        run: echo 'SOURCE_TESTED only; no Vast SSH, no native bytes, no weight download, no model promotion, no CUDA/model execution'
