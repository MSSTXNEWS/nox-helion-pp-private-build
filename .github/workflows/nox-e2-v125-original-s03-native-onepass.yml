name: NOX V125 original S03 owner fact API one-shot native acceptance
# Verified source regression: 21/21 after pre-route 404/401 distinction, preserve mandatory post-route 401.
on:
  push:
    branches: [nox/e2-v125-owner-s03-facts-20261115]
    paths:
      - '.github/workflows/nox-e2-v125-original-s03-native-onepass.yml'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Explicitly authorize guarded existing OneHost source patch after STOP/idle/S03 backup'
        type: choice
        required: true
        options: ['NO','YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v125-onehost-original-s03-install
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify native script, test module and original S03 compatibility
        run: |
          set -euo pipefail
          python -m pip install -q fastapi==0.128.2 httpx==0.28.1
          python -m compileall -q nox_runpod/teacher_mesh/v125
          python -m unittest -v \
            nox_runpod.teacher_mesh.v125.test_owner_fact_write \
            nox_runpod.teacher_mesh.v125.test_install_fact_route \
            nox_runpod.teacher_mesh.v125.test_owner_fact_native_e2e
          echo 'NOX_V125_SOURCE_REGRESSION=PASS'
  native-install:
    needs: test
    if: ${{ (github.event_name == 'push' && github.actor == 'MSSTXNEWS') || (github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Existing configured owner credentials only
        run: |
          test -n "$NOX2" || { echo 'HOLD_NOX2'; exit 2; }
      - name: Apply original one-proxy fact route only after live source SHA, STOP, idle and S03 snapshot
        run: python3 -m nox_runpod.teacher_mesh.v125.install_fact_route
      - name: Mandatory ephemeral SSH key revocation
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
  native-e2e:
    needs: native-install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Existing configured owner credentials only
        run: |
          test -n "$NOX2" || { echo 'HOLD_NOX2'; exit 2; }
      - name: Official owner cookie, real synthetic fact, S03 M2 row + V120 history/dedup readback
        run: python3 -m nox_runpod.teacher_mesh.v125.owner_fact_native_e2e
      - name: Mandatory ephemeral SSH key revocation
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
