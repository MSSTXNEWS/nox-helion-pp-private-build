name: NOX scoped refill runtime source
on:
  push:
    branches:
      - repair/nox-refill-contract-rollout-20261119
      - repair/nox-i39-combined-rollout-20261119
    paths:
      - '.github/workflows/nox-refill-contract-rollout-ci.yml'
      - 'nox-control/owner_native_operator.py'
      - 'nox-control/systemic_relay_20261118/**'
permissions:
  contents: read
jobs:
  refill-contract-source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check fixed owner transport and isolated rollout
        run: |
          python -B -m py_compile nox-control/owner_native_operator.py nox-control/owner_native_repair.py
          python -B nox-control/systemic_relay_20261118/test_owner_refill_contract_rollout.py
          python -B nox-control/systemic_relay_20261118/test_owner_systemic_taskpack.py
