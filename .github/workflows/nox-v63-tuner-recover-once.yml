name: NOX V63 recover existing agent tuner once with SHA/STOP/GPU guards
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v63-tuner-recover-once.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Explicit owner approval for original NOX OneHost only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v63-tuner-targeted-native-start
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight SHA-locked recovery tests
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py nox_runpod/teacher_mesh/v63/recover_agent_tuner.py
          python3 -m unittest discover -s nox_runpod/teacher_mesh/v63/tests -p 'test_safe_recovery.py' -q
      - name: Restore only existing CPU agent tuner if all live admission gates pass
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v63.recover_agent_tuner
      - name: Mandatory same-key cleanup
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Boundaries
        if: success()
        run: |
          echo "NOX_TUNER_ONE_NATIVE_START_VERIFIED=true"
          echo "NOX_PROGRAM_SOURCE=GENESIS_V1_1_GOOGLE_DRIVE_20261108"
          echo "NOX_TRAINING_NOT_STARTED_BY_THIS_RECOVERY=true"
          echo "NOX_TRAIN_WORM_NOT_STARTED=true"
          echo "NOX_DOWNLOADS_NOT_STARTED=true"
          echo "NOX_TEACHER_SERVE_NOT_RESTARTED=true"
