name: NOX AUTO 2C source-only original WEB hybrid receipt validation
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'coordination/hybrid_20261115/2C_contract.py'
      - 'coordination/hybrid_20261115/2C.md'
      - '.github/workflows/nox-hybrid-2c-source-acceptance.yml'
permissions: {contents: read}
jobs:
  original-2c-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Exact checkout source-only no-native original V29 receipt validation
        run: |
          set -euo pipefail
          python -m py_compile coordination/hybrid_20261115/2C_contract.py
          python coordination/hybrid_20261115/2C_contract.py --selftest
          testdir="$(mktemp -d)"
          printf '{}\n' > "$testdir/input.json"
          python coordination/hybrid_20261115/2C_contract.py --input "$testdir/input.json" --out "$testdir/receipt.json"
          python - "$testdir/receipt.json" <<'PY'
          import json,sys
          receipt=json.load(open(sys.argv[1], encoding='utf-8'))
          assert receipt['native_verified'] is False
          assert receipt['web_deployed'] is False
          assert receipt['stream']['ttft_p95_ms'] is None
          assert receipt['training']['stop_resume_controls'].startswith('DISABLED_')
          assert receipt['routes']['full_live_92_route_e2e_verified'] is False
          print('2C_SOURCE_CLI_FAIL_CLOSED_PASS; no native attestation')
          PY
          if python coordination/hybrid_20261115/2C_contract.py --input "$testdir/input.json" --out "$testdir/receipt.json"; then
            echo 'ERROR: prior source receipt was overwritten'; exit 1
          fi
