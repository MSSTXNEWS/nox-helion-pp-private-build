name: NOX V128 existing owner WEB chat and S03 post V126 physical E2E
on:
  pull_request:
    branches: [feature/nox-v37-v100-firsthour-14d-20261113]
    paths:
      - 'nox_runpod/teacher_mesh/v128/**'
      - '.github/workflows/nox-v128-owner-chat-post-v126.yml'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Explicit owner-approved single synthetic chat QA'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v128-real-owner-chat-e2e
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original V114 source reuse and SHA pin
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v114/owner_v29_dialog_acceptance.py nox_runpod/teacher_mesh/v128/owner_chat_post_v126.py
          python - <<'PY'
          from nox_runpod.teacher_mesh.v128.owner_chat_post_v126 import prepare
          remote=prepare()
          assert 'BRIDGE_SHA=\'2c714c7f952be64a2b278c993da9d59014a43a32075281b5aa755ada02c6fb8e\'' in remote
          assert 'PROXY_SHA=\'e79aa0747511cf010f79f72150fc4e64b36b9c9ccea3b09d788a6306c63c0c95\'' in remote
          assert all(k in remote for k in ('HOLD_FULL_S03_DIALOG_STREAM_RECEIPT','HOLD_OWNER_S03_DIALOG_READBACK',
                          'HOLD_STOP_FLAG','NATIVE_V114_PRIVATE_OWNER_AUTH_EXPORTED=false'))
          print('NOX_V128_ORIGINAL_V114_REUSE_AND_NATIVE_COMPILE=PASS')
          PY
  native-owner:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'MSSTXNEWS' && inputs.allow_native == 'YES'
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing authenticated synthetic owner chat stream then S03 exact history readback
        run: python -m nox_runpod.teacher_mesh.v128.owner_chat_post_v126
      - name: Revoke ephemeral key even on failure
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
