name: PRE-PRE exact candidate launch
on:
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: pp-exe-launch-run40210839317
  cancel-in-progress: false

jobs:
  launch:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Fetch, verify, and launch the exact existing candidate once
        id: launch
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'MSSTXNEWS/nox-helion-pp-private-build'
          $sourceRunId = 40210839317
          $artifactId = 12605282328
          $expectedHead = 'ca1a876018655b7b3d12c7fb8f273def8d1e45ad'
          $expectedZipSha256 = 'f7b57520904cb60e17ce91737bb9f2f8af583a4ab769734a851551fa9f4eb625'
          $apiRoot = 'https://api.github.com/repos/' + $repo
          $zipPath = Join-Path $env:RUNNER_TEMP 'PP-001-run40210839317-artifact12605282328.zip'
          $extractPath = Join-Path $env:RUNNER_TEMP 'PP-001-run40210839317-extract'
          $evidencePath = Join-Path $env:RUNNER_TEMP 'launch-evidence.json'
          $evidence = [ordered]@{
            status = 'IN_PROGRESS'
            source_run_id = $sourceRunId
            artifact_id = $artifactId
            expected_zip_sha256 = $expectedZipSha256
            actual_zip_sha256 = $null
            source_commit = $expectedHead
            exact_exe_name = $null
            exact_exe_bytes = $null
            exact_exe_sha256 = $null
            process_start_info = $null
            process_start_attempt_utc = $null
            process_start_returned_utc = $null
            process_started_utc = $null
            process_id = $null
            process_alive_after_observation = $null
            main_window_handle = $null
            main_window_title = $null
            wait_for_input_idle = $null
            process_exit_state = 'NOT_STARTED'
            error = $null
          }
          function Save-Evidence {
            $evidence | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $evidencePath -Encoding utf8
          }
          Save-Evidence

          try {
            $headers = @{
              Authorization = 'Bearer ' + $env:GITHUB_TOKEN
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $meta = Invoke-RestMethod -Method Get -Uri "$apiRoot/actions/artifacts/$artifactId" -Headers $headers
            if ($meta.id -ne $artifactId -or $meta.workflow_run.id -ne $sourceRunId -or $meta.workflow_run.head_sha -ne $expectedHead -or $meta.expired) {
              throw "Artifact provenance mismatch: id=$($meta.id), run=$($meta.workflow_run.id), head=$($meta.workflow_run.head_sha), expired=$($meta.expired)"
            }

            $apiUri = [uri]"$apiRoot/actions/artifacts/$artifactId/zip"
            $handler = [System.Net.Http.HttpClientHandler]::new()
            $handler.AllowAutoRedirect = $false
            $client = [System.Net.Http.HttpClient]::new($handler)
            $client.DefaultRequestHeaders.Authorization = [System.Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer', $env:GITHUB_TOKEN)
            $client.DefaultRequestHeaders.Accept.ParseAdd('application/vnd.github+json')
            $client.DefaultRequestHeaders.UserAgent.ParseAdd('NOX-HELION-Exact-Candidate-Launch')
            $client.DefaultRequestHeaders.Add('X-GitHub-Api-Version', '2022-11-28')
            $response = $client.GetAsync($apiUri).GetAwaiter().GetResult()

            if ([int]$response.StatusCode -eq 302) {
              $downloadUri = $response.Headers.Location
              if (-not $downloadUri.IsAbsoluteUri) { $downloadUri = [uri]::new($apiUri, $downloadUri) }
              $response.Dispose()
              $client.Dispose()
              $publicHandler = [System.Net.Http.HttpClientHandler]::new()
              $publicClient = [System.Net.Http.HttpClient]::new($publicHandler)
              $downloadResponse = $publicClient.GetAsync($downloadUri, [System.Net.Http.HttpCompletionOption]::ResponseHeadersRead).GetAwaiter().GetResult()
            } elseif ([int]$response.StatusCode -eq 200) {
              $downloadResponse = $response
            } else {
              $detail = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
              throw "Artifact download endpoint returned HTTP $([int]$response.StatusCode): $detail"
            }

            if (-not $downloadResponse.IsSuccessStatusCode) { throw "Artifact byte download returned HTTP $([int]$downloadResponse.StatusCode)" }
            $inputStream = $downloadResponse.Content.ReadAsStreamAsync().GetAwaiter().GetResult()
            $outputStream = [System.IO.File]::Create($zipPath)
            try { $inputStream.CopyTo($outputStream) } finally { $outputStream.Dispose(); $inputStream.Dispose(); $downloadResponse.Dispose() }
            if ($client) { $client.Dispose() }
            if ($publicClient) { $publicClient.Dispose() }

            $actualZipSha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $evidence.actual_zip_sha256 = $actualZipSha256
            if ($actualZipSha256 -ne $expectedZipSha256) { throw "ZIP SHA256 mismatch: expected=$expectedZipSha256 actual=$actualZipSha256" }

            Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath -Force
            $matches = @(Get-ChildItem -LiteralPath $extractPath -Filter 'NOX_HELION_PRIVATE_CANDIDATE.exe' -File -Recurse)
            if ($matches.Count -ne 1) { throw "Expected exactly one private candidate EXE; found $($matches.Count)" }

            $exe = $matches[0].FullName
            $exeItem = Get-Item -LiteralPath $exe
            $exeSha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            $evidence.exact_exe_name = $exeItem.Name
            $evidence.exact_exe_bytes = $exeItem.Length
            $evidence.exact_exe_sha256 = $exeSha256

            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $exe
            $psi.WorkingDirectory = $exeItem.DirectoryName
            $psi.UseShellExecute = $true
            $evidence.process_start_info = [ordered]@{
              filename = $psi.FileName
              working_directory = $psi.WorkingDirectory
              use_shell_execute = $psi.UseShellExecute
            }
            $evidence.process_start_attempt_utc = [DateTimeOffset]::UtcNow.ToString('o')
            $process = [System.Diagnostics.Process]::Start($psi)
            $evidence.process_start_returned_utc = [DateTimeOffset]::UtcNow.ToString('o')
            if ($null -eq $process) { throw 'Process.Start returned null for the exact candidate EXE' }

            $evidence.process_id = $process.Id
            try { $evidence.process_started_utc = $process.StartTime.ToUniversalTime().ToString('o') } catch { $evidence.process_started_utc = 'unavailable: ' + $_.Exception.GetType().Name }
            $inputIdle = 'unavailable'
            try { $inputIdle = [string]$process.WaitForInputIdle(10000) } catch { $inputIdle = 'not-exposed: ' + $_.Exception.GetType().Name }
            Start-Sleep -Seconds 5
            $process.Refresh()
            $alive = -not $process.HasExited
            $evidence.process_alive_after_observation = $alive
            $evidence.main_window_handle = if ($alive) { [string]$process.MainWindowHandle } else { '0' }
            $evidence.main_window_title = if ($alive) { $process.MainWindowTitle } else { '' }
            $evidence.wait_for_input_idle = $inputIdle
            $evidence.process_exit_state = if ($alive) { 'RUNNING_AFTER_5S' } else { 'EXITED_' + [string]$process.ExitCode }
            $evidence.status = if ($alive) { 'PROCESS_STARTED' } else { 'PROCESS_EXITED' }
            Save-Evidence

            $summary = $evidence | ConvertTo-Json -Depth 6
            Write-Host $summary
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('```json' + "`n" + $summary + "`n" + '```')
            if (-not $alive) { throw "Exact candidate process exited before observation; exit_code=$($process.ExitCode)" }
          } catch {
            $evidence.status = 'FAILED'
            $evidence.error = $_.Exception.Message
            Save-Evidence
            Write-Error $_
            exit 1
          }

      - name: Preserve launch-evidence.json
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PP-001-exact-launch-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/launch-evidence.json
          if-no-files-found: warn
          retention-days: 14
