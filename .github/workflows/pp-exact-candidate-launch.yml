name: E07 current-main exact candidate process-start proof
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pp-exact-candidate-launch.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: pp-exe-launch-run40527490043
  cancel-in-progress: false

jobs:
  launch:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'PP-ONE-037 authorized exact artifact launch 12745455266')) }}
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Fetch and byte-verify the exact current-main candidate artifact
        id: fetch_candidate
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'MSSTXNEWS/nox-helion-pp-private-build'
          $sourceRunId = 40527490043
          $artifactId = 12745455266
          $expectedHead = '89dda555b37c260af16ad91807f13360669d8596'
          $expectedZipSha256 = '91d9b815400ced62610b0b9c86551207a46bc7a880a71528fc481ba5cb0e3d78'
          $apiRoot = 'https://api.github.com/repos/' + $repo
          $zipPath = Join-Path $env:RUNNER_TEMP 'PP-001-run40527490043-artifact12745455266.zip'
          $headers = @{ Authorization = 'Bearer ' + $env:GITHUB_TOKEN; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $meta = Invoke-RestMethod -Method Get -Uri "$apiRoot/actions/artifacts/$artifactId" -Headers $headers
          if ($meta.id -ne $artifactId -or $meta.workflow_run.id -ne $sourceRunId -or $meta.workflow_run.head_sha -ne $expectedHead -or $meta.expired) { throw "Artifact provenance mismatch: id=$($meta.id), run=$($meta.workflow_run.id), head=$($meta.workflow_run.head_sha), expired=$($meta.expired)" }
          $apiUri = [uri]"$apiRoot/actions/artifacts/$artifactId/zip"
          $handler = [System.Net.Http.HttpClientHandler]::new()
          $handler.AllowAutoRedirect = $false
          $client = [System.Net.Http.HttpClient]::new($handler)
          $client.DefaultRequestHeaders.Authorization = [System.Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer', $env:GITHUB_TOKEN)
          $client.DefaultRequestHeaders.Accept.ParseAdd('application/vnd.github+json')
          $client.DefaultRequestHeaders.UserAgent.ParseAdd('NOX-HELION-Exact-Candidate-Fetch')
          $client.DefaultRequestHeaders.Add('X-GitHub-Api-Version', '2022-11-28')
          $response = $client.GetAsync($apiUri).GetAwaiter().GetResult()
          $publicClient = $null
          if ([int]$response.StatusCode -eq 302) {
            $downloadUri = $response.Headers.Location
            if (-not $downloadUri.IsAbsoluteUri) { $downloadUri = [uri]::new($apiUri, $downloadUri) }
            $response.Dispose(); $client.Dispose()
            $publicClient = [System.Net.Http.HttpClient]::new([System.Net.Http.HttpClientHandler]::new())
            $downloadResponse = $publicClient.GetAsync($downloadUri, [System.Net.Http.HttpCompletionOption]::ResponseHeadersRead).GetAwaiter().GetResult()
          } elseif ([int]$response.StatusCode -eq 200) { $downloadResponse = $response }
          else { $detail = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult(); throw "Artifact endpoint returned HTTP $([int]$response.StatusCode): $detail" }
          if (-not $downloadResponse.IsSuccessStatusCode) { throw "Artifact bytes returned HTTP $([int]$downloadResponse.StatusCode)" }
          $inputStream = $downloadResponse.Content.ReadAsStreamAsync().GetAwaiter().GetResult()
          $outputStream = [System.IO.File]::Create($zipPath)
          try { $inputStream.CopyTo($outputStream) } finally { $outputStream.Dispose(); $inputStream.Dispose(); $downloadResponse.Dispose() }
          if ($client) { $client.Dispose() }
          if ($publicClient) { $publicClient.Dispose() }
          $actualZipSha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualZipSha256 -ne $expectedZipSha256) { throw "ZIP SHA256 mismatch: expected=$expectedZipSha256 actual=$actualZipSha256" }
          $headers.Clear()
          [Environment]::SetEnvironmentVariable('GITHUB_TOKEN', $null, 'Process')
          Write-Host "Verified run=$sourceRunId artifact=$artifactId head=$expectedHead zip_sha256=$actualZipSha256"

      - name: Start exact candidate without fetch credentials and terminate it after observation
        id: launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRunId = 40527490043
          $artifactId = 12745455266
          $expectedHead = '89dda555b37c260af16ad91807f13360669d8596'
          $expectedZipSha256 = '91d9b815400ced62610b0b9c86551207a46bc7a880a71528fc481ba5cb0e3d78'
          $expectedExeSha256 = '00d3d9b2e631cd73da7359c43f5e238093d34377b58b1e37f46d715b6ed7342b'
          $zipPath = Join-Path $env:RUNNER_TEMP 'PP-001-run40527490043-artifact12745455266.zip'
          $extractPath = Join-Path $env:RUNNER_TEMP 'PP-001-run40527490043-extract'
          $evidencePath = Join-Path $env:RUNNER_TEMP 'launch-evidence.json'
          $evidence = [ordered]@{ status='IN_PROGRESS'; source_run_id=$sourceRunId; artifact_id=$artifactId; source_commit=$expectedHead; expected_zip_sha256=$expectedZipSha256; actual_zip_sha256=$null; expected_exe_sha256=$expectedExeSha256; exact_exe_name=$null; exact_exe_path=$null; exact_exe_bytes=$null; exact_exe_sha256=$null; child_environment_policy='Allowlist only; no fetch credentials'; child_environment_secrets_cleared=$false; process_start_info=$null; process_start_attempt_utc=$null; process_start_returned_utc=$null; process_started_utc=$null; process_id=$null; process_alive_after_observation=$null; main_window_handle=$null; main_window_title=$null; wait_for_input_idle=$null; process_exit_state='NOT_STARTED'; process_cleanup_state='NOT_STARTED'; cleanup_verified=$false; error=$null }
          function Save-Evidence { $evidence | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $evidencePath -Encoding utf8 }
          $process = $null
          try {
            $actualZipSha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $evidence.actual_zip_sha256 = $actualZipSha256
            if ($actualZipSha256 -ne $expectedZipSha256) { throw "ZIP SHA changed after fetch: expected=$expectedZipSha256 actual=$actualZipSha256" }
            Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath -Force
            $matches = @(Get-ChildItem -LiteralPath $extractPath -Filter 'NOX_HELION_PRIVATE_CANDIDATE.exe' -File -Recurse)
            if ($matches.Count -ne 1) { throw "Expected exactly one private candidate EXE; found $($matches.Count)" }
            $exe = $matches[0].FullName
            $exeItem = Get-Item -LiteralPath $exe
            $exeSha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($exeSha256 -ne $expectedExeSha256) { throw "EXE SHA mismatch: expected=$expectedExeSha256 actual=$exeSha256" }
            $evidence.exact_exe_name=$exeItem.Name; $evidence.exact_exe_path=$exeItem.FullName; $evidence.exact_exe_bytes=$exeItem.Length; $evidence.exact_exe_sha256=$exeSha256
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName=$exe; $psi.WorkingDirectory=$exeItem.DirectoryName; $psi.UseShellExecute=$false; $psi.CreateNoWindow=$false
            $psi.Environment.Clear()
            foreach ($name in @('SystemRoot','WINDIR','TEMP','TMP','USERPROFILE','LOCALAPPDATA','APPDATA','PROGRAMDATA','HOMEDRIVE','HOMEPATH','COMSPEC')) { $value=[Environment]::GetEnvironmentVariable($name,'Process'); if(-not [string]::IsNullOrWhiteSpace($value)){$psi.Environment[$name]=$value} }
            if(-not $psi.Environment.ContainsKey('SystemRoot')){$psi.Environment['SystemRoot']=[Environment]::GetFolderPath('Windows')}
            $evidence.child_environment_secrets_cleared = -not $psi.Environment.ContainsKey('GITHUB_TOKEN') -and -not ($psi.Environment.Keys | Where-Object {$_ -like 'ACTIONS_*' -or $_ -like 'GITHUB_*'})
            $evidence.process_start_info=[ordered]@{filename=$psi.FileName; working_directory=$psi.WorkingDirectory; use_shell_execute=$psi.UseShellExecute; allowlist_only=$true; github_and_actions_variables_passed=$false}
            $evidence.process_start_attempt_utc=[DateTimeOffset]::UtcNow.ToString('o')
            $process=[System.Diagnostics.Process]::Start($psi)
            $evidence.process_start_returned_utc=[DateTimeOffset]::UtcNow.ToString('o')
            if($null -eq $process){throw 'Process.Start returned null'}
            $evidence.process_id=$process.Id
            try{$evidence.process_started_utc=$process.StartTime.ToUniversalTime().ToString('o')}catch{$evidence.process_started_utc='unavailable: '+$_.Exception.GetType().Name}
            $inputIdle='unavailable'; try{$inputIdle=[string]$process.WaitForInputIdle(10000)}catch{$inputIdle='not-exposed: '+$_.Exception.GetType().Name}
            Start-Sleep -Seconds 5
            $process.Refresh(); $alive=-not $process.HasExited
            $evidence.process_alive_after_observation=$alive
            $evidence.main_window_handle=if($alive){[string]$process.MainWindowHandle}else{'0'}
            $evidence.main_window_title=if($alive){$process.MainWindowTitle}else{''}
            $evidence.wait_for_input_idle=$inputIdle
            $evidence.process_exit_state=if($alive){'RUNNING_AFTER_5S'}else{'EXITED_'+[string]$process.ExitCode}
            if($alive){$process.Kill($true);if(-not $process.WaitForExit(10000)){throw 'Candidate process tree did not terminate'};$process.Refresh();$evidence.process_cleanup_state='PROCESS_TREE_TERMINATED'}else{$evidence.process_cleanup_state='ALREADY_EXITED'}
            $evidence.cleanup_verified=$process.HasExited
            if(-not $evidence.cleanup_verified){throw 'Candidate process cleanup could not be verified'}
            $evidence.status=if($alive){'PROCESS_STARTED_AND_TERMINATED'}else{'PROCESS_EXITED_BEFORE_5S'}
            Save-Evidence
            $summary=$evidence|ConvertTo-Json -Depth 6
            Write-Host $summary
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary
            if(-not $alive){throw "Exact candidate process exited before observation; exit_code=$($process.ExitCode)"}
          } catch {
            $evidence.status='FAILED'; $evidence.error=$_.Exception.Message
            if($null -ne $process){try{$process.Refresh();if(-not $process.HasExited){$evidence.process_cleanup_state='CLEANUP_RETRIED_IN_CATCH';$process.Kill($true);$process.WaitForExit(10000)|Out-Null;$process.Refresh()};$evidence.cleanup_verified=$process.HasExited}catch{$evidence.cleanup_verified=$false;$evidence.process_cleanup_state='CLEANUP_FAILED';$evidence.error+='; cleanup_error='+$_.Exception.Message}}
            Save-Evidence
            Write-Error $evidence.error
            exit 1
          }

      - name: Preserve launch-evidence.json
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PP-001-exact-launch-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/launch-evidence.json
          if-no-files-found: warn
          retention-days: 14

  evidence_gate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'PP-ONE-037 authorized evidence-only gate byte-preserving artifact 12606886034' }}
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Checkout verified gate inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Fetch and verify existing launch evidence artifact
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'MSSTXNEWS/nox-helion-pp-private-build'
          $runId = 40213466755
          $artifactId = 12606886034
          $expectedHead = '58638ebe82fe1067c29186b72cf8909bcd1835a4'
          $expectedZipSha256 = 'e1e81a02b38cdd67aeff3c1799c2dcd986ea8b1d34b0837f85decadbe7bd54a6'
          $apiRoot = 'https://api.github.com/repos/' + $repo
          $zipPath = Join-Path $env:RUNNER_TEMP 'launch-evidence-artifact12606886034.zip'
          $extractPath = Join-Path $env:RUNNER_TEMP 'launch-evidence-artifact12606886034'
          $headers = @{ Authorization = 'Bearer ' + $env:GITHUB_TOKEN; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $meta = Invoke-RestMethod -Method Get -Uri "$apiRoot/actions/artifacts/$artifactId" -Headers $headers
          if ($meta.id -ne $artifactId -or $meta.workflow_run.id -ne $runId -or $meta.workflow_run.head_sha -ne $expectedHead -or $meta.name -ne 'PP-001-exact-launch-evidence-40213466755' -or $meta.expired) {
            throw "HOLD: evidence artifact provenance mismatch: id=$($meta.id), run=$($meta.workflow_run.id), head=$($meta.workflow_run.head_sha), name=$($meta.name), expired=$($meta.expired)"
          }
          $apiUri = [uri]"$apiRoot/actions/artifacts/$artifactId/zip"
          $handler = [System.Net.Http.HttpClientHandler]::new()
          $handler.AllowAutoRedirect = $false
          $client = [System.Net.Http.HttpClient]::new($handler)
          $client.DefaultRequestHeaders.Authorization = [System.Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer', $env:GITHUB_TOKEN)
          $client.DefaultRequestHeaders.Accept.ParseAdd('application/vnd.github+json')
          $client.DefaultRequestHeaders.UserAgent.ParseAdd('NOX-HELION-Evidence-Only-Gate')
          $client.DefaultRequestHeaders.Add('X-GitHub-Api-Version', '2022-11-28')
          $response = $client.GetAsync($apiUri).GetAwaiter().GetResult()
          $publicClient = $null
          if ([int]$response.StatusCode -eq 302) {
            $downloadUri = $response.Headers.Location
            if (-not $downloadUri.IsAbsoluteUri) { $downloadUri = [uri]::new($apiUri, $downloadUri) }
            $response.Dispose(); $client.Dispose()
            $publicClient = [System.Net.Http.HttpClient]::new([System.Net.Http.HttpClientHandler]::new())
            $downloadResponse = $publicClient.GetAsync($downloadUri, [System.Net.Http.HttpCompletionOption]::ResponseHeadersRead).GetAwaiter().GetResult()
          } elseif ([int]$response.StatusCode -eq 200) { $downloadResponse = $response }
          else { $detail = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult(); throw "HOLD: artifact endpoint returned HTTP $([int]$response.StatusCode): $detail" }
          if (-not $downloadResponse.IsSuccessStatusCode) { throw "HOLD: artifact byte download returned HTTP $([int]$downloadResponse.StatusCode)" }
          $inputStream = $downloadResponse.Content.ReadAsStreamAsync().GetAwaiter().GetResult()
          $outputStream = [System.IO.File]::Create($zipPath)
          try { $inputStream.CopyTo($outputStream) } finally { $outputStream.Dispose(); $inputStream.Dispose(); $downloadResponse.Dispose(); if ($client) { $client.Dispose() }; if ($publicClient) { $publicClient.Dispose() } }
          $zipSha = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipSha -ne $expectedZipSha256) { throw "HOLD: evidence artifact ZIP SHA mismatch; expected=$expectedZipSha256 actual=$zipSha" }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath -Force
          $rawMatches = @(Get-ChildItem -LiteralPath $extractPath -Filter 'launch-evidence.json' -File -Recurse)
          if ($rawMatches.Count -ne 1) { throw "HOLD: expected exactly one launch-evidence.json; found $($rawMatches.Count)" }
          "Verified artifact_id=$artifactId run_id=$runId zip_sha256=$zipSha" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Decode byte-exact verified manifest copies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestRoot = Join-Path $env:RUNNER_TEMP 'byte-exact-verified-manifests'
          New-Item -ItemType Directory -Path $manifestRoot -Force | Out-Null
          $manifestPairs = @(
            @{ Source = '.\evidence\PP-ONE-037-C2-SOURCE-FREEZE.json.b64'; Name = 'PP-ONE-037-C2-SOURCE-FREEZE.json' },
            @{ Source = '.\evidence\NOX_HELION_PORTABLE_PREREQUISITES_RUN40210839317.md.b64'; Name = 'NOX_HELION_PORTABLE_PREREQUISITES_RUN40210839317.md' },
            @{ Source = '.\evidence\PP-ONE-037-QWEN-LAYER-DRIVE-BINDING.json.b64'; Name = 'PP-ONE-037-QWEN-LAYER-DRIVE-BINDING.json' }
          )
          foreach ($pair in $manifestPairs) {
            $encoded = (Get-Content -LiteralPath $pair.Source -Raw) -replace '\s', ''
            $destination = Join-Path $manifestRoot $pair.Name
            [System.IO.File]::WriteAllBytes($destination, [Convert]::FromBase64String($encoded))
          }

      - name: Run provenance and process-start gate only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'launch-evidence-artifact12606886034') -Filter 'launch-evidence.json' -File -Recurse | Select-Object -First 1
          $manifestRoot = Join-Path $env:RUNNER_TEMP 'byte-exact-verified-manifests'
          $gateOut = Join-Path $env:RUNNER_TEMP 'normalized-same-exe-evidence.json'
          & '.\evidence\pp_same_exe_acceptance.ps1' -LaunchEvidenceJson $raw.FullName -SourceFreezeJson (Join-Path $manifestRoot 'PP-ONE-037-C2-SOURCE-FREEZE.json') -PortableManifest (Join-Path $manifestRoot 'NOX_HELION_PORTABLE_PREREQUISITES_RUN40210839317.md') -QwenBindingJson (Join-Path $manifestRoot 'PP-ONE-037-QWEN-LAYER-DRIVE-BINDING.json') -EvidenceOut $gateOut
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Preserve normalized provenance record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PP-037-normalized-same-exe-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/normalized-same-exe-evidence.json
          if-no-files-found: warn
          retention-days: 14
