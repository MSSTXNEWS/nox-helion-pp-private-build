name: NOX V72 ONEPASS native chat priority + S03 RAM + health
run-name: ONEPASS NOX PRIME 60509551 - one controlled native application
on:
  push:
    branches: [nox/e2-v72-onepass-live-20261114]
    paths: ['.github/workflows/nox-e2-v72-onepass.yml', 'nox_runpod/teacher_mesh/v72/test_onepass_contract.py']
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v72-onepass-60509551
  cancel-in-progress: false
jobs:
  onepass:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One source gate for existing PRIME/S03 and onepass
        env:
          PYTHONPATH: ".:nox_runpod/teacher_mesh/v41:nox_runpod/teacher_mesh/v47"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOX2" || { echo "::error::HOLD_NOX2"; exit 2; }
          python3 -m py_compile nox_runpod/teacher_mesh/v72/onepass_live.py
          python3 -m unittest -q \
            nox_runpod.teacher_mesh.v72.test_onepass_contract \
            nox_runpod.teacher_mesh.v71.test_one_prime \
            nox_runpod.teacher_mesh.v38.tests.test_v38_memory_speed \
            nox_runpod.teacher_mesh.v41.tests.test_priority_autonomy \
            nox_runpod.teacher_mesh.v43.tests.test_v43 \
            nox_runpod.teacher_mesh.v47.tests.test_night_v47
      - name: ONE real V100 SSH session and one idempotent rollbackable CPU priority attempt
        shell: bash
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v72.onepass_live
      - name: Upload sanitized one-run native receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOX_V72_ONEPASS_NATIVE_RECEIPT
          path: NOX_V72_SINGLE_RUN_RECEIPT.json
          if-no-files-found: warn
          retention-days: 14
      - name: Independent idempotent temporary SSH key cleanup
        if: always()
        shell: bash
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Scope statement
        if: success()
        run: |
          echo 'NOX_EXISTING_MODEL_8081_PRESERVED=true'
          echo 'NOX_EXISTING_CHAT_PROXY_8080_PRESERVED=true'
          echo 'NOX_EXISTING_S03_SQLITE_UNCHANGED=true'
          echo 'NOX_NEW_SCHEDULER_OR_PAID_VM=false'
          echo 'NOX_V71_NATIVE_ONEHOST_BINDING_NOT_CLAIMED=true'
          echo 'NOX_NEW_OPTIMIZER_STEPS_NOT_CLAIMED=true'
