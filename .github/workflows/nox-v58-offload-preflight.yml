name: NOX V58 live export/offload readiness (read only)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v58-offload-preflight.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v58-vast60509551-offload-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static syntax
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py nox_runpod/teacher_mesh/v58/offload_preflight.py
      - name: Verify disk, checkpoints and existing export channels without changes
        run: |
          python3 -m nox_runpod.teacher_mesh.v58.offload_preflight
      - name: Revoke ephemeral SSH key
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Explicit no-loss acceptance boundary
        if: success()
        run: |
          echo "BACKUP_TRANSFER_COMPLETED=false"
          echo "REMOTE_FILES_DELETED=false"
          echo "INFERENCE_PROCESSES_UNTOUCHED=true"
