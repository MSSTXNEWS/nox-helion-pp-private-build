name: NOX R11 Block1 - NuGet closure verification
on:
  push:
    branches: [integration/nox-v16-unified-candidate-20261028-r01]
    paths:
      - '.github/workflows/nox-r11-block1-nuget-closure.yml'
      - 'coordination/wow-exec-v1/downloads/complete-nuget-closure.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-closure:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download transitive NuGet closure and cryptographically verify packages
        shell: pwsh
        run: |
          & ./coordination/wow-exec-v1/downloads/complete-nuget-closure.ps1
          if($LASTEXITCODE -ne 0){throw 'BLOCK1_NUGET_CLOSURE_HOLD'}
      - name: Publish exact signed NuGet closure and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-r11-nuget-closure-${{ github.run_id }}
          path: ${{ runner.temp }}\nox-r11-block1-closure
          retention-days: 14
          compression-level: 1
          if-no-files-found: warn
