name: NOX Reflex native-installed preimage matching
on:
  push:
    branches: [repair/nox-native-reflex-autorefill-20261119]
    paths: [.github/workflows/nox-native-reflex-base-match.yml]
permissions: {contents: read}
jobs:
  expected-installed-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/nox-continuous-execution-20261118
          persist-credentials: false
      - name: Compare repository base file bytes to native SHA preflight
        run: |
          set -euo pipefail
          p=nox-control/systemic_relay_20261118/runtime
          a=$(sha256sum "$p/owner_systemic_refill.py" | cut -d' ' -f1)
          b=$(sha256sum "$p/owner_subagent_dispatcher.py" | cut -d' ' -f1)
          echo "BASE_REFILL_SHA=$a"
          echo "BASE_DISPATCHER_SHA=$b"
          test "$a" = '4f0ea3f44ded11d40245de7573c5f48efc2e2f7424f979cec2da3e140a6d1197'
          test "$b" = '0193c511168489637b6df041bee2daf79bd42bd338c4ff5f9a6b129652dc4a13'
          echo 'NOX_REFLEX_PREIMAGE_EXACT_MATCH=true'
