name: NOX Executor 2 / Vast 60509551 live preflight
on:
  push:
    branches: [nox/executor2-r60-vast-probe-20261114]
    paths: ['.github/workflows/nox-v48-vast-readonly-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nox-vast-60509551-executor2-readonly
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      VAST_API_KEY: ${{ secrets.NOX2 }}
      NOX_VAST_SSH_PRIVATE_KEY: ${{ secrets.NOX_VAST_SSH_PRIVATE_KEY }}
    steps:
      - name: Check existing NOX2 secret without showing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VAST_API_KEY:-}" || { echo "::error::HOLD_NOX2_MISSING"; exit 2; }
          echo "NOX2_PRESENT=YES (value never logged)"
      - name: Install official Vast.ai CLI in temporary runner only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip -q install --disable-pip-version-check vastai
          vastai --version || vastai --help >/dev/null
      - name: Authenticated show instance and sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          timeout 65s vastai show instance 60509551 --raw > "$RUNNER_TEMP/instance.json"
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])
          x=json.loads((p/'instance.json').read_text())
          d=x.get('instances',x) if isinstance(x,dict) else x
          if isinstance(d,list): d=next((v for v in d if str(v.get('id'))=='60509551'),{})
          if not isinstance(d,dict) or str(d.get('id'))!='60509551':
              raise SystemExit('HOLD_INSTANCE_ID_NOT_VERIFIED')
          # Only these fields can be exported: NO credentials, IP, SSH host or port.
          public=('id','actual_status','intended_status','gpu_name','num_gpus','gpu_ram','disk_space','disk_usage')
          receipt={'schema':'NOX_R60_VAST_API_RECEIPT_V1','source':'Vast.ai CLI live',
                   'instance':{k:d[k] for k in public if k in d},
                   'instance_verified':True,'remote_gpu_inspected':False,
                   'optimizer_steps_verified':False,'model_weights_changed':False}
          (p/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True,indent=2))
          print('VAST_API_RECEIPT='+json.dumps(receipt,ensure_ascii=False))
          print('VAST_API_RECEIPT_SHA256='+hashlib.sha256((p/'receipt.json').read_bytes()).hexdigest())
          PY
      - name: Inspect SSH route (no address output) and limited execute
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if timeout 35s vastai ssh-url 60509551 > "$RUNNER_TEMP/sshroute.txt" 2>/dev/null; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlparse
          raw=(Path(os.environ['RUNNER_TEMP'])/'sshroute.txt').read_text().strip()
          p=urlparse(raw)
          if p.scheme=='ssh' and p.hostname and p.port:
              print('SSH_ROUTE_AVAILABLE=true (route redacted)')
          else:
              print('HOLD_SSH_ROUTE_FORMAT')
          PY
          else
            echo "HOLD_SSH_ROUTE_UNAVAILABLE"
          fi
          if timeout 40s vastai execute 60509551 'nvidia-smi -L' > "$RUNNER_TEMP/limited_execute.txt" 2>&1; then
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          data=(Path(os.environ['RUNNER_TEMP'])/'limited_execute.txt').read_text(errors='replace')
          ok=bool(re.search(r'\b(?:Tesla\s+)?V100\b',data,re.I))
          print('LIMITED_REMOTE_GPU_LIST='+('VERIFIED_V100_RESPONSE' if ok else 'UNVERIFIED_RESPONSE'))
          print('NOTE=CLI_execute_is_not_full_SSH_or_OneHost_receipt')
          PY
          else
            echo "HOLD_LIMITED_EXECUTE (no remote changes)"
          fi
          if [ -z "${NOX_VAST_SSH_PRIVATE_KEY:-}" ]; then
            echo "HOLD_NO_EXISTING_VAST_SSH_KEY_SECRET; skip direct SSH"
            exit 0
          fi
          printf '%s\n' "$NOX_VAST_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vast.key"
          chmod 600 "$RUNNER_TEMP/vast.key"
          readarray -t hp < <(python3 - <<'PY'
          import json,os
          x=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'instance.json')))
          d=x.get('instances',x) if isinstance(x,dict) else x
          if isinstance(d,list): d=next((v for v in d if str(v.get('id'))=='60509551'),{})
          print(d.get('ssh_host',''))
          print(d.get('ssh_port',''))
          PY
          )
          if [ -z "${hp[0]}" ] || ! [[ "${hp[1]}" =~ ^[0-9]+$ ]]; then
            echo "HOLD_SSH_NO_HOST_PORT"
            exit 0
          fi
          if timeout 60s ssh -i "$RUNNER_TEMP/vast.key" -p "${hp[1]}" -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new "root@${hp[0]}" \
            "nvidia-smi --query-gpu=index,name,memory.total,memory.used,memory.free,utilization.gpu,temperature.gpu --format=csv,noheader && free -m && df -B1 /workspace" > "$RUNNER_TEMP/gpu.txt" 2>/dev/null; then
              echo "SSH_REMOTE_GPU_RAM_DISK_RECEIPT_BEGIN"
              head -n 12 "$RUNNER_TEMP/gpu.txt"
              echo "SSH_REMOTE_GPU_RAM_DISK_RECEIPT_END"
          else
              echo "HOLD_REMOTE_SSH_CREDENTIAL_OR_NETWORK"
          fi
          rm -f "$RUNNER_TEMP/vast.key"
      - name: Diagnose SSH transport and clean only our orphaned one-time keys
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,socket
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'instance.json')))
          d=d.get('instances',d)
          if isinstance(d,list): d=next((x for x in d if str(x.get('id'))=='60509551'),{})
          host,port=d.get('ssh_host'),d.get('ssh_port')
          print('SSH_META_PRESENT='+str(bool(host and port)))
          print('JUPYTER_META_PRESENT='+str(bool(d.get('jupyter_token') or d.get('jupyter_url'))))
          if host and port:
              try:
                  sock=socket.create_connection((str(host),int(port)),timeout=7)
                  sock.close()
                  print('SSH_TCP_TRANSPORT=OPEN')
              except (OSError,ValueError) as exc:
                  print('SSH_TCP_TRANSPORT=HOLD_'+type(exc).__name__)
          PY
          if timeout 30s vastai show ssh-keys 60509551 --raw > "$RUNNER_TEMP/sshkeys.json" 2>/dev/null; then
            python3 - <<'PY'
          import json,os,subprocess
          x=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'sshkeys.json')))
          z=x.get('ssh_keys',[]) if isinstance(x,dict) else x
          if isinstance(z,str):
              try:z=json.loads(z)
              except Exception:z=[]
          if not isinstance(z,list): z=[]
          owned=[v for v in z if isinstance(v,dict) and 'nox-e2-one-time' in (str(v.get('public_key',''))+' '+str(v.get('name','')))]
          print('E2_ORPHANED_KEYS_VISIBLE='+str(len(owned)))
          for v in owned:
              kid=v.get('id')
              if isinstance(kid,int):
                  p=subprocess.run(['vastai','detach','ssh','60509551',str(kid),'--raw'],capture_output=True,text=True,timeout=25)
                  print('E2_KEY_DETACH_'+str(kid)+'='+('API_CALL_SUCCESS' if p.returncode==0 else 'HOLD_DETACH_FAILED'))
              else: print('HOLD_KEY_ID_MISSING')
          PY
          else
            echo "HOLD_SSH_KEYS_LIST_UNAVAILABLE"
          fi
      - name: Verify existing Jupyter route without exposing token
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request,urllib.error,ssl
          raw=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'instance.json')))
          d=raw.get('instances',raw) if isinstance(raw,dict) else raw
          if isinstance(d,list):d=next((v for v in d if str(v.get('id'))=='60509551'),{})
          names=sorted(k for k in d if ('jup' in k.lower() or 'port' in k.lower() or 'token' in k.lower()))
          print('JUPYTER_API_FIELDS_PRESENT='+','.join(names[:25]))
          url=str(d.get('jupyter_url') or d.get('jup_url') or '')
          token=str(d.get('jupyter_token') or '')
          if not url:
              print('HOLD_NO_JUPYTER_URL_FIELD')
              raise SystemExit(0)
          p=urllib.parse.urlsplit(url)
          if not token:
              token=urllib.parse.parse_qs(p.query).get('token',[''])[0]
          if p.scheme not in ('http','https') or not p.hostname:
              print('HOLD_JUPYTER_URL_MALFORMED')
              raise SystemExit(0)
          print('JUPYTER_SCHEME='+p.scheme)
          print('JUPYTER_TOKEN_AVAILABLE='+str(bool(token)))
          root=p.path.rstrip('/')
          for suffix in ('/lab','/tree','/login'):
              if root.endswith(suffix):root=root[:-len(suffix)]
          probe=urllib.parse.urlunsplit((p.scheme,p.netloc,root+'/api','',''))
          headers={'Accept':'application/json'}
          if token:headers['Authorization']='token '+token
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect,urllib.request.HTTPSHandler(context=ssl.create_default_context()))
          try:
              with opener.open(urllib.request.Request(probe,headers=headers),timeout=10) as rsp:
                  payload=rsp.read(4096)
                  try: obj=json.loads(payload)
                  except (json.JSONDecodeError,UnicodeDecodeError):obj={}
                  print('JUPYTER_API_VERIFIED='+str(rsp.status==200 and isinstance(obj,dict) and ('version' in obj or 'status' in obj)))
                  print('JUPYTER_HTTP_STATUS='+str(rsp.status))
          except urllib.error.HTTPError as e:
              print('HOLD_JUPYTER_HTTP_'+str(e.code))
          except Exception as e:
              print('HOLD_JUPYTER_CONNECT_'+type(e).__name__)
          PY
      - name: Upload sanitized API receipt (no host or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-e2-vast60509551-api-inventory
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: ignore
          retention-days: 7
