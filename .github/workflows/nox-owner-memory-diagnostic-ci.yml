name: NOX owner memory diagnostic contract
on:
  pull_request:
    paths:
      - 'nox-control/owner_memory_diagnostic.py'
      - 'nox-control/test_owner_memory_diagnostic.py'
      - '.github/workflows/nox-owner-memory-diagnostic-ci.yml'
  push:
    paths:
      - 'nox-control/owner_memory_diagnostic.py'
      - 'nox-control/test_owner_memory_diagnostic.py'
      - '.github/workflows/nox-owner-memory-diagnostic-ci.yml'
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile owner_memory_diagnostic.py test_owner_memory_diagnostic.py
        working-directory: nox-control
      - run: python -m unittest -v test_owner_memory_diagnostic.py
        working-directory: nox-control
