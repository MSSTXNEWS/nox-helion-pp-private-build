name: NOX B2 R64 combined R58-R63 RU/ES source gate
on:
  pull_request:
    paths:
      - 'nox-control/b2_ru_es_review_integrity.py'
      - 'nox-control/tests/test_b2_ru_es_review_integrity.py'
      - '.github/workflows/nox-b2-r59-review-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b2-r59-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact combined R58-R63 source Git blobs
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git hash-object nox-control/owner_training_resume.py)" = "65d71ed0009fc8f33b57a66d529754daaacb5719"
          test "$(git hash-object nox-control/tests/test_owner_training_resume_step_type_b2.py)" = "0425ec904d14a23573d4528cd1cf6092f6ea151c"
          test "$(git hash-object nox-control/b2_ru_es_3turn_holdout.py)" = "38a00de3a374487c3e0ad9067445fa30ada5a8ab"
          test "$(git hash-object nox-control/tests/test_b2_ru_es_3turn_holdout.py)" = "57ea3c68e3db4f39a74a0f1ab8466d9530e8d7fc"
          test "$(git hash-object nox-control/b2_ru_es_review_integrity.py)" = "63dd7f468462abbe16659fbf30832c21575f2816"
          test "$(git hash-object nox-control/tests/test_b2_ru_es_review_integrity.py)" = "c0f611039988fa004141dda77f8f3d9c1727f830"
      - name: Compile and run all three non-native B2 suites (99 tests)
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile nox-control/owner_training_resume.py nox-control/tests/test_owner_training_resume_step_type_b2.py nox-control/b2_ru_es_3turn_holdout.py nox-control/tests/test_b2_ru_es_3turn_holdout.py nox-control/b2_ru_es_review_integrity.py nox-control/tests/test_b2_ru_es_review_integrity.py
          run_suite() {
            local pattern="$1" expected="$2" log
            log=$(mktemp)
            python -B -m unittest discover -s nox-control/tests -p "$pattern" -v 2>&1 | tee "$log"
            grep -Eq "^Ran ${expected} tests in " "$log"
            rm -f "$log"
          }
          run_suite test_owner_training_resume_step_type_b2.py 80
          run_suite test_b2_ru_es_3turn_holdout.py 10
          run_suite test_b2_ru_es_review_integrity.py 9
          echo 'SOURCE_ONLY: 99 tests; no native, training or S03 acceptance'
