name: NOX B2 R59 RU/ES independent review integrity source
on:
  pull_request:
    paths:
      - 'nox-control/b2_ru_es_review_integrity.py'
      - 'nox-control/tests/test_b2_ru_es_review_integrity.py'
      - '.github/workflows/nox-b2-r59-review-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b2-r59-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and verify real review integrity module
        run: |
          python -B -m py_compile nox-control/b2_ru_es_review_integrity.py nox-control/tests/test_b2_ru_es_review_integrity.py
          python -B -m unittest discover -s nox-control/tests -p 'test_b2_ru_es_review_integrity.py' -v
