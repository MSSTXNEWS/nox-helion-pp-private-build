name: NOX V93 existing S03 multi-turn owner memory onepass
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v93-s03-dialog.yml, nox_runpod/teacher_mesh/v93/native_dialog_scope_once.py]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions: {contents: read}
concurrency:
  group: nox-v93-onehost-s03-dialog
  cancel-in-progress: false
jobs:
  connect:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify exact native source and syntactic controls
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v93/native_dialog_scope_once.py
          python3 - <<'PY'
          from nox_runpod.teacher_mesh.v93.native_dialog_scope_once import REMOTE
          compile(REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0],
                  '<nox-v93-native>','exec')
          assert 'HOLD_CHAT_BECAME_BUSY' in REMOTE and 'HOLD_S03_DIALOG_ID_SEMANTICS' in REMOTE
          assert 'owner_memory_access_not_widened=True' in REMOTE
          print('NOX_V93_SOURCE_GATE=PASS')
          PY
      - name: Apply one scoped S03 dialog association to existing proxy with rollback
        run: python3 -m nox_runpod.teacher_mesh.v93.native_dialog_scope_once
      - name: Always revoke temporary SSH identity
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
