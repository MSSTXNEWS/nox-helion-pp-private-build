name: NOX E06 R08 real WPF UI boot smoke (frozen installer)
on:
  push:
    branches: [e06/express-finish-wpf-diagnostic-20261028]
    paths:
      - '.github/workflows/nox-express-r08-real-ui-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-boot:
    runs-on: windows-2025
    timeout-minutes: 17
    steps:
      - name: Get exact validated installer from PR41 native Windows run
        uses: actions/download-artifact@v4
        with:
          name: nox-e06-real-wpf-nsis-nonfinal-40611423342
          run-id: 40611423342
          github-token: ${{ github.token }}
          path: diag-input
      - name: Install and boot original WPF D02 with real WebView2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:CI -cne 'true' -or $env:OS -cne 'Windows_NT' -or -not [Environment]::Is64BitOperatingSystem) {throw 'NOX_CI_DISPOSABLE_REQUIRED'}
          $setup='diag-input/nsis-candidate/NOX-HELION-Setup-CANDIDATE.exe'
          $expected='03e026141854a7dada0c94db9066f31d7f9345ca7e35a37f7a73efa9e1657310'
          if (!(Test-Path -LiteralPath $setup -PathType Leaf) -or (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) {throw 'NOX_FROZEN_SETUP_SHA_MISMATCH'}
          $root=Join-Path $env:LOCALAPPDATA 'Programs\NOX HELION'
          if (Test-Path -LiteralPath $root){throw 'NOX_CI_TARGET_NOT_CLEAN'}
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'ci-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $receipt=[ordered]@{
            schema='NOX_E06_PR41_REAL_WPF_BOOT_DIAGNOSTIC_V1'
            runId=$env:GITHUB_RUN_ID; sourceRunId=40611423342
            setupSha256=$expected; install='NOT_RUN'; process='NOT_RUN'
            mainWindow='NOT_RUN'; webviewNavigation='NOT_RUN'
            productComplete=$false; fullPythonCoreBridgeVerified=$false
            originalWowVisualAccepted=$false; independentE07Accepted=$false
            errors=@()
          }
          $proc=$null
          try {
            $p=Start-Process -FilePath (Resolve-Path $setup).Path -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -ne 0){throw "NOX_INSTALL_EXIT_$($p.ExitCode)"}
            $receipt.install='PASS'
            $exe=Join-Path $root 'NOX.P01.Shell.exe'
            $manifestPath=Join-Path $root 'payload.sha256.json'
            if (!(Test-Path -LiteralPath $exe -PathType Leaf) -or !(Test-Path -LiteralPath $manifestPath -PathType Leaf)){throw 'NOX_PUBLISHED_PAYLOAD_MISSING'}
            $manifest=Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $entry=@($manifest.files|Where-Object { $_.path -ceq 'NOX.P01.Shell.exe' })
            if($entry.Count -ne 1 -or (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry[0].sha256){throw 'NOX_WPF_INSTALLED_SHA_MISMATCH'}
            $receipt.exeSha256=$entry[0].sha256
            $proc=Start-Process -FilePath $exe -PassThru
            $stopAt=[DateTime]::UtcNow.AddSeconds(28)
            $hasWindow=$false
            $navOk=$false
            $log=Join-Path $env:LOCALAPPDATA 'NOX_HELION\P01\logs\shell.log'
            while([DateTime]::UtcNow -lt $stopAt){
              Start-Sleep -Milliseconds 850
              $proc.Refresh()
              if($proc.HasExited){throw "NOX_WPF_EARLY_EXIT_$($proc.ExitCode)"}
              if($proc.MainWindowHandle -ne [IntPtr]::Zero){$hasWindow=$true}
              if(Test-Path -LiteralPath $log -PathType Leaf){
                $last=Get-Content -LiteralPath $log -Tail 120 -ErrorAction SilentlyContinue
                if(@($last|Where-Object {$_ -match 'NAV_OK'}).Count -gt 0){$navOk=$true;break}
                if(@($last|Where-Object {$_ -match 'INIT_ERROR|NAV_FAIL|WEBVIEW_PROCESS_FAILED'}).Count -gt 0){throw 'NOX_WPF_WEBVIEW_ERROR_IN_LOG'}
              }
            }
            $receipt.process='PASS'
            $receipt.mainWindow=if($hasWindow){'PASS'}else{'HOLD_NO_HANDLE'}
            $receipt.webviewNavigation=if($navOk){'PASS'}else{'HOLD_NAV_NOT_OBSERVED'}
            if(-not $navOk){throw 'NOX_WEBVIEW_NAV_OK_NOT_OBSERVED'}
            Write-Host "NOX_R08_WINDOWS_PROCESS_AND_WEBVIEW_NAV_PASS; UI visual and real AI remain HOLD."
          } catch {
            $receipt.errors=@($_.ToString())
            throw
          } finally {
            if($proc -and -not $proc.HasExited){
              $proc.CloseMainWindow()|Out-Null
              if(-not $proc.WaitForExit(4500)){$proc.Kill($true)}
            }
            $logPath=Join-Path $env:LOCALAPPDATA 'NOX_HELION\P01\logs\shell.log'
            if(Test-Path -LiteralPath $logPath -PathType Leaf){
              $receipt.lastLogLines=@(Get-Content -LiteralPath $logPath -Tail 80)
            }
            $receipt.checkedUtc=[DateTime]::UtcNow.ToString('o')
            $receipt|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $evidence 'nox-r08-wpf-boot-smoke.json') -Encoding utf8
          }
      - name: Retain narrow runtime receipt even on HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-r08-wpf-boot-runtime-evidence
          path: ci-evidence/nox-r08-wpf-boot-smoke.json
          retention-days: 30
          if-no-files-found: warn
