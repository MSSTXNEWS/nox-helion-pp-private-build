name: NOX E06 R08 real WPF UI boot smoke (frozen installer)
on:
  push:
    branches: [e06/express-finish-wpf-diagnostic-20261028]
    paths:
      - '.github/workflows/nox-express-r08-real-ui-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-boot:
    runs-on: windows-2025
    timeout-minutes: 17
    steps:
      - name: Pinned owner P01 preflight source for read-only diagnosis
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8e42bb15aecbee8412c342b0e9049b6cce044297
          persist-credentials: false
          path: p01-source
      - name: Get exact validated installer from PR41 native Windows run
        uses: actions/download-artifact@v4
        with:
          name: nox-e06-real-wpf-nsis-nonfinal-40611423342
          run-id: 40611423342
          github-token: ${{ github.token }}
          path: diag-input
      - name: Install and boot original WPF D02 with real WebView2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:CI -cne 'true' -or $env:OS -cne 'Windows_NT' -or -not [Environment]::Is64BitOperatingSystem) {throw 'NOX_CI_DISPOSABLE_REQUIRED'}
          $setup='diag-input/nsis-candidate/NOX-HELION-Setup-CANDIDATE.exe'
          $expected='03e026141854a7dada0c94db9066f31d7f9345ca7e35a37f7a73efa9e1657310'
          if (!(Test-Path -LiteralPath $setup -PathType Leaf) -or (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) {throw 'NOX_FROZEN_SETUP_SHA_MISMATCH'}
          $root=Join-Path $env:LOCALAPPDATA 'Programs\NOX HELION'
          if (Test-Path -LiteralPath $root){throw 'NOX_CI_TARGET_NOT_CLEAN'}
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'ci-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $receipt=[ordered]@{
            schema='NOX_E06_PR41_REAL_WPF_BOOT_DIAGNOSTIC_V1'
            runId=$env:GITHUB_RUN_ID; sourceRunId=40611423342
            setupSha256=$expected; install='NOT_RUN'; process='NOT_RUN'
            mainWindow='NOT_RUN'; webviewNavigation='NOT_RUN'
            productComplete=$false; fullPythonCoreBridgeVerified=$false
            originalWowVisualAccepted=$false; independentE07Accepted=$false
            errors=@()
          }
          $proc=$null
          try {
            $p=Start-Process -FilePath (Resolve-Path $setup).Path -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -ne 0){
              $receipt.installerExitCode=$p.ExitCode
              $preflight='p01-source/stage/proposals/P01/C09/Installer/Preflight-InstallPath.ps1'
              $previousPref=$ErrorActionPreference
              $ErrorActionPreference='Continue'
              try {
                $preOutput=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $preflight -InstallRoot $root 2>&1
                $receipt.preflightExitCode=$LASTEXITCODE
                $receipt.preflightOutput=($preOutput|Out-String).Substring(0,[Math]::Min(3000,($preOutput|Out-String).Length))
              } finally { $ErrorActionPreference=$previousPref }
              $stage="$root.__p01_stage"
              $receipt.stageExists=Test-Path -LiteralPath $stage -PathType Container
              $receipt.rootExists=Test-Path -LiteralPath $root -PathType Container
              if($receipt.stageExists){
                $receipt.stageFileCount=@(Get-ChildItem -LiteralPath $stage -File -Recurse -ErrorAction SilentlyContinue).Count
                $receipt.markerExists=Test-Path -LiteralPath (Join-Path $stage 'nox-p01-owned.txt')
                $mf=Join-Path $stage 'payload.sha256.json'
                if(Test-Path -LiteralPath $mf -PathType Leaf){
                  $verify='p01-source/stage/proposals/P01/C09/Installer/Verify-Payload.ps1'
                  $previousPref=$ErrorActionPreference
                  $ErrorActionPreference='Continue'
                  try {
                    $verOut=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $verify -Root $stage -Manifest $mf 2>&1
                    $receipt.stageVerifyExitCode=$LASTEXITCODE
                    $receipt.stageVerifyOutput=($verOut|Out-String).Substring(0,[Math]::Min(1800,($verOut|Out-String).Length))
                  } finally { $ErrorActionPreference=$previousPref }
                }
              }
              # Real WPF GUI boot is independently testable from SHA-verified
              # staging files. This does not waive installer activation failure.
              if ($receipt.stageVerifyExitCode -eq 0) {
                $stagedExe=Join-Path $stage 'NOX.P01.Shell.exe'
                $expectedStageExeSha='3b26a3c00fa24a82e084ed22432664d96ae6c4fedc46a44520c2a290d8825fda'
                if((Test-Path -LiteralPath $stagedExe -PathType Leaf) -and
                    (Get-FileHash -LiteralPath $stagedExe -Algorithm SHA256).Hash.ToLowerInvariant() -ceq $expectedStageExeSha){
                  $receipt.stageWpfExeSha256=$expectedStageExeSha
                  $stageProc=$null
                  try {
                    $stageProc=Start-Process -FilePath $stagedExe -PassThru
                    $until=[DateTime]::UtcNow.AddSeconds(24)
                    $bootLog=Join-Path $env:LOCALAPPDATA 'NOX_HELION\P01\logs\shell.log'
                    $window=$false
                    $nav=$false
                    while([DateTime]::UtcNow -lt $until){
                      Start-Sleep -Milliseconds 850
                      $stageProc.Refresh()
                      if($stageProc.HasExited){$receipt.stagedWpfExitCode=$stageProc.ExitCode; break}
                      if($stageProc.MainWindowHandle -ne [IntPtr]::Zero){$window=$true}
                      if(Test-Path -LiteralPath $bootLog -PathType Leaf){
                        $tail=@(Get-Content -LiteralPath $bootLog -Tail 100 -ErrorAction SilentlyContinue)
                        if(@($tail | Where-Object {$_ -match 'NAV_OK'}).Count -gt 0){$nav=$true; break}
                        if(@($tail | Where-Object {$_ -match 'INIT_ERROR|NAV_FAIL|WEBVIEW_PROCESS_FAILED'}).Count -gt 0){$receipt.stageWpfFailureLog=($tail|Out-String).Substring(0,[Math]::Min(1200,($tail|Out-String).Length));break}
                      }
                    }
                    $receipt.stageGuiWindow=if($window){'PASS'}else{'HOLD_NO_WINDOW'}
                    $receipt.stageWebView2Navigation=if($nav){'PASS'}else{'HOLD_NAVIGATION_NOT_OBSERVED'}
                  } catch { $receipt.stageGuiError=$_.Exception.Message }
                  finally {
                    if($stageProc -and -not $stageProc.HasExited){
                      $null=$stageProc.CloseMainWindow()
                      if(-not $stageProc.WaitForExit(2500)){$stageProc.Kill($true)}
                    }
                  }
                } else { $receipt.stageGuiError='WPF_BINARY_SHA_NOT_MATCHED' }
              }
              throw "NOX_INSTALL_EXIT_$($p.ExitCode)"
            }
            $receipt.install='PASS'
            $exe=Join-Path $root 'NOX.P01.Shell.exe'
            $manifestPath=Join-Path $root 'payload.sha256.json'
            if (!(Test-Path -LiteralPath $exe -PathType Leaf) -or !(Test-Path -LiteralPath $manifestPath -PathType Leaf)){throw 'NOX_PUBLISHED_PAYLOAD_MISSING'}
            $manifest=Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $entry=@($manifest.files|Where-Object { $_.path -ceq 'NOX.P01.Shell.exe' })
            if($entry.Count -ne 1 -or (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry[0].sha256){throw 'NOX_WPF_INSTALLED_SHA_MISMATCH'}
            $receipt.exeSha256=$entry[0].sha256
            $proc=Start-Process -FilePath $exe -PassThru
            $stopAt=[DateTime]::UtcNow.AddSeconds(28)
            $hasWindow=$false
            $navOk=$false
            $log=Join-Path $env:LOCALAPPDATA 'NOX_HELION\P01\logs\shell.log'
            while([DateTime]::UtcNow -lt $stopAt){
              Start-Sleep -Milliseconds 850
              $proc.Refresh()
              if($proc.HasExited){throw "NOX_WPF_EARLY_EXIT_$($proc.ExitCode)"}
              if($proc.MainWindowHandle -ne [IntPtr]::Zero){$hasWindow=$true}
              if(Test-Path -LiteralPath $log -PathType Leaf){
                $last=Get-Content -LiteralPath $log -Tail 120 -ErrorAction SilentlyContinue
                if(@($last|Where-Object {$_ -match 'NAV_OK'}).Count -gt 0){$navOk=$true;break}
                if(@($last|Where-Object {$_ -match 'INIT_ERROR|NAV_FAIL|WEBVIEW_PROCESS_FAILED'}).Count -gt 0){throw 'NOX_WPF_WEBVIEW_ERROR_IN_LOG'}
              }
            }
            $receipt.process='PASS'
            $receipt.mainWindow=if($hasWindow){'PASS'}else{'HOLD_NO_HANDLE'}
            $receipt.webviewNavigation=if($navOk){'PASS'}else{'HOLD_NAV_NOT_OBSERVED'}
            if(-not $navOk){throw 'NOX_WEBVIEW_NAV_OK_NOT_OBSERVED'}
            Write-Host "NOX_R08_WINDOWS_PROCESS_AND_WEBVIEW_NAV_PASS; UI visual and real AI remain HOLD."
          } catch {
            $receipt.errors=@($_.ToString())
            throw
          } finally {
            if($proc -and -not $proc.HasExited){
              $proc.CloseMainWindow()|Out-Null
              if(-not $proc.WaitForExit(4500)){$proc.Kill($true)}
            }
            $logPath=Join-Path $env:LOCALAPPDATA 'NOX_HELION\P01\logs\shell.log'
            if(Test-Path -LiteralPath $logPath -PathType Leaf){
              $receipt.lastLogLines=@(Get-Content -LiteralPath $logPath -Tail 80)
            }
            $receipt.checkedUtc=[DateTime]::UtcNow.ToString('o')
            $receipt|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $evidence 'nox-r08-wpf-boot-smoke.json') -Encoding utf8
          }
      - name: Retain narrow runtime receipt even on HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-r08-wpf-boot-runtime-evidence
          path: ci-evidence/nox-r08-wpf-boot-smoke.json
          retention-days: 30
          if-no-files-found: warn
