name: NOX V109 V29 source and no-stub release gate
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v109/**'
      - '.github/workflows/nox-v109-web-acceptance.yml'
      - 'coordination/NOX_V98_WEB_FULL_REAL_API_MATRIX.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and verify immutable V29 API inventory
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v109/web_v29_acceptance.py
          python - <<'PY'
          import json
          from pathlib import Path
          from nox_runpod.teacher_mesh.v109.web_v29_acceptance import REQUIRED
          d=json.loads(Path('coordination/NOX_V98_WEB_FULL_REAL_API_MATRIX.json').read_text())
          routes={x['route'] for x in d['functions']}
          assert d['integration_release_state']=='HOLD_NO_STUB_FULL_E2E'
          assert d['all_features_operational'] is False
          assert d['count_api_references']==92
          assert len(routes)==92
          assert set(REQUIRED)<=routes
          print('NOX_V109_STATIC_ROUTE_INVENTORY=PASS')
          print('NOX_V109_LIVE_E2E=NOT_TESTED')
          print('NOX_V109_PRODUCTION_RELEASE=HOLD')
          PY
