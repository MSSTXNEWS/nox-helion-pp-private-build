name: NOX LOCAL R7 Windows build
on:
  push:
    branches:
      - feature/nox-local-r7-cloud-build-20261106
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify source snapshot and compile Windows WPF WebView2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $archive='coordination/nox-local-r7/NOX_R7_SOURCE.zip'
          $expected='679a714e6febdb8d076effeaf35a3df28c504cce16f9073d57ead3438717d288'
          $actual=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw "SOURCE_SNAPSHOT_HASH_MISMATCH" }
          Expand-Archive -LiteralPath $archive -DestinationPath './nox-r7-build' -Force
          & dotnet publish './nox-r7-build/src/NOX.HELION.csproj' -c Release -r win-x64 --self-contained false -p:EnableWindowsTargeting=true -o './NOX_R7_WIN64'
          if ($LASTEXITCODE -ne 0) { throw "DOTNET_PUBLISH_FAILED: $LASTEXITCODE" }
          $exe=(Resolve-Path './NOX_R7_WIN64/NOX.HELION.exe').Path
          $sha=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{product='NOX HELION R7'; source_sha256=$expected; exe_sha256=$sha; build='PASS'; wpf_webview2_runtime='NOT_TESTED'; local_qwen_e2e='NOT_TESTED'; full_v16='NOT_IMPLEMENTED'; accepted_full_release=$false} | ConvertTo-Json | Set-Content './NOX_R7_WIN64/CLOUD_BUILD_RECEIPT.json' -Encoding UTF8
          Write-Host "WIN64_BUILD_PASS SHA256=$sha"
      - name: Native WebView2 UI smoke (non-interactive runner may HOLD)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path './NOX_R7_WIN64/NOX.HELION.exe').Path
          $runId='NOX-R7-GITHUB-'+$env:GITHUB_RUN_ID
          $p=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -ArgumentList @('--nox-ui-smoke',"--nox-runid=$runId") -PassThru
          try {
            Wait-Process -Id $p.Id -Timeout 80 -ErrorAction Stop
            $p.Refresh()
            $receipt=Join-Path $env:LOCALAPPDATA "NOX_HELION/ui_selftest_$($p.Id).json"
            if (!(Test-Path -LiteralPath $receipt)) { throw 'UI_RECEIPT_NOT_FOUND' }
            $json=Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
            $sha=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
            if ($p.ExitCode -ne 0 -or
                $json.schema -ne 'NOX_WPF_UI_SMOKE_R7_V1' -or
                !$json.wpfWebView2Accepted -or
                $json.pid -ne $p.Id -or
                $json.runId -cne $runId -or
                ![string]::Equals($json.exeSha256,$sha,[System.StringComparison]::OrdinalIgnoreCase)) { throw 'UI_NATIVE_HOLD' }
            Copy-Item -LiteralPath $receipt -Destination './NOX_R7_WIN64/UI_SMOKE_RECEIPT.json'
            Write-Host 'UI_SMOKE_PASS (QWEN NOT TESTED)'
          } finally {
            $p.Refresh()
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOX-R7-WIN64
          path: NOX_R7_WIN64/
          if-no-files-found: warn
          retention-days: 14
