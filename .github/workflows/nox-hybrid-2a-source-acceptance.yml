name: NOX Hybrid 2A Original SFTConfig Source Guard
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox-control/hybrid_training_entry.py'
      - 'nox-control/owner_native_inspect.py'
      - 'coordination/progress/hourly/nox_auto_2a_hf_metadata_test.py'
      - 'nox-control/test_owner_training_config_preflight.py'
      - 'nox-control/test_owner_native_inspect_receipt_privacy.py'
      - '.github/workflows/nox-hybrid-2a-source-acceptance.yml'
  workflow_dispatch:
jobs:
  original-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile exact original entry and preflight
        run: python -m py_compile nox-control/hybrid_training_entry.py nox-control/owner_training_config_preflight.py nox-control/test_owner_training_config_preflight.py
      - name: Existing strict real seam SFTConfig tests
        run: python -m unittest discover -s nox-control -p test_owner_training_config_preflight.py -v
      - name: Existing frozen dataset regression
        run: python -m unittest discover -s nox-control -p test_hybrid_training_dataset_reader.py -v

      - name: Exact 2A safetensors metadata layout test
        run: python coordination/progress/hourly/nox_auto_2a_hf_metadata_test.py
      - name: Existing native-inspector Qwen receipt integrity and privacy SOURCE regressions
        run: |
          python -m py_compile nox-control/owner_native_inspect.py nox-control/test_owner_native_inspect_inventory.py nox-control/test_owner_native_inspect_receipt_privacy.py
          python -m unittest discover -s nox-control -p test_owner_native_inspect_receipt_privacy.py -v
