name: NOX E2 V104 native model fastmode payload mapping
on:
  push:
    branches: [nox/e2-v104-chatquality-training-recovery-20261114]
    paths: ['.github/workflows/nox-e2-v104-payload-source.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: nox-v104-fastmode-code-mapping
  cancel-in-progress: false
jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile and credential gate
        run: |
          set -euo pipefail
          test -n "$NOX2"
          python3 -m py_compile nox_runpod/teacher_mesh/v104/fastmode_native_source_audit.py
      - name: Redacted native AST model/owner payload mapping
        run: python3 -m nox_runpod.teacher_mesh.v104.fastmode_native_source_audit
      - name: Cleanup one-time key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
