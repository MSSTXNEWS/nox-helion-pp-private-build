name: B3 R59 offline Chromium fixture
on:
  pull_request:
    paths:
      - 'coordination/onepass/b3_r59_*'
      - '.github/workflows/b3-r59-chromium.yml'
permissions:
  contents: read
jobs:
  chromium-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact browser
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Exact offline six-mode browser regression
        run: python coordination/onepass/b3_r59_chromium_fixture.py
      - uses: actions/upload-artifact@v4
        with:
          name: b3-r59-synthetic-browser-evidence
          path: b3-r59-browser-evidence/
