name: NOX B4 paired benchmark comparator source gate
on:
  push:
    branches:
      - b4/paired-quality-latency-gate-20261118
    # Verify the exact branch HEAD also after a base-sync merge; source blobs may be unchanged.
  pull_request:
    branches:
      - repair/nox-continuous-execution-20261118
permissions:
  contents: read
jobs:
  focused-b4:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: One focused offline comparator suite, no native mutation
        run: |
          set -euo pipefail
          python -m unittest discover -s nox-control/systemic_relay_20261118 -p 'test_b4_paired_benchmark_receipts.py' -v
          echo 'NOX_B4_SOURCE_TESTED_ONLY=true'
          echo 'NOX_B4_NATIVE_ACCEPTED=0'
      - name: One focused offline B4 Chromium CDP SSE reliability suite
        run: |
          set -euo pipefail
          node --version
          node --test nox-control/systemic_relay_20261118/test_b4_chrome_cdp_witness.mjs
          echo 'NOX_B4_CDP_SOURCE_TESTED_ONLY=true'
