name: NOX one-shot cgroup cache reclaim guard
on:
  pull_request:
    paths:
      - "nox-control/owner_atomic_qwen3_32b_stage.py"
      - "nox-control/owner_memory_map_census_oneshot.py"
      - "nox-control/owner_cold_file_cache_oneshot.py"
      - "nox-control/owner_safe_cgroup_reclaim_oneshot.py"
      - "nox-control/test_owner_safe_cgroup_reclaim_oneshot.py"
      - "nox-control/owner_native_operator.py"
      - ".github/workflows/nox-owner-cgroup-reclaim-one-shot-ci.yml"
permissions:
  contents: read
jobs:
  source-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile exact one-shot entry and run offline safety fixture
        run: |
          python -B -m py_compile nox-control/owner_atomic_qwen3_32b_stage.py nox-control/owner_memory_map_census_oneshot.py nox-control/owner_cold_file_cache_oneshot.py nox-control/owner_safe_cgroup_reclaim_oneshot.py nox-control/test_owner_safe_cgroup_reclaim_oneshot.py nox-control/owner_native_operator.py
          python -B nox-control/test_owner_safe_cgroup_reclaim_oneshot.py -v
