name: NOX isolated browser QA runtime recovery
on:
  pull_request:
    paths:
      - "nox-control/owner_browser_stream_only_entry.py"
      - "nox-control/test_owner_browser_stream_only_entry.py"
      - ".github/workflows/nox-browser-qa-runtime-bootstrap-ci.yml"
permissions:
  contents: read
jobs:
  isolated-browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile and validate isolated bootstrap without any downloads
        run: |
          python -B -m py_compile nox-control/owner_browser_stream_only_entry.py nox-control/test_owner_browser_stream_only_entry.py
          python -B nox-control/test_owner_browser_stream_only_entry.py -v
