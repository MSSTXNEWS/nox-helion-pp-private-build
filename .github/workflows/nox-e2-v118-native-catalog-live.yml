name: NOX V118 one gated native V29 owner catalog repair
on:
  push:
    branches: [nox/e2-v118-staged-native-catalog-links-20261115]
    paths:
      - '.github/workflows/nox-e2-v118-native-catalog-live.yml'
      - 'nox_runpod/teacher_mesh/v118/**'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Only after native forensics, fresh source SHA readback, STOP and offsite backup review'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v118-staged-catalog-60509551
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile existing V118 safe installer and its embedded code
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v118/activate_staged_catalog.py
          python3 -m unittest -v nox_runpod.teacher_mesh.v118.test_activate_staged_catalog
  native:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' }}
    needs: safety
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Confirm existing authorized owner secret is bound
        run: |
          set -euo pipefail
          test -n "$NOX2" || { echo "HOLD_NOX2"; exit 2; }
      - name: Single exact-SHA native owner catalog overlay and guarded rollback
        run: python3 -m nox_runpod.teacher_mesh.v118.activate_staged_catalog
      - name: Detach temporary Vast SSH public key even on failure
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
