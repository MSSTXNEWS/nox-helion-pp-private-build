name: NOX native reflex proposal source CI
on:
  push:
    branches: [repair/nox-native-reflex-autorefill-20261119]
    paths:
      - 'nox-control/systemic_relay_20261118/runtime/owner_systemic_refill.py'
      - 'nox-control/systemic_relay_20261118/runtime/owner_subagent_dispatcher.py'
      - 'nox-control/systemic_relay_20261118/test_owner_reflex_cycle.py'
      - '.github/workflows/nox-native-reflex-source-ci.yml'
  pull_request:
    paths:
      - 'nox-control/systemic_relay_20261118/runtime/owner_systemic_refill.py'
      - 'nox-control/systemic_relay_20261118/runtime/owner_subagent_dispatcher.py'
      - 'nox-control/systemic_relay_20261118/test_owner_reflex_cycle.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  pure-source-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Syntax and deterministic autonomy-source tests
        run: |
          set -euo pipefail
          python -B -m py_compile nox-control/systemic_relay_20261118/runtime/owner_systemic_refill.py nox-control/systemic_relay_20261118/runtime/owner_subagent_dispatcher.py nox-control/systemic_relay_20261118/test_owner_reflex_cycle.py
          python -B -m unittest discover -s nox-control/systemic_relay_20261118 -p test_owner_reflex_cycle.py -v
      - name: Explicit scope
        run: |
          echo "SOURCE_TESTED only; NOT installed on native Vast"
          echo "NOX_NATIVE_REFLEX=SOURCE_CANDIDATE_ONLY"
