name: NOX E2 V67 sanitized proxy function audit
on:
  push:
    branches: [nox/e2-urgent-chat-recovery-20261114]
    paths:
      - '.github/workflows/nox-e2-v67-proxy-flow.yml'
      - 'nox_runpod/teacher_mesh/v67/proxy_flow_sanitized.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nox-e2-v67-proxy-flow
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source and authorization
        run: |
          set -euo pipefail
          test -n "$NOX2"
          python3 -m py_compile nox_runpod/teacher_mesh/v67/proxy_flow_sanitized.py
      - name: Inspect bounded sanitized existing proxy functions
        run: python3 -m nox_runpod.teacher_mesh.v67.proxy_flow_sanitized
      - name: Revoke temporary key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
