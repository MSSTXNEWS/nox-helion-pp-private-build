name: NOX V116 owner signed cookie to existing V29 UI routes
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v116/**'
      - '.github/workflows/nox-v116-owner-cookie-ui.yml'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-60509551-proxy-cookie-auth
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source and native AST validation
        run: |
          python -m py_compile nox_runpod/teacher_mesh/v116/session_ui_cookie.py
          python - <<'PY'
          from nox_runpod.teacher_mesh.v116.session_ui_cookie import REMOTE
          code=REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0]
          compile(code,'<v116 native>','exec')
          for key in ('HOLD_NATIVE_SOURCE_SHA','HOLD_MIDDLEWARE_ANCHOR','_session_ok(request)',
                      'HOLD_UNAUTHORIZED_SESSION_BYPASS','rollback(previous,meta)'):
              assert key in REMOTE
          print('NOX_V116_SOURCE_SAFETY_PASS=true')
          PY
  native:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Safe existing OneHost owner session UI route fix
        run: python -m nox_runpod.teacher_mesh.v116.session_ui_cookie
      - name: Always detach temporary SSH key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
