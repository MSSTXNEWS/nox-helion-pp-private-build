name: NOX V136 Tigris nox2 owner-key match and S3 read-only
on:
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved read-only access to existing Tigris bucket'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v136-tigris-read-only-keycheck
  cancel-in-progress: false
jobs:
  authenticate-readonly:
    if: "github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && github.ref == 'refs/heads/feature/nox-v38-synaptic-brain-20261114'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
      TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
      TIGRIS_ALT_ID: ${{ secrets.TIGRIS_S3_ACCESS_KEY_ID }}
      TIGRIS_ALT_SECRET: ${{ secrets.TIGRIS_S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Check exact owner Tigris nox2 ID fingerprint without revealing credentials
        run: |
          python3 - <<'PY'
          import hashlib,os,sys
          expected='bbe514c68d2255e4767dabf30f5ee4916b7cf5bcfc1b912dda79ef1691cdae72'
          pairs=[('PRIMARY',os.getenv('TIGRIS_ACCESS_KEY_ID') or '',os.getenv('TIGRIS_SECRET_ACCESS_KEY') or ''),
                 ('ALT',os.getenv('TIGRIS_ALT_ID') or '',os.getenv('TIGRIS_ALT_SECRET') or '')]
          found=[]
          for name,key,secret in pairs:
              matches=bool(key and hashlib.sha256(key.strip().encode('utf8')).hexdigest()==expected)
              shape=bool(secret and secret.strip().startswith('tsec_') and secret.strip()==secret)
              print('NOX_TIGRIS_'+name+'_KEY_ID_IS_OWNER_NOX2='+str(matches).lower())
              print('NOX_TIGRIS_'+name+'_SECRET_FORMAT_OK='+str(shape).lower())
              if matches and shape:found.append(name)
          print('NOX_TIGRIS_NO_SECRET_VALUES_PRINTED=true')
          if len(found)!=1:
              print('NOX_TIGRIS_OWNER_KEYPAIR=HOLD_GITHUB_SECRET_MISMATCH_OR_MISSING')
              sys.exit(2)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('NOX_TIGRIS_SCOPED_PAIR='+found[0]+'\n')
          print('NOX_TIGRIS_OWNER_KEYPAIR=FORMAT_MATCHED_NOT_AUTHENTICATED')
          PY
      - name: Install test-only S3 client in GitHub runner
        run: python3 -m pip -q install 'boto3>=1.35,<2'
      - name: Authenticated read-only existing nox bucket, do not list object names
        run: |
          python3 - <<'PY'
          import os,sys
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError
          chosen=os.environ.get('NOX_TIGRIS_SCOPED_PAIR')
          if chosen=='PRIMARY':
              key=os.environ.get('TIGRIS_ACCESS_KEY_ID','').strip()
              secret=os.environ.get('TIGRIS_SECRET_ACCESS_KEY','').strip()
          elif chosen=='ALT':
              key=os.environ.get('TIGRIS_ALT_ID','').strip()
              secret=os.environ.get('TIGRIS_ALT_SECRET','').strip()
          else:
              print('NOX_TIGRIS_READONLY=HOLD_PAIR_NOT_APPROVED');sys.exit(2)
          try:
              s3=boto3.client('s3',endpoint_url='https://t3.storage.dev',
                             region_name='auto',aws_access_key_id=key,
                             aws_secret_access_key=secret,
                             config=Config(retries={'max_attempts':1},connect_timeout=8,read_timeout=12))
              result=s3.list_objects_v2(Bucket='nox',MaxKeys=1)
              if not isinstance(result,dict):raise RuntimeError('HOLD_REMOTE_RESPONSE')
          except ClientError as error:
              allowed={'InvalidAccessKeyId','SignatureDoesNotMatch','AccessDenied',
                       'NoSuchBucket','ExpiredToken','InvalidToken','AuthorizationHeaderMalformed'}
              code=str(error.response.get('Error',{}).get('Code',''))
              print('NOX_TIGRIS_READONLY=HOLD_'+(code if code in allowed else 'S3_FAILURE'))
              sys.exit(2)
          except Exception as error:
              print('NOX_TIGRIS_READONLY=HOLD_'+type(error).__name__)
              sys.exit(2)
          print('NOX_TIGRIS_AUTHENTICATED_S3_LIST=PASS')
          print('NOX_TIGRIS_EXISTING_BUCKET=nox')
          print('NOX_TIGRIS_OBJECT_NAMES_OR_CONTENT_EXPORTED=false')
          print('NOX_TIGRIS_REMOTE_WRITE_OR_DELETE=false')
          print('NOX_TIGRIS_WEIGHTS_OR_S03_CHANGED=false')
          PY
