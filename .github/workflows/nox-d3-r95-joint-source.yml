name: D3 R95 joint source delivery
on:
  pull_request:
    paths: ['nox-control/d3-r95/**', '.github/workflows/nox-d3-r95-joint-source.yml']
permissions:
  contents: read
jobs:
  joint_source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'd3-r95-r93-r79-joint-artifact-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Build and read back one joint artifact from tracked sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nox-r95"
          python3 -B nox-control/d3-r95/build_joint.py --repo . --output "$RUNNER_TEMP/nox-r95/nox-joint-source.zip"
          python3 -B nox-control/d3-r95/verify_joint.py "$RUNNER_TEMP/nox-r95/nox-joint-source.zip"
          sha256sum "$RUNNER_TEMP/nox-r95/nox-joint-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: NOX-R95-joint-source-only
          path: ${{ runner.temp }}/nox-r95/nox-joint-source.zip
          if-no-files-found: error
          retention-days: 14
