name: NOX V70 discover current public main-chat entrypoint
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v70-web-entrypoint.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions: {contents: read}
concurrency:
  group: nox-v70-web-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Audit public mapping and local chat routes without mutation
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v70/web_entrypoint_discovery.py
          python3 -m nox_runpod.teacher_mesh.v70.web_entrypoint_discovery
      - name: Cleanup exact temporary SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Explicit safety boundary
        if: success()
        run: |
          echo 'NOX_PRODUCTION_CHANGED=false'
          echo 'NOX_CHAT_RESTARTED=false'
          echo 'NOX_MODELS_CHANGED=false'
