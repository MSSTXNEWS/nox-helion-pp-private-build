name: NOX P03 C40 + TURBO10 owner component gate (not release QA)
on:
  pull_request:
    paths:
      - 'Packages/P03/C40/**'
      - '.github/workflows/p03-c40-component.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p03-source-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned source archive and extract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'Packages/P03/C40/NOX_V16_E03_C40_P03_CLOSURE_CANDIDATE.zip'
          $expected = '7eda02703538517e3efabf0e1814bcbee3ced167f897185e48eff7ed06c7c46b'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "P03_ARCHIVE_SHA_MISMATCH" }
          Expand-Archive -LiteralPath $zip -DestinationPath p03-c40-source -Force
          if (-not (Test-Path 'p03-c40-source/P03.ModelCenter/P03.ModelCenter.csproj')) { throw 'P03_CSPROJ_MISSING' }
      - name: Apply owner-scoped TURBO10 patch over exact C40 snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = (Resolve-Path 'Packages/P03/C40/NOX_V16_E03_TURBO10_from_C40.patch').Path
          $expected = 'bb6f38d3da5389039236f8c66419e74b8e593b5db66280df7a89a8932ba12149'
          # Git on Windows may checkout .patch files with CRLF despite LF blob bytes.
          # Normalize into a temp copy for a SHA-256 check over the exact original patch bytes.
          $patchText = [System.IO.File]::ReadAllText($patch).Replace("`r`n", "`n")
          $patchBytes = [System.Text.Encoding]::UTF8.GetBytes($patchText)
          $actual = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($patchBytes)).ToLowerInvariant()
          if ($actual -ne $expected) { throw "P03_TURBO10_PATCH_SHA_MISMATCH actual=$actual" }
          $exactPatch = Join-Path $env:RUNNER_TEMP 'NOX_P03_TURBO10_exact.patch'
          [System.IO.File]::WriteAllBytes($exactPatch, $patchBytes)
          git -C p03-c40-source init -q
          if ($LASTEXITCODE -ne 0) { throw 'P03_GIT_INIT_FAILED' }
          git -C p03-c40-source apply --check $exactPatch
          if ($LASTEXITCODE -ne 0) { throw 'P03_TURBO10_PREIMAGE_FAILED' }
          git -C p03-c40-source apply $exactPatch
          if ($LASTEXITCODE -ne 0) { throw 'P03_TURBO10_APPLY_FAILED' }
      - name: Apply owner-scoped TURBO11 patch over exact TURBO10 snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = (Resolve-Path 'Packages/P03/C40/NOX_V16_E03_TURBO11_from_TURBO10.patch').Path
          $expected = 'f9fc4845d456d478fae9312d761c130999416ee3ebdf3be1ad9d76554a518506'
          # Git on Windows may checkout .patch files with CRLF despite LF blob bytes.
          # Normalize into a temp copy for a SHA-256 check over the exact original patch bytes.
          $patchText = [System.IO.File]::ReadAllText($patch).Replace("`r`n", "`n")
          $patchBytes = [System.Text.Encoding]::UTF8.GetBytes($patchText)
          $actual = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($patchBytes)).ToLowerInvariant()
          if ($actual -ne $expected) { throw "P03_TURBO11_PATCH_SHA_MISMATCH actual=$actual" }
          $exactPatch = Join-Path $env:RUNNER_TEMP 'NOX_P03_TURBO11_exact.patch'
          [System.IO.File]::WriteAllBytes($exactPatch, $patchBytes)
          git -C p03-c40-source apply --check $exactPatch
          if ($LASTEXITCODE -ne 0) { throw 'P03_TURBO11_PREIMAGE_FAILED' }
          git -C p03-c40-source apply $exactPatch
          if ($LASTEXITCODE -ne 0) { throw 'P03_TURBO11_APPLY_FAILED' }
          $manifest = Get-Content -Raw 'p03-c40-source/P03.ModelCenter/PIN_REVIEW_TEMPLATE_15.json' | ConvertFrom-Json
          if ($manifest.items.Count -ne 15) { throw 'P03_MODEL_REVIEW_COUNT' }
          if (@($manifest.items | Where-Object { $_.reviewStatus -ne 'REVIEW_REQUIRED' }).Count -ne 0) { throw 'P03_MODEL_REVIEW_GATE' }
      - name: Apply E03 TURBO12 additive overlay (retain TURBO10/11, enforce exact bytes)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = 'Packages/P03/C40/NOX_V16_E03_TURBO12_additive_hardening.patch'
          $expected = 'fbfa3c354e2bfeb52871a2cae28d61e1b1c5db198d8e2539d1593f73397292b4'
          $actual = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'P03_TURBO12_PATCH_SHA_MISMATCH' }
          git -C p03-c40-source apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'P03_TURBO12_PREIMAGE_CONFLICT' }
          git -C p03-c40-source apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'P03_TURBO12_APPLY_FAILED' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build source and run deterministic component smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build p03-c40-source/P03.ModelCenter.Smoke/P03.ModelCenter.Smoke.csproj --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'P03_BUILD_FAILED' }
          dotnet run --project p03-c40-source/P03.ModelCenter.Smoke/P03.ModelCenter.Smoke.csproj --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'P03_SMOKE_FAILED' }
      - name: JavaScript syntax (no npm download)
        shell: pwsh
        run: |
          node --check p03-c40-source/P03.ModelCenter.Wow/ui.js
          if ($LASTEXITCODE -ne 0) { throw 'P03_JS_CHECK_FAILED' }

      - name: E03 TURBO12 targeted .NET safety suite (fake data, no weights/downloads)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build p03-c40-source/P03.ModelCenter.HardeningSmoke/P03.ModelCenter.HardeningSmoke.csproj --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'P03_TURBO12_BUILD_FAILED' }
          dotnet run --project p03-c40-source/P03.ModelCenter.HardeningSmoke/P03.ModelCenter.HardeningSmoke.csproj --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'P03_TURBO12_TEST_FAILED' }
