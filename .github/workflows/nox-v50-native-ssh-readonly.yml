name: NOX V50 authenticated native SSH read-only admission
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v50-native-ssh-readonly.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v50-ssh-readonly-admission
  cancel-in-progress: false
jobs:
  admit:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOX2: ${{ secrets.NOX2 }}
      NOX_VAST_SSH_PRIVATE_KEY: ${{ secrets.NOX_VAST_SSH_PRIVATE_KEY }}
      NOX_VAST_SSH_KNOWN_HOSTS: ${{ secrets.NOX_VAST_SSH_KNOWN_HOSTS }}
    steps:
      - name: Verify Vast identity and protected SSH credential availability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,urllib.request
          key=os.environ.get("NOX2","")
          if not key:raise SystemExit("HOLD_NOX2_MISSING")
          req=urllib.request.Request("https://console.vast.ai/api/v0/instances/60509551/",
              headers={"Authorization":"Bearer "+key,"Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=25) as response:d=json.load(response)
          inst=d.get("instances",d) if isinstance(d,dict) else None
          if isinstance(inst,list):inst=next((x for x in inst if str(x.get("id"))=="60509551"),None)
          if not isinstance(inst,dict) or str(inst.get("id"))!="60509551":
              raise SystemExit("HOLD_INSTANCE_NOT_VERIFIED")
          if inst.get("actual_status")!="running":
              raise SystemExit("HOLD_INSTANCE_NOT_RUNNING")
          host=inst.get("ssh_host")
          port=inst.get("ssh_port")
          if not isinstance(host,str) or not re.fullmatch(r"[a-zA-Z0-9][a-zA-Z0-9.-]{1,253}",host):
              raise SystemExit("HOLD_SSH_HOST_NOT_VERIFIED")
          if not str(port).isdigit() or not 1<=int(port)<=65535:
              raise SystemExit("HOLD_SSH_PORT_NOT_VERIFIED")
          with open(os.environ["RUNNER_TEMP"]+"/nox_ssh_target","w",encoding="ascii") as f:
              f.write(host+"\n"+str(port)+"\n")
          print("VAST_INSTANCE_VERIFIED=true")
          print("VAST_STATUS=running")
          print("VAST_GPU_COUNT="+str(inst.get("num_gpus","unknown")))
          print("SSH_ROUTE_FROM_AUTHENTICATED_API=true")
          print("SSH_PRIVATE_KEY_SECRET_PRESENT="+str(bool(os.environ.get("NOX_VAST_SSH_PRIVATE_KEY"))).lower())
          print("SSH_KNOWN_HOSTS_SECRET_PRESENT="+str(bool(os.environ.get("NOX_VAST_SSH_KNOWN_HOSTS"))).lower())
          PY
      - name: Native inventory by existing SSH identity (no writes)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NOX_VAST_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::HOLD_NATIVE_SSH_KEY_NOT_CONFIGURED; API-only connection is not shell access"
            exit 2
          fi
          umask 077
          keyfile="$RUNNER_TEMP/nox_existing_identity"
          printf '%s\n' "$NOX_VAST_SSH_PRIVATE_KEY" > "$keyfile"
          if ! ssh-keygen -y -f "$keyfile" > /dev/null 2>&1; then
            echo "::error::HOLD_NATIVE_SSH_PRIVATE_KEY_INVALID"
            exit 2
          fi
          host="$(sed -n '1p' "$RUNNER_TEMP/nox_ssh_target")"
          port="$(sed -n '2p' "$RUNNER_TEMP/nox_ssh_target")"
          known_hosts="$RUNNER_TEMP/nox_known_hosts"
          if [ -n "${NOX_VAST_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$NOX_VAST_SSH_KNOWN_HOSTS" > "$known_hosts"
            ssh_policy=yes
            echo "SSH_HOST_TRUST=pinned_by_owner_secret"
          else
            ssh_policy=accept-new
            echo "SSH_HOST_TRUST=first_use_unpinned_READONLY_ONLY"
          fi
          if ! timeout 75s ssh -T -i "$keyfile" -p "$port" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=12 -o NumberOfPasswordPrompts=0 \
              -o StrictHostKeyChecking="$ssh_policy" \
              -o UserKnownHostsFile="$known_hosts" "root@$host" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo "NATIVE_SSH_COMMAND_EXECUTED=true"
          echo "REMOTE_UID=$(id -u)"
          nvidia-smi --query-gpu=index,name,memory.total,memory.used,utilization.gpu,temperature.gpu --format=csv,noheader,nounits 2>/dev/null | head -n 2 | sed 's/^/GPU_NATIVE=/'
          free -b | awk '/^Mem:/{print "RAM_TOTAL_BYTES="$2; print "RAM_USED_BYTES="$3}'
          df -B1 /workspace | awk 'NR==2{print "WORKSPACE_DISK_SIZE_BYTES="$2;print "WORKSPACE_DISK_USED_BYTES="$3;print "WORKSPACE_DISK_FREE_BYTES="$4}'
          ps -eo comm= | awk '/python|uvicorn|llama|supervisord|ollama|trainer/{n++}END{print "CANDIDATE_PROCESS_COUNT="(n+0)}'
          REMOTE
          then
            echo "::error::HOLD_NATIVE_SSH_CONNECT_OR_COMMAND_FAILED; no native receipt"
            exit 2
          fi
          echo "NOX_NATIVE_SSH_INVENTORY_RECEIVED=true"
          echo "LIVE_WRITE_EXECUTED=false"
