name: NOX V63 native installed package and original WEB acceptance
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v63-dependency-acceptance.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v63-dependency-native-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile audit
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v63/dependency_acceptance.py
      - name: Read package versions and original model/WEB/S03 file metadata
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v63.dependency_acceptance
      - name: Revoke temporary SSH key even on failure
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Evidence scope
        if: success()
        run: |
          echo "NATIVE_PACKAGE_AND_ARTIFACT_READBACK=true"
          echo "PACKAGES_INSTALLED_BY_WORKFLOW=false"
          echo "SERVICES_RESTARTED_BY_WORKFLOW=false"
