name: NOX V114 authenticated V29 real SSE + S03 dialog E2E
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v114/owner_v29_dialog_acceptance.py'
      - '.github/workflows/nox-v114-web-dialog-e2e.yml'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions: {contents: read}
concurrency:
  group: nox-v114-unique-owner-dialog-e2e
  cancel-in-progress: false
jobs:
  authentic:
    runs-on: ubuntu-latest
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    timeout-minutes: 12
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compile and prove fail-closed source guards
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v114/owner_v29_dialog_acceptance.py
          python3 - <<'PY'
          from nox_runpod.teacher_mesh.v114.owner_v29_dialog_acceptance import REMOTE
          source=REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0]
          compile(source, '<v114 authentic owner>', 'exec')
          for literal in ("HOLD_NATIVE_BUILD_SHA_CHANGED","HOLD_ONEHOST_BUSY",
                          "HOLD_OWNER_COOKIE","HOLD_FULL_S03_DIALOG_STREAM_RECEIPT",
                          "HOLD_OWNER_S03_DIALOG_READBACK","HOLD_OWNER_WEB_NATIVE_SWITCH",
                          "NATIVE_V114_PRIVATE_OWNER_AUTH_EXPORTED=false"):
              assert literal in source,literal
          print('NOX_V114_E2E_SOURCE_COMPILES_PASS=true')
          PY
      - name: Real owner cookie native V29 WEB page+create+stream+S03 readback
        run: python3 -m nox_runpod.teacher_mesh.v114.owner_v29_dialog_acceptance
      - name: Revoke temporary SSH identity
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
