name: NOX B1 isolated real Chromium IndexedDB ACK gate
on:
  pull_request:
    paths:
      - nox-control/test_b1_chromium_idb.py
      - nox-control/b1_client_ack_indexeddb_store.js
      - .github/workflows/nox-b1-real-chromium-idb-ci.yml
  workflow_dispatch:
jobs:
  b1-chromium-indexeddb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned real browser test prerequisites
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: B1 real Chromium IDB transaction, reload and no-duplicate check
        run: |
          python -m py_compile nox-control/test_b1_chromium_idb.py
          python nox-control/test_b1_chromium_idb.py
