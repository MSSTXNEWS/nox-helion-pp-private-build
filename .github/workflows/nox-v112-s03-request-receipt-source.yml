name: NOX V112 S03 request receipt source tests
on:
  push:
    branches:
      - codex/nox-v112-s03-receipt-05af-20261116
    paths:
      - 'nox_runpod/teacher_mesh/v112/native_v29_full_bridge.py'
      - 'nox_runpod/teacher_mesh/v112/tests/test_native_bridge.py'
      - '.github/workflows/nox-v112-s03-request-receipt-source.yml'
  pull_request:
    paths:
      - 'nox_runpod/teacher_mesh/v112/native_v29_full_bridge.py'
      - 'nox_runpod/teacher_mesh/v112/tests/test_native_bridge.py'
      - '.github/workflows/nox-v112-s03-request-receipt-source.yml'
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source test dependencies
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Compile and run isolated V112 receipt regressions
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v112/native_v29_full_bridge.py
          python -m py_compile nox_runpod/teacher_mesh/v112/tests/test_native_bridge.py
          python -m unittest nox_runpod.teacher_mesh.v112.tests.test_native_bridge -v
      - name: Mark runtime boundary
        run: |
          echo 'SOURCE_TESTED_ONLY=true'
          echo 'PRODUCTION_WRITER_RECEIPT_CONTRACT_VERIFIED=false'
          echo 'NOX_PROCESS_LAUNCHED=false'
          echo 'GPU_OR_MODEL_TESTED=false'
