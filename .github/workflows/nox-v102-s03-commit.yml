name: NOX V102 S03 actual commit/readback structural verification
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v102-s03-commit.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions: {contents: read}
concurrency:
  group: nox-v102-s03-commit-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile trusted runner/native source
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v102/s03_commit_source_audit.py
          python3 - <<'PY'
          from nox_runpod.teacher_mesh.v102.s03_commit_source_audit import REMOTE
          compile(REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0],
                  '<native-v102>','exec')
          PY
      - name: Native S03 current source, no memory records
        run: python3 -m nox_runpod.teacher_mesh.v102.s03_commit_source_audit
      - name: Revoke temporary SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
