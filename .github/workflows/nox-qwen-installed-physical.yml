name: NOX QWEN installed FULL D02 3b13 same-Setup physical verification
on:
  push:
    branches: [integration/nox-v16-unified-candidate-20261028-r01]
    paths:
      - coordination/e07/probe_installed_qwen.py
      - coordination/e07/probe_native_active_stop.py
      - tests/e07/test_probe_native_active_stop_f02.py
      - .github/workflows/nox-qwen-installed-physical.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nox-qwen-installed-physical-${{ github.ref }}
  cancel-in-progress: false
jobs:
  live-qwen-on-installed-nox:
    if: github.repository == 'MSSTXNEWS/nox-helion-pp-private-build'
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - name: Checkout exact QA source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use pinned Python 3.12 on Windows
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
          check-latest: false
      - name: Compile existing installed Qwen native probe before costly downloads
        shell: pwsh
        run: |
          python -B -m py_compile coordination/e07/probe_installed_qwen.py
          if ($LASTEXITCODE -ne 0) { throw 'QWEN_PROBE_SYNTAX_HOLD' }
          python -B -m py_compile coordination/e07/probe_native_active_stop.py
          if ($LASTEXITCODE -ne 0) { throw 'ACTIVE_STOP_OWNED_PROBE_SYNTAX_HOLD' }
          python -B -m unittest discover -s tests/e07 -p test_probe_native_active_stop_f02.py -v
          if ($LASTEXITCODE -ne 0) { throw 'ACTIVE_STOP_OWNED_PROBE_REGRESSION_HOLD' }
      - name: Download already-verified Ollama Windows installer
        uses: actions/download-artifact@v4
        with:
          run-id: 41324910974
          name: nox-r11-official-ollama-41324910974
          github-token: ${{ github.token }}
          path: input/ollama
      - name: Download exact successful NOX Windows Setup
        uses: actions/download-artifact@v4
        with:
          run-id: 41869997321
          name: nox-v16-e06-onehost-diagnostic-41869997321
          github-token: ${{ github.token }}
          path: input/nox
      - name: Verify both physical installers without relaxing any source pins
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ollama='input/ollama/OllamaSetup-v0.40.13-x64.exe'
          $nox='input/nox/e06/onehost-wow-diagnostic/NOX-HELION-V16-DIAGNOSTIC-SETUP.exe'
          $handoff='input/nox/e06/onehost-wow-diagnostic/E07_BUILT_HANDOFF.json'
          if (-not (Test-Path -LiteralPath $handoff -PathType Leaf)) { throw 'FULLD02_SOURCE_BUILDID_HANDOFF_MISSING' }
          $frozen=Get-Content -LiteralPath $handoff -Raw -Encoding UTF8 | ConvertFrom-Json -ErrorAction Stop
          if ($frozen.source_commit_sha1 -cne '3b13cf596749e19555af249998f2910578c0a995' -or $frozen.setup_sha256 -cne 'f5064b45a558f37b1577d2f9877dbd916eacc464402add6f0d739abb9beb8046' -or $frozen.build_id -cne 'NOX-V16-6aadc683f32637bba72f2519' -or $frozen.phase -cne 'BUILT' -or $frozen.release_accepted -ne $false) { throw 'FULLD02_IMMUTABLE_SOURCE_SETUP_BUILDID_HOLD' }
          if (-not (Test-Path -LiteralPath $ollama -PathType Leaf)) { throw 'PINNED_OLLAMA_INSTALLER_NOT_FOUND' }
          if (-not (Test-Path -LiteralPath $nox -PathType Leaf)) { throw 'PINNED_NOX_SETUP_NOT_FOUND' }
          if ((Get-Item -LiteralPath $ollama).Length -ne 1676266440) { throw 'OLLAMA_ORIGINAL_BYTES_HOLD' }
          if ((Get-FileHash -LiteralPath $ollama -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9e3c76e54e7184c68e88a2378b909bf59bbe454f83c076cb4f4a717e946ae719') { throw 'OLLAMA_ORIGINAL_SHA256_HOLD' }
          $sig=Get-AuthenticodeSignature -LiteralPath $ollama
          if ($sig.Status -ne 'Valid') { throw 'OLLAMA_AUTHENTICODE_NOT_VALID_HOLD' }
          if ((Get-Item -LiteralPath $nox).Length -ne 169651627) { throw 'NOX_SETUP_BYTES_HOLD' }
          if ((Get-FileHash -LiteralPath $nox -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f5064b45a558f37b1577d2f9877dbd916eacc464402add6f0d739abb9beb8046') { throw 'NOX_SETUP_SHA256_HOLD' }
          New-Item -ItemType Directory -Force -Path 'work/qwen-installed' | Out-Null
          Copy-Item -LiteralPath $handoff -Destination 'work/qwen-installed/FROZEN_FULLD02_BUILDID.json' -ErrorAction Stop
          Write-Host 'FULLD02_3B13_IMMUTABLE_SETUP_SHA_BUILDID_PASS_NOT_E07'
      - name: Install Ollama from verified bytes and start original local provider
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'
          $env:OLLAMA_NO_CLOUD='1'
          $env:OLLAMA_HOST='127.0.0.1:11434'
          $p=Start-Process -FilePath (Resolve-Path 'input/ollama/OllamaSetup-v0.40.13-x64.exe').Path -ArgumentList '/VERYSILENT /NORESTART /SUPPRESSMSGBOXES /SP-' -PassThru
          # Wait only for the installer process, not the long-lived Ollama app children.
          if (-not $p.WaitForExit(180000)) { throw 'OLLAMA_INSTALLER_PROCESS_TIMEOUT_HOLD' }
          if ($p.ExitCode -ne 0) { throw 'OLLAMA_INSTALL_EXIT_HOLD' }
          $ollama=Join-Path $env:LOCALAPPDATA 'Programs/Ollama/ollama.exe'
          if (-not (Test-Path -LiteralPath $ollama -PathType Leaf)) { throw 'OLLAMA_INSTALLED_CLI_ABSENT' }
          $env:OLLAMA_CLI=$ollama
          $proc=Start-Process -FilePath $ollama -ArgumentList 'serve' -WindowStyle Hidden -PassThru
          $ready=$false
          for($i=0;$i -lt 120;$i++) {
            Start-Sleep -Seconds 2
            try {
              $health=Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/tags' -TimeoutSec 3 -ErrorAction Stop
              if ($null -ne $health.models) { $ready=$true; break }
            } catch { }
            if ($proc.HasExited) { throw 'OLLAMA_LOCAL_SERVER_EXITED' }
          }
          if (-not $ready) { throw 'OLLAMA_LOCAL_SERVER_NOT_READY' }
          Write-Host 'REAL_LOCAL_OLLAMA_API_READY_NO_MODEL_PASS_YET'
      - name: Pull official Qwen2.5 Coder 1.5B and verify Ollama-reported manifest digest
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference='Stop'
          $env:OLLAMA_NO_CLOUD='1'
          $env:OLLAMA_HOST='127.0.0.1:11434'
          $ollama=Join-Path $env:LOCALAPPDATA 'Programs/Ollama/ollama.exe'
          & $ollama pull qwen2.5-coder:1.5b
          if ($LASTEXITCODE -ne 0) { throw 'QWEN_OFFICIAL_OCI_PULL_FAILED' }
          $tags=Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/tags' -TimeoutSec 30 -ErrorAction Stop
          $one=@($tags.models | Where-Object {$_.name -eq 'qwen2.5-coder:1.5b'})
          if ($one.Count -ne 1 -or $one[0].digest -cne 'd7372fd828518a4d38b1eb196c673c31a85f2ed302b3d1e406c4c2d1b64a0668') { throw 'QWEN_15B_MANIFEST_TAG_HOLD' }
          Write-Host 'QWEN_15B_OFFICIAL_MANIFEST_DIGEST_PRESENT'
      - name: Install the exact frozen NOX Setup and probe REAL installed OneHost
        id: realprobe
        shell: pwsh
        timeout-minutes: 14
        run: |
          $ErrorActionPreference='Stop'
          $env:OLLAMA_NO_CLOUD='1'
          $env:OLLAMA_HOST='127.0.0.1:11434'
          $nox=(Resolve-Path 'input/nox/e06/onehost-wow-diagnostic/NOX-HELION-V16-DIAGNOSTIC-SETUP.exe').Path
          $p=Start-Process -FilePath $nox -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'NOX_EXACT_SETUP_INSTALL_FAILED' }
          $backend=Join-Path $env:LOCALAPPDATA 'Programs/NOX HELION/Backend/NOX_HELION_PRIVATE_CANDIDATE.exe'
          if (-not (Test-Path -LiteralPath $backend -PathType Leaf)) { throw 'NOX_INSTALLED_ONEHOST_MISSING' }
          python -B coordination/e07/probe_installed_qwen.py --backend "$backend" --out work/qwen-installed/QWEN_INSTALLED_RECEIPT.json
          if ($LASTEXITCODE -ne 0) { throw 'NOX_INSTALLED_QWEN_OR_STREAM_HOLD' }
          Write-Host 'INSTALLED_NOX_QWEN_LIVE_EVIDENCE_NOT_FULL_E07'
      - name: Physically interrupt live native OneHost stream AFTER real Qwen history probe
        id: activestop
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference='Stop'
          $env:OLLAMA_NO_CLOUD='1'
          $env:OLLAMA_HOST='127.0.0.1:11434'
          $backend=Join-Path $env:LOCALAPPDATA 'Programs/NOX HELION/Backend/NOX_HELION_PRIVATE_CANDIDATE.exe'
          if (-not (Test-Path -LiteralPath $backend -PathType Leaf)) { throw 'FULLD02_NATIVE_STOP_BACKEND_MISSING' }
          $data=Join-Path $env:RUNNER_TEMP 'nox-full-d02-active-stop'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          python -B -m py_compile coordination/e07/probe_native_active_stop.py
          if ($LASTEXITCODE -ne 0) { throw 'FULLD02_ACTIVE_STOP_SOURCE_SYNTAX_HOLD' }
          python -B coordination/e07/probe_native_active_stop.py --backend "$backend" --data-dir "$data" --model qwen2.5-coder:1.5b --out work/qwen-installed/ACTIVE_STOP_RECEIPT.json
          if ($LASTEXITCODE -ne 0) { throw 'FULLD02_ACTIVE_STOP_AFTER_REAL_DELTA_HOLD' }
          Write-Host 'FULLD02_NATIVE_ACTIVE_STOP_PHYSICAL_PASS_NOT_E07'
      - name: Preserve evidence without falsely promoting incomplete release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NOX-QWEN-FULLD02-3B13-${{ github.sha }}-${{ github.run_id }}
          path: |
            work/qwen-installed/QWEN_INSTALLED_RECEIPT.json
            work/qwen-installed/ACTIVE_STOP_RECEIPT.json
            work/qwen-installed/FROZEN_FULLD02_BUILDID.json
          if-no-files-found: warn
          retention-days: 14
      - name: Do not promote a provider-only pass to a NOX release
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.realprobe.outcome }}' -ne 'success') { throw 'FULLD02_REAL_QWEN_INSTALLED_HOLD' }
          if ('${{ steps.activestop.outcome }}' -ne 'success') { throw 'FULLD02_NATIVE_ACTIVE_STOP_HOLD' }
          Write-Host 'FULLD02_3B13_QWEN_STREAM_SQLITE_AND_ACTIVE_STOP_VERIFIED_ON_IDENTICAL_SETUP; FIVE FUNCTIONAL BUTTONS/VISUAL/E07 STILL_HOLD'
