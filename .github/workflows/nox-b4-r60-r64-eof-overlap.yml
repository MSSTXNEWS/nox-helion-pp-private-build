name: NOX B4 R60 R64 overlap and native EOF witness
on:
  pull_request:
    branches: [main]
    paths:
      - 'nox-control/systemic_relay_20261118/test_b4_r60_r64_eof_overlap.mjs'
      - '.github/workflows/nox-b4-r60-r64-eof-overlap.yml'
permissions:
  contents: read
jobs:
  overlap-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 568b5e548180c039629789b57e4b22ff0abc7f9a
          path: b3-pinned
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact bridge and deterministic overlap
        run: |
          set -euo pipefail
          test "$(git -C b3-pinned rev-parse HEAD)" = 568b5e548180c039629789b57e4b22ff0abc7f9a
          test "$(git hash-object b3-pinned/coordination/onepass/b3_r64_eof_candidate.js)" = 66595eac01c562aff4daae68f5d146aaed64cbbe
          test "$(git hash-object nox-control/systemic_relay_20261118/b4_sse_latency_probe.mjs)" = 3582fd900dde982d1abbc1ef0f7ba11025a2e0d5
          node nox-control/systemic_relay_20261118/test_b4_r60_r64_eof_overlap.mjs b3-pinned/coordination/onepass/b3_r64_eof_candidate.js
