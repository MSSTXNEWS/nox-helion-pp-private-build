name: NOX B1 R61 main-based UI candidate
on:
  pull_request:
    branches: [main]
    paths:
      - 'nox-control/b1-r61/**'
      - '.github/workflows/nox-b1-r61-main-candidate.yml'
permissions:
  contents: read
jobs:
  r61:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: |
          git rev-parse HEAD
          git hash-object nox-control/b1-r61/b1_abort_safe_ui_adapter.js
          git hash-object nox-control/b1-r61/test_b1_r58_adapter_chromium.py
          git hash-object nox-control/b1-r61/test_b1_r60_cumulative_chromium.py
          python nox-control/b1-r61/test_b1_r60_cumulative_chromium.py
