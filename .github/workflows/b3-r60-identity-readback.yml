name: B3 R60 isolated identity readback race
on:
  pull_request:
    paths:
      - 'coordination/onepass/b3_r60_identity_readback_race.cjs'
      - '.github/workflows/b3-r60-identity-readback.yml'
permissions:
  contents: read
jobs:
  identity-readback-race:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node coordination/onepass/b3_r60_identity_readback_race.cjs
