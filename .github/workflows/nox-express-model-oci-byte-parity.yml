name: NOX EXPRESS verified OCI manifest cache byte parity
on:
  push:
    branches: [integration/nox-v16-unified-candidate-20261028-r01]
    paths:
      - src/nox_selfbuilder/engines/fetch_ollama_weight_layers.py
      - tests/selfbuilder/test_model_cache_manifest_byte_parity.py
      - .github/workflows/nox-express-model-oci-byte-parity.yml
permissions:
  contents: read
concurrency:
  group: nox-express-oci-byte-parity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-source-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    steps:
      - name: Checkout original PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12 without model downloads
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Compile actual cache engine and regression
        shell: pwsh
        run: |
          python -B -m py_compile src/nox_selfbuilder/engines/fetch_ollama_weight_layers.py tests/selfbuilder/test_model_cache_manifest_byte_parity.py
          if ($LASTEXITCODE -ne 0) { throw 'OCI_CACHE_SYNTAX_HOLD' }
      - name: Verify exact upstream-manifest bytes are cached, without network
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests/selfbuilder -p test_model_cache_manifest_byte_parity.py -v
          if ($LASTEXITCODE -ne 0) { throw 'OCI_MANIFEST_BYTE_PARITY_HOLD' }
      - name: State strict acceptance boundary
        shell: pwsh
        run: |
          Write-Host 'SOURCE_TEST_ONLY: no model weights downloaded, no P03 owner approval, no Windows Setup built, no live inference, independent E07 remains HOLD.'
