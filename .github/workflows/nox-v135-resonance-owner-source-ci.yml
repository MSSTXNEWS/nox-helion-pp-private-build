name: NOX V135 original Resonance owner SSE and S03 real route source acceptance
on:
  push:
    branches: [fix/nox-v135-resonance-native-stream-20261115, feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox-control/owner_chat_ui.py'
      - 'nox-control/owner_chat_stream.py'
      - 'nox-control/test_owner_chat_stream.py'
      - 'nox-control/test_owner_chat_ui_workers.py'
      - 'nox-control/owner_chat_stream_only_qa.py'
      - 'nox-control/owner_browser_stream_only_entry.py'
      - 'nox-control/test_owner_chat_stream_only_qa.py'
      - 'coordination/onepass/nox-v135-resonance-owner-bridge.js'
      - 'coordination/onepass/nox-v137-owner-self-status.js'
      - 'nox_runpod/teacher_mesh/v137/**'
      - 'coordination/onepass/v135_resonance_owner_stage.py'
      - 'coordination/onepass/test_v135_resonance_owner_stage.py'
      - 'coordination/onepass/test_v135_resonance_owner_bridge.cjs'
      - 'coordination/onepass/test_ci_guard_coverage.py'
      - '.github/workflows/nox-v135-resonance-owner-source-ci.yml'
  pull_request:
    paths:
      - 'nox-control/owner_chat_ui.py'
      - 'nox-control/owner_chat_stream.py'
      - 'nox-control/test_owner_chat_stream.py'
      - 'nox-control/test_owner_chat_ui_workers.py'
      - 'nox-control/owner_chat_stream_only_qa.py'
      - 'nox-control/owner_browser_stream_only_entry.py'
      - 'nox-control/test_owner_chat_stream_only_qa.py'
      - 'coordination/onepass/nox-v135-resonance-owner-bridge.js'
      - 'coordination/onepass/nox-v137-owner-self-status.js'
      - 'nox_runpod/teacher_mesh/v137/**'
      - 'coordination/onepass/v135_resonance_owner_stage.py'
      - 'coordination/onepass/test_v135_resonance_owner_stage.py'
      - 'coordination/onepass/test_v135_resonance_owner_bridge.cjs'
      - 'coordination/onepass/test_ci_guard_coverage.py'
      - '.github/workflows/nox-v135-resonance-owner-source-ci.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Compile Python builder and JavaScript
        run: |
          set -euo pipefail
          python3 -m py_compile coordination/onepass/v135_resonance_owner_stage.py
          node --check coordination/onepass/nox-v135-resonance-owner-bridge.js
          node --check coordination/onepass/test_v135_resonance_owner_bridge.cjs
      - name: Real streaming fixture with delayed native terminal event
        run: |
          set -euo pipefail
          node --test coordination/onepass/test_v135_resonance_owner_bridge.cjs
      - name: Stream-only original owner browser source QA (no native commands)
        run: |
          set -euo pipefail
          PYTHONPATH=nox-control python3 -m unittest -v test_owner_chat_stream_only_qa
      - name: Original owner UI worker claims (source only, no server)
        run: |
          set -euo pipefail
          python3 -m pip install -q "fastapi==0.128.2"
          PYTHONPATH=nox-control python3 -m unittest -v test_owner_chat_ui_workers
      - name: Existing owner model SSE/STOP/S03 terminal stream regressions (source only)
        run: |
          set -euo pipefail
          python3 -m pip install -q "httpx==0.28.1"
          PYTHONPATH=nox-control python3 -m unittest -v test_owner_chat_stream
      - name: Byte-level ZIP no-loss and SHA-pinned rollback fixtures
        run: |
          set -euo pipefail
          python3 -m unittest -v coordination.onepass.test_v135_resonance_owner_stage
          python3 -m unittest -v coordination.onepass.test_ci_guard_coverage
      - name: Assemble minimal V135 integration source pack
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          paths=[
            'coordination/onepass/nox-v135-resonance-owner-bridge.js',
            'coordination/onepass/nox-v137-owner-self-status.js',
            'nox_runpod/teacher_mesh/v137/owner_self_observation.py',
            'nox_runpod/teacher_mesh/v137/owner_response_contract.py',
            'nox_runpod/teacher_mesh/v137/tests/test_owner_response_contract.py',
            'nox_runpod/teacher_mesh/v137/tests/test_owner_self_observation.py',
            'coordination/onepass/test_v137_owner_self_status.cjs',
            'coordination/onepass/v135_resonance_owner_stage.py',
            'coordination/onepass/test_v135_resonance_owner_bridge.cjs',
            'coordination/onepass/test_v135_resonance_owner_stage.py'
          ]
          hashes={s:hashlib.sha256(Path(s).read_bytes()).hexdigest() for s in paths}
          readme=(
            "NOX V135+V137 - SOURCE PATCH, NOT A RUNNING SERVER OR COMPLETE WEB ZIP\n"
            "Target: existing Vast.ai #60509551 OneHost owner staging, never a new host.\n"
            "Read-only verified original V29.3 ZIP: sha256 "
            "166becb90fce63e2db3f9a74281d756995844552cddb7b67a190aa0\n"
            "Use v135_resonance_owner_stage.py with --frozen, --source, "
            "--expected-source-sha and --output to generate a NEW archive.\n"
            "For source=V134 candidate use its exact SHA, NOT the frozen SHA.\n"
            "Never overwrite source, original S03, model weights or checkpoints.\n"
            "Production deployed: NO. Owner-cookie browser and latency E2E: HOLD.\n"
            "Script is owner-only at /nox-web-v29/pc/resonance.html and V22 template.\n"
          )
          out='NOX_V135_RESONANCE_OWNER_SOURCE_PATCH.zip'
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED) as z:
            for name in paths:z.write(name,name)
            z.writestr('README_V135_OWNER_STREAM_RU.txt',readme)
            z.writestr('MANIFEST_NOX_V135_SHA256.json',
                       json.dumps({'schema':'NOX_V135_SOURCE_ONLY_V1',
                         'files':hashes,'production_deployed':False,
                         'real_server_changed':False,'source_ci_required':True},
                        ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          with zipfile.ZipFile(out) as z:
            assert z.testzip() is None
            for name in paths:
              assert hashlib.sha256(z.read(name)).hexdigest()==hashes[name]
          print('NOX_V135_PACK_SHA256='+hashlib.sha256(Path(out).read_bytes()).hexdigest())
          print('NOX_V135_PACK_SOURCE_ONLY=true')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NOX_V135_RESONANCE_OWNER_SOURCE_PATCH
          path: NOX_V135_RESONANCE_OWNER_SOURCE_PATCH.zip
          retention-days: 30
          if-no-files-found: error
      - name: Declare scope accurately
        run: |
          echo 'NOX_V135_SOURCE_ACCEPTANCE=PASS'
          echo 'NOX_V135_LIVE_SERVER_DEPLOYED=false'
          echo 'NOX_V135_NATIVE_COOKIE_E2E_VERIFIED=false'
          echo 'NOX_V135_MODEL_WEIGHTS_OR_S03_TOUCHED=false'
