name: NOX B1 R51 isolated exact-source Chromium regression
on:
  push:
    branches:
      - b1/r51-canonical-reentrant-stop-final-projection-20261123
  pull_request:
    paths:
      - nox-control/b1_client_stream_reconnect_harness.js
      - nox-control/test_b1_sse_ui_binding.py
      - .github/workflows/nox-b1-r51-chromium-regression.yml
permissions:
  contents: read
jobs:
  exact-source-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned Playwright and reuse runner Chrome
        run: |
          python -m pip install 'playwright==1.56.0'
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME_BIN" ]; then
            "$CHROME_BIN" --version
            if [ ! -e /usr/bin/chromium ]; then sudo ln -s "$CHROME_BIN" /usr/bin/chromium; fi
          else
            python -m playwright install chromium
          fi
      - name: Run actual B1 client + UI binding exact-source regression
        run: |
          python -m py_compile nox-control/test_b1_sse_ui_binding.py
          python nox-control/test_b1_sse_ui_binding.py
