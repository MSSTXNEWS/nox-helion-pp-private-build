name: NOX V72 stage SHA verified MEGA Drive donors on existing Vast
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v72-mega-stage.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v72-mega-source-staging
  cancel-in-progress: false
jobs:
  stage:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify syntax before isolated staging
        run: python3 -m py_compile nox_runpod/teacher_mesh/v72/mega_stage_existing.py
      - name: Stage only matching Drive files already on Vast and report missing inputs
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v72.mega_stage_existing
      - name: Always detach exact ephemeral SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: No production activation without native tests
        if: success()
        run: |
          echo 'NOX_ONEHOST_PRODUCTION_CHANGED=false'
          echo 'NOX_S03_AND_GGUF_UNCHANGED=true'
          echo 'NOX_ARCHIVES_ONLY_STAGED_IF_SHA_VERIFIED=true'
