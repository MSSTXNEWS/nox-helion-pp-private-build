name: NOX ONEPASS original Vast recovery via official SDK and CLI (READ ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nox-onepass-original-instance-official-readonly
  cancel-in-progress: false
jobs:
  recover-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Test read-only no-secrets driver offline
        run: |
          set -euo pipefail
          python -m py_compile coordination/onepass/vast_official_readonly.py
          python -m unittest -v coordination.onepass.test_vast_official_readonly
      - name: Install official vastai SDK and CLI only in ephemeral runner
        run: python -m pip install -q --upgrade vastai
      - name: Query ONLY existing instances via official SDK and CLI, never start or destroy
        run: |
          set -euo pipefail
          test -n "$NOX2" || { echo 'HOLD_NOX2_NOT_CONFIGURED'; exit 2; }
          python -m coordination.onepass.vast_official_readonly
      - name: No native changes performed
        if: always()
        run: |
          echo 'NOX_OFFICIAL_CLIENT_READ_ONLY=true'
          echo 'NOX_NATIVE_NO_WRITES_NO_SSH_NO_GPU_LAUNCH=true'
