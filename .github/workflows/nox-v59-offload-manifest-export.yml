name: NOX V59 offload inventory manifest (read-only, portable)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v59-offload-manifest-export.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Explicit owner approval for original NOX OneHost only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v59-manifest-export
  cancel-in-progress: false
jobs:
  export:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read live inventory using existing safe ephemeral SSH and remove key
        shell: bash
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v58.offload_preflight > "$RUNNER_TEMP/audit.txt"
          grep -F 'TEMP_SSH_CLEANUP=DETACHED_AND_VERIFIED' "$RUNNER_TEMP/audit.txt" >/dev/null
          grep -F 'NATIVE_READ_ONLY_COMPLETE=true' "$RUNNER_TEMP/audit.txt" >/dev/null
          python3 - <<'PY'
          import os,sys,json,datetime,re,hashlib
          from pathlib import Path
          data=Path(os.environ['RUNNER_TEMP'],'audit.txt').read_text()
          accepted=[]
          prefixes=('NATIVE_OFFLOAD_','NATIVE_CLASS_','NATIVE_GPU_','NATIVE_EXTERNAL_','NATIVE_PROCESS_')
          for line in data.splitlines():
              if line.startswith(prefixes) and len(line)<200:
                  if '=' in line and re.fullmatch('[A-Za-z0-9_.=,:+/-]{2,200}',line):
                      accepted.append(line)
          if len(accepted)<20: raise SystemExit('HOLD_NO_NATIVE_INVENTORY')
          artifact={
             'schema':'NOX_V59_NATIVE_OFFLOAD_MANIFEST_V1',
             'instance_id':60509551,
             'observed_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
             'source':'GitHub Actions read-only root SSH to Vast 60509551',
             'items':dict(x.split('=',1) for x in accepted),
             'user_content_exported':False,
             'weights_exported':False,
             's03_content_exported':False,
             'remote_files_deleted':False,
             'native_temp_ssh_cleanup':'DETACHED_AND_VERIFIED',
             'action_required':'External owner-controlled destination/keys and SHA readback before large offload or cleanup',
          }
          out=Path('nox-v59-manifest.json')
          out.write_text(json.dumps(artifact,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print('NOX_V59_NATIVE_MANIFEST_SHA256='+hashlib.sha256(out.read_bytes()).hexdigest())
          print('NOX_V59_NATIVE_MANIFEST_FIELDS='+str(len(artifact['items'])))
          print('NOX_V59_CONTENT_EXPORT=NONE')
          PY
      - name: Upload sanitized source inventory only
        uses: actions/upload-artifact@v4
        with:
          name: NOX_V59_NATIVE_OFFLOAD_MANIFEST_20261114
          path: nox-v59-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Force exact temporary SSH-key cleanup check on any failure
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
