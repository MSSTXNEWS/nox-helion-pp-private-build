name: NOX V69 one cold ZIP full SHA and SSH error classification read-only
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v69-one-cold-sha-diagnostic.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v69-single-cold-archive
  cancel-in-progress: false
jobs:
  diagnose:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source syntax
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v69/diagnose_one_cold_sha.py
      - name: Read only one 85MB archive and classify execution
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v69.diagnose_one_cold_sha
      - name: Revoke temporary Vast instance key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Boundary
        if: success()
        run: |
          echo "ONE_COLD_ARCHIVE_SOURCE_SHA_VERIFIED=true"
          echo "RAM_OR_DRIVE_COPIED=false"
          echo "FILES_DELETED=false"
