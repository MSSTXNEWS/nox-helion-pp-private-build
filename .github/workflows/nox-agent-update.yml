name: NOX agent update (one click)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nox-agent-update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor == 'MSSTXNEWS'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Update NOX command agent over temporary SSH key
        env:
          NOX2: ${{ secrets.NOX2 }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: python3 -B nox-control/cmd_agent/run_update.py
