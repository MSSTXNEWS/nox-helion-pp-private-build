name: NOX c300 S1 run
on:
  workflow_dispatch:
    inputs:
      script:
        description: script name in nox-control/c300
        required: true
permissions:
  contents: read
concurrency:
  group: nox-c300-${{ inputs.script }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor == 'MSSTXNEWS'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run c300 script on S1
        env:
          NOX2: ${{ secrets.NOX2 }}
          TS_AUTHKEY: ${{ secrets.NOXXXXX }}
          C300: ${{ inputs.script }}
        run: |
          case "$C300" in *[!A-Za-z0-9_.-]*) echo bad name; exit 1;; esac
          python3 -B nox-control/c300/run_c300.py
