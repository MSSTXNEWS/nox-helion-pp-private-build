name: NOX UI 21-25 FULL REBUILD AND SHA REPAIR
on:
  push:
    branches: [assets/download-ui-21-31-20261105]
    paths: [.github/workflows/nox-ui-21-25-rebuild.yml]
permissions: {contents: read}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch all five originals, rebuild, verify and count every part
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source parts
          cat > repos.tsv <<'EOF'
          21 d3 d3/d3
          22 threejs mrdoob/three.js
          23 postprocessing pmndrs/postprocessing
          24 tsparticles tsparticles/tsparticles
          25 particlesjs VincentGarreau/particles.js
          EOF
          printf 'number,name,repo,commit,filename,bytes,sha256\n' > source/MANIFEST.csv
          while read -r number name repo; do
            meta="$(curl -fsSL --retry 5 --max-time 120 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo")"
            branch="$(jq -r .default_branch <<< "$meta")"
            commit="$(curl -fsSL --retry 5 --max-time 120 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/commits/$branch" | jq -r .sha)"
            file="source/${number}_${name}.zip"
            curl -fL --retry 5 --max-time 1500 "https://codeload.github.com/$repo/zip/$commit" -o "$file"
            test -s "$file"
            unzip -tqq "$file"
            printf '%s,%s,%s,%s,%s,%s,%s\n' "$number" "$name" "$repo" "$commit" "$(basename "$file")" "$(stat -c '%s' "$file")" "$(sha256sum "$file" | cut -d' ' -f1)" >> source/MANIFEST.csv
          done < repos.tsv
          test "$(find source -name '*.zip' | wc -l)" -eq 5
          sha256sum source/*.zip > source/SHA256SUMS.txt
          (cd source && zip -0 -q ../NOX_UI_21_25_SOURCES_REPAIRED.zip ./*)
          unzip -tqq NOX_UI_21_25_SOURCES_REPAIRED.zip
          sha256sum NOX_UI_21_25_SOURCES_REPAIRED.zip > parts/COMPLETE_SHA256.txt
          split -b 85000000 -d -a 2 NOX_UI_21_25_SOURCES_REPAIRED.zip parts/NOX_UI_21_25_SOURCES_REPAIRED.zip.part-
          num="$(find parts -name '*.part-*' | wc -l)"
          echo "PART_COUNT=$num" | tee parts/PART_COUNT.txt
          test "$num" -gt 0 && test "$num" -le 35
          cat parts/*.part-* > /tmp/recombined.zip
          cmp -s NOX_UI_21_25_SOURCES_REPAIRED.zip /tmp/recombined.zip
          (cd /tmp && sha256sum /tmp/recombined.zip)
          unzip -tqq /tmp/recombined.zip
          echo 'PASS all parts accounted for and bytes verified' > parts/VERIFIED.txt
          du -h NOX_UI_21_25_SOURCES_REPAIRED.zip
      - name: Upload verified manifest, checksum and count
        uses: actions/upload-artifact@v4
        with:
          name: NOX_UI_21_25_REPAIRED_META
          path: |
            parts/COMPLETE_SHA256.txt
            parts/PART_COUNT.txt
            parts/VERIFIED.txt
          retention-days: 7
      - name: Upload repaired chunk 00
        if: ${{ hashFiles('parts/*.part-00') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: NOX_UI_21_25_REPAIRED_PART_00
          path: parts/*.part-00
