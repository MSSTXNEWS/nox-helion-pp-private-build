name: NOX V65 native five-service process collision investigation
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - .github/workflows/nox-v65-service-collision-readonly.yml
      - nox_runpod/teacher_mesh/v65/service_process_collision.py
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v65-process-collision-readonly
  cancel-in-progress: false
jobs:
  native-process-read:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax gate
        run: python3 -m py_compile nox_runpod/teacher_mesh/v65/service_process_collision.py
      - name: Read Supervisor state and process ownership twice
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v65.service_process_collision
      - name: Revoke exact ephemeral SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Acceptance boundary
        if: success()
        run: |
          echo "NOX_V65_READONLY=true"
          echo "SERVICE_ACTIONS_PERFORMED=false"
