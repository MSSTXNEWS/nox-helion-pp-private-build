name: NOX owner native lock observer source checks
on:
  push:
    paths:
      - 'nox-control/owner_native_inspect.py'
      - 'nox-control/owner_native_operator.py'
      - 'nox-control/test_owner_native_inspect_locks.py'
      - 'nox-control/systemic_relay_20261118/owner_systemic_relay_observe.py'
      - 'nox-control/systemic_relay_20261118/test_owner_systemic_relay_observe_locks.py'
      - '.github/workflows/nox-owner-lock-observer-ci.yml'
  pull_request:
    paths:
      - 'nox-control/owner_native_inspect.py'
      - 'nox-control/owner_native_operator.py'
      - 'nox-control/test_owner_native_inspect_locks.py'
      - 'nox-control/systemic_relay_20261118/owner_systemic_relay_observe.py'
      - 'nox-control/systemic_relay_20261118/test_owner_systemic_relay_observe_locks.py'
      - '.github/workflows/nox-owner-lock-observer-ci.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  readonly-lock-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Compile active owner inspect route and run synthetic fixtures
        run: |
          set -euo pipefail
          python3 -B -m py_compile nox-control/owner_native_inspect.py nox-control/owner_native_operator.py nox-control/test_owner_native_inspect_locks.py nox-control/systemic_relay_20261118/owner_systemic_relay_observe.py nox-control/systemic_relay_20261118/test_owner_systemic_relay_observe_locks.py
          python3 -B nox-control/test_owner_native_inspect_locks.py
          python3 -B nox-control/systemic_relay_20261118/test_owner_systemic_relay_observe_locks.py
      - name: Keep native scope explicit
        run: |
          echo "SOURCE_ONLY — synthetic fixtures only; no server operation or native acceptance"
