name: NOX V71 actual main GGUF RU-ES accuracy and latency baseline
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v71-model-quality.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v71-main-model-benchmark
  cancel-in-progress: false
jobs:
  measure:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source syntax
        run: python3 -m py_compile nox_runpod/teacher_mesh/v71/main_model_quality_benchmark.py
      - name: Measure real installed NOX main model only
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v71.main_model_quality_benchmark
      - name: Always revoke exact temporary SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Read-only scope
        if: success()
        run: |
          echo 'NOX_BENCHMARK_ONLY=true'
          echo 'NOX_WEIGHTS_CHANGED=false'
          echo 'NOX_LIVE_CHAT_UPDATED=false'
