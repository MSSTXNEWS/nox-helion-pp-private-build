name: B3 R64 bounded native EOF source
on:
  pull_request:
    paths:
      - 'coordination/onepass/b3_r64_*'
      - '.github/workflows/b3-r64-eof.yml'
permissions:
  contents: read
jobs:
  eof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node coordination/onepass/b3_r64_eof_test.cjs
