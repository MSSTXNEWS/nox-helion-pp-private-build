name: NOX V51 temporary SSH — real native read-only inventory
on:
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v51-vast60509551-temp-ssh
  cancel-in-progress: false
jobs:
  verify-native:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && github.ref == 'refs/heads/feature/nox-v38-synaptic-brain-20261114' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Single source regression and compile (no native writes)
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py nox_runpod/teacher_mesh/v131/vast_no_billing_inventory.py
          python3 -m unittest -q nox_runpod.teacher_mesh.v131.tests.test_v131_inventory nox_runpod.teacher_mesh.v50.tests.test_documented_vast_list nox_runpod.teacher_mesh.v104.test_one_model_thinking_benchmark nox_runpod.teacher_mesh.v112.tests.test_owner_status_readonly nox_runpod.teacher_mesh.v50.tests.test_v51_native_safety_readonly
      - name: Official owner-scoped v1 read-only instance ownership and status
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v131.vast_no_billing_inventory
      - name: One pinned ephemeral SSH session - deep native inventory plus actual original model SSE TTFT
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import contextlib,io,json
          from nox_runpod.teacher_mesh.v51 import ephemeral_ssh_probe as ssh
          from nox_runpod.teacher_mesh.v104 import one_model_thinking_benchmark as bench
          from nox_runpod.teacher_mesh.v112 import owner_status_readonly as status
          # Both existing read-only programs share ONE authenticated SSH session.
          # No second attach/probe cycle while GPU1 is active.
          ssh.REMOTE=ssh.REMOTE+"\n"+bench.REMOTE+"\n"+status.REMOTE
          ssh.api=bench.gate
          buffer=io.StringIO()
          healthy=False
          try:
              with contextlib.redirect_stdout(buffer):
                  healthy=ssh.probe()
          except Exception as exc:
              err=str(exc)
              print("NOX_SINGLE_SSH_HOLD="+err if err.startswith("HOLD_") and len(err)<90
                    else "NOX_SINGLE_SSH_HOLD=HOLD_REMOTE_OR_AUTH")
          lines=buffer.getvalue().splitlines()
          for line in lines:
              if line.startswith(("NATIVE_V104_","TEMP_SSH_CLEANUP=","NATIVE_GPU=",
                                   "NATIVE_DRIVER_CCAP=","NATIVE_PYENV_","NATIVE_P0_",
                                   "SSH_HOST_FINGERPRINT=","NATIVE_V112_OWNER_STATUS=")):
                  print(line[:790])
          # Actual model stream must contain two complete cases and final DONE,
          # never success merely from SSH, a busy slot or a synthetic fixture.
          valid=healthy and bench.native_timing_evidence(lines)
          # Tokens/sec is separate from verified first-token latency. A null
          # upstream usage report must NEVER be displayed as measured throughput.
          native_rates=[]
          for line in lines:
              if line.startswith("NATIVE_V104_CASE="):
                  try:
                      row=json.loads(line.split("=",1)[1])
                      rate=row.get("decode_tokens_per_sec")
                      if type(rate) in (int,float) and 0 < rate < 5000:
                          native_rates.append(rate)
                  except (ValueError,AttributeError):
                      pass
          print("NOX_V104_DECODE_TPS_VERIFIED="+str(valid and len(native_rates)==2).lower())
          print("NOX_V104_TIMINGS_VERIFIED="+str(valid).lower())
          print("NOX_V112_OWNER_S03_STATUS_VERIFIED="+str(healthy and status.native_status_evidence(lines)).lower())
          raise SystemExit(0 if valid else 2)
          PY
      - name: Mandatory second cleanup attempt on failure
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Explicit acceptance boundary
        if: success()
        run: |
          echo "NOX_VAST_NATIVE_READ_ONLY_SSH_RECEIPT=PASS"
          # This read-only SSH/SSE job never calls original OneHost queue/S03 ports.
          # A successful SSH receipt cannot certify how many native jobs exist.
          echo "ONEHOST_NATIVE_QUEUE_READBACK=HOLD_NOT_QUERIED"
          echo "ONEHOST_NATIVE_S03_RECEIPTS=HOLD_NOT_QUERIED"
          echo "ONEHOST_NATIVE_JOB_IDS_VERIFIED=UNKNOWN_NOT_QUERIED"
          echo "PRODUCTION_NOT_MODIFIED=true"
          echo "TRAINER_NOT_RESTARTED=true"
