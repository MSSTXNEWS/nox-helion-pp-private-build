name: NOX V51 temporary SSH — real native read-only inventory
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - ".github/workflows/nox-v51-ephemeral-ssh-native.yml"
      - "nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py"
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v51-vast60509551-temp-ssh
  cancel-in-progress: false
jobs:
  verify-native:
    if: "${{ (github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS') || (github.event_name == 'push' && github.ref == 'refs/heads/feature/nox-v38-synaptic-brain-20261114' && github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Single source regression and compile (no native writes)
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py nox_runpod/teacher_mesh/v131/vast_no_billing_inventory.py
          python3 -m unittest -q nox_runpod.teacher_mesh.v131.tests.test_v131_inventory nox_runpod.teacher_mesh.v50.tests.test_documented_vast_list
      - name: Official owner-scoped v1 read-only instance ownership and status
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v131.vast_no_billing_inventory
      - name: Per-instance ephemeral SSH attach, live read-only command, detach
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe probe
      - name: Mandatory second cleanup attempt on failure
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Explicit acceptance boundary
        if: success()
        run: |
          echo "NOX_VAST_NATIVE_READ_ONLY_SSH_RECEIPT=PASS"
          echo "ONEHOST_NATIVE_QUEUE_REGISTERED=false"
          echo "PRODUCTION_NOT_MODIFIED=true"
          echo "TRAINER_NOT_RESTARTED=true"
