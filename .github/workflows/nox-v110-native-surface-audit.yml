name: NOX V110 one-time read-only owner V29 contract probe
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - "nox_runpod/teacher_mesh/v110/native_web_surface_audit.py"
      - ".github/workflows/nox-v110-native-surface-audit.yml"
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions: {contents: read}
concurrency:
  group: nox-v110-v29-audit
  cancel-in-progress: false
jobs:
  inspect:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Syntax compile and source-only audit
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v110/native_web_surface_audit.py
          python3 - <<'PY'
          from nox_runpod.teacher_mesh.v110.native_web_surface_audit import REMOTE
          compile(REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0],'<v110 native>','exec')
          print('NOX_V110_SOURCE=PASS')
          PY
      - name: Probe existing native instance (zero writes)
        run: python3 -m nox_runpod.teacher_mesh.v110.native_web_surface_audit
      - name: Always revoke ephemeral SSH authorization
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
