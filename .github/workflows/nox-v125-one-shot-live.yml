name: NOX V125 one-shot native owner metrics with S03/STOP protection
on:
  push:
    branches: [nox/v125-live-owner-metrics-20261115]
    paths:
      - '.github/workflows/nox-v125-one-shot-live.yml'
  workflow_dispatch:
    inputs:
      allow_native:
        description: "Explicit YES only after fresh live SHA/STOP/S03 review"
        type: choice
        options: ['NO','YES']
        default: 'NO'
        required: true
permissions:
  contents: read
concurrency:
  group: nox-60509551-v125-one-shot-owner-metrics
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install test-only dependencies outside native OneHost
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Native module/installer embedded-AST+owner-cookie source suite
        run: |
          set -euo pipefail
          python -m unittest -v nox_runpod.teacher_mesh.v125.test_live_owner_readonly
          python -m unittest -v nox_runpod.teacher_mesh.v125.test_install_owner_readonly
  native:
    needs: source
    if: ${{ github.actor == 'MSSTXNEWS' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Require existing owner key without logging it
        run: test -n "$NOX2" || { echo 'HOLD_NOX2'; exit 2; }
      - name: Native exact-SHA and idle gated five real read routes
        run: python -m nox_runpod.teacher_mesh.v125.install_owner_readonly
      - name: Always revoke temporary Vast SSH key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
