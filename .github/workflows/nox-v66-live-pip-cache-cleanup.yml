name: NOX V66 clean ONLY regenerable pip cache; native verified
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v66-live-pip-cache-cleanup.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Explicit owner approval for original NOX OneHost only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v66-live-single-cache-purge
  cancel-in-progress: false
jobs:
  one-safe-clean:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mandatory source safety gate before mutation
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v66/cache_purge.py
          python3 -m unittest discover -s nox_runpod/teacher_mesh/v66/tests -p 'test_*.py' -q
      - name: One exact regenerable-only pip cache purge and disk readback
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v66.cache_purge
      - name: Always remove temporary SSH key, verify remote absence
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Protected critical files and workflows
        if: success()
        run: |
          echo "NOX_NATIVE_PIP_CACHE_CLEANED=true"
          echo "NOX_S03_MODELS_CHECKPOINTS_UNTOUCHED=true"
          echo "NOX_TRAINERS_NOT_RESTARTED=true"
          echo "OFFSITE_OWNER_RESTORE_NOT_IMPLIED=true"
