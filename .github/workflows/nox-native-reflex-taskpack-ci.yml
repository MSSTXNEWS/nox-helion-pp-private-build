name: NOX Reflex taskpack source checks
on:
  pull_request:
    paths:
      - 'nox-control/systemic_relay_20261118/runtime/owner_reflex_taskpack.py'
      - 'nox-control/systemic_relay_20261118/test_owner_reflex_taskpack.py'
      - '.github/workflows/nox-native-reflex-taskpack-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  taskpack-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and regression test (no remote credentials)
        working-directory: nox-control/systemic_relay_20261118
        run: |
          python -m py_compile runtime/owner_reflex_taskpack.py test_owner_reflex_taskpack.py
          python -m unittest -v test_owner_reflex_taskpack
