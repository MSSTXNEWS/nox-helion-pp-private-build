name: NOX V111 owner-only optional local teacher in current Resonance
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - "nox_runpod/teacher_mesh/v111/**"
      - ".github/workflows/nox-v111-owner-teacher-patch.yml"
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-60509551-native-owner-teacher
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only validation
        run: |
          python -m py_compile nox_runpod/teacher_mesh/v111/owner_teacher_once.py
          python - <<'PY'
          from nox_runpod.teacher_mesh.v111.owner_teacher_once import REMOTE
          compile(REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0],'<remote>','exec')
          assert 'HOLD_CHAT_OR_TEACHER_BUSY' in REMOTE
          assert 'HOLD_S03_CHANGED' in REMOTE
          assert 'HOLD_BACKUP_SHA' in REMOTE
          PY
  gated-native:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: OneHost owner teacher hint, SHA pinned source and rollback
        run: python -m nox_runpod.teacher_mesh.v111.owner_teacher_once
      - name: Always revoke ephemeral SSH key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
