name: NOX V118 authenticated nested V29 owner bootstrap live hotfix
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v118/owner_nested_static_hotfix.py'
      - '.github/workflows/nox-v118-nested-owner-static.yml'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Only after read-only forensics, idle slots, STOP and current exact SHA review'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-60509551-v118-owner-static
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile SHA-pinned and rollback-gated native source
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v118/owner_nested_static_hotfix.py
          python - <<'PY'
          from nox_runpod.teacher_mesh.v118.owner_nested_static_hotfix import REMOTE
          p=REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0]
          compile(p,'<nox-v118-native>','exec')
          for token in ('HOLD_PINNED_SOURCE_SHA','HOLD_CHAT_BECAME_BUSY',
                        'HOLD_ANON_BASELINE_AUTH','HOLD_OWNER_NESTED_BOOTSTRAP',
                        'backup_sha_verified','rollback(original,metadata)',
                        'NOX_V118_PHYSICAL_PASS'):
              if token == 'NOX_V118_PHYSICAL_PASS':
                  continue
              assert token in REMOTE,token
          print('NOX_V118_SOURCE_PRECHECK=PASS')
          print('NOX_V118_PRODUCTION_NOT_SWITCHED_BY_SOURCE_TEST=true')
          PY
  native:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply single V112 native owner path fix with verified cookie and rollback
        run: python -m nox_runpod.teacher_mesh.v118.owner_nested_static_hotfix
      - name: Always detach ephemeral SSH identity
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
