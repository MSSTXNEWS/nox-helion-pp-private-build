name: NOX V118 authenticated nested V29 owner bootstrap (manual native gate)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114, fix/nox-v118-cookiejar-shadow-20261115]
    paths:
      - 'nox_runpod/teacher_mesh/v118/owner_nested_static_hotfix.py'
      - 'nox_runpod/teacher_mesh/v118/test_cookiejar_shadow.py'
      - '.github/workflows/nox-v118-nested-owner-static.yml'
  pull_request:
    paths:
      - 'nox_runpod/teacher_mesh/v118/owner_nested_static_hotfix.py'
      - 'nox_runpod/teacher_mesh/v118/test_cookiejar_shadow.py'
      - '.github/workflows/nox-v118-nested-owner-static.yml'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Only after current live SHA readback, STOP/NO-LOSS/backup check'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-60509551-v118-owner-static
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test native source without executing it
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v118/owner_nested_static_hotfix.py
          python -m unittest -v nox_runpod.teacher_mesh.v118.test_cookiejar_shadow
          python - <<'PY'
          from nox_runpod.teacher_mesh.v118.owner_nested_static_hotfix import REMOTE
          p=REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0]
          compile(p,'<nox-v118-native>','exec')
          for token in ('HOLD_PINNED_SOURCE_SHA','HOLD_CHAT_BECAME_BUSY',
                        'HOLD_ANON_BASELINE_AUTH','HOLD_OWNER_NESTED_BOOTSTRAP',
                        'backup_sha_verified','rollback(original,metadata)'):
              assert token in REMOTE,token
          print('NOX_V118_SOURCE_PRECHECK=PASS')
          print('NOX_V118_PRODUCTION_NOT_SWITCHED_BY_SOURCE_TEST=true')
          PY
  native:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'MSSTXNEWS' && inputs.allow_native == 'YES' }}
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require configured owner transport
        run: |
          test -n "$NOX2" || { echo 'HOLD_NOX2'; exit 2; }
      - name: Apply only SHA-pinned V112 path fix, rollback on failures
        run: python -m nox_runpod.teacher_mesh.v118.owner_nested_static_hotfix
      - name: Always detach ephemeral SSH identity
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
