name: NOX V15 autonomy NORMAL 3 FORSAZH 6 source acceptance
on:
  push:
    paths:
      - 'nox-control/owner_autonomy_pool.py'
      - 'nox-control/test_owner_autonomy_pool.py'
      - 'nox-control/owner_autonomy_mode_stage_v15.py'
      - 'nox-control/test_owner_autonomy_mode_stage_v15.py'
      - 'nox-control/owner_subagent_processes.py'
      - 'nox-control/test_owner_subagent_processes.py'
      - '.github/workflows/nox-v15-autonomy-modes-source-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mode-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and test three/six worker admission and STOP-safe staging
        run: |
          python3 -m py_compile nox-control/owner_autonomy_pool.py nox-control/owner_autonomy_mode_stage_v15.py
          PYTHONPATH=nox-control python3 -m unittest -v test_owner_autonomy_pool test_owner_autonomy_mode_stage_v15
          python3 -m py_compile nox-control/owner_subagent_processes.py
          PYTHONPATH=nox-control python3 -m unittest -v test_owner_subagent_processes
      - name: Assert pinned modes and no production activation by source test
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'nox-control')
          import owner_autonomy_pool as p
          import owner_autonomy_mode_stage_v15 as m
          assert p.MODES == {'NORMAL':3,'FORSAZH':6}
          assert (m.NORMAL,m.FORSAZH)==(3,6)
          print('MODE_V15_SOURCE_TESTED_ONLY; NO_NATIVE_SERVICES_STARTED')
          PY
