name: NOX V135 full original WEB source export for independent local release verification
on:
  push:
    branches: [fix/nox-v135-resonance-native-stream-20261115]
    paths:
      - '.github/workflows/nox-v135-full-release-exact-source.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate current V135 owner stream browser contracts and full original ZIP no-loss
        run: |
          set -euo pipefail
          node --check coordination/onepass/nox-v135-resonance-owner-bridge.js
          node --test coordination/onepass/test_v135_resonance_owner_bridge.cjs
          python -m py_compile coordination/onepass/v135_resonance_owner_stage.py
          python -m unittest -v coordination.onepass.test_v135_resonance_owner_stage
      - name: Export exact V135 JS, frozen ZIP builder, tested source and source hashes
        run: |
          set -euo pipefail
          mkdir -p source/coordination/onepass source/nox_runpod/teacher_mesh/v137
          cp coordination/onepass/nox-v135-resonance-owner-bridge.js coordination/onepass/v135_resonance_owner_stage.py coordination/onepass/test_v135_resonance_owner_bridge.cjs coordination/onepass/test_v135_resonance_owner_stage.py coordination/onepass/nox-v137-owner-self-status.js source/coordination/onepass/
          cp nox_runpod/teacher_mesh/v137/owner_self_observation.py nox_runpod/teacher_mesh/v137/owner_response_contract.py source/nox_runpod/teacher_mesh/v137/
          (cd source && find coordination nox_runpod -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SOURCE_SHA256SUMS.txt)
          (cd source && zip -q -r ../NOX_V135_FULL_RELEASE_EXACT_SOURCE.zip .)
          sha256sum NOX_V135_FULL_RELEASE_EXACT_SOURCE.zip
          echo 'NOX_V135_NATIVE_NOT_DEPLOYED=true'
      - uses: actions/upload-artifact@v4
        with:
          name: NOX_V135_FULL_RELEASE_EXACT_SOURCE
          path: NOX_V135_FULL_RELEASE_EXACT_SOURCE.zip
          retention-days: 7
          if-no-files-found: error
