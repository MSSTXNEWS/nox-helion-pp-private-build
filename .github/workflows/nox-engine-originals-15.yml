name: NOX Engine Originals 15
on:
  push:
    branches: [assets/download-nox-engines-15-20261105]
    paths: [.github/workflows/nox-engine-originals-15.yml]
permissions: {contents: read}
jobs:
  download:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - item: '01'
            package: 'ripgrep'
            upstream: 'BurntSushi/ripgrep'
          - item: '02'
            package: 'tree-sitter'
            upstream: 'tree-sitter/tree-sitter'
          - item: '03'
            package: 'uv'
            upstream: 'astral-sh/uv'
          - item: '04'
            package: 'ruff'
            upstream: 'astral-sh/ruff'
          - item: '05'
            package: 'sqlite-vec'
            upstream: 'asg017/sqlite-vec'
          - item: '06'
            package: 'playwright'
            upstream: 'microsoft/playwright'
          - item: '07'
            package: 'crawl4ai'
            upstream: 'unclecode/crawl4ai'
          - item: '08'
            package: 'trafilatura'
            upstream: 'adbar/trafilatura'
          - item: '09'
            package: 'aider'
            upstream: 'Aider-AI/aider'
          - item: '10'
            package: 'fluent-icons'
            upstream: 'microsoft/fluentui-system-icons'
          - item: '11'
            package: 'godot'
            upstream: 'godotengine/godot'
          - item: '12'
            package: 'blender'
            upstream: 'blender/blender'
          - item: '13'
            package: 'comfyui'
            upstream: 'Comfy-Org/ComfyUI'
          - item: '14'
            package: 'ffmpeg'
            upstream: 'FFmpeg/FFmpeg'
          - item: '15'
            package: 'llama-cpp'
            upstream: 'ggml-org/llama.cpp'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact upstream source and validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out parts
          repo='${{ matrix.upstream }}'
          item='${{ matrix.item }}'
          package='${{ matrix.package }}'
          meta="$(curl -fsSL --retry 4 --max-time 120 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo")"
          branch="$(jq -r .default_branch <<< "$meta")"
          commit="$(curl -fsSL --retry 4 --max-time 120 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/commits/$branch" | jq -r .sha)"
          test "${#commit}" -eq 40
          file="out/NOX_ENGINE_${item}_${package}_ORIGINAL_SOURCE.zip"
          curl -fL --retry 4 --max-time 1800 "https://codeload.github.com/$repo/zip/$commit" -o "$file"
          test -s "$file"
          unzip -tqq "$file"
          echo "repository=$repo" > out/SOURCE.txt
          echo "commit=$commit" >> out/SOURCE.txt
          echo "archive=$(basename "$file")" >> out/SOURCE.txt
          sha256sum "$file" > out/SHA256SUMS.txt
          # Split source bytes for upload to constrained Drive connector.
          split -b 45000000 -d -a 3 "$file" "parts/NOX_ENGINE_${item}_${package}.zip.part-"
          count="$(find parts -name '*.part-*' | wc -l)"
          echo "$count" > out/PART_COUNT.txt
          test "$count" -gt 0 && test "$count" -le 30
          cat parts/*.part-* > /tmp/source_reconstructed.zip
          cmp -s "$file" /tmp/source_reconstructed.zip
          unzip -tqq /tmp/source_reconstructed.zip
          echo 'PASS validated upstream zip; all parts accounted; recombined bytes identical' > out/VERIFIED.txt
      - name: Publish metadata
        uses: actions/upload-artifact@v4
        with:
          name: NOX_ENGINE_${{ matrix.item }}_${{ matrix.package }}_META
          path: |
            out/SOURCE.txt
            out/SHA256SUMS.txt
            out/PART_COUNT.txt
            out/VERIFIED.txt
          retention-days: 7
      - name: Upload part 000
        if: ${{ hashFiles('parts/*.part-000') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: NOX_ENGINE_${{ matrix.item }}_${{ matrix.package }}_PART_000
          path: parts/*.part-000
          retention-days: 7
          if-no-files-found: error
      - name: Upload part 001
        if: ${{ hashFiles('parts/*.part-001') != '' }}
        uses: actions/upload-artifact@v4
