name: NOX V132 ONEPASS real release gates and guarded existing OneHost
on:
  pull_request:
    branches: [feature/nox-v37-v100-firsthour-14d-20261113]
    paths:
      - 'nox_runpod/teacher_mesh/v132/**'
      - 'nox_runpod/teacher_mesh/v130/**'
      - '.github/workflows/nox-v132-onepass-safe.yml'
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v132/**'
      - 'nox_runpod/teacher_mesh/v130/**'
      - '.github/workflows/nox-v132-onepass-safe.yml'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'ONE explicit owner-approved native attempt only if Vast original instance is verified'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-60509551-v132-onepass-owner-controlled
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned isolated test dependencies (never installed on NOX server)
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: 'ONE source acceptance: 92 WEB paths and original memory/restore safety'
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v132/onepass_release_gate.py nox_runpod/teacher_mesh/v130/owner_s03_fact_write.py nox_runpod/teacher_mesh/v130/install_native_owner_fact.py nox_runpod/teacher_mesh/v131/vast_no_billing_inventory.py
          python -m unittest discover -s nox_runpod/teacher_mesh/v132/tests -p 'test_*.py' -v
          python -m unittest discover -s nox_runpod/teacher_mesh/v130/tests -p 'test_*.py' -v
          python -m unittest discover -s nox_runpod/teacher_mesh/v112/tests -p 'test_*.py' -v
          python -m unittest discover -s nox_runpod/teacher_mesh/v61/tests -p 'test_*.py' -v
          python -m nox_runpod.teacher_mesh.v132.onepass_release_gate --root . --out nox_v132_onepass_receipt.json
          python - <<'PY'
          import json
          x=json.load(open('nox_v132_onepass_receipt.json',encoding='utf-8'))
          assert x['release']['state']=='HOLD_REQUIRED_LIVE_ACCEPTANCE'
          assert x['web_baseline']['expected_exact_paths']==92
          assert x['web_baseline']['last_observed_exact_registered']==23
          assert x['web_baseline']['last_observed_unmapped']==69
          assert x['v130']['state']=='SOURCE_STAGED_NOT_LIVE_VERIFIED'
          assert x['safety']['no_new_server'] and x['safety']['no_secrets_in_receipt']
          print('NOX_V132_SOURCE_RECEIPT_VERIFIED=true')
          PY
      - name: Upload machine-readable NOX acceptance and blockers (no private records)
        uses: actions/upload-artifact@v4
        with:
          name: NOX_V132_ONEPASS_SOURCE_RECEIPT
          path: nox_v132_onepass_receipt.json
          if-no-files-found: error
          retention-days: 30
  native-once:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'MSSTXNEWS' && inputs.allow_native == 'YES'
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact existing Vast instance under NOX2; never start/create/destroy GPU
        run: python -m nox_runpod.teacher_mesh.v131.vast_no_billing_inventory
      - name: One native install with exact code SHA, original S03, owner E2E and rollback
        run: python -m nox_runpod.teacher_mesh.v130.install_native_owner_fact
      - name: Mandatory revoke of temporary one-time SSH public key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
