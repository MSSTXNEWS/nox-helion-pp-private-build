name: NOX B4 R40 Exact Node22 SSE Suite
on:
  push:
    branches:
      - b4/sse-loopback-ttft-eof-r24-20261123
    paths:
      - .github/workflows/nox-b4-r39-exact-node22-suite.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nox-b4-r40-source-only
  cancel-in-progress: false
jobs:
  full-exact-b4-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify B4 exact source and run ALL test cases
        shell: bash
        run: |
          set -euo pipefail
          cd nox-control/systemic_relay_20261118
          test "$(git hash-object b4_sse_latency_probe.mjs)" = "4873c7829e72072420f15e21e5ead503051d160f"
          test "$(git hash-object test_b4_sse_latency_probe.mjs)" = "cfb1fa0dcfc3975f4263fc87deae024b319085d5"
          printf 'B4_R40_EXACT_SOURCE_PROBE_SHA256='
          sha256sum b4_sse_latency_probe.mjs
          printf 'B4_R40_EXACT_SOURCE_TEST_SHA256='
          sha256sum test_b4_sse_latency_probe.mjs
          node --version
          node --test test_b4_sse_latency_probe.mjs
