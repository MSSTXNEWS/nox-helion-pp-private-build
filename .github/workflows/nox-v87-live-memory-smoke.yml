name: NOX V87 physical safe S03 readthrough deny-all ACL
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: ['nox_runpod/teacher_mesh/v87/**','.github/workflows/nox-v87-live-memory-smoke.yml']
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-60509551-v87-readonly
  cancel-in-progress: false
jobs:
  smoke:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate V84 ACL and V87 syntax
        run: |
          python -m unittest discover -s nox_runpod/teacher_mesh/v84/tests -p 'test_*.py' -v
          python -m py_compile nox_runpod/teacher_mesh/v87/readthrough_smoke.py
      - name: Real S03 query with explicit deny-all owner ACL
        run: python -m nox_runpod.teacher_mesh.v87.readthrough_smoke
      - name: Remove temporary SSH key even after failure
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
