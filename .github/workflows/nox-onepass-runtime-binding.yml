name: NOX ONEPASS runtime binding
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: ['nox_runpod/teacher_mesh/onepass_runtime/**', '.github/workflows/nox-onepass-runtime-binding.yml']
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-60509551-onepass-binding
  cancel-in-progress: false
jobs:
  binding:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate remote and runner source before connection
        run: |
          python -m py_compile nox_runpod/teacher_mesh/onepass_runtime/binding_probe.py
          python - <<'PY'
          from nox_runpod.teacher_mesh.onepass_runtime.binding_probe import REMOTE
          compile(REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0],'<remote>','exec')
          PY
      - name: Inspect native integration seams without private data
        run: python -m nox_runpod.teacher_mesh.onepass_runtime.binding_probe
      - name: Always revoke only this run's temporary SSH key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
