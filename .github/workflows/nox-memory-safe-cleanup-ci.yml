name: NOX owner memory cleanup one-shot source gate
on:
  push:
    branches: [repair/nox-owner-file-cache-release-20261119]
  pull_request:
    paths:
      - nox-control/owner_native_operator.py
      - nox-control/owner_memory_cleanup_entry.py
      - nox-control/owner_memory_governor.py
      - nox-control/owner_storage_reclaim.py
      - nox-control/test_owner_memory_cache_release.py
      - .github/workflows/nox-memory-safe-cleanup-ci.yml
permissions:
  contents: read
jobs:
  memory-safe-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and verify strictly bounded maintenance route and governor
        run: |
          python - <<'PY'
          import ast, pathlib
          root=pathlib.Path('nox-control')
          for file in ('owner_native_operator.py','owner_memory_cleanup_entry.py','owner_memory_governor.py','owner_storage_reclaim.py'):
              compile((root/file).read_text(),str(root/file),'exec')
          s=(root/'owner_native_operator.py').read_text()
          tree=ast.parse(s)
          assert "FILES['repair'] = 'nox-control/owner_memory_cleanup_entry.py'" in s
          assert "SCOPED_REPAIR_BUNDLES[FILES['repair']] = ('owner_memory_governor.py', 'owner_storage_reclaim.py')" in s
          assert "SCOPED_REPAIR_EXTRA_PATHS[FILES['repair']] = ('nox-control/owner_memory_governor.py',)" in s
          import importlib.util
          spec=importlib.util.spec_from_file_location('nox_owner_operator',root/'owner_native_operator.py')
          operator=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(operator)
          bundle=operator.repair_bundle_paths('repair',operator.FILES['repair'],
              ('nox-control/owner_storage_reclaim.py',))
          assert len(bundle)==2 and {pathlib.Path(x).name for x in bundle}=={
              'owner_memory_governor.py','owner_storage_reclaim.py'}
          entry=(root/'owner_memory_cleanup_entry.py').read_text()
          assert "NOX_FILE_CACHE_RELEASE_RECEIPT_V1" in entry
          assert "NOX_MAINT_REPAIR_COMPLETE=true" in entry
          assert "NOX_MEMORY_GOVERNOR" in (root/'owner_memory_governor.py').read_text()
          PY
          python -m unittest discover -s nox-control -p 'test_owner_memory_governor.py' -v
          python -m unittest discover -s nox-control -p 'test_owner_storage_reclaim.py' -v
          python -m unittest discover -s nox-control -p 'test_owner_memory_cache_release.py' -v
