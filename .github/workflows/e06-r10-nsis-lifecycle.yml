name: NOX E06 R10 real NSIS install update rollback uninstall QA
on:
  push:
    branches: [e06/v16-express-onehost-20261028]
    paths: ['.github/workflows/e06-r10-nsis-lifecycle.yml']
permissions:
  contents: read
  actions: read
jobs:
  frozen-nsis-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install update rollback uninstall on disposable Windows account only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $receipt=[ordered]@{
            schema='NOX_E06_R10_NSIS_LIFECYCLE_DIAGNOSTIC_v1'
            owner=6
            source_run_id=40611662850
            original_artifact_id=12783517896
            original_source_sha1='e5c50ca6c5db18d75b15c392155b3951a81df6f5'
            frozen_installer_sha256='ba0b96ecc3e05eb79a773e3147157e597711777ba42a917016aae990aeb0d554'
            status='HOLD'
            install='NOT_RUN'
            update='NOT_RUN'
            rollback='NOT_RUN'
            uninstall='NOT_RUN'
            user_data_preserved='NOT_RUN'
            e07_accepted=$false
            release_accepted=$false
            failure=$null
          }
          $receiptPath='e06-r10-nsis-lifecycle-evidence.json'
          try {
            $meta=gh api repos/MSSTXNEWS/nox-helion-pp-private-build/actions/artifacts/12783517896 | ConvertFrom-Json
            if ($meta.id -ne 12783517896 -or $meta.expired -or $meta.workflow_run.id -ne 40611662850 -or $meta.workflow_run.head_sha -cne $receipt.original_source_sha1) {
              throw 'ORIGINAL_INSTALLER_ARTIFACT_PROVENANCE_HOLD'
            }
            $output=Join-Path $env:RUNNER_TEMP 'nox-e06-installer-original'
            if (Test-Path -LiteralPath $output) { throw 'TMP_ALREADY_EXISTS' }
            New-Item -ItemType Directory -Path $output | Out-Null
            gh run download 40611662850 --repo MSSTXNEWS/nox-helion-pp-private-build --name nox-e06-onehost-installer-40611662850 --dir $output
            if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_INSTALLER_DOWNLOAD_HOLD' }
            $setup=Join-Path $output 'onehost-candidate/NOX-HELION-V16-DIAGNOSTIC-SETUP.exe'
            if (!(Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'INSTALLER_EXE_MISSING' }
            $sha=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sha -cne $receipt.frozen_installer_sha256) { throw 'INSTALLER_SHA_HOLD' }
            $installRoot=Join-Path $env:LOCALAPPDATA 'Programs/NOX HELION'
            $stage=$installRoot+'.__p01_stage'
            $previous=$installRoot+'.__p01_previous'
            $saved=$installRoot+'.__p01_rollback_saved'
            foreach($dir in @($installRoot,$stage,$previous,$saved)) {
              if (Test-Path -LiteralPath $dir) { throw "PREEXISTING_INSTALL_PATH_HOLD:$dir" }
            }
            $userData=Join-Path $env:LOCALAPPDATA 'NOX_E06_R10_TEST_ONLY_USER_DATA'
            if (Test-Path -LiteralPath $userData) { throw 'PREEXISTING_TEST_USER_DATA_HOLD' }
            New-Item -ItemType Directory -Path $userData | Out-Null
            $sentinel=Join-Path $userData 'owner_data_preserved.txt'
            'E06 R10 installer must never edit outside program install root' | Set-Content -LiteralPath $sentinel -Encoding utf8
            $sentinelSha=(Get-FileHash -LiteralPath $sentinel -Algorithm SHA256).Hash.ToLowerInvariant()
            function AssertSentinel {
              if (!(Test-Path -LiteralPath $sentinel -PathType Leaf) -or
                 (Get-FileHash -LiteralPath $sentinel -Algorithm SHA256).Hash.ToLowerInvariant() -cne $sentinelSha) {
                   throw 'USER_DATA_PRESERVATION_FAILURE'
              }
            }
            $exe=Join-Path $installRoot 'NOX.P01.Shell.exe'
            $backend=Join-Path $installRoot 'Backend/NOX_HELION_PRIVATE_CANDIDATE.exe'
            function RunNsi([string]$program, [string]$opts) {
              $process=Start-Process -FilePath $program -ArgumentList $opts -Wait -PassThru
              if ($null -eq $process -or $process.ExitCode -ne 0) { throw "NSIS_EXECUTION_FAILURE:$opts" }
            }
            # Disposable CI prerequisite only. Keep original NSIS WebView2 preflight intact.
            $runtimeKeys=@(
              'Registry::HKEY_CURRENT_USER\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A7E4C5}',
              'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A7E4C5}',
              'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A7E4C5}'
            )
            function WebView2Present {
              foreach($key in $runtimeKeys) {
                try {
                  $pv=(Get-ItemProperty -LiteralPath $key -ErrorAction Stop).pv
                  if($pv -and $pv -ne '0.0.0.0') { return $true }
                } catch {}
              }
              return $false
            }
            $receipt | Add-Member -NotePropertyName webview2_preexisting -NotePropertyValue ([bool](WebView2Present))
            if (-not (WebView2Present)) {
              $w=Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
              Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile $w -MaximumRedirection 6
              $sig=Get-AuthenticodeSignature -LiteralPath $w
              if ($sig.Status -ne 'Valid' -or !$sig.SignerCertificate -or
                  $sig.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
                throw 'MICROSOFT_WEBVIEW2_SIGNED_PREREQUISITE_HOLD'
              }
              $receipt | Add-Member -NotePropertyName official_webview2_installer_sha256 -NotePropertyValue ((Get-FileHash $w -Algorithm SHA256).Hash.ToLowerInvariant())
              $p=Start-Process -FilePath $w -ArgumentList @('/silent','/install') -Wait -PassThru
              if ($p.ExitCode -ne 0) { throw "MICROSOFT_WEBVIEW2_CI_INSTALL_FAILED:$($p.ExitCode)" }
              Start-Sleep -Seconds 3
              if (-not (WebView2Present)) { throw 'WEBVIEW2_RUNTIME_NOT_REGISTERED_AFTER_INSTALL' }
            }
            $receipt | Add-Member -NotePropertyName webview2_ready -NotePropertyValue $true
            Write-Host 'E06_OFFICIAL_WEBVIEW2_RUNTIME_CI_PREREQUISITE_PASS'
            RunNsi $setup '/S'
            if (!(Test-Path -LiteralPath $exe -PathType Leaf) -or !(Test-Path -LiteralPath $backend -PathType Leaf) -or
                !(Test-Path -LiteralPath (Join-Path $installRoot 'nox-p01-owned.txt') -PathType Leaf)) { throw 'INSTALL_EXE_OR_OWNER_MARKER_MISSING' }
            if ((Get-FileHash -LiteralPath $backend -Algorithm SHA256).Hash.ToLowerInvariant() -cne '4e488372cf3f6410d268a7ef72b3e4b359a7a3e6642c7a16ac2e6f7eb06fc5f3') { throw 'INSTALLED_PYTHON_SHA_HOLD' }
            AssertSentinel
            $receipt.install='PASS'
            RunNsi $setup '/S'
            if (!(Test-Path -LiteralPath (Join-Path $previous 'nox-p01-owned.txt'))) { throw 'UPDATE_PREVIOUS_VERSION_NOT_SAVED' }
            AssertSentinel
            $receipt.update='PASS'
            RunNsi $setup '/S /ROLLBACK'
            if (!(Test-Path -LiteralPath (Join-Path $saved 'nox-p01-owned.txt')) -or
                !(Test-Path -LiteralPath (Join-Path $installRoot 'nox-p01-owned.txt'))) { throw 'ROLLBACK_SAVED_APP_NOT_PRESERVED' }
            AssertSentinel
            $receipt.rollback='PASS'
            $uninstall=Join-Path $installRoot 'Uninstall.exe'
            if (!(Test-Path -LiteralPath $uninstall -PathType Leaf)) { throw 'UNINSTALL_ENTRYPOINT_MISSING' }
            RunNsi $uninstall '/S'
            if (Test-Path -LiteralPath (Join-Path $installRoot 'nox-p01-owned.txt')) { throw 'OWNERSHIP_MARKER_REMAINS_AFTER_UNINSTALL' }
            AssertSentinel
            $receipt.uninstall='PASS'
            $receipt.user_data_preserved='PASS'
            $receipt.status='DIAGNOSTIC_LIFECYCLE_PASS_NOT_E07_ACCEPTED'
          } catch {
            $receipt.failure=$_.Exception.Message
            Write-Warning "NOX_INSTALLER_LIFECYCLE_HOLD: $($receipt.failure)"
          } finally {
            $receipt | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $receiptPath -Encoding utf8
            Write-Host ($receipt | ConvertTo-Json -Depth 8)
          }
          if ($receipt.status -ne 'DIAGNOSTIC_LIFECYCLE_PASS_NOT_E07_ACCEPTED') { throw 'E06_R10_NSIS_LIFECYCLE_BLOCKED' }
      - name: Preserve exact lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-e06-r10-installer-lifecycle-${{ github.run_id }}
          path: e06-r10-nsis-lifecycle-evidence.json
          if-no-files-found: warn
          retention-days: 30
