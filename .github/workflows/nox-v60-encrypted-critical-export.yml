name: NOX V60 verified encrypted S03 + V29.3 offsite export
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - .github/workflows/nox-v60-encrypted-critical-export.yml
      - nox_runpod/teacher_mesh/v60/encrypted_backup.py
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Explicit owner approval for original NOX OneHost only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v60-vast60509551-offload-export
  cancel-in-progress: false
jobs:
  encrypted-snapshot:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile verified source
        shell: bash
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py nox_runpod/teacher_mesh/v60/encrypted_backup.py
      - name: Install official age encryption binary from OS distribution
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y age
          fi
          age --version
      - name: Stream consistent SQLite snapshots + original WEB encrypted to EXISTING owner SSH key
        shell: bash
        env:
          NOX2: ${{ secrets.NOX2 }}
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v60.encrypted_backup
      - name: Check encrypted artifact and independent local test receipt
        shell: bash
        run: |
          set -euo pipefail
          test -s NOX_V60_S03_GENESIS_WEB_20261114.tar.age
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          d=json.loads(Path('NOX_V60_ENCRYPTED_BACKUP_RECEIPT.json').read_text())
          a=Path('NOX_V60_S03_GENESIS_WEB_20261114.tar.age').read_bytes()
          assert d['restoration_with_temporary_test_identity']=='PASS'
          assert d['restored_file_sha256_count']==7
          assert hashlib.sha256(a).hexdigest()==d['ciphertext_sha256']
          assert not d['raw_source_files_uploaded_to_github']
          print('NOX_V60_ENCRYPTED_ARCHIVE_AND_MANIFEST=PASS')
          PY
      - name: Upload ciphertext and independent receipt (NO plaintext or private keys)
        uses: actions/upload-artifact@v4
        with:
          name: NOX_V60_ENCRYPTED_S03_GENESIS_WEB_20261114
          path: |
            NOX_V60_S03_GENESIS_WEB_20261114.tar.age
            NOX_V60_ENCRYPTED_BACKUP_RECEIPT.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify no old SSH key left in Vast (idempotent)
        if: always()
        env:
          NOX2: ${{ secrets.NOX2 }}
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Explicit no-loss boundary
        if: success()
        run: |
          echo "VAST_SOURCE_FILES_DELETED=false"
          echo "BACKUP_ENCRYPTED=true"
          echo "OWNER_PRIVATE_KEY_NEVER_UPLOADED=true"
          echo "OWNER_KEY_DECRYPTION_NEEDS_OFFSITE_ACCEPTANCE=true"
          echo "GPU_TRAINER_NOT_MODIFIED=true"
