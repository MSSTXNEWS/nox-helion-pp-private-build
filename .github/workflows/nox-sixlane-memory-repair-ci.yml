name: NOX sixlane source + exact native installer safety
on:
  push:
    paths:
      - 'nox-control/owner_native_operator.py'
      - 'nox-control/owner_sixlane_memory_repair_entry.py'
      - 'nox-control/test_owner_sixlane_memory_repair_entry.py'
      - 'nox-control/systemic_relay_20261118/runtime/owner_systemic_refill.py'
      - 'nox-control/systemic_relay_20261118/test_owner_reflex_cycle.py'
      - '.github/workflows/nox-sixlane-memory-repair-ci.yml'
  pull_request:
    paths:
      - 'nox-control/owner_native_operator.py'
      - 'nox-control/owner_sixlane_memory_repair_entry.py'
      - 'nox-control/test_owner_sixlane_memory_repair_entry.py'
      - 'nox-control/systemic_relay_20261118/runtime/owner_systemic_refill.py'
      - 'nox-control/systemic_relay_20261118/test_owner_reflex_cycle.py'
      - '.github/workflows/nox-sixlane-memory-repair-ci.yml'
permissions:
  contents: read
jobs:
  bounded-repair-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile reviewed modules
        run: |
          python3 -m py_compile nox-control/owner_native_operator.py nox-control/owner_sixlane_memory_repair_entry.py nox-control/test_owner_sixlane_memory_repair_entry.py nox-control/systemic_relay_20261118/runtime/owner_systemic_refill.py
      - name: Owner-scoped installer invariant tests
        run: python3 -m unittest discover -s nox-control -p 'test_owner_sixlane_memory_repair_entry.py' -v
      - name: Existing native reflex regression suite
        run: python3 -m unittest discover -s nox-control/systemic_relay_20261118 -p 'test_owner_reflex_cycle.py' -v
