name: NOX V63 inspect installed bash helper integration without restarts
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v63-shell-integration-audit.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v63-shell-integrity-readonly
  cancel-in-progress: false
jobs:
  read-only:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check tool source syntax
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v63/shell_function_audit.py
      - name: Inspect installed shell functions without triggering services
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v63.shell_function_audit
      - name: Mandatory exact temporary SSH key cleanup
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Source verification only
        if: success()
        run: |
          echo "NOX_SERVICES_RESTARTED=false"
          echo "NOX_DISK_CONTENT_MODIFIED=false"
