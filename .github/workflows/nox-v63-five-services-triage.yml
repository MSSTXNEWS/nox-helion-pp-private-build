name: NOX V63 five services native logs and resource triage
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - .github/workflows/nox-v63-five-services-triage.yml
      - nox_runpod/teacher_mesh/v63/service_triage.py
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v63-five-services-native-triage
  cancel-in-progress: false
jobs:
  inspect:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile source before any remote request
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py nox_runpod/teacher_mesh/v63/service_triage.py
      - name: Query five services through established temporary SSH (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v63.service_triage
      - name: Mandatory existing V51 key revocation readback
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Evidence scope
        if: success()
        run: |
          echo "NOX_V63_NATIVE_TRIAGE_EXECUTED=true"
          echo "SERVICE_RESTARTS_PERFORMED=false"
          echo "ONEHOST_S03_CHECKPOINTS_UNCHANGED=true"

# NOX V64 post-patch collision readback: refresh after downloader state changed.
