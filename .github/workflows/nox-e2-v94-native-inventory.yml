name: NOX E2 V94 hardware-AI acceleration native inventory
on:
  push:
    branches: [nox/e2-v94-performance-ai-volta-20261114]
    paths: ['.github/workflows/nox-e2-v94-native-inventory.yml']
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-e2-v94-60509551-readonly
  cancel-in-progress: false
jobs:
  inventory:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Authorization and code preflight
        run: |
          set -euo pipefail
          test -n "$NOX2"
          python3 -m py_compile nox_runpod/teacher_mesh/v94/live_ai_compatibility.py
      - name: ONE native 2x V100 CPU/RAM/CUDA/PyTorch/llama.cpp package inventory
        run: python3 -m nox_runpod.teacher_mesh.v94.live_ai_compatibility
      - name: Revoke temporary owner SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Read-only evidence boundary
        if: success()
        run: |
          echo 'NOX_COMPAT_AUDIT_ONLY=true'
          echo 'NOX_CHAT_RESTARTS=0'
          echo 'NOX_WEIGHT_DOWNLOADS=0'
