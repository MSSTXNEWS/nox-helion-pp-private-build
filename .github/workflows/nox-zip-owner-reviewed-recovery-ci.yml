name: NOX owner reviewed blocked ZIP recovery source acceptance
on:
  pull_request:
    paths:
      - 'nox-control/systemic_relay_20261118/zip_owner_reviewed/**'
      - 'nox-control/owner_native_operator.py'
      - '.github/workflows/nox-zip-owner-reviewed-recovery-ci.yml'
permissions:
  contents: read
jobs:
  reviewed-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact reviewed candidate and pinned owner transport (source only)
        run: |
          python -B -m py_compile nox-control/owner_native_operator.py \
            nox-control/systemic_relay_20261118/zip_owner_reviewed/owner_zip_reviewed_recovery_entry.py \
            nox-control/systemic_relay_20261118/zip_owner_reviewed/merge_web_source.py
          python -B -m unittest discover -s nox-control/systemic_relay_20261118/zip_owner_reviewed -p test_owner_zip_reviewed_recovery_entry.py -v
          python -B -m unittest discover -s nox-control/systemic_relay_20261118/zip_owner_reviewed -p test_zip_budget.py -v
