name: NOX E06 no-loss deterministic gate
on:
  push:
    paths:
      - 'coordination/e06/intake.json'
      - 'coordination/e06/verify_integration.py'
      - 'coordination/e06/emit_receipts.py'
      - 'tests/e06/test_verify_integration.py'
      - 'tests/e06/test_hardening.py'
      - '.github/workflows/nox-e06-intake.yml'
  pull_request:
    paths:
      - 'coordination/e06/intake.json'
      - 'coordination/e06/verify_integration.py'
      - 'coordination/e06/emit_receipts.py'
      - 'tests/e06/test_verify_integration.py'
      - 'tests/e06/test_hardening.py'
      - '.github/workflows/nox-e06-intake.yml'
concurrency:
  group: e06-intake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  e06-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ten physical integration-gate checks
        shell: pwsh
        run: |
          python -m unittest discover -s tests/e06 -p 'test_verify_integration.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/e06 -p 'test_hardening.py' -v
      - name: Generate fail-closed receipt
        shell: pwsh
        run: |
          python coordination/e06/verify_integration.py --source-root . --out e06-gate.json
          if ($LASTEXITCODE -ne 2) { throw "Unaccepted application must remain blocked" }
          python -c "import json; x=json.load(open('e06-gate.json')); assert x['release']=='BLOCKED'; assert len(x['gates'])==10; assert x['gates']['02_source_archive']=='PASS'"
      - name: Compute per-file pre/post SHA256 and actual Git patch SHA256
        shell: pwsh
        run: python coordination/e06/emit_receipts.py
      - name: Save machine-readable receipt
        uses: actions/upload-artifact@v4
        with:
          name: e06-no-loss-gate
          path: |
            e06-gate.json
            e06-file-receipts.json
