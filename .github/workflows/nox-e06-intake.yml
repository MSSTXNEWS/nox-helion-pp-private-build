name: NOX E06 no-loss deterministic gate
on:
  push:
    paths:
      - 'coordination/e06/**'
      - 'tests/e06/**'
      - '.github/workflows/nox-e06-intake.yml'
  pull_request:
    paths:
      - 'coordination/e06/**'
      - 'tests/e06/**'
      - '.github/workflows/nox-e06-intake.yml'
permissions:
  contents: read
jobs:
  e06-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ten physical integration-gate checks
        shell: pwsh
        run: python -m unittest discover -s tests/e06 -p 'test_*.py' -v
      - name: Generate fail-closed receipt
        shell: pwsh
        run: |
          python coordination/e06/verify_integration.py --out e06-gate.json
          if ($LASTEXITCODE -ne 2) { throw "Unaccepted application must remain blocked" }
          python -c "import json; x=json.load(open('e06-gate.json')); assert x['release']=='BLOCKED'; assert len(x['gates'])==10"
      - name: Save machine-readable receipt
        uses: actions/upload-artifact@v4
        with:
          name: e06-no-loss-gate
          path: e06-gate.json
