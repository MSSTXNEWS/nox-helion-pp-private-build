name: NOX B2 R65 main RU ES source candidate
on:
  pull_request:
    paths:
      - 'nox-control/b2_ru_es_3turn_holdout.py'
      - 'nox-control/tests/test_b2_ru_es_3turn_holdout.py'
      - 'nox-control/b2_ru_es_review_integrity.py'
      - 'nox-control/tests/test_b2_ru_es_review_integrity.py'
      - 'nox-control/b2_existing_dialog_review.py'
      - 'nox-control/tests/test_b2_existing_dialog_review.py'
      - '.github/workflows/nox-b2-r65-main-rues-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b2-r65-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pin reviewed source and run offline RU ES suites
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git hash-object nox-control/b2_ru_es_3turn_holdout.py)" = "38a00de3a374487c3e0ad9067445fa30ada5a8ab"
          test "$(git hash-object nox-control/tests/test_b2_ru_es_3turn_holdout.py)" = "57ea3c68e3db4f39a74a0f1ab8466d9530e8d7fc"
          test "$(git hash-object nox-control/b2_ru_es_review_integrity.py)" = "63dd7f468462abbe16659fbf30832c21575f2816"
          test "$(git hash-object nox-control/tests/test_b2_ru_es_review_integrity.py)" = "c0f611039988fa004141dda77f8f3d9c1727f830"
          python -B -m py_compile nox-control/b2_ru_es_3turn_holdout.py nox-control/tests/test_b2_ru_es_3turn_holdout.py nox-control/b2_ru_es_review_integrity.py nox-control/tests/test_b2_ru_es_review_integrity.py
          python -B -m unittest discover -s nox-control/tests -p test_b2_ru_es_3turn_holdout.py -v 2>&1 | tee /tmp/b2-holdout.log
          grep -Eq '^Ran 10 tests in ' /tmp/b2-holdout.log
          python -B -m unittest discover -s nox-control/tests -p test_b2_ru_es_review_integrity.py -v 2>&1 | tee /tmp/b2-review.log
          grep -Eq '^Ran 9 tests in ' /tmp/b2-review.log
          test "$(git hash-object nox-control/b2_existing_dialog_review.py)" = "9660e41dde202970da509b0db2dad3cf1e96c0b0"
          test "$(git hash-object nox-control/tests/test_b2_existing_dialog_review.py)" = "10c98b01883eba4b524feec2a483fc8294b7703c"
          python -B -m unittest discover -s nox-control/tests -p test_b2_existing_dialog_review.py -v 2>&1 | tee /tmp/b2-resume.log
          grep -Eq '^Ran 3 tests in ' /tmp/b2-resume.log
          echo 'SOURCE_ONLY: 22 tests; native quality and S03 NOT VERIFIED'
