name: NOX V108 native private V105 to V47 full-base training corpus
on:
  push:
    branches: [nox/e2-v108-teacher-corpus-repair-20261114]
    paths:
      - '.github/workflows/nox-e2-v108-base-corpus.yml'
      - 'nox_runpod/teacher_mesh/v108/prepare_v47_corpus.py'
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-e2-v108-v47-data-60509551
  cancel-in-progress: false
jobs:
  prepare:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify exact privacy guards, source syntax and NOX2
        run: |
          set -euo pipefail
          test -n "$NOX2"
          python3 -m py_compile nox_runpod/teacher_mesh/v108/prepare_v47_corpus.py
          python3 - <<'PY'
          import ast
          from nox_runpod.teacher_mesh.v108 import prepare_v47_corpus as c
          script=c.REMOTE.lstrip("\n").split("python3 - <<'PYREMOTE'\n",1)[1].rsplit("\nPYREMOTE",1)[0]
          ast.parse(script)
          for flag in ("privacy_approved","rights_verified","source_row_sha256","HOLD_STOP",
                       "HOLD_TRAIN_HOLDOUT_DUPLICATE_PROMPT","HOLD_V105_PRIVACY",
                       "HOLD_NEW_WRITE_10GB_RESERVE","NOX_V108_V47_BASE_INPUT_V1"):
              assert flag in script,flag
          for unsafe in ("os.kill(","supervisorctl restart","torch.cuda","pip install"):
              assert unsafe not in script,unsafe
          print("NOX_V108_V47_SOURCE_AND_PRIVACY=PASS")
          PY
      - name: ONE native private source conversion into V47 train/holdout, no training
        run: python3 -m nox_runpod.teacher_mesh.v108.prepare_v47_corpus
      - name: Revoke temporary SSH key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Honesty boundary
        if: success()
        run: |
          echo "NOX_V108_DATA_SOURCE_READBACK=PASS"
          echo "NOX_V108_PRIVATE_DATA_NOT_EXPORTED=true"
          echo "NOX_V108_MAIN_MODEL_UNCHANGED=true"
          echo "NOX_V108_REAL_BASE_OPTIMIZER_STEPS=0"
