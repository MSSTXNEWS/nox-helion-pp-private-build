name: NOX V16 original archive SHA256 and 729-file safety gate
on:
  push:
    branches:
      - integration/nox-v16-unified-candidate-20261028-r01
    paths:
      - 'coordination/source-lock/**'
      - 'source_0*.part'
      - '.github/workflows/nox-v16-original-source-audit.yml'
  pull_request:
    paths:
      - 'coordination/source-lock/**'
      - 'source_0*.part'
      - '.github/workflows/nox-v16-original-source-audit.yml'
permissions:
  contents: read
jobs:
  inspect-original-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run exact source ZIP, entry and SHA256 validation (no extraction)
        shell: bash
        run: |
          python3 coordination/source-lock/verify_original_archive.py \
            --parts-dir . \
            --output "${RUNNER_TEMP}/nox-original-729-sha256.json" \
            --expected-files 729
      - name: Save immutable source-only evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nox-v16-729-original-source-manifest
          path: ${{ runner.temp }}/nox-original-729-sha256.json
          retention-days: 30
