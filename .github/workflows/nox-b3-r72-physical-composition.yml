name: B3 R72 exact R71 physical composition
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/nox-b3-r72-physical-composition.yml'
      - 'coordination/onepass/b3_r71_physical_terminal_composition.cjs'
permissions:
  contents: read
jobs:
  physical-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact six source blobs and actual Node crypto regression
        shell: bash
        run: |
          set -euo pipefail
          cd coordination/onepass
          pin() { test "$(git hash-object "$1")" = "$2"; printf 'PIN %s %s\n' "$1" "$2"; }
          pin b3_r65_r64_physical_pin_check.cjs 1e22eff92da6b951ad22dea2b2db09201b2d371b
          pin b3_r66_raw_readback_binding.cjs c4331cc22cb94da0c67fa765e27c838d7b354c66
          pin b3_r68_route_binding.cjs 6d0fef57783346fe33d59ca39a625015514ae168
          pin b3_r69_exchange_scope_binding.cjs 18b3be8fc4264b32d51a57ad4db367b3ba786d41
          pin b3_r70_s03_terminal_identity.cjs ced1789a8ab19b625888489bf97faa79e07c7e1b
          pin b3_r71_physical_terminal_composition.cjs 4c0cd74bc0453d3e450894668338499549217f50
          node --version
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const {createHash} = require('node:crypto');
          assert.equal(createHash('sha256').update('abc').digest('hex'), 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad');
          const r = require('./b3_r71_physical_terminal_composition.cjs').selfTest();
          assert.equal(r.results.length, 18);
          assert.equal(r.reproduced, 12);
          assert.equal(r.results.filter(x => x.consistent).length, 1);
          assert.equal(r.native_accepted, false);
          console.log(JSON.stringify(r));
          console.log('R71 direct Node crypto: 18/18 synthetic; native_accepted=false');
          NODE
