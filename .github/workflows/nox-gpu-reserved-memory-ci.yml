name: NOX GPU reserved-memory source contract
on:
  pull_request:
    paths:
      - "nox-control/owner_native_gpu_inventory.py"
      - "nox-control/owner_native_operator.py"
      - "nox-control/test_owner_native_gpu_inventory.py"
      - "nox-control/test_owner_native_operator_gpu_inventory.py"
      - ".github/workflows/nox-gpu-reserved-memory-ci.yml"
permissions:
  contents: read
jobs:
  exact-gpu-memory-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile bounded GPU helper, owner parser, regressions
        run: |
          python -B -m py_compile \
            nox-control/owner_native_gpu_inventory.py \
            nox-control/owner_native_operator.py \
            nox-control/test_owner_native_gpu_inventory.py \
            nox-control/test_owner_native_operator_gpu_inventory.py
      - name: Execute real helper and owner receipt contract regressions
        run: |
          python -B -m unittest discover -s nox-control -p test_owner_native_gpu_inventory.py -v
          python -B -m unittest discover -s nox-control -p test_owner_native_operator_gpu_inventory.py -v
