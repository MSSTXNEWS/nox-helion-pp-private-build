name: NOX existing SSH secret -> read-only trainer diagnosis
on:
  push:
    branches: [feature/nox-tigris-warm-20261115]
    paths: ['.github/workflows/nox-existing-ssh-credential-readonly-20261115.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: nox-60509551-auth-existing-only-readonly
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NOX_SSH_CANDIDATE: ${{ secrets.NOX }}
      NOX_SSH_PRIVATE_KEY: ${{ secrets.NOX_SSH_PRIVATE_KEY }}
      NOX_VAST_SSH_PRIVATE_KEY: ${{ secrets.NOX_VAST_SSH_PRIVATE_KEY }}
    steps:
      - name: Verify existing NOX SSH credentials without printing values
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess,tempfile,pathlib,re,shutil
          CANDIDATES=('NOX_SSH_PRIVATE_KEY','NOX_VAST_SSH_PRIVATE_KEY','NOX_SSH_CANDIDATE')
          print('NOX_DIAG_SCOPE=READ_ONLY')
          print('NOX_REMOTE_CHANGES=false')
          print('NOX_NEW_SSH_KEYS_CREATED=false')
          with tempfile.TemporaryDirectory(prefix='nox-readonly-') as tmp:
              private=pathlib.Path(tmp)/'identity'
              known=pathlib.Path(tmp)/'known_hosts'
              selected=None
              for name in CANDIDATES:
                  val=os.getenv(name,'').strip()
                  # Do not send unrelated API tokens or passwords to SSH.
                  if not re.search(r'-----BEGIN (?:OPENSSH|RSA|EC|DSA) PRIVATE KEY-----',val):
                      continue
                  private.write_text(val+'\n')
                  os.chmod(private,0o600)
                  p=subprocess.run(['ssh-keygen','-y','-P','','-f',str(private)],
                      capture_output=True,text=True,timeout=8)
                  if p.returncode==0 and p.stdout.startswith(('ssh-ed25519 ','ssh-rsa ','ecdsa-sha2-')):
                      selected=name
                      break
                  private.unlink(missing_ok=True)
              print('NOX_SSH_PRIVATE_KEY_AVAILABLE='+str(bool(selected)).lower())
              if not selected:
                  print('NOX_SSH_NATIVE=HOLD_NO_EXISTING_SSH_PRIVATE_KEY')
                  raise SystemExit(0)
              cmd=['ssh','-T','-p','11234','-i',str(private),
                  '-o','BatchMode=yes','-o','IdentitiesOnly=yes',
                  '-o','PasswordAuthentication=no','-o','KbdInteractiveAuthentication=no',
                  '-o','StrictHostKeyChecking=accept-new',
                  '-o','UserKnownHostsFile='+str(known),
                  '-o','ConnectTimeout=10','-o','ServerAliveInterval=5',
                  'root@166.113.48.41','bash','-se']
              remote=r"""
          set -u
          echo NOX_NATIVE_READONLY=true
          echo NOX_REMOTE_SERVER_UID=$(id -u)
          echo NOX_GPU_BEGIN
          nvidia-smi --query-gpu=index,name,memory.total,memory.used,utilization.gpu,temperature.gpu --format=csv,noheader,nounits 2>/dev/null | head -4 || true
          echo NOX_GPU_END
          echo NOX_RAM_BEGIN
          free -m 2>/dev/null | grep '^Mem:' || true
          echo NOX_RAM_END
          echo NOX_DISK_BEGIN
          df -h /root/nox 2>/dev/null | tail -1 || true
          echo NOX_DISK_END
          echo NOX_SUPERVISOR_BEGIN
          supervisorctl status 2>/dev/null | grep -Ei 'nox|train|jupyter|forge' | head -25 || true
          echo NOX_SUPERVISOR_END
          echo NOX_HEALTH_BEGIN
          for port in 8080 8081 8888; do
            code=$(curl -s -m 2 -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/health" 2>/dev/null || true)
            echo "$port=$code"
          done
          echo NOX_HEALTH_END
          echo NOX_NATIVE_READONLY_COMPLETE=true
          """
              p=subprocess.run(cmd,input=remote,encoding='utf-8',stdout=subprocess.PIPE,
                               stderr=subprocess.PIPE,timeout=55)
              ok=p.returncode==0 and 'NOX_NATIVE_READONLY_COMPLETE=true' in p.stdout
              print('NOX_SSH_NATIVE='+('PASS' if ok else 'HOLD_AUTH_OR_ROUTE'))
              if ok:
                  # Only sanitized bounded output, no credentials, private paths, or full logs.
                  acceptable=('NOX_NATIVE_READONLY','NOX_REMOTE_SERVER_UID',
                              'NOX_GPU_BEGIN','NOX_GPU_END','NOX_RAM_BEGIN','NOX_RAM_END',
                              'NOX_DISK_BEGIN','NOX_DISK_END','NOX_SUPERVISOR_BEGIN',
                              'NOX_SUPERVISOR_END','NOX_HEALTH_BEGIN','NOX_HEALTH_END')
                  inside=None
                  for l in p.stdout.splitlines():
                      if len(l)>180:continue
                      if l.endswith('_BEGIN'):
                          inside=l
                          print(l)
                          continue
                      if l.endswith('_END'):
                          print(l)
                          inside=None
                          continue
                      if l.startswith(acceptable):
                          print(l)
                          continue
                      if inside and all(c.isalnum() or c in ' ,.:+_/-=%()' for c in l):
                          print(l)
              else:
                  # Never output SSH stderr (may expose sensitive host data).
                  print('NOX_SSH_RETURN_CODE='+str(p.returncode))
          PY
