name: NOX V66 live cache/offload space and open process read-only audit
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v66-offload-cache-audit.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v66-safe-cache-inventory
  cancel-in-progress: false
jobs:
  native-read:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify audit syntax
        run: python3 -m py_compile nox_runpod/teacher_mesh/v66/storage_audit.py
      - name: Read actual cache sizes, open file handles and offload options
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v66.storage_audit
      - name: Mandatory SSH ephemeral key removal
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: Scope
        if: success()
        run: |
          echo "NO_FILES_DELETED=true"
          echo "NO_MODEL_OR_CHECKPOINT_COPY_TRIGGERED=true"
