name: NOX V135 full-base ZeRO3 CPU offload distillation SOURCE QA only
on:
  pull_request:
    branches: [feature/nox-v37-v100-firsthour-14d-20261113]
    paths:
      - 'nox_runpod/teacher_mesh/v135/**'
      - '.github/workflows/nox-v135-zero3-distillation-source.yml'
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v135/**'
      - '.github/workflows/nox-v135-zero3-distillation-source.yml'
permissions:
  contents: read
concurrency:
  group: nox-v135-distillation-source-only
  cancel-in-progress: false
jobs:
  test-no-native:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile actual full-base trainer without GPU/model/provider access
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v135/zero3_fullbase_plan.py nox_runpod/teacher_mesh/v135/curate_teacher_distillation.py nox_runpod/teacher_mesh/v135/train_full_base_zero3.py
          python -m unittest discover -s nox_runpod/teacher_mesh/v135/tests -p 'test_*.py' -v
          python - <<'PY'
          import pathlib
          import nox_runpod.teacher_mesh.v135.zero3_fullbase_plan as z
          import nox_runpod.teacher_mesh.v135.train_full_base_zero3 as x
          assert z.fullbase_admission(None)['optimizer_steps_verified']==0
          assert z.fullbase_admission(None)['state']=='HOLD'
          assert x.main is not None
          print('NOX_V135_GPU_OPTIMIZER_STEPS_ACTUAL=UNVERIFIED_ZERO')
          print('NOX_V135_FULLBASE_SOURCE_TESTED=true')
          print('NOX_V135_NO_ADAPTERS_OR_MAIN_MODEL_CHANGES=true')
          PY
