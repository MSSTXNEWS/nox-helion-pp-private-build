name: NOX owner builder archive cleanup guard tests
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox-control/owner_builder_archive_reclaim.py'
      - 'nox-control/test_owner_builder_archive_reclaim.py'
      - 'nox-control/owner_builder_proc_probe.py'
      - 'nox-control/owner_builder_drive_public_proof.json'
      - '.github/workflows/nox-owner-builder-archive-reclaim-source-ci.yml'
  pull_request:
    paths:
      - 'nox-control/owner_builder_archive_reclaim.py'
      - 'nox-control/test_owner_builder_archive_reclaim.py'
      - 'nox-control/owner_builder_proc_probe.py'
      - 'nox-control/owner_builder_drive_public_proof.json'
      - '.github/workflows/nox-owner-builder-archive-reclaim-source-ci.yml'
permissions:
  contents: read
jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run temporary-tree cleanup guard tests
        run: |
          python -m py_compile nox-control/owner_builder_archive_reclaim.py nox-control/test_owner_builder_archive_reclaim.py
          cd nox-control
          python -m unittest -v test_owner_builder_archive_reclaim
      - name: Mark runtime boundary
        run: echo 'SOURCE TESTS ONLY. No OneHost/Vast files, STOP, services, backups, or weights touched.'
