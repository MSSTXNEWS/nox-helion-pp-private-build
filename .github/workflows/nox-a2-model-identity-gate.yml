name: NOX A2 6V14-01 truthful identity source
on:
  pull_request:
    branches: [main]
    paths:
      - 'nox-control/bridge/nox_webapi.py'
      - 'nox-control/bridge/test_nox_model_identity_truth_6v14.py'
      - '.github/workflows/nox-a2-model-identity-gate.yml'
permissions:
  contents: read
jobs:
  truthful-model-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependency and exact focused regression
        run: |
          python -m pip install --disable-pip-version-check fastapi==0.115.12 httpx==0.28.1
          python -B -m unittest discover -s nox-control/bridge -p 'test_nox_model_identity_truth_6v14.py' -v
