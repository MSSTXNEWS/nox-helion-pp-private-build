name: NOX V112 Maya existing bridge RU ES SSE STOP S03 source contract
on:
  push:
    branches:
      - codex/nox-maya-existing-bridge-contract-20261116
    paths:
      - 'nox_runpod/teacher_mesh/v112/**'
      - '.github/workflows/nox-v112-maya-bridge-contract.yml'
  pull_request:
    paths:
      - 'nox_runpod/teacher_mesh/v112/**'
      - '.github/workflows/nox-v112-maya-bridge-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Compile and run existing V112 plus Maya API contract fixtures
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v112/native_v29_full_bridge.py nox_runpod/teacher_mesh/v112/tests/test_maya_existing_bridge_contract.py
          python -m unittest -v nox_runpod.teacher_mesh.v112.tests.test_maya_existing_bridge_contract
          python -m unittest -v nox_runpod.teacher_mesh.v112.tests.test_native_bridge
      - name: Report scope without implying Maya runtime
        run: |
          echo 'NOX_V112_MAYA_BRIDGE_CONTRACT_SOURCE_TESTED=true'
          echo 'NOX_V112_MAYA_BINARY_EXECUTED=false'
          echo 'NOX_V112_ONEHOST_DEPLOYED=false'
          echo 'NOX_V112_PRODUCTION_S03_TOUCHED=false'
