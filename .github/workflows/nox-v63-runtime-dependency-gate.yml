name: NOX V63 native service stability and Python dependency gate
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v63-runtime-dependency-gate.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nox-v63-runtime-dependencies-readonly
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source compile before remote probe
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v63/runtime_dependency_gate.py
      - name: Actual existing runtime and two-sample service status
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v63.runtime_dependency_gate
      - name: Mandatory temporary SSH key removal
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: No service mutations
        if: success()
        run: |
          echo "NOX_SERVICE_RESTARTS=NONE"
          echo "NOX_INSTALLS_OR_DOWNLOADS=NONE"
          echo "NOX_NATIVE_ENV_READONLY_PASS=true"
