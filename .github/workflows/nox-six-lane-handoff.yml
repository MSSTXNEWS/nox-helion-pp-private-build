name: NOX six-lane handoff exact source checks
on:
  pull_request:
    paths:
      - 'nox-control/systemic_relay_20261118/six_lane_refill_handoff_20261119.json'
      - 'nox-control/systemic_relay_20261118/test_six_lane_refill_handoff.py'
      - '.github/workflows/nox-six-lane-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-six-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prove registry SHA and six unique work lanes
        working-directory: nox-control/systemic_relay_20261118
        run: |
          python -m unittest -v test_six_lane_refill_handoff
