name: NOX V51 per-instance SSH attach preflight (read-only)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v51-ssh-key-api-preflight.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
jobs:
  preflight:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - name: Read per-instance SSH key API schema without creating keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          key=os.environ.get('NOX2','')
          if not key: raise SystemExit('HOLD_NOX2_MISSING')
          base='https://console.vast.ai/api/v0'
          h={'Authorization':'Bearer '+key,'Accept':'application/json'}
          for label,path in [('instance','/instances/60509551/'),('keys','/instances/60509551/ssh/')]:
              r=urllib.request.Request(base+path,headers=h,method='GET')
              try:
                  with urllib.request.urlopen(r,timeout=25) as response: data=json.load(response)
              except urllib.error.HTTPError as e:
                  print(label.upper()+'_HTTP_CODE='+str(e.code))
                  raise SystemExit(2)
              if label=='instance':
                  d=data.get('instances',data) if isinstance(data,dict) else None
                  if isinstance(d,list):d=next((x for x in d if str(x.get('id'))=='60509551'),None)
                  if not isinstance(d,dict) or str(d.get('id'))!='60509551':
                      raise SystemExit('HOLD_WRONG_INSTANCE')
                  print('INSTANCE_STATUS='+str(d.get('actual_status')))
                  print('INSTANCE_SSH_ROUTE_PRESENT='+str(bool(d.get('ssh_host') and d.get('ssh_port'))).lower())
              else:
                  print('KEYS_RESPONSE_TYPE='+type(data).__name__)
                  if isinstance(data,dict):
                      print('KEYS_RESPONSE_FIELDS='+','.join(sorted(str(k) for k in data if k in ('success','ssh_keys','keys','id','msg','error'))))
                      v=data.get('ssh_keys',data.get('keys'))
                      if isinstance(v,str):
                          try:v=json.loads(v)
                          except (ValueError,TypeError):v=None
                      print('KEYS_COLLECTION_TYPE='+type(v).__name__)
                      if isinstance(v,list):
                          print('KEYS_COUNT='+str(len(v)))
                          if v and isinstance(v[0],dict):
                              print('KEY_ENTRY_FIELD_NAMES='+','.join(sorted(k for k in v[0] if k in ('id','public_key','ssh_key','key','name'))))
                  elif isinstance(data,list):
                      print('KEYS_COUNT='+str(len(data)))
                  print('SSH_API_READ_VERIFIED=true')
          PY
