name: D3 R109 ordered offline release
on:
  pull_request:
    paths: ['nox-control/d3-r109/**', '.github/workflows/nox-d3-r109-ordered-release.yml']
permissions:
  contents: read
jobs:
  ordered-source-release:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'd3-r109-ordered-release-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: New extracted ordered entrypoints
        run: python3 -B nox-control/d3-r109/build_ordered.py "$RUNNER_TEMP/nox-r109-ordered-offline.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: nox-r109-ordered-offline
          path: ${{ runner.temp }}/nox-r109-ordered-offline.zip
          retention-days: 14
