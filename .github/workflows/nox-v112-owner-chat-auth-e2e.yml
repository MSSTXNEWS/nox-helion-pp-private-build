name: NOX V112 authentic owner cookie WEB V29 and durable S03 E2E
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox_runpod/teacher_mesh/v112/**'
      - '.github/workflows/nox-v112-owner-chat-auth-e2e.yml'
  workflow_dispatch:
    inputs:
      allow_owner_e2e:
        description: 'Explicitly permit one synthetic owner-cookie chat/S03 E2E after idle and current SHA checks'
        type: choice
        required: true
        options: ['NO','YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-owner-cookie-v112-60509551
  cancel-in-progress: false
jobs:
  native:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_owner_e2e == 'YES' && github.actor == 'MSSTXNEWS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static safety gate
        run: |
          python -m py_compile nox_runpod/teacher_mesh/v112/owner_cookie_web_e2e.py
          python - <<'PY'
          from nox_runpod.teacher_mesh.v112.owner_cookie_web_e2e import REMOTE
          inner=REMOTE.split("<<'PYREMOTE'\n",1)[1].rsplit('\nPYREMOTE',1)[0]
          compile(inner,'<v112 native>','exec')
          for token in ('HOLD_PRIMARY_CHAT_BUSY','HOLD_OFFICIAL_LOGIN','HOLD_OWNER_COOKIE_NOT_VALID',
                        'HOLD_S03_STREAM_COMMIT','_read_chat_password','NATIVE_V112_PRIVATE_CREDENTIALS_EXPORTED=false'):
              assert token in REMOTE
          print('NOX_V112_SOURCE_COMPILE_PASS=true')
          PY
      - name: Real official login cookie + model stream and memory readback
        run: python -m nox_runpod.teacher_mesh.v112.owner_cookie_web_e2e
      - name: Always revoke ephemeral SSH key
        if: always()
        run: python -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
