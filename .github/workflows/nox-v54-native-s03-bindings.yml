name: NOX V54 live S03 and OneHost runtime bindings (read only)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v54-native-s03-bindings.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v54-native-runtime-audit
  cancel-in-progress: false
jobs:
  bind-audit:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' && (github.actor == 'MSSTXNEWS') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile sources
        run: |
          python3 -m py_compile nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py nox_runpod/teacher_mesh/v54/runtime_bindings_audit.py
      - name: Read only active S03 DB file handles and OneHost source structures
        run: |
          python3 -m nox_runpod.teacher_mesh.v54.runtime_bindings_audit
      - name: Revoke temporary SSH access even if prior step failed
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: No production writes or queue side effects
        if: success()
        run: |
          echo "NATIVE_BINDINGS_READ_ONLY_PROBE=PASS"
          echo "ONEHOST_QUEUE_REGISTRATION=NOT_ATTEMPTED"
          echo "S03_CONTENT_EXPORT=NONE"
          echo "NOX_WEIGHTS_NOT_CHANGED=true"
