name: NOX V50 Vast ephemeral SSH source/security tests
on:
  push:
    branches:
      - feature/nox-v38-synaptic-brain-20261114
    paths:
      - "nox_runpod/teacher_mesh/v50/**"
      - "nox_runpod/teacher_mesh/v51/ephemeral_ssh_probe.py"
      - ".github/workflows/nox-v50-offline-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nox-v50-source-ci
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate the actual audited Python source
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v50/ephemeral_ssh_audit.py
          python -m unittest discover -s nox_runpod/teacher_mesh/v50/tests -p 'test_*.py' -v
      - name: Check restricted instance and method guards
        run: |
          python - <<'PY'
          from nox_runpod.teacher_mesh.v50.ephemeral_ssh_audit import Vast
          x=Vast('offline-valid-test-key-not-real')
          for path,verb in [('instances/60509551/','DELETE'),('instances/60509551/ssh/','DELETE'),('instances/60509551/ssh/1/','POST')]:
              try:x.api(path,verb)
              except RuntimeError as e:
                  assert str(e)=='HOLD_API_METHOD', (path,verb)
              else:raise AssertionError('UNSAFE_VAST_METHOD_ACCEPTED')
          print('INSTANCE_DELETE_GUARD=PASS')
          PY
      - name: Evidence scope
        run: |
          echo 'SOURCE_TESTS_ONLY=true'
          echo 'EPHEMERAL_SSH_ATTACHED=false'
          echo 'LIVE_VAST_COMMAND_EXECUTED=false'
