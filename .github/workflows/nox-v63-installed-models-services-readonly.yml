name: NOX V63 native installed models and service integration audit
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v63-installed-models-services-readonly.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v63-installed-service-model-inventory
  cancel-in-progress: false
jobs:
  inventory:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate static inventory source
        run: |
          set -euo pipefail
          python3 -m py_compile nox_runpod/teacher_mesh/v63/installation_inventory.py
      - name: Native read-only installed models, packages, service process audit
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v63.installation_inventory
      - name: Revoke same temporary SSH key
        if: always()
        run: |
          python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: No changes assertion
        if: success()
        run: |
          echo "NOX_MODELS_DOWNLOADED=false"
          echo "NOX_TRAINING_RESTARTED=false"
          echo "NOX_SERVICES_NOT_RESTARTED_BY_THIS_WORKFLOW=true"
          echo "NOX_PROGRAM_SOURCE=GENESIS_V1_1_20261108"
          echo "NOX_DOWNLOAD_DECISION_REQUIRES_FREE_SPACE_AND_SHA=true"
