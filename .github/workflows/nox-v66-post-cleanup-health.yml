name: NOX V66 post-cache-cleanup health and disk readback (read only)
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths: [.github/workflows/nox-v66-post-cleanup-health.yml]
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v66-post-cleanup-health
  cancel-in-progress: false
jobs:
  verify:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax of original V63 native Supervisor inventory
        run: python3 -m py_compile nox_runpod/teacher_mesh/v63/service_triage.py
      - name: Read GPU RAM disk and five Supervisor states, no mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m nox_runpod.teacher_mesh.v63.service_triage | tee "$RUNNER_TEMP/nox-v66-verify.log"
          python3 - <<'PY'
          import json,os,pathlib
          lines=pathlib.Path(os.environ['RUNNER_TEMP'],'nox-v66-verify.log').read_text().splitlines()
          events=[json.loads(s.split('=',1)[1]) for s in lines if s.startswith('NATIVE_SERVICE_RESOURCES=')]
          if len(events)!=1:raise SystemExit('HOLD_NATIVE_DISK_READBACK')
          e=events[0]
          print('NOX_V66_DISK_FREE_BYTES='+str(e.get('disk_free_bytes')))
          print('NOX_V66_8080='+str(e.get('health_http_8080')))
          print('NOX_V66_8081='+str(e.get('health_http_8081')))
          if e.get('disk_free_bytes') is None or e['disk_free_bytes']<17400000000:
              raise SystemExit('HOLD_DISK_CLEANUP_REGRESSION')
          if e.get('health_http_8080')!=200 or e.get('health_http_8081')!=200:
              raise SystemExit('HOLD_MAIN_CHAT_OR_MODEL_HEALTH')
          print('NOX_V66_MAIN_CHAT_AND_MODEL_HEALTH_PASS=true')
          print('NOX_V66_20GB_CHECKPOINT_RESERVE_PASS='+str(e['disk_free_bytes']>=20000000000).lower())
          PY
      - name: Remove only temporary SSH key even if audit errors
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
      - name: No production mutations
        if: success()
        run: echo 'POST_CLEANUP_VERIFIED_READ_ONLY=true'
