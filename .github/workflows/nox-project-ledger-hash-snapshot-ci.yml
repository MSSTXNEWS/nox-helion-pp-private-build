name: NOX project ledger hash snapshot source checks
on:
  pull_request:
    paths:
      - 'nox-control/systemic_relay_20261118/owner_systemic_relay_observe.py'
      - 'nox-control/systemic_relay_20261118/test_owner_project_ledger_hash_snapshot.py'
      - '.github/workflows/nox-project-ledger-hash-snapshot-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hash-snapshot-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and test source-only snapshot
        working-directory: nox-control/systemic_relay_20261118
        run: |
          python -m py_compile owner_systemic_relay_observe.py test_owner_project_ledger_hash_snapshot.py
          python -m unittest -v test_owner_project_ledger_hash_snapshot
