name: NOX V126 original S03 owner fact write isolation suite
on:
  push:
    branches: [nox/v126-native-s03-owner-facts-20261115]
    paths:
      - 'nox_runpod/teacher_mesh/v126/owner_s03_fact_write.py'
      - 'nox_runpod/teacher_mesh/v126/test_owner_s03_fact_write.py'
      - '.github/workflows/nox-v126-facts-source-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-s03-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install test-only FastAPI/HTTPX, never native Vast
        run: python -m pip install -q fastapi==0.128.2 httpx==0.28.1
      - name: Compile exact owner-metadata writer with original S03-shaped SQLite fixture
        run: |
          set -euo pipefail
          python -m py_compile nox_runpod/teacher_mesh/v126/owner_s03_fact_write.py
          python -m unittest -v nox_runpod.teacher_mesh.v126.test_owner_s03_fact_write
          echo 'SOURCE_TESTS_ONLY=true'
          echo 'ORIGINAL_S03_UNCHANGED_BY_CI=true'
