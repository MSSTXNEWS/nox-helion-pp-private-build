name: NOX V95 live RAM/offload base-weight training prerequisites
on:
  push:
    branches: [nox/e2-v95-ram-weight-pipeline-20261114]
    paths: ['.github/workflows/nox-e2-v95-ram-preflight.yml']
  workflow_dispatch:
    inputs:
      allow_native:
        description: 'Owner-approved original NOX OneHost access only'
        type: choice
        required: true
        options: ['NO', 'YES']
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: nox-v95-60509551-ram-preflight
  cancel-in-progress: false
jobs:
  native:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.allow_native == 'YES' && github.actor == 'MSSTXNEWS' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOX2: ${{ secrets.NOX2 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Source and authorized key check
        run: |
          set -euo pipefail
          test -n "$NOX2" || exit 2
          python3 -m py_compile nox_runpod/teacher_mesh/v95/ram_training_preflight.py
      - name: One physical CPU RAM, NVML, trainer env and native source audit
        run: python3 -m nox_runpod.teacher_mesh.v95.ram_training_preflight
      - name: Revoke exact ephemeral SSH owner key
        if: always()
        run: python3 -m nox_runpod.teacher_mesh.v51.ephemeral_ssh_probe cleanup
