name: NOX AUTO 1D cold independent restore source gate
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox-control/nox_cold_drive.py'
      - 'nox-control/test_nox_cold_drive.py'
      - '.github/workflows/nox-auto1d-cold-restore-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare accessible owner-flag directories on isolated CI runner
        run: |
          set -euo pipefail
          # GitHub runners are unprivileged. Production OneHost keeps its own
          # ACLs; unreadable owner controls MUST remain HOLD in application code.
          sudo install -d -m 0755 /root/nox/program /root/nox/state /workspace
          sudo chmod 0711 /root
          sudo chmod 0755 /root/nox /root/nox/program /root/nox/state
          for flag in /root/nox/STOP /root/nox/STOP.flag /root/nox/stop.flag /root/nox/.stop /root/nox/program/STOP /root/nox/state/STOP /root/nox/state/STOP.flag /root/nox/state/OWNER_MAINTENANCE.flag /workspace/NOX_STOP; do
            test ! -e "$flag" && test ! -L "$flag"
          done
      - name: Cold-drive full regression and real isolated fixture restore
        run: |
          set -euo pipefail
          python3 -m py_compile nox-control/nox_cold_drive.py nox-control/test_nox_cold_drive.py
          python3 -m unittest discover -s nox-control -p test_nox_cold_drive.py -v
      - name: No native claims
        run: |
          echo "OFFLINE_FIXTURE_SOURCE_TEST=true"
          echo "ONEHOST_NOT_CHANGED=true"
          echo "REAL_CLOUD_RESTORE_NOT_TESTED=true"
          echo "S03_OPTIMIZER_NOT_BACKED_UP=true"
          echo "FILES_DELETED=false"
