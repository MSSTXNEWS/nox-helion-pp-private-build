name: NOX AUTO 1D cold independent restore source gate
on:
  push:
    branches: [feature/nox-v38-synaptic-brain-20261114]
    paths:
      - 'nox-control/nox_cold_drive.py'
      - 'nox-control/test_nox_cold_drive.py'
      - '.github/workflows/nox-auto1d-cold-restore-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cold-drive full regression and real isolated fixture restore
        run: |
          set -euo pipefail
          python3 -m py_compile nox-control/nox_cold_drive.py nox-control/test_nox_cold_drive.py
          python3 -m unittest discover -s nox-control -p test_nox_cold_drive.py -v
      - name: No native claims
        run: |
          echo "OFFLINE_FIXTURE_SOURCE_TEST=true"
          echo "ONEHOST_NOT_CHANGED=true"
          echo "REAL_CLOUD_RESTORE_NOT_TESTED=true"
          echo "S03_OPTIMIZER_NOT_BACKED_UP=true"
          echo "FILES_DELETED=false"
