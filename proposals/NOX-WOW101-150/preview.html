<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOX HELION · WOW 101–150</title><link rel="stylesheet" href="./director.css"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 48% 26%,#24353c,#090d14 68%,#030509);color:#f0ebe4;font:14px/1.5 Segoe UI,Arial,sans-serif}main{max-width:1420px;margin:auto;padding:18px}h1{font-size:clamp(21px,3vw,34px);letter-spacing:.13em;margin:0}p,small{color:#bbc4c7}header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:1.6fr 1fr;gap:15px;margin-top:18px}.stage{position:relative;min-height:500px;border-radius:23px;border:1px solid #7f93a06e;overflow:hidden;display:grid;place-items:center;background:radial-gradient(ellipse,#263640,#0a1119 63%,#03060a)}.stage strong{font-size:clamp(36px,6vw,88px);letter-spacing:.23em;color:#d6d9d882;text-shadow:0 0 30px #b37b5955}.tools{max-height:600px;overflow:auto;padding:13px;background:#101923;border:1px solid #7b8b965a;border-radius:18px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px}button,select{font:inherit;cursor:pointer;min-height:44px;border:1px solid #79909a77;border-radius:9px;background:#1e2b34;color:#f0e9e0;padding:9px;text-align:left}button[aria-pressed=true]{border-color:#e1ae7c;background:#443024}button:focus-visible,select:focus-visible{outline:2px solid #e9b57b}@media(max-width:830px){.layout{grid-template-columns:1fr}.stage{min-height:355px}.tools{max-height:460px}}</style></head><body><main><header><div><small>NOX · NON-PRODUCTION SECONDARY SCENE</small><h1>DIRECTOR · WOW 101–150</h1><p>50 режиссёрских кинопереходов. ДЕМО — не оригинальный экран D02.</p></div><label>Режим <select id="mode"><option>BALANCED</option><option>MAX</option><option>ECO</option><option>REDUCED</option></select></label></header><div class="layout"><section class="stage" id="stage" data-nox-wow-slot="secondary"><strong>HELION</strong></section><aside class="tools"><h2>50 отдельных сцен</h2><div class="cards" id="cards"></div></aside></div></main><script type="module">import {SHOTS} from "./catalog.mjs";import {mountDirector} from "./director.mjs";const m=mountDirector(document.getElementById("stage"));const cards=document.getElementById("cards");for(const s of SHOTS){const b=document.createElement("button");b.type="button";b.textContent=s.id+" · "+s.name;b.setAttribute("aria-pressed","false");b.addEventListener("click",()=>{m.preview(s.id);for(const x of cards.children)x.setAttribute("aria-pressed",String(x===b))});cards.append(b)}document.getElementById("mode").addEventListener("change",e=>m.setMode(e.target.value));m.preview(101);cards.firstChild.setAttribute("aria-pressed","true");</script></body></html>
