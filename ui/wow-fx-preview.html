<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="nox-wow-fx.css">
<link rel="stylesheet" href="selfbuilder-menu-v2.css">
<style>
body{margin:0;background:#070b12;padding:20px;color:#edf3f5}
.stage{position:relative}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.smoke{position:absolute;right:8%;bottom:0;width:180px;opacity:.7;pointer-events:none}
.fire{width:28px;height:36px;vertical-align:middle}
</style></head><body>
<section class="stage nox-fx nox-sb-panel">
<canvas class="fx" id="fx"></canvas>
<img class="smoke" src="fx/smoke.svg" alt="">
<h2 class="nox-sb-heading">NOX · MENU <img class="fire" src="fx/fire.svg" alt=""></h2>
<div class="nox-sb-grid">
<button class="nox-sb-tile">РАБОТА</button>
<button class="nox-sb-tile" data-state="RUNNING">ИНТЕЛЛЕКТ</button>
<button class="nox-sb-tile" data-state="HOLD">ЗНАНИЯ</button>
<button class="nox-sb-tile" data-state="ERROR">ТВОРЧЕСТВО</button>
<button class="nox-sb-tile" data-state="OK">ЛЮДИ</button>
<button class="nox-sb-tile">РАЗВИТИЕ</button>
<button class="nox-sb-tile">МИР</button>
<button class="nox-sb-tile">СИСТЕМА</button>
</div>
</section>
<script src="fx/three.min.js"></script>
<script type="module">
import { mountNoxWow } from './fx/nox-wow-scene.js';
mountNoxWow(document.getElementById('fx'));
</script>
</body></html>
