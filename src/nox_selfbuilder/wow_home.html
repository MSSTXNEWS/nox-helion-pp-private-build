<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOX HELION · HOME</title>
  <style>
    :root {
      --obsidian: #04060a;
      --amber: #ffb86a;
      --cyan: #5ce1ff;
      --lava: #ff4d1a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse 80% 60% at 50% 100%, #1a0a04 0%, var(--obsidian) 70%);
      color: #f4f1ea;
      font-family: "Segoe UI Variable", system-ui, sans-serif;
      overflow: hidden;
    }
    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Central liquid sun */
    .sun {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #2a1208 0%, #0a0402 45%, #000 100%);
      box-shadow:
        0 0 40px rgba(255,70,20,0.4),
        0 0 80px rgba(90,225,255,0.08),
        inset 0 0 30px rgba(255,40,0,0.35);
      animation: breathe 9s ease-in-out infinite;
    }
    .sun::before {
      content: "";
      position: absolute;
      inset: -8%;
      border-radius: 50%;
      background:
        conic-gradient(from 20deg,
          transparent 0%,
          rgba(255,80,20,0.35) 6%,
          transparent 12%,
          rgba(90,225,255,0.2) 45%,
          transparent 52%,
          rgba(255,100,30,0.25) 78%,
          transparent 85%);
      animation: rotate 28s linear infinite;
      filter: blur(4px);
    }
    .sun::after {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 40% 35%, rgba(255,180,80,0.15) 0%, transparent 50%),
        radial-gradient(circle at 60% 60%, rgba(90,225,255,0.08) 0%, transparent 40%);
      animation: veins 14s ease-in-out infinite alternate;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); box-shadow: 0 0 35px rgba(255,70,20,0.35); }
      50%      { transform: scale(1.03); box-shadow: 0 0 60px rgba(255,100,30,0.5); }
    }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes veins {
      0%   { opacity: 0.6; transform: rotate(0deg); }
      100% { opacity: 0.9; transform: rotate(20deg); }
    }
    /* 8 cores */
    .orbit {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      animation: spin 40s linear infinite;
    }
    .orbit:nth-child(2) { width: 380px; height: 380px; animation-duration: 32s; animation-direction: reverse; }
    .orbit:nth-child(3) { width: 640px; height: 640px; animation-duration: 48s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .core {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      top: 0;
      left: 50%;
      margin-left: -18px;
      transform-origin: center 260px;
    }
    .orbit:nth-child(2) .core { transform-origin: center 190px; }
    .orbit:nth-child(3) .core { transform-origin: center 320px; }
    /* Unique materials per TZ */
    .c-consciousness { background: radial-gradient(circle at 30% 30%, #ffb86a, #3a1806); box-shadow: 0 0 16px #ff6b2c; }
    .c-persona       { background: radial-gradient(circle at 30% 30%, #8a8680, #1a1a1a); box-shadow: 0 0 12px #555; }
    .c-atlas         { background: radial-gradient(circle at 30% 30%, #5ce1ff, #0a2030); box-shadow: 0 0 14px #5ce1ff; }
    .c-voice         { background: radial-gradient(circle at 30% 30%, #a0e0ff, #103040); box-shadow: 0 0 14px #7ad4ff; }
    .c-reflection    { background: radial-gradient(circle at 30% 30%, #e0e0e0, #404040); box-shadow: 0 0 10px #aaa; }
    .c-core          { background: radial-gradient(circle at 30% 30%, #ff8c40, #4a2010); box-shadow: 0 0 16px #ff5a1f; }
    .c-nexus         { background: radial-gradient(circle at 30% 30%, #666, #111); box-shadow: 0 0 10px #444; }
    .c-forge         { background: radial-gradient(circle at 30% 30%, #c07040, #3a2010); box-shadow: 0 0 14px #a05030; }
    .core::after {
      content: attr(data-label);
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      color: var(--amber);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s;
      text-shadow: 0 0 4px #000;
    }
    .core:hover::after { opacity: 1; }
    .label {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      color: var(--amber);
      text-transform: uppercase;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="orbit">
      <div class="core c-consciousness" data-label="CONSCIOUSNESS" style="transform: rotate(0deg) translateY(-260px);"></div>
      <div class="core c-persona" data-label="PERSONA" style="transform: rotate(45deg) translateY(-260px);"></div>
      <div class="core c-atlas" data-label="ATLAS" style="transform: rotate(90deg) translateY(-260px);"></div>
    </div>
    <div class="orbit">
      <div class="core c-voice" data-label="VOICE" style="transform: rotate(20deg) translateY(-190px);"></div>
      <div class="core c-reflection" data-label="REFLECTION" style="transform: rotate(140deg) translateY(-190px);"></div>
      <div class="core c-core" data-label="CORE" style="transform: rotate(260deg) translateY(-190px);"></div>
    </div>
    <div class="orbit">
      <div class="core c-nexus" data-label="NEXUS" style="transform: rotate(70deg) translateY(-320px);"></div>
      <div class="core c-forge" data-label="FORGE" style="transform: rotate(200deg) translateY(-320px);"></div>
    </div>
    <div class="sun" title="HELION"></div>
    <div class="label">HELION</div>
  </div>
</body>
</html>
