# Azure DevOps WINDOWS fallback for NOX V16 private repository.
# CONNECT in Azure DevOps to GitHub PR162 branch, select this YAML file.
# Do not treat diagnostic artifacts as release/E07 acceptance.
trigger: none
pr: none
name: NOX-V16-AZ-$(Date:yyyyMMdd)-$(Rev:r)
pool:
  vmImage: 'windows-2022'
jobs:
- job: original_source_and_onehost
  displayName: 'Original source 729 SHA + real Windows ONEHOST diagnostic'
  timeoutInMinutes: 60
  steps:
  - checkout: self
    displayName: 'Exact private GitHub commit'
    clean: true
    fetchDepth: 0
    persistCredentials: false
  - task: UsePythonVersion@0
    displayName: 'Python 3.12 x64'
    inputs:
      versionSpec: '3.12'
      architecture: 'x64'
  - task: UseDotNet@2
    displayName: '.NET 8 SDK'
    inputs:
      packageType: sdk
      version: '8.0.x'
  - pwsh: |
      $ErrorActionPreference='Stop'
      Set-StrictMode -Version Latest
      $head=(& git rev-parse HEAD).Trim().ToLowerInvariant()
      if ($head -cne '$(Build.SourceVersion)'.ToLowerInvariant()) { throw 'AZURE_PINNED_SOURCE_HEAD_MISMATCH' }
      Write-Host "SOURCE_COMMIT_SHA=$head"
      python -m unittest discover -s tests/e07 -p 'test_original_archive_namespace.py' -v
      if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_NAMESPACE_TEST_HOLD' }
      python -m unittest discover -s tests/e06 -p 'test_original_729_source.py' -v
      if ($LASTEXITCODE -ne 0) { throw 'E06_PART_PIN_REGRESSION_HOLD' }
      $pinnedManifest=Join-Path '$(Agent.TempDirectory)' 'nox-original-729-owner-pinned.json'
      python coordination/e06/verify_original_729_source.py --parts-dir . --out $pinnedManifest --run-id 'NOX-V16-AZURE-$(Build.BuildId)'
      if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_THREE_PART_PIN_SHA_HOLD' }
      $pinReceipt=Get-Content -LiteralPath $pinnedManifest -Raw -Encoding UTF8 | ConvertFrom-Json
      if ($pinReceipt.fileCount -ne 729 -or $pinReceipt.combinedZip.sha256 -cne 'ff8e2848c7c7ab776b90cbd8ac28e41e3815e96373c3c5f635d7587284629e9a') { throw 'E06_PINNED_SOURCE_RECEIPT_INVALID' }
      $manifest=Join-Path '$(Agent.TempDirectory)' 'nox-original-729-sha256.json'
      python coordination/source-lock/verify_original_archive.py --parts-dir . --output $manifest --expected-files 729
      if ($LASTEXITCODE -ne 0) { throw 'REAL_SOURCE_729_SHA_HOLD' }
      $evidence=Get-Content -LiteralPath $manifest -Raw -Encoding UTF8 | ConvertFrom-Json
      if ($evidence.file_count -ne 729 -or $evidence.status -cne 'SOURCE_ARCHIVE_VERIFIED_ONLY_NOT_E07_RELEASE') { throw 'ORIGINAL_SHA_RECEIPT_INVALID' }
      Write-Host 'ORIGINAL_729_ACTUAL_BYTES_PASS_RELEASE_NOT_ACCEPTED'
    displayName: 'Read and verify original 60 MB source ZIP and all 729 entries'
  - pwsh: |
      $ErrorActionPreference='Stop'
      $env:GITHUB_RUN_ID='AZURE-$(Build.BuildId)'
      $env:GITHUB_SHA='$(Build.SourceVersion)'
      # Read-only native ingress and training validation before source staging.
      python Packages/P02/worker-python/test_p02_native_ingress.py
      if ($LASTEXITCODE -ne 0) { throw 'P02_NATIVE_INGRESS_UNIT_HOLD' }
      python tests/P04/test_training_failure_status.py
      if ($LASTEXITCODE -ne 0) { throw 'P04_GPU_STATUS_UNIT_HOLD' }
      python tests/P04/test_e04_role_type_before_membership.py
      if ($LASTEXITCODE -ne 0) { throw 'P04_TRAINING_DATA_ROLE_UNIT_HOLD' }
      # Existing E06 P02/P04 owner seam regressions: deterministic native stubs only.
      # Pass is NOT installed Windows/GPU/SQLite/Ollama acceptance.
      python -m unittest discover -s tests/e06 -p 'test_onehost_post_history_r10.py' -v
      if ($LASTEXITCODE -ne 0) { throw 'AZURE_E06_ONEHOST_OFFLINE_REGRESSION_HOLD' }
      python -m unittest discover -s tests/e06 -p 'test_onehost_binding_drift_r09.py' -v
      if ($LASTEXITCODE -ne 0) { throw 'AZURE_E06_OWNER_BINDING_REGRESSION_HOLD' }
      python -m unittest discover -s tests/e06 -p 'test_onehost_wire_type_r08.py' -v
      if ($LASTEXITCODE -ne 0) { throw 'AZURE_E06_JSON_WIRE_REGRESSION_HOLD' }
      Write-Host 'E06_MOCK_CONTRACT_GATE_ONLY_NOT_E07_NATIVE_ACCEPTANCE'
      & ./private_build.ps1
      if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_PYTHON_BUILD_HOLD' }
      python coordination/e06/stage_p01.py
      if ($LASTEXITCODE -ne 0) { throw 'EXACT_P01_R11_STAGE_HOLD' }
      python -m unittest discover -s integrations/wow200/tests -p 'test_stage_wow200.py' -v
      if ($LASTEXITCODE -ne 0) { throw 'WOW200_SOURCE_TEST_HOLD' }
      python integrations/creative/stage_creative.py work/e06/staged/R11 integrations/creative
      if ($LASTEXITCODE -ne 0) { throw 'CREATIVE_STAGE_HOLD' }
      python integrations/wow200/stage_wow200.py work/e06/staged/R11 integrations/wow200
      if ($LASTEXITCODE -ne 0) { throw 'D02_WOW_STAGE_HOLD' }
    displayName: 'Original Python candidate + approved P01/Creative/WOW source staging'
  - pwsh: |
      $ErrorActionPreference='Stop'
      $pin='4e488372cf3f6410d268a7ef72b3e4b359a7a3e6642c7a16ac2e6f7eb06fc5f3'
      $m=@(Get-ChildItem -LiteralPath 'work/candidate' -File -Recurse -Filter 'NOX_HELION_PRIVATE_CANDIDATE.exe' | Where-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ceq $pin })
      if ($m.Count -ne 1) { throw 'PINNED_ORIGINAL_EXE_MISSING' }
      $out='work/e06/azure-onehost-diagnostic'
      & ./coordination/e06/build_onehost_installer.ps1 -SourceRoot 'work/e06/staged/R11' -PythonExe $m[0].FullName -OutputRoot $out -RunId 'NOX-AZURE-$(Build.BuildId)' -CreativeSourceRoot 'integrations/creative' -WowSourceRoot 'integrations/wow200'
      if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_ONEHOST_NSIS_BUILD_HOLD' }
      $setup=Join-Path $out 'NOX-HELION-V16-DIAGNOSTIC-SETUP.exe'
      $exe=Join-Path $out 'payload/NOX.P01.Shell.exe'
      $receipt=Join-Path $out 'ONEHOST_DIAGNOSTIC_RECEIPT.json'
      foreach ($p in @($setup,$exe,$receipt)) { if (!(Test-Path -LiteralPath $p -PathType Leaf)) { throw "MISSING_WINDOWS_BUILD_FILE:$p" } }
      $args=@{Original729Receipt=(Join-Path '$(Agent.TempDirectory)' 'nox-original-729-sha256.json');Owner729Receipt=$pinnedManifest;OneHostReceipt=$receipt;SetupExe=$setup;PublishedExe=$exe;SourceCommitSha='$(Build.SourceVersion)';Output=(Join-Path $out 'E07_BUILT_HANDOFF.json');Phase='BUILT'}
      & ./coordination/e06/Emit-E07ImmutableHandoff.ps1 @args
      if ($LASTEXITCODE -ne 0) { throw 'E07_BUILT_HANDOFF_HOLD' }
      Write-Host "SETUP_SHA256=$((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant())"
      Write-Host "WPF_SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant())"
      Write-Host 'BUILD_ONLY_NOT_E07_ACCEPTED'
    displayName: 'WPF/WebView2 + Python + NSIS and immutable BuildID/EXE SHA'
  - pwsh: |
      $ErrorActionPreference='Stop'
      $dst=Join-Path '$(Build.ArtifactStagingDirectory)' 'nox-v16-diagnostic'
      New-Item -ItemType Directory -Path $dst -Force | Out-Null
      $files=@(
        @('$(Agent.TempDirectory)/nox-original-729-sha256.json','original-729-sha256.json'),
        @('$(Agent.TempDirectory)/nox-original-729-owner-pinned.json','original-729-owner-pinned.json'),
        @('work/e06/azure-onehost-diagnostic/ONEHOST_DIAGNOSTIC_RECEIPT.json','ONEHOST_DIAGNOSTIC_RECEIPT.json'),
        @('work/e06/azure-onehost-diagnostic/E07_BUILT_HANDOFF.json','E07_BUILT_HANDOFF.json'),
        @('work/e06/azure-onehost-diagnostic/D02_VISUAL_PUBLISH_RECEIPT.json','D02_VISUAL_PUBLISH_RECEIPT.json'),
        @('work/e06/azure-onehost-diagnostic/NOX-HELION-V16-DIAGNOSTIC-SETUP.exe','NOX-HELION-V16-DIAGNOSTIC-SETUP.exe')
      )
      foreach ($entry in $files) {
        if (!(Test-Path -LiteralPath $entry[0] -PathType Leaf)) { continue }
        $source=Get-Item -LiteralPath $entry[0] -Force
        if (($source.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'AZURE_DIAGNOSTIC_EVIDENCE_REPARSE_HOLD' }
        $target=Join-Path $dst $entry[1]
        $digest=(Get-FileHash -LiteralPath $source.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
        Copy-Item -LiteralPath $source.FullName -Destination $target -ErrorAction Stop
        if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -cne $digest) { throw 'AZURE_DIAGNOSTIC_EVIDENCE_COPY_SHA_HOLD' }
      }
      # PublishSingleFile=false: the WPF EXE requires its DLLs and runtime payload.
      # Keep the diagnostic bundle in the PRIVATE pipeline artifact, never public release.
      $payloadSource='work/e06/azure-onehost-diagnostic/payload'
      if (Test-Path -LiteralPath $payloadSource -PathType Container) {
        $nodes=@(Get-Item -LiteralPath $payloadSource -Force)+@(Get-ChildItem -LiteralPath $payloadSource -Recurse -Force)
        foreach ($node in $nodes) {
          if (($node.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'AZURE_PUBLISHED_REPARSE_HOLD' }
        }
        $payloadTarget=Join-Path $dst 'payload'
        if (Test-Path -LiteralPath $payloadTarget) { throw 'AZURE_PUBLISHED_TARGET_EXISTS_HOLD' }
        Copy-Item -LiteralPath $payloadSource -Destination $payloadTarget -Recurse -ErrorAction Stop
        $originalFiles=@(Get-ChildItem -LiteralPath $payloadSource -File -Recurse -Force)
        $publishedFiles=@(Get-ChildItem -LiteralPath $payloadTarget -File -Recurse -Force)
        if ($originalFiles.Count -ne $publishedFiles.Count) { throw 'AZURE_PUBLISHED_FILE_COUNT_HOLD' }
        $digestRows=@()
        foreach ($file in $originalFiles) {
          $relative=$file.FullName.Substring($payloadSource.Length+1)
          $published=Join-Path $payloadTarget $relative
          if (!(Test-Path -LiteralPath $published -PathType Leaf)) { throw 'AZURE_PUBLISHED_MISSING_FILE_HOLD' }
          $digest=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-FileHash -LiteralPath $published -Algorithm SHA256).Hash.ToLowerInvariant() -cne $digest) { throw 'AZURE_PUBLISHED_PAYLOAD_SHA_HOLD' }
          $digestRows+=([ordered]@{path=$relative.Replace('\','/');sha256=$digest;bytes=$file.Length})
        }
        $seal='work/e06/azure-onehost-diagnostic/E07_BUILT_HANDOFF.json'
        if (Test-Path -LiteralPath $seal -PathType Leaf) {
          $handoff=Get-Content -LiteralPath $seal -Raw -Encoding UTF8 | ConvertFrom-Json
          $binary=Join-Path $payloadTarget 'NOX.P01.Shell.exe'
          $setup=Join-Path $dst 'NOX-HELION-V16-DIAGNOSTIC-SETUP.exe'
          if (!(Test-Path -LiteralPath $binary -PathType Leaf) -or !(Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'AZURE_E07_BUILT_BINARY_MISSING_HOLD' }
          if ($handoff.phase -cne 'BUILT' -or $handoff.release_accepted -ne $false -or
              ([string]$handoff.published_exe_sha256).ToLowerInvariant() -cne (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant() -or
              ([string]$handoff.setup_sha256).ToLowerInvariant() -cne (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'AZURE_E07_BUILT_SHA_HOLD' }
        }
        $manifest=[ordered]@{schema='NOX_AZURE_PRIVATE_DIAGNOSTIC_SHA_V1';source_commit='$(Build.SourceVersion)';azure_build_id='$(Build.BuildId)';release_accepted=$false;files=$digestRows}
        [IO.File]::WriteAllText((Join-Path $dst 'PUBLISHED_PRIVATE_PAYLOAD_SHA256.json'),($manifest | ConvertTo-Json -Depth 6),[Text.UTF8Encoding]::new($false))
      }
      Write-Host 'Private diagnostic bundle with complete WPF runtime SHA-checked, NOT E07 accepted.'
    displayName: 'Retain evidence and diagnostic installer without secrets'
    condition: succeededOrFailed()
  - task: PublishPipelineArtifact@1
    displayName: 'Publish candidate for manual #1/#3, NOT release'
    condition: succeededOrFailed()
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/nox-v16-diagnostic'
      artifact: nox-v16-azure-diagnostic
      publishLocation: pipeline
