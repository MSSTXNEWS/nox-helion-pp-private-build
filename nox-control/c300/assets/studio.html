<!doctype html>
<html lang="ru" class="sl-theme-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<title>NOX HELION · ФОТОСТУДИЯ</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="./vendor/fonts-wow/fonts.css">
<link rel="stylesheet" href="./vendor/shoelace/cdn/themes/dark.css">
<link rel="stylesheet" href="./vendor/swiper/swiper-bundle.min.css">

<link rel="stylesheet" href="./nox-unify.css">

<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","postprocessing":"./vendor/postprocessing/build/index.js"}}</script>
<style>
.stu{position:fixed;left:10px;right:10px;top:64px;bottom:122px;z-index:5;border-radius:16px;overflow:hidden;border:1px solid rgba(255,225,200,.12);background:rgba(8,7,8,.7);box-shadow:0 20px 60px rgba(0,0,0,.55)}
.stu iframe{width:100%;height:100%;border:0;display:block;background:#101012}
.stu-bar{position:absolute;right:12px;top:10px;z-index:3;display:flex;gap:8px;padding:6px;border-radius:14px;background:rgba(14,11,12,.68);border:1px solid rgba(255,225,200,.12);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.stu-bar a,.stu-bar button{font:300 11px/1 inherit;font-family:inherit;letter-spacing:.18em;text-transform:uppercase;color:#f0e6de;text-decoration:none;background:rgba(255,235,220,.06);border:1px solid rgba(255,225,200,.1);padding:9px 13px;border-radius:10px;cursor:pointer}
.stu-bar a:hover,.stu-bar button:hover{background:linear-gradient(90deg,rgba(176,44,32,.85),rgba(110,26,20,.6));color:#fff}
.stu-st{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:13px;letter-spacing:.06em;background:rgba(10,8,9,.88);z-index:2}
.stu-st.on{display:grid}
@media(max-width:600px){.stu{left:6px;right:6px;top:58px;bottom:92px;border-radius:12px}.stu-bar{right:8px;top:8px;gap:6px}.stu-bar a,.stu-bar button{padding:8px 9px;font-size:10px;letter-spacing:.1em}}
</style>
</head>
<body data-page="studio" class="boot">
<div id="app">
<main class="page" id="page"><div class="stu">
  <div class="stu-bar"><button type="button" id="stuChat">Диалог с NOX</button><a href="photo.html">Обработка</a><a href="/svc/invoke/" target="_blank" rel="noopener">Вне рамки</a></div>
  <div class="stu-st" id="stuSt"></div>
  <iframe id="stuF" title="InvokeAI" allow="clipboard-write; fullscreen"></iframe>
</div></main>
</div>
<script type="module" src="./nox-nav.js"></script>
<script>
(async()=>{const st=document.getElementById('stuSt'),f=document.getElementById('stuF');
 let v=null;try{v=((await (await fetch('/svc/_status',{cache:'no-store'})).json()).services||{}).invoke}catch(e){}
 if(!v||!v.up){st.classList.add('on');st.innerHTML='<div><i class="led warn"></i> InvokeAI не отвечает'+(v?' (порт '+v.port+')':' (не установлен)')+'.<br>Запуск: /workspace/nox/svc/start_all.sh на сервере.</div>';return}
 f.src='/svc/invoke/';
 document.getElementById('stuChat').onclick=()=>{const b=document.querySelector('.nmc-fab');b&&b.click()};
})();
</script>
<script src="./nox-dock-pop.js" defer></script>
<script type="module" src="./nox-ninja.js"></script>
<script src="./nox-minichat.js" defer></script>
</body>
</html>
