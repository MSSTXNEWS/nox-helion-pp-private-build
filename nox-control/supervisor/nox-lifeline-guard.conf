[program:nox-lifeline-guard]
; Independent bounded guard. OneHost remains the ONLY scheduler.
; Install only after host preflight, and keep local policy disabled until approval.
command=/usr/bin/python3 -u /root/nox/scripts/nox_native_lifeline.py --policy /etc/nox/lifeline.json --state /root/nox/state/lifeline/state.json
directory=/root/nox
user=root
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=10
stopasgroup=false
killasgroup=false
redirect_stderr=true
stdout_logfile=/root/nox/state/lifeline/guard.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONUNBUFFERED="1"
