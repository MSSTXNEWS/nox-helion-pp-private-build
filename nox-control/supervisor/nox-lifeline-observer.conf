[program:nox-lifeline-observer]
command=/usr/bin/python3 -u /root/nox/scripts/nox_lifeline_observer_bootstrap.py
directory=/root/nox
user=root
numprocs=1
process_name=%(program_name)s
autostart=true
autorestart=unexpected
startsecs=5
startretries=2
stopsignal=TERM
stopwaitsecs=5
stopasgroup=false
killasgroup=false
umask=0077
redirect_stderr=true
stdout_logfile=NONE
environment=PYTHONUNBUFFERED="1"
