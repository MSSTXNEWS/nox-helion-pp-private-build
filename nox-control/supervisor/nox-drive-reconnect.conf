; For Vast.ai containers running supervisord instead of systemd.
; Install only via approved owner-pinned route and after current resource check.
[program:nox-drive-reconnect]
command=/bin/sh /root/nox/ops/drive-auth/nox_drive_reconnect_loop.sh
directory=/root/nox
user=root
priority=999
startsecs=5
startretries=3
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0
