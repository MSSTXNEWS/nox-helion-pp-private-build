<!doctype html>
<!-- nox-web-extras: пропустить (у страницы своё меню и панели; marker для deploy1.sh) -->
<html lang="ru" class="sl-theme-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<title>NOX HELION · КАЛЕНДАРЬ</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="./vendor/fonts-wow/fonts.css">
<link rel="stylesheet" href="./vendor/shoelace/cdn/themes/dark.css">
<link rel="stylesheet" href="./vendor/swiper/swiper-bundle.min.css">
<link rel="stylesheet" href="./nox-wow.css">
<link rel="stylesheet" href="./nox-pages.css">
<script src="./nox-theme.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","postprocessing":"./vendor/postprocessing/build/index.js"}}</script>
</head>
<body data-page="cal" class="boot">
<div id="app">
<main class="page" id="page"><div class="wrap">
<div class="ph"><div><span class="kick mono">Сроки задач · события · напоминания</span><h1>Календарь</h1></div>
  <div class="acts"><span class="seg"><button type="button" id="cNew"><sl-icon library="tabler" name="plus"></sl-icon>Новое событие</button><button type="button" id="cIcs"><sl-icon library="tabler" name="calendar-down"></sl-icon>ICS</button></span></div></div>
<div class="grid">
  <section class="card c8"><div id="cal" style="min-height:420px"></div></section>
  <section class="card c4"><h2>Ближайшие 14 дней <span class="r mono" id="soonN"></span></h2><ul class="lines soon" id="soon"></ul>
    <p class="muted" style="font-size:12px;margin:10px 0 0">Данные общие с разделом «Проекты» (хранятся в этом браузере). Клик по дню создаёт событие, перетаскивание переносит дату.</p></section>
</div>
<sl-dialog id="dlg" class="nox-dl" label="Событие"><form class="dlg" id="dForm" autocomplete="off">
  <label class="fld"><span>Название</span><input type="text" id="dTitle" maxlength="200" required></label>
  <div class="frow"><label class="fld"><span>Дата</span><input type="date" id="dDue" required></label><label class="fld"><span>Время</span><input type="time" id="dTime"></label></div>
  <label class="fld"><span>Заметка</span><textarea id="dNote" maxlength="2000"></textarea></label><button type="submit" hidden></button></form>
  <div class="seg" slot="footer"><button type="button" id="dSave">Сохранить</button><button type="button" id="dDel" style="color:rgb(var(--mg))">Удалить</button><button type="button" id="dCancel">Отмена</button></div></sl-dialog>
</div></main>
</div>
<script src="./vendor/nox-extra/fullcalendar.global.min.js"></script>
<script type="module" src="./nox-nav.js"></script>
<script type="module" src="./nox-p-calendar.js"></script>
</body>
</html>
