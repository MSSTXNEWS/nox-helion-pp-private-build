[program:nox-cache-maintenance]
command=/usr/bin/python3 -E -s -B /root/nox/ops/cache-maintenance/nox_cache_maintenance.py
directory=/root/nox
user=root
autostart=true
autorestart=unexpected
startsecs=2
startretries=2
priority=90
stopasgroup=true
killasgroup=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/root/nox/logs/nox-cache-maintenance.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
