[program:nox-engram-cold-holder]
command=/usr/bin/python3 -I -B /root/nox/ops/engram_cold_holder.py
directory=/root/nox
user=root
autostart=true
autorestart=false
startsecs=1
startretries=0
priority=10
stopsignal=TERM
stopwaitsecs=30
stopasgroup=false
killasgroup=false
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
