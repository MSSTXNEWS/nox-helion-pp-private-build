# NOX V16 · TWO strictly separated, explicit GitLab.com Windows paths:
# (A) manually approved source-only Windows QA BEFORE T08/T10 (never builds EXE);
# (B) original final diagnostic build AFTER independent T08 + signed T10.
# No pipeline on push/PR/mirror. Both modes must never run together.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $NOX_APPROVE_WINDOWS_QA == "YES" && $NOX_APPROVE_WINDOWS_BUILD != "YES" && $NOX_QA_SOURCE_SHA != null && $NOX_QA_SOURCE_REF != null'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "api" && $NOX_APPROVE_WINDOWS_QA == "YES" && $NOX_APPROVE_WINDOWS_BUILD != "YES" && $NOX_QA_SOURCE_SHA != null && $NOX_QA_SOURCE_REF != null'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web" && $NOX_APPROVE_WINDOWS_BUILD == "YES" && $NOX_APPROVE_WINDOWS_QA != "YES" && $NOX_FROZEN_SOURCE_SHA != null && $NOX_FROZEN_SOURCE_REF != null'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "api" && $NOX_APPROVE_WINDOWS_BUILD == "YES" && $NOX_APPROVE_WINDOWS_QA != "YES" && $NOX_FROZEN_SOURCE_SHA != null && $NOX_FROZEN_SOURCE_REF != null'
      when: always
    - when: never

stages:
  - windows-source-qa
  - windows-diagnostic

variables:
  GIT_DEPTH: "0"
  GIT_STRATEGY: "fetch"
  NOX_WINDOWS_RUNNER_TAG: "saas-windows-medium-amd64"

# Explicit approval runs source tests on GitLab.com's Windows 2022 hosted runner.
# This DOES NOT attest native installed EXE, cannot pass T08/T10, does not
# download dependencies, install software, train weights, or invoke NSIS.
nox_v16_windows_source_qa:
  stage: windows-source-qa
  rules:
    - if: '$NOX_APPROVE_WINDOWS_QA == "YES" && $NOX_APPROVE_WINDOWS_BUILD != "YES" && $NOX_QA_SOURCE_SHA != null && $NOX_QA_SOURCE_REF != null'
      when: on_success
    - when: never
  tags:
    - $NOX_WINDOWS_RUNNER_TAG
  timeout: 20m
  interruptible: false
  retry: 0
  script:
    - '& .\coordination\e06\gitlab_windows_source_qa.ps1'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - work/gitlab-qa/

nox_v16_windows_diagnostic:
  stage: windows-diagnostic
  rules:
    - if: '$NOX_APPROVE_WINDOWS_BUILD == "YES" && $NOX_APPROVE_WINDOWS_QA != "YES" && $NOX_FROZEN_SOURCE_SHA != null && $NOX_FROZEN_SOURCE_REF != null'
      when: on_success
    - when: never
  tags:
    - $NOX_WINDOWS_RUNNER_TAG
  timeout: 1h
  interruptible: false
  retry: 0
  script:
    - '& .\coordination\e06\gitlab_windows_entrypoint.ps1'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - work/gitlab-artifacts/
