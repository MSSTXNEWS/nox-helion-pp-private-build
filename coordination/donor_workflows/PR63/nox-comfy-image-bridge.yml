name: NOX local ComfyUI image adapter guard tests
on:
  push:
    paths:
      - 'proposals/NOX-SUPER-CINEMA-3D/**'
      - '.github/workflows/nox-comfy-image-bridge.yml'
  pull_request:
    paths:
      - 'proposals/NOX-SUPER-CINEMA-3D/**'
      - '.github/workflows/nox-comfy-image-bridge.yml'
jobs:
  offline-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local image-generation bridge security and contract
        run: python -m unittest discover -s proposals/NOX-SUPER-CINEMA-3D -p 'test_*.py' -v
