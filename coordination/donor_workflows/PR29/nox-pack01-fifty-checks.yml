name: NOX V16 PACK01 fifty-route source checks
on:
  pull_request:
    paths:
      - 'proposals/NOX-PACK01-50/**'
      - '.github/workflows/nox-pack01-fifty-checks.yml'
  workflow_dispatch:
jobs:
  fifty-route-contract:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ES module syntax
        shell: pwsh
        run: |
          node --check proposals/NOX-PACK01-50/registry.mjs
          node --check proposals/NOX-PACK01-50/panel.mjs
          node --check proposals/NOX-PACK01-50/smoke.test.mjs
          node --check proposals/NOX-PACK01-50/binding_map.test.mjs
          node --check proposals/NOX-PACK01-50/measure_progress.mjs
      - name: Run 50 per-route contract checks and fail-closed gates
        shell: pwsh
        run: |
          node --test proposals/NOX-PACK01-50/smoke.test.mjs proposals/NOX-PACK01-50/binding_map.test.mjs
          if ($LASTEXITCODE -ne 0) {throw 'CONTRACT_TEST_FAILED'}
          node proposals/NOX-PACK01-50/measure_progress.mjs
          if ($LASTEXITCODE -ne 0) {throw 'PROGRESS_LEDGER_INVALID'}
