name: NOX V16 original D02 cinematic gravity FX gate
on:
  pull_request:
    paths:
      - 'proposals/NOX-CINEMA-FX/**'
      - '.github/workflows/nox-cinema-v16.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nox-cinema-v16-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  no-loss-cinema:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript ESM syntax without npm
        shell: pwsh
        run: |
          node --check proposals/NOX-CINEMA-FX/nox-cinema.mjs
          node --check proposals/NOX-CINEMA-FX/nox-cinema.test.mjs
          node --check proposals/NOX-CINEMA-FX/nox-cinema-events.mjs
          node --check proposals/NOX-CINEMA-FX/nox-cinema-events.test.mjs
          if ($LASTEXITCODE -ne 0) {throw 'CINEMA_SYNTAX_FAIL'}
      - name: Run original D02 no-loss and particle gravity regression
        shell: pwsh
        run: |
          node --test proposals/NOX-CINEMA-FX/nox-cinema.test.mjs proposals/NOX-CINEMA-FX/nox-cinema-events.test.mjs
          if ($LASTEXITCODE -ne 0) {throw 'CINEMA_COMPONENT_FAIL'}
      - name: Verify no changes to original approved assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $diff = git diff --name-only origin/main...HEAD
          $bad = @($diff | Where-Object {
            $_ -notlike 'proposals/NOX-CINEMA-FX/*' -and
            $_ -ne '.github/workflows/nox-cinema-v16.yml'
          })
          if ($bad.Count -gt 0) {throw ('NO_LOSS_SCOPE_VIOLATION '+($bad -join ','))}
