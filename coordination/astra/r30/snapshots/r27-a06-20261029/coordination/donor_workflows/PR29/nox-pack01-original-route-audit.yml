name: NOX PACK01 remaining 18 original source audit
on:
  pull_request:
    paths:
      - 'proposals/NOX-PACK01-50/audit_original_18.py'
      - '.github/workflows/nox-pack01-original-route-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-exact-source:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen untouched original app parts
        uses: actions/checkout@v4
        with:
          repository: MSSTXNEWS/nox-helion-pp-private-build
          ref: eb46b49fb8a022cefa679afb8606877016808db1
          path: original
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only source SHA and audit all 18 remaining native endpoints
        shell: pwsh
        run: |
          python proposals/NOX-PACK01-50/audit_original_18.py original pack01-final18-original-audit.json
          if ($LASTEXITCODE -ne 0) {throw 'ORIGINAL_SOURCE_ROUTE_AUDIT_FAILED'}
      - uses: actions/upload-artifact@v4
        with:
          name: pack01-original-18-route-evidence
          path: pack01-final18-original-audit.json
          if-no-files-found: error
          retention-days: 30
