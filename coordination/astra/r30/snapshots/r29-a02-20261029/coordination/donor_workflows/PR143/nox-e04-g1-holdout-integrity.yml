name: NOX E04 G1 real-module dataset duplicate integrity
on:
  push:
    branches: [e04/v16-g1-04-holdout-integrity-20261028-r02, e04/v16-g1-04-dataset-format-gate-20261028-r04, e04/v16-g1-04-message-metadata-leakage-20261028-r05, e04/v16-g1-04-strict-authorization-json-20261028-r06, e04/v16-g1-04-rights-attestation-20261028-r07, e04/v16-g1-04-rights-identity-exact-20261028-r08, e04/v16-g1-04-pinned-tree-reparse-20261028-r09]
    paths:
      - 'Packages/P04/train_qlora.py'
      - 'tests/P04/test_e04_holdout_duplicate_gate.py'
      - 'tests/P04/test_e04_authorization_json_gate.py'
      - 'tests/P04/test_e04_rights_verifier_response.py'
      - 'tests/P04/test_e04_rights_identity_binding.py'
      - 'tests/P04/test_e04_pinned_tree_reparse_guard.py'
      - '.github/workflows/nox-e04-g1-holdout-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e04-python-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile same P04 worker source
        run: python -m py_compile Packages/P04/train_qlora.py
      - name: Execute actual-module duplicate and holdout fixture tests
        run: python -m unittest discover -s tests/P04 -p 'test_e04_holdout_duplicate_gate.py' -v
      - name: Execute strict authorization and checkpoint JSON regressions
        run: python -m unittest discover -s tests/P04 -p 'test_e04_authorization_json_gate.py' -v
      - name: Execute real-module rights-verifier response regressions
        run: python -m unittest discover -s tests/P04 -p 'test_e04_rights_verifier_response.py' -v
      - name: Execute actual-module rights claim identity regressions
        run: python -m unittest discover -s tests/P04 -p 'test_e04_rights_identity_binding.py' -v
      - name: Execute actual-module pinned tree junction and symlink tests
        run: python -m unittest discover -s tests/P04 -p 'test_e04_pinned_tree_reparse_guard.py' -v
      - name: Execute existing P04 source integrity guards
        run: python -m unittest discover -s tests/P04 -p 'test_turbo10_integrity_guards.py' -v
