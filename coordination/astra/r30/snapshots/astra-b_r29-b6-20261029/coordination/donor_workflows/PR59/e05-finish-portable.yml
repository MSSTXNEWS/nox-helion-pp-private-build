name: NOX E05 FINISH portable component gate
on:
  pull_request:
    paths:
      - 'Packages/P05/E05/**'
      - '.github/workflows/e05-finish-portable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e05-dotnet8:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify current E05 files compile
        run: dotnet build Packages/P05/E05/src/NoxHelion.E05.csproj --configuration Release --nologo
      - name: Run deterministic host and Google Docs contract regressions
        run: dotnet run --project Packages/P05/E05/checks/E05Checks.csproj --configuration Release --no-restore
