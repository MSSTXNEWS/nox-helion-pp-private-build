<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOX · WOW 51–100 · вторичная сцена</title><link rel="stylesheet" href="./wow51-100.css"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 52% 35%,#17252b,#080e14 65%,#030508);color:#efebe6;font:14px/1.4 Segoe UI,Arial,sans-serif}main{max-width:1450px;margin:auto;padding:20px}h1{font-size:clamp(20px,3vw,34px);letter-spacing:.15em;margin:0}small,.note{color:#aebac1}.shell{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:16px;margin-top:20px}.stage{height:min(65vw,630px);min-height:390px;border-radius:24px;border:1px solid #74828e55;background:radial-gradient(ellipse at center,#20333b,#0a1018 64%,#03060a);position:relative;overflow:hidden;display:grid;place-items:center}.hero{width:min(48%,250px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 31% 29%,#58687299 2%,transparent 28%),conic-gradient(from 35deg,#06080b,#283139,#05070b,#38434b,#06080b,#1e2932,#06080b);box-shadow:inset -22px -19px 41px #000b,inset 13px 7px 27px #ffffff13,0 0 80px #a4c4cc22;display:grid;place-items:center;z-index:0}.hero span{color:#e3d2bd88;letter-spacing:.28em;font-size:clamp(14px,2vw,23px)}.tools{max-height:700px;overflow:auto;border-radius:19px;border:1px solid #788b9850;background:#101923c9;padding:12px}.tools h2{margin:0 0 9px;font-size:17px}.list{display:grid;grid-template-columns:1fr 1fr;gap:7px}button,select{color:#e4e7e8;border-radius:9px;background:#1c2934;border:1px solid #839aa055;padding:10px;font:inherit;cursor:pointer;text-align:left;min-height:44px}button:focus-visible,select:focus-visible{outline:2px solid #e5b275}button[aria-pressed=true]{border-color:#d4a672;background:#463326}header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}select{min-width:150px}footer{font-size:12px;color:#bec7ca;padding-top:15px}@media(max-width:850px){.shell{grid-template-columns:1fr}.stage{min-height:360px;height:400px}.tools{max-height:440px}}</style></head><body><main><header><div><small>NOX HELION · CINEMATIC ENGINEERING</small><h1>WOW 51–100</h1><p class="note">Демонстрация вторичных эффектов. Не оригинальный D02 HOME, не данные настоящего ИИ.</p></div><label>Режим графики <select id="mode"><option>BALANCED</option><option>MAX</option><option>ECO</option><option>REDUCED</option></select></label></header><section class="shell"><div class="stage" data-nox-wow-slot="secondary" id="stage"><div class="hero"><span>NOX</span></div></div><aside class="tools"><h2>50 визуальных сигналов</h2><div id="list" class="list"></div></aside></section><footer>Для реальной интеграции нужен утверждённый вторичный слот и проверенный host events.v3. На главном D02 этот модуль не устанавливается.</footer></main><script type="module">import {CUES} from "./catalog.mjs";import {createCinematicCues} from "./wow51-100.mjs";const w=createCinematicCues(document.getElementById("stage"));const list=document.getElementById("list");for(const c of CUES){const b=document.createElement("button");b.type="button";b.textContent=c.id+" · "+c.name;b.setAttribute("aria-pressed","false");b.addEventListener("click",()=>{w.preview(c.id);for(const other of list.children)other.setAttribute("aria-pressed",String(other===b))});list.append(b)}document.getElementById("mode").addEventListener("change",e=>w.setMode(e.target.value));w.preview(51);list.firstChild.setAttribute("aria-pressed","true");</script></body></html>
