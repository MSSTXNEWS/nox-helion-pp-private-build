name: NOX E05 component gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Packages/P05/E05/**"
      - ".github/workflows/e05-component.yml"
permissions:
  contents: read
jobs:
  e05-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build E05
        run: dotnet build Packages/P05/E05/src/NoxHelion.E05.csproj --configuration Release
      - name: E05 deterministic tests
        run: dotnet run --project Packages/P05/E05/checks/E05Checks.csproj --configuration Release
