<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Инструменты · NOX</title>
<link rel="stylesheet" href="nox-shared-chrome-v10.css"><link rel="stylesheet" href="nox-services-tools.css">
<script defer src="pc/vendor/v22/marked.umd.js"></script><script defer src="pc/vendor/v22/purify.min.js"></script>
<script defer src="nox-shared-chrome-v10.js"></script><script defer src="nox-services-tools.js"></script>
<script defer src="nox-mini-client.js" data-nox-mini-client="v1"></script><link rel="stylesheet" href="nox-theme-header-v12.css" data-nox-header-v12="1"><link rel="stylesheet" href="nox-world-controls-v13.css" data-nox-controls-v13="1"><link rel="stylesheet" href="nox-connection-v13.css" data-nox-connection-v13="1"><script defer src="nox-connection-v13.js" data-nox-connection-v13="1"></script></head><body class="nox-shared-glass"><main class="services-tools">
<header><p class="eyebrow">NOX / РАБОЧИЕ ИНСТРУМЕНТЫ</p><h1>От мысли к результату</h1><p>Локальные инструменты. Текст обрабатывается в браузере.</p></header>
<nav class="tools-tabs" aria-label="Инструменты"><button data-tool="markdown" aria-pressed="true">Документ</button><button data-tool="json">JSON</button><button data-tool="text">Текст</button><button data-tool="units">Величины</button><button data-tool="timer">Фокус</button><a href="pc/pages/reader/index.html">PDF / EPUB</a><a href="pc/pages/code/index.html">Код</a></nav>
<section id="tool-markdown" class="tool-pane"><div class="tool-bar"><h2>Документ Markdown</h2><label class="file-button">Открыть файл<input id="md-file" type="file" accept=".md,.txt,text/plain,text/markdown"></label><button id="md-export">Скачать .md</button><button id="html-export">Скачать .html</button></div><div class="split"><textarea id="md-input" aria-label="Исходный Markdown" maxlength="250000" placeholder="Начните документ…"></textarea><article id="md-preview" aria-label="Предпросмотр документа"></article></div><p id="md-save" role="status"></p></section>
<section id="tool-json" class="tool-pane" hidden><h2>JSON</h2><textarea id="json-input" aria-label="JSON" maxlength="1000000" placeholder="Вставьте JSON"></textarea><div class="tool-bar"><button id="json-pretty">Форматировать</button><button id="json-compact">Сжать</button><button id="json-export">Скачать .json</button></div><p id="json-status" role="status"></p></section>
<section id="tool-text" class="tool-pane" hidden><h2>Работа с текстом</h2><textarea id="text-input" aria-label="Текст для обработки" maxlength="250000" placeholder="Вставьте текст"></textarea><p id="text-stats" role="status"></p><div class="tool-bar"><button id="text-trim">Убрать лишние пробелы</button><button id="text-unique">Убрать повторные строки</button><button id="text-undo" disabled>Вернуть исходный</button><button id="text-export">Скачать .txt</button></div></section>
<section id="tool-units" class="tool-pane" hidden><h2>Величины</h2><div class="choice-row"><button data-kind="length" aria-pressed="true">Длина</button><button data-kind="mass">Масса</button><button data-kind="temperature">Температура</button></div><label>Значение<input id="unit-value" inputmode="decimal" value="1"></label><div id="unit-from" class="choice-row" aria-label="Из единицы"></div><div id="unit-to" class="choice-row" aria-label="В единицу"></div><output id="unit-result" aria-live="polite"></output></section>
<section id="tool-timer" class="tool-pane" hidden><h2>Время для важного</h2><label>Минут<input id="timer-minutes" type="number" min="1" max="240" value="25"></label><output id="timer-clock" aria-live="off">25:00</output><div class="tool-bar"><button id="timer-start">Начать</button><button id="timer-pause">Пауза</button><button id="timer-reset">Сбросить</button></div><p id="timer-status" role="status">Таймер работает в этом браузере.</p></section>
<p id="tools-status" role="status" aria-live="polite"></p>
</main><script defer src="nox-corner-workspace.js" data-nox-corner="global-v1"></script></body></html>
