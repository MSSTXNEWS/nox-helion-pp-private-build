name: NOX PACK01 real P04 RAG and GPU bindings Windows
on:
  pull_request:
    paths:
      - 'proposals/NOX-PACK01-50/P04OwnerPack.cs'
      - 'proposals/NOX-PACK01-50/P04Smoke/**'
      - '.github/workflows/nox-pack01-owner-p04.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p04-source:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact current owner P04 source (no modification)
        uses: actions/checkout@v4
        with:
          repository: MSSTXNEWS/nox-helion-pp-private-build
          ref: 4c115a582eb996710572a1d6ecc099976b81295b
          path: owner-p04
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build linked original RAG and GPU implementation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build proposals/NOX-PACK01-50/P04Smoke/P04Smoke.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) {throw 'PACK01_P04_SOURCE_BUILD_FAILED'}
      - name: Run real RAG index through loopback embedding protocol and actual GPU diagnostics
        shell: pwsh
        run: |
          dotnet run --project proposals/NOX-PACK01-50/P04Smoke/P04Smoke.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) {throw 'PACK01_P04_SOURCE_SMOKE_FAILED'}
