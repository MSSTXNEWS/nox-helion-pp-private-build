name: NOX PACK01 existing P02 voice/teacher/SIP contract Windows
on:
  pull_request:
    paths:
      - 'proposals/NOX-PACK01-50/native_bridge.py'
      - 'proposals/NOX-PACK01-50/test_voice_owner_bind.py'
      - '.github/workflows/nox-pack01-owner-voice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p02-voice:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact owner #2 source no duplicate voice engine
        uses: actions/checkout@v4
        with:
          repository: MSSTXNEWS/nox-helion-pp-private-build
          ref: c93210e2f9e68383c5a65225cc5f9fd15d88d424
          path: owner-p02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify shared route syntax
        shell: pwsh
        run: python -m py_compile proposals/NOX-PACK01-50/native_bridge.py proposals/NOX-PACK01-50/test_voice_owner_bind.py
      - name: Test existing P02 voice/MAESTRO/SIP source methods
        shell: pwsh
        env:
          NOX_P02_OWNER_PATH: ${{ github.workspace }}/owner-p02/Packages/P02/worker-python
        run: |
          python -m unittest discover -s proposals/NOX-PACK01-50 -p 'test_voice_owner_bind.py' -v
