name: NOX PACK02 50 offline component operations
on:
  push:
    paths:
      - 'proposals/NOX-PACK02-50/**'
      - '.github/workflows/nox-pack02-fifty-checks.yml'
  pull_request:
    paths:
      - 'proposals/NOX-PACK02-50/**'
      - '.github/workflows/nox-pack02-fifty-checks.yml'
jobs:
  component:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 50 operations and no-loss source regressions
        run: node --test proposals/NOX-PACK02-50/*.test.mjs
      - name: Parser and UI module syntax
        run: |
          node --check proposals/NOX-PACK02-50/ops.mjs
          node --check proposals/NOX-PACK02-50/panel.mjs
          node --check proposals/NOX-PACK02-50/catalog.mjs
