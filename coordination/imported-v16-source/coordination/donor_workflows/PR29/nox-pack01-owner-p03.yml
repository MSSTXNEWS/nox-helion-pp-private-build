name: NOX PACK01 real P03 ModelCenter binding Windows
on:
  pull_request:
    paths:
      - 'proposals/NOX-PACK01-50/P03OwnerPack.cs'
      - 'proposals/NOX-PACK01-50/P03Smoke/**'
      - 'proposals/NOX-PACK01-50/catalog.json'
      - '.github/workflows/nox-pack01-owner-p03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p03-real-owner:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact original P03 owner files (without replacing them)
        uses: actions/checkout@v4
        with:
          repository: MSSTXNEWS/nox-helion-pp-private-build
          ref: ba984c2f6ab6146e7f33242a3d08df178458ffdf
          path: owner-p03
      - name: Verify original C40 source and extract only to scratch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'owner-p03/Packages/P03/C40/NOX_V16_E03_C40_P03_CLOSURE_CANDIDATE.zip'
          $expected = '7eda02703538517e3efabf0e1814bcbee3ced167f897185e48eff7ed06c7c46b'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'OWNER_P03_SOURCE_DRIFT' }
          Expand-Archive $zip -DestinationPath p03-c40-source
          if (-not (Test-Path 'p03-c40-source/P03.ModelCenter/P03.ModelCenter.csproj')) { throw 'NO_REAL_P03_PROJECT' }
      - name: Apply latest owner TURBO10 delta with pinned SHA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'owner-p03/Packages/P03/C40/NOX_V16_E03_TURBO10_from_C40.patch'
          $bytes = [System.Text.Encoding]::UTF8.GetBytes([System.IO.File]::ReadAllText((Resolve-Path $source).Path).Replace("`r`n","`n"))
          $expected = 'bb6f38d3da5389039236f8c66419e74b8e593b5db66280df7a89a8932ba12149'
          $actual = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          if ($actual -ne $expected) { throw 'P03_OWNER_PATCH_DRIFT' }
          $file = Join-Path $env:RUNNER_TEMP 'p03-owner.patch'
          [System.IO.File]::WriteAllBytes($file,$bytes)
          git -C p03-c40-source init -q
          git -C p03-c40-source apply --check $file
          if ($LASTEXITCODE -ne 0) { throw 'P03_OWNER_PATCH_PREIMAGE_FAIL' }
          git -C p03-c40-source apply $file
          if ($LASTEXITCODE -ne 0) { throw 'P03_OWNER_PATCH_APPLY_FAIL' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile current P03 plus external adapter and run real queue checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item proposals/NOX-PACK01-50/P03OwnerPack.cs p03-c40-source/P03.ModelCenter/P03OwnerPack.cs
          dotnet build proposals/NOX-PACK01-50/P03Smoke/P03Smoke.csproj --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'P03_PACK_COMPILE_FAILED' }
          dotnet run --project proposals/NOX-PACK01-50/P03Smoke/P03Smoke.csproj --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'P03_PACK_OWNER_SMOKE_FAILED' }
