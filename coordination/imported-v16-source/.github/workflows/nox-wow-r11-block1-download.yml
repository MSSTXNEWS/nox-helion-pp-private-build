name: NOX R11 WOW - Block1 downloads only
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/nox-wow-r11-block1-download.yml'
      - 'coordination/wow-exec-v1/downloads/**'
  push:
    branches: [integration/nox-v16-unified-candidate-20261028-r01]
    paths:
      - '.github/workflows/nox-wow-r11-block1-download.yml'
      - 'coordination/wow-exec-v1/downloads/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  block1:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download official Windows sources and Microsoft SVG
        shell: pwsh
        env:
          NOX_BLOCK1_OUT: '${{ runner.temp }}\nox-r11-block1'
        run: |
          python coordination/wow-exec-v1/downloads/fetch-block1.py
      - name: Download pinned Motion and tsParticles tree without executing scripts
        shell: pwsh
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'nox-r11-block1\npm'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item 'coordination/wow-exec-v1/downloads/package.json' (Join-Path $out 'package.json')
          Push-Location $out
          npm install --ignore-scripts --no-audit --no-fund --save-exact 2>&1 | Tee-Object npm-download.log
          $code=$LASTEXITCODE
          if($code -eq 0){
            npm ls --all --json > npm-tree.json
            @{status='SOURCE_DOWNLOADED_ONLY';installed_on_owner_pc=$false} | ConvertTo-Json | Set-Content npm-receipt.json
          } else {
            @{status='DOWNLOAD_HOLD';exitCode=$code} | ConvertTo-Json | Set-Content npm-receipt.json
          }
          Pop-Location
      - name: Download kitUIN FluentIcon source candidate
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'nox-r11-block1\kitUIN-FluentIcon'
          git clone --depth 1 https://github.com/kitUIN/FluentIcon.git $d
          if($LASTEXITCODE -eq 0){
            git -C $d rev-parse HEAD | Set-Content (Join-Path $d 'DOWNLOADED_COMMIT.txt')
          } else {
            New-Item -ItemType Directory -Path $d -Force | Out-Null
            'DOWNLOAD_HOLD' | Set-Content (Join-Path $d 'DOWNLOAD_HOLD.txt')
          }
      - name: Inventory existing dotnet and NSIS tools
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'nox-r11-block1'
          dotnet --list-sdks 2>&1 | Out-File (Join-Path $d 'dotnet-ci-sdks.txt')
          where.exe makensis.exe 2>&1 | Out-File (Join-Path $d 'nsis-ci-path.txt')
      - name: Preserve source downloads and exact receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nox-r11-block1-download-${{ github.run_id }}
          path: ${{ runner.temp }}\nox-r11-block1
          retention-days: 14
          compression-level: 3
          if-no-files-found: warn
