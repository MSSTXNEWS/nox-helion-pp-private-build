name: NOX R11 Block1 NuGet closure transport
on:
  push:
    branches: [integration/nox-v16-unified-candidate-20261028-r01]
    paths:
      - '.github/workflows/nox-r11-block1-nuget-parts.yml'
      - 'coordination/wow-exec-v1/downloads/package-verified-nuget.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  transport:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch previous signed NuGet closure artifact
        uses: actions/download-artifact@v4
        with:
          name: nox-r11-nuget-closure-41326720252
          run-id: 41326720252
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}\nox-nuget-original
      - name: Recheck each source SHA and prepare bounded offline packages
        shell: pwsh
        run: |
          python coordination/wow-exec-v1/downloads/package-verified-nuget.py
      - name: Upload bounded NuGet group 01
        uses: actions/upload-artifact@v4
        with:
          name: nox-r11-nuget-group01-${{ github.run_id }}
          path: ${{ runner.temp }}\nox-nuget-transfer\group01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload bounded NuGet group 02
        uses: actions/upload-artifact@v4
        with:
          name: nox-r11-nuget-group02-${{ github.run_id }}
          path: ${{ runner.temp }}\nox-nuget-transfer\group02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload bounded NuGet group 03
        uses: actions/upload-artifact@v4
        with:
          name: nox-r11-nuget-group03-${{ github.run_id }}
          path: ${{ runner.temp }}\nox-nuget-transfer\group03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload bounded NuGet group 04
        uses: actions/upload-artifact@v4
        with:
          name: nox-r11-nuget-group04-${{ github.run_id }}
          path: ${{ runner.temp }}\nox-nuget-transfer\group04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload bounded NuGet group 05
        uses: actions/upload-artifact@v4
        with:
          name: nox-r11-nuget-group05-${{ github.run_id }}
          path: ${{ runner.temp }}\nox-nuget-transfer\group05
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload bounded NuGet group 06
        uses: actions/upload-artifact@v4
        with:
          name: nox-r11-nuget-group06-${{ github.run_id }}
          path: ${{ runner.temp }}\nox-nuget-transfer\group06
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload bounded NuGet group 07
        uses: actions/upload-artifact@v4
        with:
          name: nox-r11-nuget-group07-${{ github.run_id }}
          path: ${{ runner.temp }}\nox-nuget-transfer\group07
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload bounded NuGet group 08
        uses: actions/upload-artifact@v4
        with:
          name: nox-r11-nuget-group08-${{ github.run_id }}
          path: ${{ runner.temp }}\nox-nuget-transfer\group08
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload exact independent NuGet transfer manifest
        uses: actions/upload-artifact@v4
        with:
          name: nox-r11-nuget-transfer-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}\nox-nuget-transfer\PACKAGES_MANIFEST.json
          retention-days: 14
