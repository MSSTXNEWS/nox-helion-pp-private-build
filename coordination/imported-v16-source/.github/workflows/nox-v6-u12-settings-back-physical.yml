# QA ONLY: one frozen original D02 V6 candidate, never final E07 approval.
name: NOX V6 U12 original installed SETTINGS plus BACK physical UIA
on:
  push:
    branches: [integration/nox-v16-unified-candidate-20261028-r01]
    paths:
      - .github/workflows/nox-v6-u12-settings-back-physical.yml
      - coordination/e07/probe_v6_settings_roundtrip_u12.py
      - tests/e07/test_v6_settings_roundtrip_u12.py
permissions:
  contents: read
  actions: read
concurrency:
  group: nox-v6-u12-settings-back-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-wpf-settings-back:
    if: github.repository == 'MSSTXNEWS/nox-helion-pp-private-build'
    runs-on: windows-2022
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
          check-latest: false
      - name: Fail closed on wrong UIA witness before downloading original Setup
        shell: pwsh
        run: |
          python -B -m py_compile coordination/e07/independent_setup_e07.py coordination/e07/probe_full_d02_722399_u13.py coordination/e07/probe_v6_settings_roundtrip_u12.py
          if ($LASTEXITCODE -ne 0) { throw 'U12_SOURCE_SYNTAX_HOLD' }
          python -B -m unittest discover -s tests/e07 -p test_v6_settings_roundtrip_u12.py -v
          if ($LASTEXITCODE -ne 0) { throw 'U12_NEGATIVE_REGRESSIONS_HOLD' }
      - name: Reuse exact already-verified frozen original V6 physical Windows Setup
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 41833271465
          name: nox-v16-e06-onehost-diagnostic-41833271465
          github-token: ${{ github.token }}
          path: input/frozen
      - name: Actually click original SETTINGS then original BACK in installed WPF
        shell: pwsh
        timeout-minutes: 14
        run: |
          $ErrorActionPreference='Stop'
          python -B coordination/e07/probe_v6_settings_roundtrip_u12.py --artifact-dir input/frozen --out work/u12/SETTINGS_BACK_PHYSICAL_RECEIPT.json
          if ($LASTEXITCODE -ne 0) { throw 'U12_REAL_SETTINGS_BACK_FIRST_FAILURE_HOLD' }
          Write-Host 'U12_REAL_SETTINGS_BACK_TWO_UIA_INVOKES_PASS_NO_E07_NO_FUNCTIONAL_FULL_PASS'
      - name: Archive bounded evidence only; never release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: NOX-V6-U12-SETTINGS-BACK-RECEIPT-${{ github.run_id }}
          path: work/u12/SETTINGS_BACK_PHYSICAL_RECEIPT.json
          if-no-files-found: warn
          retention-days: 14
