name: NOX V16 P04 EXPRESS no-loss component gate
on:
  push:
    branches:
      - integration/nox-v16-p04-express-20261028-r01
    paths:
      - 'Packages/P04/**'
      - 'tests/P04/**'
      - 'Packages/P02/worker-python/**'
      - '.github/workflows/nox-p04-express-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p04-real-source:
    name: P04 actual-module offline tests (not GPU training)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Confirm canonical files actually present
        shell: bash
        run: |
          test -f Packages/P04/rag_python_compat.py
          test -f Packages/P04/train_qlora.py
          test -f Packages/P04/merge_qlora_adapter.py
          test -f Packages/P04/GpuGuardian/GpuGuardian.cs
          test -f Packages/P02/worker-python/p02_runtime.py
          test -f Packages/P02/worker-python/p02_chat_bridge.py
      - name: Compile existing P04 Python and tests without fetching weights
        shell: bash
        run: python -m compileall -q Packages/P04 tests/P04
      - name: Run original P04 regressions and local P02 cited RAG seam
        shell: bash
        env:
          NOX_P02_SOURCE_DIR: ${{ github.workspace }}/Packages/P02/worker-python
        run: python -m unittest discover -s tests/P04 -p 'test_*.py' -v
      - name: Compile original RAG and GPU Guardian .NET8 source
        shell: bash
        run: dotnet build Packages/P04/NoxP04.csproj -c Release --nologo
      - name: Run existing .NET RAG ACL/context/component fixture
        shell: bash
        run: dotnet run --project tests/P04/RagComponentHarness.csproj -c Release
      - name: Run GPU control-process ACK/receipt native fixture on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: dotnet run --project tests/P04/GpuWorkerReceiptHarness.csproj -c Release
      - name: State exact verification boundary
        shell: bash
        run: |
          echo "Component test PASS does NOT mean a CUDA optimizer step, complete checkpoint, live Ollama, installed Windows EXE or E07 accepted release."
          echo "Authorized model revision, dataset rights, NVIDIA GPU and onehost final BuildID remain separate release gates."
