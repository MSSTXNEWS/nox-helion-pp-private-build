# I0 after exact C07 MainWindow source/asset preflight: separate Creative and WOW source.
version: 2.1
orbs:
  win: circleci/windows@5.0
jobs:
  i0-fixed-c07-creative-source:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Original C07 SHA and fixed Creative native bridge only
          command: |
            $ErrorActionPreference='Stop'
            python coordination/e06/stage_p01.py
            if ($LASTEXITCODE -ne 0) { throw 'I0_C07_RECONSTRUCT_FAIL' }
            python integrations/creative/stage_creative.py work/e06/staged/R11 integrations/creative
            if ($LASTEXITCODE -ne 0) { throw 'I0_C07_CREATIVE_STAGE_FAIL' }
            Write-Host 'I0_FIXED_CREATIVE_STAGE_PASS'
      - persist_to_workspace:
          root: .
          paths:
            - work/e06/staged
  i0-wow200-after-creative:
    executor: win/server-2022
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Existing exact WOW200 after fixed Creative
          command: |
            $ErrorActionPreference='Stop'
            python integrations/wow200/stage_wow200.py work/e06/staged/R11 integrations/wow200
            if ($LASTEXITCODE -ne 0) { throw 'I0_OWNER_WOW200_AFTER_CREATIVE_FAIL' }
            Write-Host 'I0_WOW200_AFTER_CREATIVE_PASS'
      - store_artifacts:
          path: work/e06/staged/WOW200_STAGE_RECEIPT.json
          destination: I0-WOW200-RECEIPT
workflows:
  i0_source_stage_exact_split:
    jobs:
      - i0-fixed-c07-creative-source:
          filters:
            branches:
              only: ci/nox-r66-i0-onehost-preflight-isolate-20261031
      - i0-wow200-after-creative:
          requires:
            - i0-fixed-c07-creative-source
          filters:
            branches:
              only: ci/nox-r66-i0-onehost-preflight-isolate-20261031
