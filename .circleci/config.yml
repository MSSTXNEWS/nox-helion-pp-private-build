# NOX B1 isolated exact-repository Chromium source gate. No native access/deploy.
# Production requires independent owner/CAS/STOP/resources, all required CI,
# immutable verifier, installed SHA256 and live multi-turn S03 acceptance.
version: 2.1

jobs:
  b1-exact-repository-chromium:
    docker:
      - image: cimg/python:3.11-browsers
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install pinned Playwright Chromium
          command: |
            set -eu
            python -m pip install --disable-pip-version-check 'playwright==1.56.0'
            python -m playwright install chromium
      - run:
          name: Verify exact branch inputs and syntax
          command: |
            set -eu
            git rev-parse HEAD
            git hash-object nox-control/b1_abort_safe_ui_adapter.js
            git hash-object nox-control/b1_client_stream_reconnect_harness.js
            git hash-object nox-control/b1_sse_ui_binding.js
            node --check nox-control/b1_abort_safe_ui_adapter.js
            node --check nox-control/b1_client_stream_reconnect_harness.js
            node --check nox-control/b1_sse_ui_binding.js
            python -B -m py_compile nox-control/test_b1_sse_ui_binding.py
      - run:
          name: Real Chromium two-turn STOP reconnect no-duplicate source fixture
          command: |
            set -eu
            python nox-control/test_b1_sse_ui_binding.py

workflows:
  b1-exact-source-verification:
    jobs:
      - b1-exact-repository-chromium
