# NOX R66 I0 Windows OneHost failure isolation only (no product code or release branch changes).
# On this disposable diagnostic branch run exactly one job, not the 8 already PASS.
version: 2.1
orbs:
  win: circleci/windows@5.0
jobs:
  r66-i0-onehost-preflight-diagnostic:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: OneHost PRE/A/early-C with durable phase and exact error marker
          no_output_timeout: 20m
          command: |
            $ErrorActionPreference = 'Stop'
            $diag = 'work/e06/i0-onehost-preflight-diagnostic'
            New-Item -ItemType Directory -Force -Path $diag | Out-Null
            $phase = 'INIT'
            $failure = $null
            $steps = New-Object System.Collections.ArrayList
            function Set-I0Phase {
              param([string]$Name)
              $script:phase = $Name
              [void]$script:steps.Add($Name)
              Write-Host "NOX_I0_PHASE_BEGIN:$Name"
              [IO.File]::WriteAllText((Join-Path $diag 'last-phase.txt'),$Name)
            }
            try {
              Set-I0Phase 'PRE_OS_SHA'
              if ($env:OS -ne 'Windows_NT') { throw 'T06_WINDOWS_VM_REQUIRED' }
              if ((git rev-parse HEAD).Trim() -cne $env:CIRCLE_SHA1) { throw 'T06_CHECKOUT_SHA_DRIFT' }
              Set-I0Phase 'PRE_DOTNET_DISCOVERY'
              $sdk = @(dotnet --list-sdks)
              if ($LASTEXITCODE -ne 0) { throw 'T06_DOTNET_NOT_AVAILABLE' }
              if (@($sdk | Where-Object { $_ -match '^8\.' }).Count -eq 0) {
                Set-I0Phase 'PRE_DOTNET8_INSTALL'
                $sdkRoot=Join-Path $env:TEMP 'nox-dotnet-sdk8'
                $installer=Join-Path $env:TEMP 'nox-dotnet-install.ps1'
                Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile $installer -UseBasicParsing
                & $installer -Version '8.0.425' -InstallDir $sdkRoot -NoPath
                if ($LASTEXITCODE -ne 0) { throw 'NOX_OFFICIAL_DOTNET8_PROVISION_FAILED' }
                $env:DOTNET_ROOT=$sdkRoot
                $env:PATH="$sdkRoot;$env:PATH"
                $sdk=@(dotnet --list-sdks)
                if (@($sdk | Where-Object { $_ -match '^8\.' }).Count -eq 0) { throw 'NOX_PINNED_DOTNET8_MISSING' }
              }
              Set-I0Phase 'PRE_PYTHON'
              python --version
              if ($LASTEXITCODE -ne 0) { throw 'T06_PYTHON_NOT_INSTALLED' }
              Set-I0Phase 'PRE_NSIS'
              $nsis=Get-Command makensis.exe -ErrorAction SilentlyContinue
              $nsisPath='C:\Program Files (x86)\NSIS\makensis.exe'
              if (!$nsis -and !(Test-Path -LiteralPath $nsisPath -PathType Leaf)) {
                if (!(Get-Command choco.exe -ErrorAction SilentlyContinue)) { throw 'T06_NSIS_AND_CHOCOLATEY_MISSING' }
                Set-I0Phase 'PRE_NSIS_CHOCO_INSTALL'
                choco install nsis --yes --no-progress --limit-output
                if ($LASTEXITCODE -ne 0) { throw 'T06_WINDOWS_NSIS_INSTALL_FAILED' }
              }
              Write-Host 'NOX_I0_PRE_PASS'
              Set-I0Phase 'A_SOURCELOCK_ORIGINAL_729'
              python coordination/source-lock/verify_original_archive.py --parts-dir . --output work/e06/original-729-manifest.json --expected-files 729
              if ($LASTEXITCODE -ne 0) { throw 'T06_SOURCE_729_FAIL' }
              python coordination/e06/verify_original_729_source.py --parts-dir . --out work/e06/original-729-owner-pinned.json --run-id "NOX-I0-DIAG-$env:CIRCLE_BUILD_NUM"
              if ($LASTEXITCODE -ne 0) { throw 'T06_OWNER_SOURCELOCK_FAIL' }
              Write-Host 'NOX_I0_SOURCELOCK_PASS'
              Set-I0Phase 'C_R11_STAGE'
              python coordination/e06/stage_p01.py
              if ($LASTEXITCODE -ne 0) { throw 'T06_APPROVED_R11_D02_STAGE_FAILED' }
              Set-I0Phase 'C_WOW_UNIT'
              python -m unittest discover -v -s integrations/wow200/tests -p test_stage_wow200.py
              if ($LASTEXITCODE -ne 0) { throw 'T06_APPROVED_D02_REGRESSION_FAILED' }
              Set-I0Phase 'C_HOST_TOOLS_FINAL'
              if (!(Get-Command makensis.exe -ErrorAction SilentlyContinue) -and
                  !(Test-Path -LiteralPath $nsisPath -PathType Leaf)) { throw 'NOX_I0_NSIS_POSTINSTALL_MISSING' }
              if (@(dotnet --list-sdks | Where-Object { $_ -match '^8\.' }).Count -eq 0) {
                throw 'NOX_I0_DOTNET8_NOT_PERSISTED_IN_PROCESS'
              }
              Write-Host 'NOX_I0_PRE_A_EARLY_C_PASS / WPF_NSIS_NOT_BUILT'
              Set-I0Phase 'DONE'
            }
            catch {
              $failure=[ordered]@{
                phase=$phase
                type=$_.Exception.GetType().FullName
                message=$_.Exception.Message
                invocation=$_.InvocationInfo.PositionMessage
                category=[string]$_.CategoryInfo.Category
              }
              Write-Host "NOX_I0_DIAG_FAILED_PHASE:$phase"
              Write-Host "NOX_I0_DIAG_ERROR:$($_.Exception.Message)"
            }
            finally {
              $report=[ordered]@{
                schema='NOX-I0-ONEHOST-PRE-DIAGNOSTIC-v1'
                source_sha=$env:CIRCLE_SHA1
                phase=$phase
                observed_phases=@($steps)
                failure=$failure
                original_pinned_sources_unchanged=$true
                production_build_executed=$false
                release_accepted=$false
              }
              $report | ConvertTo-Json -Depth 10 | Out-File (Join-Path $diag 'phase-report.json') -Encoding utf8
              Write-Host "NOX_I0_DIAG_REPORT_PATH:$diag/phase-report.json"
            }
            if ($null -ne $failure) { throw "NOX_I0_DIAG_FAIL_IN_$phase" }
      - store_artifacts:
          path: work/e06/i0-onehost-preflight-diagnostic
          destination: NOX-I0-ONEHOST-PHASE-NOT-PRODUCT
workflows:
  r66_i0_onehost_diagnostic_only:
    jobs:
      - r66-i0-onehost-preflight-diagnostic:
          filters:
            branches:
              only: ci/nox-r66-i0-onehost-preflight-isolate-20261031
