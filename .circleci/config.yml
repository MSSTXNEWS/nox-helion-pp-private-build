# I0 current cause isolation only: packInvoke case, trusted method, adapted Creative stage.
version: 2.1
orbs:
  win: circleci/windows@5.0
jobs:
  i0-packinvoke-case-exists:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Recreate only original immutable R11 donor
          command: |
            $ErrorActionPreference='Stop'
            python coordination/e06/stage_p01.py
            if ($LASTEXITCODE -ne 0) { throw 'I0_R11_STAGE_FAIL' }
      - run:
          name: i0-packinvoke-case-exists only
          command: |
            $ErrorActionPreference='Stop'
            $c=Get-Content 'work/e06/staged/R11/MainWindow.xaml.cs' -Raw -Encoding UTF8
            if ([regex]::Matches($c,'case\s+"packInvoke"\s*:').Count -ne 1) { throw 'I0_OWNER_PACKINVOKE_CASE_NOT_UNIQUE' }
            Write-Host 'I0_OWNER_PACKINVOKE_CASE_UNIQUE_PASS'
  i0-dispatchpack01-handler-exists:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Recreate only original immutable R11 donor
          command: |
            $ErrorActionPreference='Stop'
            python coordination/e06/stage_p01.py
            if ($LASTEXITCODE -ne 0) { throw 'I0_R11_STAGE_FAIL' }
      - run:
          name: i0-dispatchpack01-handler-exists only
          command: |
            $ErrorActionPreference='Stop'
            $c=Get-Content 'work/e06/staged/R11/MainWindow.xaml.cs' -Raw -Encoding UTF8
            if ([regex]::Matches($c,'DispatchPack01Async').Count -lt 1) { throw 'I0_OWNER_DISPATCHPACK01_HANDLER_ABSENT' }
            Write-Host 'I0_OWNER_DISPATCHPACK01_HANDLER_PRESENT'
  i0-adapted-creative-stage-only:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Recreate only original immutable R11 donor
          command: |
            $ErrorActionPreference='Stop'
            python coordination/e06/stage_p01.py
            if ($LASTEXITCODE -ne 0) { throw 'I0_R11_STAGE_FAIL' }
      - run:
          name: i0-adapted-creative-stage-only only
          command: |
            $ErrorActionPreference='Stop'
            python integrations/creative/stage_creative.py work/e06/staged/R11 integrations/creative
            if ($LASTEXITCODE -ne 0) { throw 'I0_ADAPTED_CREATIVE_SOURCE_STAGE_FAILED' }
            Write-Host 'I0_ADAPTED_CREATIVE_SOURCE_STAGE_PASS'
workflows:
  i0_creative_semantic_route_contract:
    jobs:
      - i0-packinvoke-case-exists:
          filters:
            branches:
              only: ci/nox-r66-i0-onehost-preflight-isolate-20261031
      - i0-dispatchpack01-handler-exists:
          filters:
            branches:
              only: ci/nox-r66-i0-onehost-preflight-isolate-20261031
      - i0-adapted-creative-stage-only:
          filters:
            branches:
              only: ci/nox-r66-i0-onehost-preflight-isolate-20261031
