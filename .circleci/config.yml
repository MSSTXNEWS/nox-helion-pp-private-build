# NOX B3 5A05: real source-only CI, separately visible diagnostics.
# None of these jobs proves installed OneHost, model/tokenizer pins or native S03.
version: 2.1
jobs:
  b3-source-syntax-and-size:
    docker:
      - image: cimg/node:22.16
    resource_class: small
    steps:
      - checkout
      - run:
          name: Parse both sources and enforce hard 20000-byte bridge limit
          command: |
            set -eu
            node --version
            node --check coordination/onepass/nox-v135-resonance-owner-bridge.js
            node --check coordination/onepass/test_v135_resonance_owner_bridge.cjs
            node -e "const fs=require('fs');const n=fs.statSync('coordination/onepass/nox-v135-resonance-owner-bridge.js').size;console.log('owner_bridge_bytes='+n);if(n>20000)process.exit(1)"
  b3-targeted-stop-regression:
    docker:
      - image: cimg/node:22.16
    resource_class: small
    steps:
      - checkout
      - run:
          name: Actual post-STOP queued fetch safety regression
          command: |
            set -eu
            node --test --test-name-pattern='V192 queued native history fetch' coordination/onepass/test_v135_resonance_owner_bridge.cjs
  b3-full-owner-regressions:
    docker:
      - image: cimg/node:22.16
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Full source SSE Unicode Reduced Motion STOP and S03 fixture suite
          command: |
            set -eu
            node --test coordination/onepass/test_v135_resonance_owner_bridge.cjs
  b3-v24-v141:
    docker:
      - image: cimg/node:22.16
    resource_class: small
    steps:
      - checkout
      - run:
          name: Actual Node regression subset b3-v24-v141
          command: |
            set -eu
            node --test --test-name-pattern='^(native V24|legacy dialogs|V24 rename|not installed|invalid dialog|SSE bytes|V135|V136|V137|V141)' coordination/onepass/test_v135_resonance_owner_bridge.cjs
  b3-v153-v166:
    docker:
      - image: cimg/node:22.16
    resource_class: small
    steps:
      - checkout
      - run:
          name: Actual Node regression subset b3-v153-v166
          command: |
            set -eu
            node --test --test-name-pattern='^(V153|V154|V155|V170|V156|V157|V158|V159|V160|V161|V162|V163|V164|V166 exact|V166 duplicate)' coordination/onepass/test_v135_resonance_owner_bridge.cjs
  b3-v165-v176:
    docker:
      - image: cimg/node:22.16
    resource_class: small
    steps:
      - checkout
      - run:
          name: Actual Node regression subset b3-v165-v176
          command: |
            set -eu
            node --test --test-name-pattern='^(V165|V166 native|V166 JSON|V167|V168|V171|V172|V174|V173|V175|V176)' coordination/onepass/test_v135_resonance_owner_bridge.cjs
  b3-v177-v192:
    docker:
      - image: cimg/node:22.16
    resource_class: small
    steps:
      - checkout
      - run:
          name: Actual Node regression subset b3-v177-v192
          command: |
            set -eu
            node --test --test-name-pattern='^(V177|V178|V179|V180|V181|V182|V186|V184|V187|V188|V189|V191|V192)' coordination/onepass/test_v135_resonance_owner_bridge.cjs
  b3-native-v24:
    docker:
      - image: cimg/node:22.16
    resource_class: small
    steps:
      - checkout
      - run:
          name: Diagnostic exact source subset b3-native-v24
          command: |
            set -eu
            node --test --test-name-pattern='^(native V24|V24 rename)' coordination/onepass/test_v135_resonance_owner_bridge.cjs
  b3-legacy-routing:
    docker:
      - image: cimg/node:22.16
    resource_class: small
    steps:
      - checkout
      - run:
          name: Diagnostic exact source subset b3-legacy-routing
          command: |
            set -eu
            node --test --test-name-pattern='^(legacy dialogs|not installed|invalid dialog|SSE bytes)' coordination/onepass/test_v135_resonance_owner_bridge.cjs
  b3-v135-v137:
    docker:
      - image: cimg/node:22.16
    resource_class: small
    steps:
      - checkout
      - run:
          name: Diagnostic exact source subset b3-v135-v137
          command: |
            set -eu
            node --test --test-name-pattern='^(V135|V136|V137)' coordination/onepass/test_v135_resonance_owner_bridge.cjs
  b3-v141:
    docker:
      - image: cimg/node:22.16
    resource_class: small
    steps:
      - checkout
      - run:
          name: Diagnostic exact source subset b3-v141
          command: |
            set -eu
            node --test --test-name-pattern='^V141' coordination/onepass/test_v135_resonance_owner_bridge.cjs
workflows:
  b3-real-source-verification:
    jobs:
      - b3-source-syntax-and-size
      - b3-targeted-stop-regression
      - b3-full-owner-regressions
      - b3-v24-v141
      - b3-v153-v166
      - b3-v165-v176
      - b3-v177-v192
      - b3-native-v24
      - b3-legacy-routing
      - b3-v135-v137
      - b3-v141
