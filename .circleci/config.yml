# NOX HELION — actual offline source verification, not a status-only job.
# This repository's GitHub Actions continue to provide per-component CI.
# CircleCI must never be used to bypass owner, STOP, lease, CAS, or live S03 acceptance.
version: 2.1

jobs:
  owner-command-safety:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Compile immutable owner-command guard and its regressions
          command: |
            set -eu
            python -B -m py_compile \
              nox-control/owner_native_inspect_comment_guard.py \
              nox-control/test_owner_native_inspect_comment_guard.py
      - run:
          name: Verify authorized actions and reject forged owner requests
          command: |
            set -eu
            python -B -m unittest discover \
              -s nox-control \
              -p test_owner_native_inspect_comment_guard.py \
              -v


  exact-live-smoke-source:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify exact owner-attested chat source and single safe POST contract
          command: |
            set -eu
            python -B -m py_compile nox-control/owner_live_stream_smoke_oneshot.py nox-control/owner_native_operator.py nox-control/test_owner_live_stream_smoke_oneshot.py
            python -B nox-control/test_owner_live_stream_smoke_oneshot.py -v

workflows:
  source-verification:
    jobs:
      - owner-command-safety
      - exact-live-smoke-source
