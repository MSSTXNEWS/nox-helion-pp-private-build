# NOX R66 SQLite six-criteria isolated diagnostics: existing SOURCE_ONLY builder.
# NO new EXE, source mutation, acceptance flag or user data. CI branch only.
version: 2.1
orbs:
  win: circleci/windows@5.0
jobs:
  r66-sqlite-original-stage:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Reuse exact 729 original Python source and native framed IPC
          command: |
            $ErrorActionPreference = 'Stop'
            $env:NOX_T06_SOURCE_ONLY='YES'
            python coordination/e06/t06_native_proven_builder.py
            if ($LASTEXITCODE -ne 0) { throw 'NOX_R66_SQLITE_ORIGINAL_SOURCE_STAGE_FAILED' }
      - persist_to_workspace:
          root: .
          paths:
            - work/t06-manual-source-inspect/native-runtime
  sqlite-original-v4-chat:
    executor: win/server-2022
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Exact original V4 owner contract original-v4-chat
          command: |
            $ErrorActionPreference = 'Stop'
            $env:NOX_R64_STAGED_ROOT=(Resolve-Path 'work/t06-manual-source-inspect/native-runtime').Path
            python -m unittest -v coordination.e06.test_e06_r64_shared_db.OriginalDbTest.test_original_v4_one_file_shared_p02_chat
            if ($LASTEXITCODE -ne 0) { throw 'NOX_R66_SQLITE_ORIGINAL_V4_CHAT_HOLD' }
  sqlite-unknown-object:
    executor: win/server-2022
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Exact original V4 owner contract unknown-object
          command: |
            $ErrorActionPreference = 'Stop'
            $env:NOX_R64_STAGED_ROOT=(Resolve-Path 'work/t06-manual-source-inspect/native-runtime').Path
            python -m unittest -v coordination.e06.test_e06_r64_shared_db.OriginalDbTest.test_unknown_original_object_fails_before_p02_schema
            if ($LASTEXITCODE -ne 0) { throw 'NOX_R66_SQLITE_UNKNOWN_OBJECT_HOLD' }
  sqlite-schema-version:
    executor: win/server-2022
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Exact original V4 owner contract schema-version
          command: |
            $ErrorActionPreference = 'Stop'
            $env:NOX_R64_STAGED_ROOT=(Resolve-Path 'work/t06-manual-source-inspect/native-runtime').Path
            python -m unittest -v coordination.e06.test_e06_r64_shared_db.OriginalDbTest.test_legacy_version_mismatch_fails_closed
            if ($LASTEXITCODE -ne 0) { throw 'NOX_R66_SQLITE_SCHEMA_VERSION_HOLD' }
  sqlite-legacy-v3-preflight:
    executor: win/server-2022
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Exact original V4 owner contract legacy-v3-preflight
          command: |
            $ErrorActionPreference = 'Stop'
            $env:NOX_R64_STAGED_ROOT=(Resolve-Path 'work/t06-manual-source-inspect/native-runtime').Path
            python -m unittest -v coordination.e06.test_e06_r64_shared_db.OriginalDbTest.test_existing_legacy_v3_denied_before_store_migration
            if ($LASTEXITCODE -ne 0) { throw 'NOX_R66_SQLITE_LEGACY_V3_PREFLIGHT_HOLD' }
  sqlite-fresh-db-preflight:
    executor: win/server-2022
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Exact original V4 owner contract fresh-db-preflight
          command: |
            $ErrorActionPreference = 'Stop'
            $env:NOX_R64_STAGED_ROOT=(Resolve-Path 'work/t06-manual-source-inspect/native-runtime').Path
            python -m unittest -v coordination.e06.test_e06_r64_shared_db.OriginalDbTest.test_new_db_and_real_v4_preflight
            if ($LASTEXITCODE -ne 0) { throw 'NOX_R66_SQLITE_FRESH_DB_PREFLIGHT_HOLD' }
  sqlite-history-reopen:
    executor: win/server-2022
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Exact original V4 owner contract history-reopen
          command: |
            $ErrorActionPreference = 'Stop'
            $env:NOX_R64_STAGED_ROOT=(Resolve-Path 'work/t06-manual-source-inspect/native-runtime').Path
            python -m unittest -v coordination.e06.test_e06_r64_shared_db.OriginalDbTest.test_reopen_original_database_preserves_history
            if ($LASTEXITCODE -ne 0) { throw 'NOX_R66_SQLITE_HISTORY_REOPEN_HOLD' }
workflows:
  nox_r66_sqlite_isolate:
    jobs:
      - r66-sqlite-original-stage:
          filters:
            branches:
              only: ci/nox-r66-sqlite-isolate-20261031
      - sqlite-original-v4-chat:
          requires:
            - r66-sqlite-original-stage
          filters:
            branches:
              only: ci/nox-r66-sqlite-isolate-20261031
      - sqlite-unknown-object:
          requires:
            - r66-sqlite-original-stage
          filters:
            branches:
              only: ci/nox-r66-sqlite-isolate-20261031
      - sqlite-schema-version:
          requires:
            - r66-sqlite-original-stage
          filters:
            branches:
              only: ci/nox-r66-sqlite-isolate-20261031
      - sqlite-legacy-v3-preflight:
          requires:
            - r66-sqlite-original-stage
          filters:
            branches:
              only: ci/nox-r66-sqlite-isolate-20261031
      - sqlite-fresh-db-preflight:
          requires:
            - r66-sqlite-original-stage
          filters:
            branches:
              only: ci/nox-r66-sqlite-isolate-20261031
      - sqlite-history-reopen:
          requires:
            - r66-sqlite-original-stage
          filters:
            branches:
              only: ci/nox-r66-sqlite-isolate-20261031
