# I0 narrow C1 split. #84 combined Creative/WOW FAILED; identify exact failing owner stage.
version: 2.1
orbs:
  win: circleci/windows@5.0
jobs:
  i0-r11-creative-owner-stage:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: R11 original donor plus exact existing Creative patch
          command: |
            $ErrorActionPreference='Stop'
            python coordination/e06/stage_p01.py
            if ($LASTEXITCODE -ne 0) { throw 'I0_R11_DONOR_STAGE_FAILED' }
            python integrations/creative/stage_creative.py work/e06/staged/R11 integrations/creative
            if ($LASTEXITCODE -ne 0) { throw 'I0_ORIGINAL_CREATIVE_STAGE_FAILED' }
            if (!(Test-Path 'work/e06/staged/CREATIVE_STAGE_RECEIPT.json' -PathType Leaf)) {
              throw 'I0_CREATIVE_SOURCE_RECEIPT_ABSENT'
            }
            Write-Host 'I0_ORIGINAL_CREATIVE_STAGE_PASS'
      - persist_to_workspace:
          root: .
          paths:
            - work/e06/staged
      - store_artifacts:
          path: work/e06/staged/CREATIVE_STAGE_RECEIPT.json
          destination: I0-ORIGINAL-CREATIVE-SOURCE-NOT-GUI
  i0-wow200-owner-stage:
    executor: win/server-2022
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Existing exact original WOW200 stage after Creative
          command: |
            $ErrorActionPreference='Stop'
            python integrations/wow200/stage_wow200.py work/e06/staged/R11 integrations/wow200
            if ($LASTEXITCODE -ne 0) { throw 'I0_ORIGINAL_WOW200_STAGE_FAILED' }
            $p=Get-Content work/e06/staged/WOW200_STAGE_RECEIPT.json -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($p.count -ne 65 -or $p.active_d02_engine -cne 'OWNER1_PR144_PINNED' -or
                $p.legacy_d02_runtime_imported -ne $false -or
                $p.pack01_catalog_routes -ne 50 -or $p.release_accepted -ne $false) {
              throw 'I0_WOW200_RECEIPT_CONTRACT_REJECTED'
            }
            Write-Host 'I0_ORIGINAL_WOW200_STAGE_PASS_NOT_GUI'
      - store_artifacts:
          path: work/e06/staged/WOW200_STAGE_RECEIPT.json
          destination: I0-ORIGINAL-WOW-SOURCE-NOT-GUI
workflows:
  i0_isolate_c1_owner_stages:
    jobs:
      - i0-r11-creative-owner-stage:
          filters:
            branches:
              only: ci/nox-r66-i0-onehost-preflight-isolate-20261031
      - i0-wow200-owner-stage:
          requires:
            - i0-r11-creative-owner-stage
          filters:
            branches:
              only: ci/nox-r66-i0-onehost-preflight-isolate-20261031
