# I0: isolate failing source assertion in original R11 MainWindow/HTML (#88).
version: 2.1
orbs:
  win: circleci/windows@5.0
jobs:
  i0-creative-pack-router-anchor:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Reconstruct exact immutable R11 owner candidate
          command: |
            $ErrorActionPreference='Stop'
            python coordination/e06/stage_p01.py
            if ($LASTEXITCODE -ne 0) { throw 'I0_R11_STAGE_FAILED' }
      - run:
          name: Original Creative Stage required anchor - separately checked
          command: |
            $ErrorActionPreference='Stop'
            $main=Get-Content 'work/e06/staged/R11/MainWindow.xaml.cs' -Raw -Encoding UTF8
            $exact='case "packInvoke": _ = DispatchPack01Async(json.RootElement.Clone()); break;'
            $found=[regex]::Matches($main,[regex]::Escape($exact)).Count
            if ($found -ne 1) { throw 'I0_R11_CREATIVE_PACK_EXACT_ANCHOR_DRIFT' }
            Write-Host 'I0_PACK_ROUTER_ANCHOR_PASS'
  i0-creative-lifecycle-anchor:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Reconstruct exact immutable R11 owner candidate
          command: |
            $ErrorActionPreference='Stop'
            python coordination/e06/stage_p01.py
            if ($LASTEXITCODE -ne 0) { throw 'I0_R11_STAGE_FAILED' }
      - run:
          name: Original Creative Stage required anchor - separately checked
          command: |
            $ErrorActionPreference='Stop'
            $main=Get-Content 'work/e06/staged/R11/MainWindow.xaml.cs' -Raw -Encoding UTF8
            $exact='Closing += (_, _) => { _openAiProvider.Dispose(); _trainingMonitorCts?.Cancel(); };'
            $found=[regex]::Matches($main,[regex]::Escape($exact)).Count
            if ($found -ne 1) { throw 'I0_R11_CREATIVE_LIFECYCLE_ANCHOR_DRIFT' }
            Write-Host 'I0_CREATIVE_LIFECYCLE_ANCHOR_PASS'
  i0-creative-index-footer:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Reconstruct exact immutable R11 owner candidate
          command: |
            $ErrorActionPreference='Stop'
            python coordination/e06/stage_p01.py
            if ($LASTEXITCODE -ne 0) { throw 'I0_R11_STAGE_FAILED' }
      - run:
          name: Original Creative Stage required anchor - separately checked
          command: |
            $ErrorActionPreference='Stop'
            $html=Get-Content 'work/e06/staged/R11/Assets/index.html' -Raw -Encoding UTF8
            if ([regex]::Matches($html,[regex]::Escape('</body>')).Count -ne 1) { throw 'I0_R11_HTML_BODY_ANCHOR_DRIFT' }
            if ($html.Contains('creative/entry.js')) { throw 'I0_R11_CREATIVE_ALREADY_IMPORTED' }
            Write-Host 'I0_CREATIVE_HTML_FOOTER_PASS'
workflows:
  i0_creative_anchor_diagnosis:
    jobs:
      - i0-creative-pack-router-anchor:
          filters:
            branches:
              only: ci/nox-r66-i0-onehost-preflight-isolate-20261031
      - i0-creative-lifecycle-anchor:
          filters:
            branches:
              only: ci/nox-r66-i0-onehost-preflight-isolate-20261031
      - i0-creative-index-footer:
          filters:
            branches:
              only: ci/nox-r66-i0-onehost-preflight-isolate-20261031
