<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NOX HELION · CINEMA</title>
<style>
:root{color-scheme:dark;--ink:#03060b;--glass:rgba(8,15,24,.83);--edge:rgba(220,166,97,.38);--amber:#f8c27d;--steel:#a6c4d3;--text:#f6eee4;--focus:#83e1fb}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{position:relative;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px clamp(10px,2.4vw,28px);background:linear-gradient(165deg,rgba(17,29,39,.94),rgba(4,8,13,.94));border-bottom:1px solid var(--edge);box-shadow:0 12px 36px rgba(0,0,0,.46),inset 0 1px rgba(255,221,164,.13);backdrop-filter:blur(16px)}
.brand{display:flex;flex-direction:column;min-width:153px;line-height:1.25}
.brand strong{font-size:13px;font-weight:650;letter-spacing:.23em;color:#f7e5ce}
.brand small{font-size:9px;letter-spacing:.17em;color:#aebeca}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1 1 360px}
button,.file-button{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:8px 13px;border:1px solid var(--edge);border-radius:10px;color:var(--text);background:linear-gradient(150deg,rgba(54,65,78,.72),rgba(8,13,20,.96));box-shadow:inset 0 1px rgba(255,255,255,.09);font:inherit;cursor:pointer;transition:transform .18s,border-color .2s,box-shadow .2s}
button:hover,.file-button:hover{border-color:#efbb72;box-shadow:0 0 18px rgba(235,160,71,.22);transform:translateY(-1px)}
button:focus-visible,.file-button:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.file-button{position:relative;overflow:hidden}
.file-button input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
#play{border-color:rgba(255,191,109,.7);background:linear-gradient(140deg,rgba(131,75,26,.9),rgba(35,25,19,.94))}
#status{flex:1 1 170px;min-width:0;color:var(--steel);font-size:12px;overflow-wrap:anywhere}
main{flex:1;min-height:0;position:relative;display:grid;place-items:center;isolation:isolate;background:radial-gradient(circle at 54% 34%,rgba(212,131,50,.18),transparent 43%),linear-gradient(180deg,rgba(3,7,13,.62),rgba(1,3,7,.91)),url("../work.png") center 52%/cover no-repeat}
main::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,rgba(0,0,0,.47),transparent 53%,rgba(0,0,0,.29));box-shadow:inset 0 0 140px rgba(0,0,0,.78)}
main::after{content:"";position:absolute;inset:15px;pointer-events:none;border:1px solid rgba(244,184,108,.12);border-radius:18px}
.stage{position:relative;z-index:1;max-width:min(92vw,960px);padding:28px;text-align:center;border:1px solid rgba(236,185,124,.27);border-radius:18px;background:linear-gradient(135deg,rgba(11,19,29,.57),rgba(3,6,11,.33));box-shadow:0 22px 70px #0009,0 0 40px rgba(245,157,59,.09)}
.stage::before{content:"";position:absolute;top:0;left:14%;right:14%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,200,131,.88),transparent)}
h1{font-weight:550;font-size:clamp(23px,4vw,54px);letter-spacing:.11em;text-shadow:0 4px 22px #000;margin:0 0 10px}
.muted{margin:0;color:#d3b28b;letter-spacing:.08em}
video{position:relative;z-index:2;display:none;width:100%;height:100%;max-width:100vw;max-height:100%;object-fit:contain;background:#000}
footer{padding:5px 16px;font-size:10px;color:#889fad;border-top:1px solid rgba(238,183,110,.15);background:#03080f;text-align:right}
:fullscreen{background:#000}
#stage:fullscreen{background:#000}
#stage:fullscreen::before,#stage:fullscreen::after{display:none}
#stage:fullscreen video{width:100%;height:100%;max-width:100%;max-height:100%}
#stage:fullscreen .stage{display:none}
@media(max-width:800px){header{padding:8px;gap:7px}.brand{min-width:120px}.controls{flex-basis:auto;gap:6px}button,.file-button{padding:7px 9px}#status{flex-basis:100%}}
@media(max-width:430px){.brand{width:100%}.controls{width:100%}.controls>*{flex:1 1 auto}.stage{padding:18px}.stage h1{font-size:23px}footer{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
<div class="brand"><strong>NOX HELION</strong><small>CINEMA · LOCAL FIRST</small></div>
<div class="controls">
<label class="file-button" for="file">Выбрать видео<input id="file" type="file" accept="video/mp4,video/webm,.mov" aria-label="Выбрать локальное видео"></label>
<label class="file-button" for="subtitles">Субтитры<input id="subtitles" type="file" accept=".srt,.vtt,text/vtt" aria-label="Выбрать файл субтитров"></label>
<button id="play" type="button" aria-label="Воспроизведение">▶ Смотреть</button>
<button id="pause" type="button" aria-label="Пауза">Ⅱ Пауза</button>
<button id="full" type="button" aria-label="На весь экран">⛶ Экран</button>
<button id="screens" type="button" aria-label="Подключённые экраны">Проектор</button>
</div>
<output id="status" role="status" aria-live="polite">Выберите разрешённый локальный фильм</output>
</header>
<main id="stage">
<div id="poster" class="stage"><h1 id="title">NOX HELION · КИНОЗАЛ</h1><p id="space" class="muted">Локальное воспроизведение · HELION SPACES</p></div>
<video id="video" controls playsinline preload="metadata"></video>
</main>
<footer>NOX · PRIVATE CINEMA · SOURCE / HARDWARE STATUS ONLY</footer>
<script src="theater.js"></script>
</body>
</html>
